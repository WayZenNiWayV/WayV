﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.wb-app{
  --wb-orange:#ffa15e;
  --wb-orange-deep:#e08040;
  --wb-orange-soft:#ffe2ca;
  --wb-ink:#4a382b;
  --wb-ink-soft:#ab9a8c;
  --wb-line:rgba(255,205,170,.5);
  --wb-card:rgba(255,255,255,.66);
  display:flex;flex-direction:column;flex:1;height:0;min-height:0;
  background:linear-gradient(180deg,#fffdfa 0%,#fff8f1 45%,#fff2e7 100%);
  position:relative;overflow:hidden;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--wb-ink);
}
.wb-app::before{content:"";position:absolute;top:-18%;right:-25%;width:75%;height:48%;background:radial-gradient(circle,rgba(255,186,136,.26) 0%,transparent 70%);pointer-events:none;}
.wb-app::after{content:"";position:absolute;bottom:-12%;left:-20%;width:70%;height:45%;background:radial-gradient(circle,rgba(255,226,196,.42) 0%,transparent 70%);pointer-events:none;}

.wb-topbar{flex-shrink:0;min-height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;position:relative;z-index:5;}
.wb-title{font-size:16px;font-weight:700;color:var(--wb-ink);pointer-events:none;}
.wb-title-wrap{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;}
.wb-title-broom{width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;color:#8a8a8a;
  display:none;align-items:center;justify-content:center;border-radius:50%;}
.wb-title-broom.on{display:flex;}
.wb-title-broom:active{background:rgba(0,0,0,.06);}
.wb-title-broom svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wb-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:var(--wb-orange);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  transition:transform .1s,background .15s;box-shadow:0 3px 10px -4px rgba(200,110,20,.42);}
.wb-icon-btn:active{transform:scale(.9);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.wb-icon-btn-plus{width:34px;height:34px;}
.wb-icon-btn-plus svg{width:19px;height:19px;stroke-width:2.4;}
.wb-top-actions{margin-left:auto;display:flex;gap:8px;}

.wb-body{flex:1;overflow-y:auto;position:relative;z-index:2;-webkit-overflow-scrolling:touch;}
.wb-body::-webkit-scrollbar{width:0;}

.wb-segment{display:flex;justify-content:center;gap:24px;padding:6px 0 10px;}
.wb-seg{border:none;background:none;font-family:inherit;font-size:14px;color:var(--wb-ink-soft);cursor:pointer;padding:4px 2px;position:relative;}
.wb-seg.active{color:var(--wb-ink);font-weight:700;}
.wb-seg.active::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--wb-orange);}
.wb-seg-plus{border:none;background:none;font-family:inherit;font-size:14px;line-height:1;color:var(--wb-ink-soft);
  opacity:.36;width:18px;height:18px;padding:0;margin-left:-16px;cursor:pointer;align-self:center;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s;}
.wb-seg-plus:active{opacity:.85;}

.wb-rec-rows{display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow-y:auto;padding-right:2px;}
.wb-rec-rows::-webkit-scrollbar{width:0;}
.wb-rec-row{display:flex;flex-direction:column;gap:7px;padding:10px 11px;border-radius:14px;
  background:rgba(255,255,255,.75);border:1px solid rgba(255,190,140,.42);}
.wb-rec-row-head{display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;font-weight:600;color:var(--wb-orange-deep);}
.wb-rec-row-del{border:none;background:none;font-family:inherit;font-size:11.5px;color:var(--wb-ink-soft);
  padding:2px 6px;border-radius:8px;cursor:pointer;}
.wb-rec-row-del:active{background:rgba(0,0,0,.06);}
.wb-rec-addrow{border:1px dashed rgba(255,161,94,.6);background:rgba(255,244,232,.7);border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--wb-orange-deep);padding:9px;cursor:pointer;}
.wb-rec-addrow:active{background:rgba(255,232,210,.92);}

.wb-live-strip{display:flex;gap:18px;padding:6px 14px 12px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;
  overscroll-behavior-x:contain;cursor:grab;}
.wb-live-strip.dragging{cursor:grabbing;scroll-behavior:auto;}
.wb-live-strip::-webkit-scrollbar{height:0;}
.wb-live-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;
  -webkit-user-select:none;user-select:none;}
.wb-live-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;background:linear-gradient(135deg,#ffd6b4,#ffa66b);
  border:2px solid rgba(255,255,255,.95);cursor:default;
  box-shadow:0 3px 10px -5px rgba(180,100,40,.5);}
.wb-live-avatar img{width:100%;height:100%;object-fit:cover;}
.wb-live-avatar.live{border-color:var(--wb-orange);cursor:pointer;animation:wbLivePulse 1.3s ease-in-out infinite;}
@keyframes wbLivePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,161,94,.55),0 3px 10px -5px rgba(180,100,40,.5);}
  55%{box-shadow:0 0 0 7px rgba(255,161,94,0),0 3px 10px -5px rgba(180,100,40,.5);}
}
.wb-live-name{width:72px;font-size:10px;color:var(--wb-ink-soft);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center;}

.wb-draft{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);border-radius:12px;
  padding:10px 12px;margin:0 12px 8px;cursor:pointer;transition:background .15s;}
.wb-draft:active{background:rgba(255,244,232,.92);}
.wb-draft-top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--wb-ink-soft);}
.wb-draft-text{font-size:13px;line-height:1.55;margin-top:6px;color:var(--wb-ink);white-space:pre-wrap;
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.wb-draft-imgs{display:flex;gap:4px;margin-top:7px;}
.wb-draft-imgs img{width:44px;height:44px;object-fit:cover;border-radius:7px;}
.wb-draft-del{border:none;background:rgba(0,0,0,.05);color:var(--wb-ink-soft);font-family:inherit;
  font-size:11px;padding:4px 9px;border-radius:9px;cursor:pointer;}
.wb-draft-del:active{background:rgba(214,84,58,.16);color:#c9553f;}

@keyframes wbSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wb-icon-btn.spin svg{animation:wbSpin .55s ease;}
.wb-icon-btn.spinning svg{animation:wbSpin .8s linear infinite;}

.wb-loading{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 12px 10px;
  padding:16px;border-radius:14px;background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.85);font-size:12.5px;color:var(--wb-ink-soft);
  box-shadow:0 4px 16px -10px rgba(190,110,40,.35);}
.wb-loading-spin{width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,140,60,.28);border-top-color:var(--wb-orange);
  animation:wbSpin .8s linear infinite;}

.wb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;background:linear-gradient(135deg,#ffd6b4,#ffa66b);}
.wb-avatar img{width:100%;height:100%;object-fit:cover;}

.wb-post{position:relative;background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:13px 13px 6px;margin:0 12px 10px;
  box-shadow:0 4px 16px -10px rgba(190,110,40,.35);cursor:pointer;}
.wb-post-pin{display:flex;align-items:center;gap:5px;margin:-2px 0 9px;font-size:11.5px;color:var(--wb-orange-deep);}
.wb-post-pin i{width:13px;height:13px;border-radius:3px;background:var(--wb-orange);color:#fff;font-style:normal;
  font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.wb-post-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px;padding-right:30px;}
.wb-post-head .wb-avatar{width:38px;height:38px;font-size:14px;flex:none;}
.wb-post-meta{flex:1;min-width:0;padding-top:1px;}
.wb-post-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:4px;overflow:hidden;}
.wb-vip{width:14px;height:14px;border-radius:50%;background:var(--wb-orange);color:#fff;font-size:9px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.wb-vip.v-yellow{background:linear-gradient(135deg,#ffd34d,#eaa600);}
.wb-vip.v-gold{background:linear-gradient(135deg,#ffe9a3,#d99b16);}
.wb-post-time{font-size:11.5px;color:var(--wb-ink-soft);margin-top:3px;}
.wb-post-loc{display:inline-flex;align-items:center;gap:4px;margin:0 0 8px;padding:4px 9px;border-radius:999px;
  background:rgba(255,244,232,.92);border:1px solid rgba(255,255,255,.85);font-size:11.5px;color:var(--wb-orange-deep);}
.wb-post-loc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wb-post-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;}
.wb-post-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.wb-post-img{aspect-ratio:1;overflow:hidden;background:#ffead9;}
.wb-post-imgs.one{grid-template-columns:1fr;}
.wb-post-imgs.one .wb-post-img{aspect-ratio:4/3;}
.wb-post-img.empty{background:transparent;}
.wb-post-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
.wb-viewer{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;
  align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;}
.wb-viewer.show{opacity:1;}
.wb-viewer img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.88);
  transition:transform .22s cubic-bezier(.2,.8,.3,1);user-select:none;-webkit-user-drag:none;}
.wb-viewer.show img{transform:scale(1);}
.wb-viewer-count{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;
  font-size:12px;opacity:.85;pointer-events:none;}
.wb-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wb-viewer-nav.prev{left:10px;}
.wb-viewer-nav.next{right:10px;}
.wb-post-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  margin-bottom:8px;background:#1d1d1d;}
.wb-post-video img{width:100%;height:100%;object-fit:cover;display:block;}
.wb-post-video::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none;}
.wb-post-video-meta{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 9px 8px;font-size:11.5px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.45);z-index:2;pointer-events:none;}
.wb-post-video-dur{font-variant-numeric:tabular-nums;letter-spacing:.4px;}
.wb-post-actions{display:flex;align-items:center;gap:4px;padding:6px 0 5px;}
.wb-robert-ava{flex:none;width:24px;height:24px;border-radius:8px;
  background:linear-gradient(135deg,#ffbb8f,#ff93a5);color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
.wb-robert-tag{font-size:9px;font-weight:700;color:#fff;background:rgba(255,145,90,.85);
  border-radius:4px;padding:1px 4px;letter-spacing:.4px;}
.wb-act{flex:1;border:none;background:none;border-radius:9px;padding:6px 0;font-size:12px;
  color:var(--wb-ink-soft);font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,transform .1s;}
.wb-act:active{transform:scale(.96);}
.wb-act[data-act="like"]{color:var(--wb-ink-soft);}
.wb-act.liked{color:#ff8200;font-weight:600;}
.wb-act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-act.liked svg{fill:currentColor;stroke:currentColor;}
.wb-post-more{position:absolute;top:9px;right:9px;z-index:3;}
.wb-more-btn{width:26px;height:26px;border:none;border-radius:8px;background:none;
  color:var(--wb-ink-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:background .15s,transform .1s,color .15s;}
.wb-more-btn:active{transform:scale(.9);background:rgba(255,140,60,.16);color:var(--wb-orange-deep);}
.wb-more-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-more-menu{position:absolute;right:0;top:29px;min-width:108px;background:rgba(255,252,248,.99);
  border:1px solid rgba(255,255,255,.85);border-radius:11px;padding:4px;
  box-shadow:0 10px 26px -12px rgba(150,80,20,.55);display:flex;flex-direction:column;gap:2px;
  animation:wbFade .14s ease;z-index:6;}
.wb-more-item{border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--wb-ink);
  text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;}
.wb-more-item:active{background:rgba(255,140,60,.16);color:var(--wb-orange-deep);}
.wb-more-item.danger{color:#c9553f;}
.wb-more-item.danger:active{background:rgba(214,84,58,.14);color:#c9553f;}

.wb-me-cover{position:relative;height:152px;flex-shrink:0;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#ffb673 0%,#ffc794 28%,#ffdcba 58%,#ffedda 82%,#fffaf4 100%);
  background-size:cover;background-position:center;transition:background .2s;}
.wb-me-cover.has-img::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(60,25,5,.16),rgba(60,25,5,.34));}
.wb-me-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;
  background:linear-gradient(180deg,transparent,rgba(255,249,243,.9));pointer-events:none;}
.wb-cover-back{position:absolute;left:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,background .15s;}
.wb-cover-back:active{transform:scale(.92);background:rgba(255,255,255,.42);}
.wb-cover-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-acts{position:absolute;right:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);display:flex;gap:10px;z-index:3;}
.wb-cover-btn{width:32px;height:32px;border-radius:50%;border:none;
  background:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--wb-orange);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:0 4px 14px -6px rgba(120,60,10,.55);transition:transform .12s,background .15s,color .15s;}
.wb-cover-btn:active{transform:scale(.92);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-cover-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-plus{width:34px;height:34px;}
.wb-cover-plus svg{width:19px;height:19px;stroke-width:2.4;}

.wb-me-main{position:relative;padding:0 15px;margin-top:-44px;z-index:2;}
.wb-me-head{display:flex;align-items:flex-end;gap:12px;}
.wb-me-avatar{width:78px;height:78px;font-size:28px;border:3px solid #fff;flex-shrink:0;
  box-shadow:0 6px 18px -8px rgba(190,110,40,.55);}
.wb-me-headinfo{flex:1;min-width:0;padding-bottom:6px;}
.wb-me-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.35;}
.wb-me-stats{display:flex;align-items:baseline;gap:22px;margin-top:16px;}
.wb-me-stat{display:flex;align-items:baseline;gap:5px;}
.wb-me-stat b{font-size:17px;font-weight:700;color:var(--wb-ink);}
.wb-me-stat span{font-size:12px;color:var(--wb-ink-soft);}
.wb-me-bio-row{display:flex;align-items:flex-start;gap:10px;margin-top:12px;}
.wb-me-bio{flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--wb-ink-soft);word-break:break-word;}
.wb-me-edit{flex-shrink:0;align-self:flex-end;margin-bottom:8px;width:30px;height:30px;padding:0;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--wb-orange-deep);
  font-family:inherit;cursor:pointer;transition:transform .12s,background .15s;}
.wb-me-edit:active{transform:scale(.92);background:rgba(255,140,60,.12);}
.wb-me-tabs{display:flex;align-items:center;margin:14px -15px 0;padding:0 6px;
  border-top:1px solid var(--wb-line);}
.wb-me-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 0 10px;
  background:none;border:none;font-family:inherit;font-size:13px;color:var(--wb-ink-soft);
  cursor:pointer;position:relative;transition:color .15s;}
.wb-me-tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.wb-me-tab.on{color:var(--wb-ink);font-weight:700;}
.wb-me-tab.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;border-radius:2px;background:var(--wb-orange);}
.wb-me-panel{padding:10px 0 0;}
.wb-me-empty{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 20px 34px;color:var(--wb-ink-soft);font-size:12.5px;}
.wb-me-empty svg{width:38px;height:38px;fill:none;stroke:rgba(255,168,110,.62);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-me-edit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.wb-avatar-switchable{cursor:pointer;transition:transform .12s;}
.wb-avatar-switchable:active{transform:scale(.96);}
.wb-app.wb-me-mode > .wb-topbar{display:none;}

.wb-card{background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;margin:0 12px 10px;overflow:hidden;
  box-shadow:0 4px 16px -12px rgba(190,110,40,.4);}

.wb-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 8px;font-size:14px;font-weight:700;}
.wb-hot-time{font-size:11px;color:var(--wb-orange-deep);font-weight:500;background:rgba(255,140,60,.12);padding:2px 8px;border-radius:9px;}
.wb-hot-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
.wb-hot-row:active{background:rgba(255,200,160,.18);}
.wb-hot-rank{width:18px;font-size:12px;font-weight:700;color:var(--wb-ink-soft);flex-shrink:0;text-align:center;}
.wb-hot-rank.top{color:var(--wb-orange-deep);}
.wb-hot-tag{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-hot-heat{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;min-width:54px;text-align:right;}
.wb-hot-badge{flex-shrink:0;font-size:10px;color:#fff;padding:1px 5px;border-radius:4px;font-weight:600;line-height:1.5;}
.wb-hot-热{background:#ff6b35;}
.wb-hot-沸{background:#ff3b30;}
.wb-hot-爆{background:#ff2d55;}
.wb-hot-新{background:#ff5e7e;}
.wb-topics{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:4px 14px 14px;}
.wb-topic{font-size:13px;padding:7px 2px;color:var(--wb-ink);cursor:pointer;display:flex;align-items:center;
  gap:6px;overflow:hidden;background:none;border:none;border-radius:0;}
.wb-topic:active{opacity:.6;}
.wb-topic-text{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;line-height:1.35;}
.wb-topic-more{grid-column:1/-1;text-align:right;font-size:12px;color:var(--wb-orange-deep);padding:6px 0 2px;cursor:pointer;}

.wb-chat-row{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;}
.wb-chat-row:active{background:rgba(255,200,160,.18);}
.wb-chat-row+.wb-chat-row{border-top:1px solid var(--wb-line);}
.wb-chat-avatar{width:44px;height:44px;font-size:17px;}
.wb-chat-info{flex:1;min-width:0;}
.wb-chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.wb-chat-name{font-size:14.5px;font-weight:600;}
.wb-chat-time{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-chat-preview{font-size:12.5px;color:var(--wb-ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wb-orange);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wb-msg-ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;font-size:22px;font-weight:700;}
.wb-msg-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;}
.wb-msg-ico.ico-at{background:linear-gradient(135deg,#5fb8e8,#3f9bd4);}
.wb-msg-ico.ico-cmt{background:linear-gradient(135deg,#5ecf93,#3cb877);}
.wb-msg-ico.ico-like{background:linear-gradient(135deg,#ffc04d,#f29a15);}
.wb-msg-ico.ico-dm{background:linear-gradient(135deg,#b9a8ff,#8d7be8);}
.wb-msg-arrow{color:var(--wb-ink-soft);font-size:17px;flex-shrink:0;}
.wb-msg-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;font-size:15px;font-weight:600;}
.wb-msg-head button{background:none;border:0;padding:4px;cursor:pointer;color:var(--wb-ink);display:flex;}
.wb-msg-head button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;}
.wb-msg-sec{font-size:12px;color:var(--wb-ink-soft);padding:12px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
.wb-sheet-ava{width:30px;height:30px;font-size:12px;}

.wb-end{text-align:center;font-size:11px;color:var(--wb-ink-soft);padding:10px 0 18px;}

.wb-tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.72);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.7);
  padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);position:relative;z-index:5;}
.wb-tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 0;cursor:pointer;color:var(--wb-ink-soft);font-family:inherit;transition:color .15s;}
.wb-tab-ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.62;
  transition:transform .18s,opacity .18s;}
.wb-tab-label{font-size:10.5px;font-weight:500;}
.wb-tab.active{color:var(--wb-orange-deep);}
.wb-tab.active .wb-tab-ico{opacity:1;transform:translateY(-1px);}
.wb-tab.active .wb-tab-label{font-weight:700;}

.wb-sheet-mask{position:absolute;inset:0;z-index:45;background:rgba(60,35,15,.28);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;animation:wbFade .18s ease;}
.wb-sheet{width:100%;max-height:88%;overflow-y:auto;background:rgba(255,252,248,.97);border-radius:18px 18px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;animation:wbUp .25s cubic-bezier(.32,.72,0,1);}
.wb-sheet-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;}
.wb-sheet-cancel,.wb-sheet-send{border:none;font-family:inherit;font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;}
.wb-sheet-cancel{background:rgba(0,0,0,.05);color:var(--wb-ink-soft);}
.wb-sheet-send{background:var(--wb-orange);color:#fff;font-weight:600;}
.wb-sheet-text{width:100%;height:120px;border:1px solid var(--wb-line);border-radius:12px;padding:10px 12px;
  font-family:inherit;font-size:14px;line-height:1.6;color:var(--wb-ink);background:#fff;outline:none;resize:none;}
.wb-sheet-text:focus{border-color:var(--wb-orange);}

.wb-compose-mask{position:absolute;inset:0;z-index:45;background:rgba(60,35,15,.3);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;opacity:0;transition:opacity .2s ease;}
.wb-compose-mask.show{opacity:1;}
.wb-compose{position:relative;overflow:hidden;width:100%;background:rgba(255,252,248,.98);border-radius:18px 18px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;
  transform:translateY(24px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
.wb-compose-mask.show .wb-compose{transform:translateY(0);}
.wb-compose-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;}
.wb-compose-cancel,.wb-compose-send{border:none;font-family:inherit;font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;}
.wb-compose-cancel{background:rgba(0,0,0,.05);color:var(--wb-ink-soft);}
.wb-compose-send{background:var(--wb-orange);color:#fff;font-weight:600;}
.wb-compose-body{display:flex;gap:10px;align-items:flex-start;}
.wb-compose-body .wb-avatar{width:36px;height:36px;font-size:14px;}
.wb-compose>*{position:relative;z-index:2;}
.wb-compose-bg{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;
  background-repeat:no-repeat;opacity:0;transition:opacity .2s;pointer-events:none;}
.wb-compose.has-bg .wb-compose-bg{opacity:1;}
.wb-compose.has-bg::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(255,252,248,.72);
  pointer-events:none;}
.wb-compose-field textarea{position:relative;z-index:2;width:100%;height:110px;border:none;background:none;
  outline:none;resize:none;font-family:inherit;font-size:14px;line-height:1.6;padding:0;margin:0;
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--wb-ink);overflow-y:auto;}
.wb-compose-field textarea::placeholder{color:var(--wb-ink-soft);-webkit-text-fill-color:var(--wb-ink-soft);}
.wb-compose-tools{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--wb-line);}
.wb-tool{width:30px;height:30px;border:none;border-radius:9px;background:rgba(255,255,255,.8);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wb-tool:active{transform:scale(.94);}
.wb-tool svg{width:18px;height:18px;fill:none;stroke:var(--wb-orange-deep);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-tool.bg-on{background:rgba(255,140,60,.18);}
.wb-tool.diamond{margin-right:2px;}
.wb-tool.diamond svg{stroke:#4aa3ff;}
.wb-compose-count{margin-left:auto;font-size:11px;color:var(--wb-ink-soft);}
.wb-compose-field{min-width:0;position:relative;}
.wb-compose-body .wb-compose-field{flex:1;}
.wb-compose-mirror{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
  font-family:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  color:var(--wb-ink);}
.wb-hl{color:#2f80ed;}
.wb-compose-imgs{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;}
.wb-compose-imgs.show{display:grid;}
.wb-compose-img{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#ffe4cc;}
.wb-compose-img img{width:100%;height:100%;object-fit:cover;display:block;}
.wb-compose-img.is-video{aspect-ratio:16/9;grid-column:1/-1;}
.wb-compose-video-badge{position:absolute;right:6px;bottom:6px;font-size:10.5px;color:#fff;
  background:rgba(0,0,0,.42);border-radius:9px;padding:1px 6px;letter-spacing:.3px;}
.wb-compose-img-del{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;display:flex;
  align-items:center;justify-content:center;cursor:pointer;}
.wb-compose-imgs .wb-compose-add{aspect-ratio:1;border-radius:9px;border:1px dashed rgba(255,168,110,.75);
  background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:var(--wb-orange-deep);font-size:10.5px;}
.wb-compose-imgs .wb-compose-add svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-sheet-item{padding:13px 4px;font-size:14px;text-align:center;border-radius:12px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);cursor:pointer;
  font-family:inherit;color:var(--wb-ink);}
.wb-sheet-item:active{background:rgba(255,214,170,.6);}
.wb-sheet-item.danger{color:var(--wb-ink-soft);}
.wb-sheet-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;}
.wb-sheet-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.72);cursor:pointer;}
.wb-sheet-row:active{background:rgba(255,214,170,.55);}
.wb-sheet-row .wb-topic-ico{width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:rgba(74,163,255,.14);}
.wb-sheet-row .wb-topic-ico svg{width:14px;height:14px;fill:none;stroke:#4aa3ff;stroke-width:1.7;
  stroke-linejoin:round;}
.wb-sheet-row-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:flex;flex-direction:column;gap:0;}
.wb-sheet-row-name > div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-sheet-row-sub{font-size:11px;color:var(--wb-ink-soft);font-weight:500;margin-top:2px;white-space:normal;line-height:1.4;}
.wb-sheet-row.on{background:rgba(255,168,110,.22);border:1px solid rgba(255,168,110,.55);}
.wb-sheet-check{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:transparent;}
.wb-sheet-row.on .wb-sheet-check{background:var(--wb-orange);border-color:var(--wb-orange);}
.wb-sheet-tip{font-size:11.5px;color:var(--wb-ink-soft);padding:4px 4px 10px;line-height:1.5;}
.wb-sheet-row-meta{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-sheet-quote{display:flex;gap:8px;padding:10px 11px;border-radius:12px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,196,150,.45);}
.wb-sheet-quote .wb-avatar{width:30px;height:30px;font-size:12px;}
.wb-sheet-quote-main{flex:1;min-width:0;}
.wb-sheet-quote-name{font-size:12px;font-weight:600;color:var(--wb-orange-deep);margin-bottom:3px;}
.wb-sheet-quote-text{font-size:12.5px;line-height:1.6;color:var(--wb-ink-soft);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.wb-sheet-foot{display:flex;align-items:center;gap:10px;}

.wb-cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.wb-cover-swatch{aspect-ratio:3/2;border-radius:10px;cursor:pointer;border:2px solid transparent;
  box-shadow:0 3px 10px -6px rgba(190,110,40,.6);transition:transform .12s,border-color .15s;}
.wb-cover-swatch.on{border-color:var(--wb-orange);}
.wb-cover-swatch:active{transform:scale(.95);}
.wb-acc-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;}
.wb-acc-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);cursor:pointer;}
.wb-acc-row:active{background:rgba(255,214,170,.55);}
.wb-acc-row.on{background:rgba(255,140,60,.13);border-color:rgba(255,168,110,.7);}
.wb-acc-avatar{width:38px;height:38px;font-size:15px;}
.wb-cm-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:13px;font-weight:700;margin-bottom:8px;}
.wb-cm-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;color:var(--wb-ink-soft);margin:0 0 9px;}
.wb-cm-refresh{border:none;font-family:inherit;font-size:11px;padding:4px 10px;border-radius:9px;
  background:rgba(255,140,60,.16);color:var(--wb-orange-deep);font-weight:600;cursor:pointer;
  white-space:nowrap;}
.wb-cm-refresh:active{background:rgba(255,140,60,.3);}
.wb-cm-refresh:disabled{opacity:.6;}
.wb-cm-list{display:flex;flex-direction:column;gap:13px;max-height:44vh;overflow-y:auto;padding-right:2px;}
.wb-cm-item{display:flex;gap:8px;}
.wb-cm-item.is-reply{margin-top:9px;}
.wb-cm-avatar{width:28px;height:28px;font-size:12px;flex:none;}
.wb-cm-avatar.is-ai{background:linear-gradient(140deg,#ffbe86,#ff9a63);color:#fff;font-weight:700;}
.wb-cm-main{flex:1;min-width:0;}
.wb-cm-name{font-size:12px;font-weight:600;color:#8a6a4f;margin-bottom:3px;
  display:flex;align-items:center;gap:5px;}
.wb-cm-text{font-size:12.5px;line-height:1.6;color:var(--wb-ink);word-break:break-word;}
.wb-cm-text.pending{color:var(--wb-ink-soft);}
.wb-cm-sub{display:flex;align-items:center;gap:12px;font-size:10.5px;color:var(--wb-ink-soft);margin-top:4px;}
.wb-cm-btn{border:none;background:none;padding:0;font-family:inherit;font-size:10.5px;
  color:var(--wb-ink-soft);cursor:pointer;}
.wb-cm-btn.on{color:var(--wb-orange-deep);font-weight:700;}
.wb-cm-replies{margin-top:7px;padding-left:8px;border-left:2px solid rgba(255,190,150,.4);}
.wb-cm-replybox{display:flex;flex-direction:column;gap:6px;margin-top:7px;}
.wb-cm-replybox[hidden]{display:none;}
.wb-cm-reply-row{display:flex;gap:6px;align-items:center;}
.wb-cm-input{flex:1;min-width:0;border:1px solid var(--wb-line);border-radius:10px;padding:6px 9px;
  font-family:inherit;font-size:12px;background:rgba(255,255,255,.92);color:var(--wb-ink);}
.wb-cm-input:focus{outline:none;border-color:var(--wb-orange);}
.wb-cm-send{border:none;border-radius:10px;padding:6px 12px;font-family:inherit;font-size:12px;
  font-weight:600;background:var(--wb-orange);color:#fff;cursor:pointer;}
.wb-cm-imgbtn{flex:none;width:32px;height:32px;padding:0;border:1px solid var(--wb-line);border-radius:10px;
  background:rgba(255,255,255,.92);color:var(--wb-orange-deep);cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.wb-cm-imgbtn:active{background:rgba(255,214,170,.6);}
.wb-cm-imgbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cm-imgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.wb-cm-imgs img{width:62px;height:62px;object-fit:cover;border-radius:8px;display:block;}
.wb-cm-picked{display:flex;flex-wrap:wrap;gap:5px;}
.wb-cm-picked:empty{display:none;}
.wb-cm-picked-item{position:relative;width:44px;height:44px;border-radius:8px;overflow:hidden;}
.wb-cm-picked-item img{width:100%;height:100%;object-fit:cover;display:block;}
.wb-cm-picked-del{position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;line-height:1;display:flex;
  align-items:center;justify-content:center;cursor:pointer;}
.wb-cm-compose{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--wb-line);}
.wb-cm-compose-row{display:flex;gap:8px;align-items:center;}
.wb-cm-empty{font-size:12px;color:var(--wb-ink-soft);text-align:center;padding:16px 0;}

.wb-mp-mask{position:absolute;inset:0;z-index:38;display:flex;flex-direction:column;background:#f5f5f5;
  animation:wbFade .16s ease;}
.wb-mp-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f5f5f5;}
.wb-mp-scroll::-webkit-scrollbar{width:0;}
.wb-mp-hero{position:relative;background:#fff;padding-bottom:2px;}
.wb-mp-cover{position:relative;height:196px;background-size:cover;background-position:center 26%;background-color:#d8d0c6;}
.wb-mp-cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,0) 42%,rgba(0,0,0,.04));}
.wb-mp-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;
  padding:10px 12px 0;}
.wb-mp-back{position:absolute;left:10px;top:10px;z-index:7;width:32px;height:32px;border:none;padding:0;
  cursor:pointer;border-radius:50%;color:#3a3a3a;background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .12s,background .15s;}
.wb-mp-back:active{transform:scale(.92);background:#fff;}
.wb-mp-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-mp-topacts{margin-left:auto;display:flex;align-items:center;gap:8px;}
.wb-mp-likebtn{display:flex;align-items:center;gap:5px;height:30px;padding:0 14px;border:none;
  border-radius:16px;background:rgba(90,90,90,.44);color:#fff;font-family:inherit;font-size:13px;
  cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.wb-mp-likebtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-mp-circle{width:30px;height:30px;border:none;border-radius:50%;background:rgba(90,90,90,.44);
  color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.wb-mp-circle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-mp-card{position:relative;margin-top:-22px;background:#fff;border-radius:16px 16px 0 0;
  padding:0 14px 14px;z-index:2;}
.wb-mp-head{display:flex;align-items:flex-start;gap:12px;}
.wb-mp-ava{position:relative;flex:none;width:84px;height:84px;margin-top:-32px;}
.wb-mp-ava .wb-avatar{width:84px;height:84px;font-size:30px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.35);}
.wb-mp-vb{position:absolute;right:-1px;bottom:3px;width:20px;height:20px;border-radius:50%;
  background:var(--wb-orange);color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;}
.wb-mp-id{flex:1;min-width:0;padding-top:8px;}
.wb-mp-name{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:18px;font-weight:700;
  color:#222;line-height:1.4;}
.wb-mp-gender{width:16px;height:16px;border-radius:50%;background:#5b9cf8;color:#fff;font-size:10px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.wb-mp-badge{display:inline-flex;align-items:center;height:14px;padding:0 6px;border-radius:7px;
  font-size:9px;font-weight:700;color:#5c3200;letter-spacing:.2px;

    ctx.fillStyle = st.bg;
    ctx.fillRect(0, 0, CV, CVH);
    const font = s => `${s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    const wrap = () => {
      const out = [];
      let cur = '';
      for(const ch of Array.from(t)){
        if(ch === '\n'){ out.push(cur); cur = ''; continue; }
        const test = cur + ch;
        if(ctx.measureText(test).width > CV - pad * 2 && cur){ out.push(cur); cur = ch; }
        else cur = test;
      }
      if(cur) out.push(cur);
      return out;
    };
    let fs = Math.round(CV * (md === 's' ? 0.075 : 0.055)), lineH = 0, lines = [];
    while(fs >= 18){
      ctx.font = font(fs);
      lineH = Math.round(fs * 1.75);
      lines = wrap();
      if(lines.length * lineH <= CVH - pad * 2) break;
      fs -= 2;
    }
    ctx.fillStyle = st.fg;
    ctx.font = font(fs);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const startY = (CVH - lines.length * lineH) / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, pad, startY + i * lineH));
    const url = cv.toDataURL('image/png');
    TEXT_IMG_CACHE[key] = url;
    return url;
  }

  function imgSrc(src, mode){
    const s = String(src == null ? '' : src);
    if(s.indexOf('txt:') !== 0) return s;
    const body = s.slice(4);
    let seed = 0;
    for(let i = 0; i < body.length; i++) seed = (seed * 31 + body.charCodeAt(i)) % 9973;
    return textImage(body, seed, mode);
  }

  function pickScene(){
    const usable = SCENE_KEYS.filter(k => k !== 'none');
    return usable[Math.floor(Math.random() * usable.length)];
  }

  function sceneList(it){
    let list = it && it.scenes;
    if(typeof list === 'string') list = list.split(/[,，、\s]+/);
    if(!Array.isArray(list) || !list.length) list = [it && it.scene ? it.scene : ''];
    list = list.map(s => String(s || '').trim()).filter(s => SCENE_KEYS.indexOf(s) >= 0);
    if(!list.length) list = [pickScene()];
    return list.slice(0, 9);
  }

  function imageTexts(it){
    let list = it && it.images;
    if(typeof list === 'string') list = list.split(/[,，、\n]+/);
    if(!Array.isArray(list)) list = [];
    list = list.map(s => String(s == null ? '' : s).trim()).filter(Boolean).slice(0, 9);
    if(list.length) return list;
    const text = String((it && it.text) || '').trim();
    if(!text) return [];
    const parts = text.split(/[，。！？；、,.!?;~～\s]+/).map(s => s.trim()).filter(Boolean);
    if(parts.length >= 3) return parts.slice(0, 3);
    const one = parts.join(' ').slice(0, 16) || text.slice(0, 16);
    return [one];
  }

  function postImages(texts){
    const list = (Array.isArray(texts) ? texts : []).slice(0, 9)
      .map(t => String(t == null ? '' : t).trim()).filter(Boolean);
    return list.map(t => t.indexOf('data:') === 0 ? t : 'txt:' + t);

                if(!data.profile.following) data.profile.following = FOLLOWED_NAMES.size;
      }
      if(!Array.isArray(data.recommend)) data.recommend = [];

      }
      if(!Array.isArray(data.drafts)) data.drafts = [];

      data.feed.concat(data.recommend || []).forEach(x => {

      if(!data.v || data.v < 11){
        data.feed.concat(data.recommend || []).forEach(x => {

      if(!data.v || data.v < 12){
        const byName = {};
        (data.chats || []).forEach(c => { byName[c.name] = c; });
        const merged = DEFAULT_CHATS.map(c => byName[c.name] || Object.assign({}, c));
        (data.chats || []).forEach(c => {
          if(!DEFAULT_CHATS.some(x => x.name === c.name)) merged.push(c);
        });
        data.chats = merged;
        if(!data.dms || typeof data.dms !== 'object') data.dms = {};
      }
      if(!data.v || data.v < 13){
        const fix = x => {
          if(!x) return;
          if(!x.mine){
            const mapped = weiboNick(x.name);
            if(mapped && mapped !== x.name){
              x.name = mapped;
              if(isWayvAccount(mapped)){

              }
            }
            if(x.text) x.text = toMandarin(x.text);
          }
          if(!x.ts) x.ts = timeToTs(x.time);
        };
        data.feed.concat(data.recommend || []).forEach(fix);
        (data.batches || []).forEach(b => {
          if(!b.ts && b.time) b.ts = timeToTs(b.time);
        });
      }
      if(!data.v || data.v < 14){
        const meNames = new Set();
        const addMe = n => {
          const t = String(n == null ? '' : n).trim();
          if(t) meNames.add(t);
        };
        addMe(data.profile && data.profile.name);
        (data.accounts || []).forEach(a => addMe(a && a.name));
        data.feed = data.feed.filter(x => !(x && /^atseed/.test(String(x.id || ''))));
        data.feed.forEach(x => {
          if(!x || x.mine || !x.text) return;
          meNames.forEach(n => { x.text = String(x.text).split('@' + n).join('').trim(); });
        });
        delete data.atSeeded;
      }
      if(!data.v || data.v < 15){
        data.chats = [];
        data.dms = {};
        data.seenNotices = [];
        data.feed.forEach(x => {
          if(!x || x.mine || !Array.isArray(x.cmts)) return;
          x.cmts = x.cmts.filter(e => e && e.name !== x.name);
        });
      }
      if(!data.v || data.v < 16){
        data.recommend = [];
        data.recView = { round: 1, items: [] };
      }
      if(!data.v || data.v < 17){
        (data.recommend || []).forEach(x => applyMarketStats(x));
        (data.feed || []).forEach(x => applyMarketStats(x));
      }
      if(!data.v || data.v < 19){
        const fixStats = x => {
          if(!x) return;
          if(x.mine){
            const empty = !(x.likes > 0) && !(x.comments > 0) && !(x.reposts > 0);
            applyPostStats(x, empty);
            return;
          }
          applyPostStats(x, true);
        };
        (data.feed || []).forEach(fixStats);
        (data.recommend || []).forEach(fixStats);
      }
      if(!data.v || data.v < 20){
        (data.recommend || []).forEach(x => { if(x) x.rec = true; });
        (data.feed || []).forEach(x => { if(x) applyPostStats(x, true); });
        (data.recommend || []).forEach(x => { if(x) applyPostStats(x, true); });
      }
      if(!data.v || data.v < 22){
        if(data.memberPosts && typeof data.memberPosts === 'object'){
          delete data.memberPosts['威神V_钱锟_KUN'];
        }
      }
      if(!data.v || data.v < 23){
        if(data.memberPosts && typeof data.memberPosts === 'object'){
          delete data.memberPosts['威神V_肖俊'];

          data.recommend = data.recommend.filter(x => x && keepNames.has(String(x.name || '').trim()));

        const strip = p => {

        }
      }
      data.v = 32;
      if(seedDefaultContent(data)) save();
      return data;

    }
    return { get, save };
  }

  function imgsGrid(list, cls){
    const imgs = (list || []).filter(Boolean).slice(0, 9);
    if(!imgs.length) return '';
    const base = cls || 'wb-post-imgs';
    const one = imgs.length === 1 && base === 'wb-post-imgs';
    const cells = imgs.map(src => `<div class="wb-post-img"><img src="${esc(imgSrc(src, one ? 'wide' : ''))}" alt=""></div>`);
    if(one) return `<div class="${base} one">${cells[0]}</div>`;
    while(cells.length % 3) cells.push('<div class="wb-post-img empty"></div>');
    return `<div class="${base}">${cells.join('')}</div>`;
  }

              }));

    function shuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function isFollowed(p){
       if(!p) return false;
      if(p.mine) return true;
      if(isWayvAccount(p.name)) return true;
      if(p.unfollowed) return false;
      return !!(p.official || p.following || FOLLOWED_NAMES.has(p.name));

    function followSources(d){
      const rec = (d.recommend || []).filter(x => !x.mine && !isMeName(x.name) && !x.unfollowed && (x.following || x.official));
      const all = d.feed.filter(x => !x.mine && !isMeName(x.name) && isFollowed(x)).concat(rec);
      if(!followOrder) return all;
      const map = {};
      all.forEach(x => { map[x.id] = x; });
      const ordered = followOrder.map(id => map[id]).filter(Boolean);
      all.forEach(x => { if(ordered.indexOf(x) < 0) ordered.push(x); });
      return ordered;
    }

    function recAccounts(){
      const seen = new Set();
      const out = [];
      REC_ACCOUNTS.forEach(a => {
        const n = String(a.name || '').trim();
        if(!n || seen.has(n)) return;
        if(isWayvAccount(n) || isMeName(n) || FOLLOWED_NAMES.has(n)) return;
        seen.add(n);
        out.push(a);
      });
      return out;
    }

    function recommendPool(d){
      const bots = (d.recommend || [])
        .filter(x => x && !isFollowed(x) && !isMeName(x.name) && !isWayvAccount(x.name));
      const others = [];
      const seenName = {};
      d.feed.forEach(x => {
        if(!x || x.mine || isMeName(x.name) || isFollowed(x) || isWayvAccount(x.name)) return;
        if(seenName[x.name]) return;
        seenName[x.name] = true;
        others.push(x);
      });
      const map = {};
      others.concat(bots).forEach(x => { map[x.id] = x; });
      return { others, bots, map, total: others.length + bots.length };
    }

    function makeRecPost(d, view, author, text, round, pics, forceImages){
      const caps = Array.isArray(pics) ? pics.filter(Boolean).slice(0, 2) : [];

      const withImg = fixed ? fixed.length > 0 : Math.random() < 0.45;
      const post = {
        id: 'rc' + (round || 1) + '_' + Date.now().toString(36) + '_' + bigRnd(1000, 9999),
        name: author.name,
        avatar: '',
        vip: !!author.vip,
        time: '刚刚',
        ts: Date.now() - bigRnd(0, 50) * 60000,
        text,
        imgs: withImg
          ? postImages(fixed ? fixed : caps.slice(0, bigRnd(1, caps.length)))
          : [],
        likes: 0,
        comments: 0,
        reposts: 0,
        liked: false,
        rec: true,
        cmts: []
      };
      applyPostStats(post, true);
      d.recommend.push(post);
      return post.id;
    }

    function recViewInit(d){
      if(!d.recView || !Array.isArray(d.recView.items)) d.recView = { round: 1, items: [] };
      if(!d.recView.round) d.recView.round = 1;
      const { map } = recommendPool(d);
      const alive = d.recView.items.filter(it => map[it.id]);
      if(alive.length !== d.recView.items.length) d.recView.items = alive;
      store.save();
      return d.recView;
    }

    function recommendList(d){

        view.items = alive;

      }
      return alive.map(it => map[it.id]);
    }

    function pruneRecommend(d, view){
      const cutoff = (view.round || 1) - 4;
      if(cutoff < 1) return;
      const drop = view.items.filter(it => (it.r || 1) <= cutoff).map(it => it.id);
      if(!drop.length) return;
      view.items = view.items.filter(it => (it.r || 1) > cutoff);
      d.recommend = (d.recommend || []).filter(x => {
        if(drop.indexOf(x.id) < 0) return true;
        if(x.liked) return true;
        return false;
      });
    }

    function recKindLabel(acc){
      const name = String((acc && acc.name) || '').trim();
      if(isCrackAccount(name)) return '韩娱吃瓜/扒料 bot，全程用缩写和代称（帽家、瓶、某男豆、某团、绿卡、素人），不点真名';
      if(acc && acc.gossip) return '娱乐吃瓜/爆料号，主打娱乐圈动态与争议话题';

    const REC_AI_SYSTEM = '你是微博推荐页内容生成器。用户会给出若干微博账号（微博名 + 账号类型），请为每个账号各写一条全新的微博，每次都必须重新创作，不能套用固定模板，也不能与账号已有内容重复。要求：1) 完全贴合该账号的定位与语气，账号之间不要串味；2) 每条 25-80 字，像真人随手发的日常或爆料，不要用"大家好"这类开场白；3) 娱乐爆料/吃瓜类账号可以写带悬念的瓜，但不得出现任何现实存在的艺人姓名、经纪公司、真实事件或机构名称，需要指代时用"某艺人""某剧组""某公司""某位顶流"等；4) 最多带 1 个 #话题#，可加少量 emoji；5) 每条配 0-9 张图，用 images 数组写每张图上要出现的文字（像随手拍的照片说明或画面里的字），不需要图就给空数组；6) 全部使用普通话简体中文，不要出现粤语用字或方言；7) 不要 @ 任何人，不要提及这是 AI 生成。只输出 JSON 数组，不要输出解释或代码块标记。';

    async function requestAiRecPosts(authors){
      if(!Phone || !Phone.chatWithAI) throw new Error('未连接 AI');
      const lines = authors.map((a, i) => `${i + 1}. 微博名：${a.name}｜账号类型：${recKindLabel(a)}`).join('\n');
      const raw = await Phone.chatWithAI([
        { role:'system', content: REC_AI_SYSTEM },
        { role:'user', content: `请为下面每个账号各写一条全新的微博，共 ${authors.length} 条：\n${lines}\n\n输出格式（严格 JSON 数组）：\n[{"name":"微博名","text":"微博正文","images":["图上文字1","图上文字2"]}]` }
      ]);
      const items = parsePostJson(raw);
      if(!items.length) throw new Error('没有解析到推荐内容');
      return items;
    }

    async function aiFreshRecommend(d, view, count, round){
      const accounts = recAccounts();
      if(!accounts.length) throw new Error('没有可用的推荐账号');
      const shown = {};
      (view.items || []).forEach(it => {
        const p = findPost(d, it.id);
        if(p && p.name) shown[p.name] = true;
      });
      const recent = new Set(Array.isArray(view.recentAuthors) ? view.recentAuthors : []);
      let pool = accounts.filter(a => !shown[a.name] && !recent.has(a.name));
      if(!pool.length) pool = accounts.filter(a => !shown[a.name]);
      if(!pool.length) pool = accounts.slice();
      const picked = shuffle(pool).slice(0, Math.min(count, pool.length));
      const items = await requestAiRecPosts(picked);
      const ids = [];
      items.slice(0, picked.length).forEach((it, i) => {
        const acc = picked.find(a => a.name === String(it.name || '').trim()) || picked[i];
        if(!acc) return;
        const text = toMandarin(String(it.text || '').trim());
        if(!text) return;
        const images = (Array.isArray(it.images) ? it.images : [])
          .map(t => toMandarin(String(t == null ? '' : t).trim())).filter(Boolean).slice(0, 9);
        ids.push(makeRecPost(d, view, acc, text, round, [], images));
        shown[acc.name] = true;
        recent.add(acc.name);
      });
      if(!ids.length) throw new Error('没有生成到推荐内容');
      view.recentAuthors = Array.from(recent).slice(-60);
      return ids;
    }

    async function regenerateRecommend(){
      if(recRefreshing) return;
      recRefreshing = true;
      const d = store.get();
      const view = recViewInit(d);
      const nextRound = (view.round || 1) + 1;
      if(currentTab === 'home') renderHome();
      try{
        const added = await aiFreshRecommend(d, view, 4, nextRound);
        view.round = nextRound;
        pruneRecommend(d, view);
        added.forEach(id => view.items.unshift({ id, r: nextRound }));
        store.save();
        recRefreshing = false;
        rollLive(store.get());
        if(currentTab === 'home') renderHome();
        toast(`已生成 ${added.length} 条新推荐`);
      }catch(err){
        recRefreshing = false;
        rollLive(store.get());
        if(currentTab === 'home') renderHome();
        toast('生成失败：' + ((err && err.message) ? err.message : '请检查 API 设置'));
      }
    }

    function bindLiveStrip(el){
      if(!el) return;
      let dragging = false, startX = 0, startLeft = 0, moved = false;
      el.addEventListener('pointerdown', e => {
        if(e.pointerType !== 'mouse' || e.button !== 0) return;
        dragging = true; moved = false;
        startX = e.clientX; startLeft = el.scrollLeft;
        el.classList.add('dragging');
      });
      el.addEventListener('pointermove', e => {
        if(!dragging) return;
        const dx = e.clientX - startX;
        if(Math.abs(dx) > 4){
          moved = true;
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
        }
        if(moved){
          el.scrollLeft = startLeft - dx;
          e.preventDefault();
        }
      });
      const end = () => {
        if(!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('click', e => {
        if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
      }, true);
    }

    function parsePostJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          const out = list.map(x => {
            let scenes = x.scenes;
            if(typeof scenes === 'string') scenes = scenes.split(/[,，、\s]+/);
            if(!Array.isArray(scenes)) scenes = [];
            let images = x.images || x.imgs || x['配图文字'];
            if(typeof images === 'string') images = images.split(/[,，、\n]+/);
            if(!Array.isArray(images)) images = [];
            return {
              name: String(x.name || x['角色'] || '').trim(),
              text: toMandarin(String(x.text || x.content || x['内容'] || '').trim()),
              scene: String(x.scene || x['配图'] || '').trim(),
              scenes: scenes.map(s => String(s || '').trim()).filter(Boolean),
              images: images.map(s => String(s || '').trim()).filter(Boolean).slice(0, 9)
            };
          }).filter(x => x.text);
          if(out.length) return out;
        }
      }catch(e){}
      const out = [];
      const re = /"name"\s*:\s*"([^"]*)"[\s\S]*?"text"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
      let m;
      while((m = re.exec(s))) out.push({ name: m[1], text: toMandarin(m[2].replace(/\\n/g, '\n').replace(/\\"/g, '"')), scene:'', scenes:[], images:[] });
      return out.filter(x => x.text);
    }

    async function generateBatch(){
      const d = store.get();
      let authors = authorList();
      if(!authors.length) authors = memberFallbackList();
      if(!authors.some(a => a.name === 'WayV_official')){
        authors = authors.concat([{ name:'WayV_official', avatar:'wayv.jpg', identity:'WayV官方账号', persona:'官方口吻，发布公告、行程和官方物料' }]);
      }
      authors = authors.filter(a => a && !isMeName(a.name));
      if(!authors.length) throw new Error('还没有可以发微博的联系人');
      if(!Phone || !Phone.chatWithAI) throw new Error('未连接 AI');
      const wayvAuthors = authors.filter(a => isWayvAccount(a.name));
      const otherAuthors = authors.filter(a => !isWayvAccount(a.name));
      const want = 1 + Math.floor(Math.random() * 3);
      const bag = [];
      wayvAuthors.forEach(a => { for(let i = 0; i < 6; i++) bag.push(a); });
      otherAuthors.forEach(a => bag.push(a));
      const recentNames = new Set((d.feed || []).slice(0, 12).filter(x => x && !x.mine).map(x => weiboNick(x.name)));
      const picked = [];
      const seen = new Set();
      let otherPicked = 0;
      shuffle(bag).forEach(a => {
        if(picked.length >= want) return;
        const key = weiboNick(a.name);
        if(seen.has(key)) return;
        const isWayv = isWayvAccount(a.name);
        if(!isWayv && otherPicked >= 1) return;
        seen.add(key);
        if(!isWayv) otherPicked++;
        picked.push(a);
      });
      if(wayvAuthors.length && !picked.some(a => isWayvAccount(a.name))){
        const w = shuffle(wayvAuthors).find(a => !recentNames.has(weiboNick(a.name))) || wayvAuthors[Math.floor(Math.random() * wayvAuthors.length)];
        if(w && !seen.has(weiboNick(w.name))){
          seen.add(weiboNick(w.name));
          picked.unshift(w);
          if(picked.length > want) picked.pop();
        }
      }
      if(!picked.length) picked.push(authors[Math.floor(Math.random() * authors.length)]);
      const lines = picked.map((c, i) => {
        const bits = [];
        if(c.identity) bits.push('身份：' + c.identity);
        if(c.persona) bits.push('人设：' + c.persona);
        return `${i + 1}. ${c.name}${bits.length ? '（' + bits.join('；') + '）' : ''}`;
      }).join('\n');
      const messages = [
        { role:'system', content:'你是微博内容生成器，根据每个人的设定写出真实、自然、有生活感的微博正文。所有内容必须使用普通话简体中文，严禁出现粤语用字（唔、嘅、咁、係、嚟、冇、咗、睇、靓等）和粤语表达；即使人物来自广东、香港、澳门，或设定里提到会说粤语，发微博也必须写普通话。只输出 JSON 数组，不要输出解释或代码块标记。' },
        { role:'user', content:`请为下面每个人各写一条微博，共 ${picked.length} 条：\n${lines}\n\n要求：\n1. 完全贴合该人物的人设与语气，不要串味；\n2. 每条 20-60 字，像真人随手发的日常，不要用"大家好"这类开场白；\n3. 最多带 1 个 #话题#，可加少量 emoji；\n4. 不要提及这是 AI 生成；\n5. 每条配 1-9 张图，用 images 数组表示每张图上要写的文字（一句话、几个字都行，就像随手拍的图上的字），文字要像在描述这些图，比如"今晚的首尔"配上夜景和自拍；张数 1-9 张不等，不要超过 9 张；\n6. 全部用普通话简体中文，绝对不能出现粤语、粤语用字或方言词（唔/嘅/咁/係/嚟/冇/咗/睇/靓 一律不允许）；\n7. 正文里不要 @ 任何人，也不要 @ 粉丝或用户。\n\n输出格式（严格 JSON 数组）：\n[{"name":"角色名","text":"微博正文","images":["图上文字1","图上文字2"]}]` }
      ];
      const raw = await Phone.chatWithAI(messages);
      const items = parsePostJson(raw);
      if(!items.length) throw new Error('没有解析到微博内容');
      const batchId = 'b' + Date.now();
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      (d.batches || []).forEach(b => {
        (b.postIds || []).forEach(id => {
          const old = d.feed.find(x => x.id === id);
          if(old && old.time === '刚刚') old.time = b.time;
        });
      });
      const postIds = [];
      items.slice(0, picked.length).forEach((it, i) => {
        const key = weiboNick(it.name);
        const ch = picked.find(c => weiboNick(c.name) === key || c.name === it.name) || picked[i] || picked[0];
        if(!ch || isMeName(ch.name)) return;
        const mappedName = weiboNick(ch.name);
        const texts = imageTexts(it).map(t => stripMeMentions(toMandarin(t)));
        const post = {
          id: batchId + '_' + i,
          name: mappedName,
          avatar: charAvatar(ch, d),
          vip: true,
          following: true,
          time: '刚刚',
          ts: Date.now(),
          text: stripMeMentions(toMandarin(it.text)),
          imgs: postImages(texts),
          likes: 0,
          comments: 0,
          reposts: 0,
          liked: false,
          batch: batchId
        };
        applyPostStats(post, true);
        d.feed.unshift(post);
        postIds.push(post.id);
      });
      if(!postIds.length) throw new Error('没有生成到内容');
      d.batches.unshift({ id: batchId, time, ts: now.getTime(), postIds });
      store.save();
      return postIds.length;
    }

    const REC_REFINE_SYSTEM = '你是微博文案助手。用户会给出一个微博账号的「微博名」「账号主要内容」和一条「新帖内容」。你要做三件事：1) 先判断账号定位与语气，把这条新帖改写成一条真实的微博正文，必须重新组织句子和措辞，绝对不能与用户给的原文逐字相同，也不能只加标点：原文很简略或只有几个词时，补充具体细节、场景、情绪和口吻，写成 30-90 字完整的一条；原文已经完整时换一种说法，调整开头与语序，保留原意与关键信息，不要改变事实；2) 判断这条微博适合配几张图，0-9 张，不需要图就返回空数组；3) 为每张图写一句图上文字，像随手拍的照片说明或画面里的字，不要编号。全部使用普通话简体中文，不要出现粤语用字或方言，不要用"大家好"这类开场白，不要提及 AI。只输出 JSON 数组，不要输出解释或代码块标记。';

    function parseRefineJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          return list.map((x, i) => {
            let images = x.images || x.imgs || x['配图文字'];
            if(typeof images === 'string') images = images.split(/[,，、\n]+/);
            if(!Array.isArray(images)) images = [];
            return {
              idx: Number(x.idx || x.index || i + 1),
              text: toMandarin(String(x.text || x.content || x['正文'] || '').trim()),
              images: images.map(t => String(t == null ? '' : t).trim()).filter(Boolean).slice(0, 9)
            };
          }).filter(x => x.text);
        }
      }catch(e){}
      return [];
    }

    function recTextKey(s){
      return String(s == null ? '' : s).replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
    }

    async function aiRefineRecPosts(items){
      if(!Phone || !Phone.chatWithAI) throw new Error('未连接 AI');
      const lines = items.map((it, i) =>
        `${i + 1}. 微博名：${it.name}｜账号主要内容：${it.topic || '未填写'}｜新帖内容：${it.text}`
      ).join('\n');
      const raw = await Phone.chatWithAI([
        { role:'system', content: REC_REFINE_SYSTEM },
        { role:'user', content:`请按下面每一组的账号定位，扩写/润色新帖内容并按需配图：\n${lines}\n\n输出格式（严格 JSON 数组，idx 与上面的序号对应）：\n[{"idx":1,"text":"微博正文","images":["图上文字1","图上文字2"]}]` }
      ]);
      const out = parseRefineJson(raw);
      return items.map((it, i) => {
        const hit = out.find(x => x.idx === i + 1) || out[i];
        const got = hit && hit.text ? String(hit.text).trim() : '';
        const same = got && recTextKey(got) === recTextKey(it.text);
        const text = (got && !same) ? got : String(it.text || '').trim();
        const images = (got && !same && hit.images && hit.images.length) ? hit.images : [];
        return { name: it.name, topic: it.topic, text, images };
      });
    }

          </div>`).join('');
        rowsEl.querySelectorAll('[data-del]').forEach(btn => {
          btn.onclick = () => {
            syncRows();
            rows.splice(Number(btn.dataset.del), 1);
            if(!rows.length) rows.push({ name:'', topic:'', text:'' });
            renderRows();
          };
        });
        rowsEl.querySelectorAll('[data-k="name"]').forEach(input => {
          input.onchange = () => {
            const name = input.value.trim();
            const topicInput = input.parentElement.querySelector('[data-k="topic"]');
            if(!name || !topicInput || topicInput.value.trim()) return;
            const known = (store.get().customRec || []).find(x => x.name === name);
            if(known && known.topic) topicInput.value = known.topic;
          };
        });
      }
      renderRows();
      s.mask.querySelector('#wbRecAddRow').onclick = () => {
        syncRows();
        rows.push({ name:'', topic:'', text:'' });
        renderRows();
        rowsEl.scrollTop = rowsEl.scrollHeight;
      };
      s.mask.querySelector('[data-act="cancel"]').onclick = s.close;
      const okBtn = s.mask.querySelector('[data-act="ok"]');
      okBtn.onclick = async () => {
        if(okBtn.dataset.busy) return;
        syncRows();
        const valid = rows.filter(r => String(r.name || '').trim() && String(r.text || '').trim());
        if(!valid.length){ toast('请至少填写一组微博名和新帖内容'); return; }
        const base = valid.map(r => ({
          name: String(r.name).trim(),
          topic: String(r.topic || '').trim(),
          text: String(r.text).trim()
        }));
        okBtn.dataset.busy = '1';
        okBtn.disabled = true;
        const oldLabel = okBtn.textContent;
        okBtn.textContent = 'AI 生成中…';
        let refined;
        try{
          refined = await aiRefineRecPosts(base);
        }catch(e){
          okBtn.dataset.busy = '';
          okBtn.disabled = false;
          okBtn.textContent = oldLabel;
          toast('生成失败：' + ((e && e.message) ? e.message : '请检查 API 设置'));
          return;
        }
        okBtn.dataset.busy = '';
        okBtn.disabled = false;
        okBtn.textContent = oldLabel;
        const d = store.get();
        if(!Array.isArray(d.customRec)) d.customRec = [];
        const ids = [];
        refined.forEach(r => {
          const name = String(r.name || '').trim();
          const topic = String(r.topic || '').trim();
          const text = String(r.text || '').trim();
          if(!name || !text) return;
          let acc = d.customRec.find(x => x.name === name);
          if(!acc){ acc = { name, topic, texts: [] }; d.customRec.push(acc); }
          if(topic) acc.topic = topic;
          if(!acc.texts) acc.texts = [];
          if(acc.texts.indexOf(text) < 0) acc.texts.push(text);
          const id = makeRecPost(d, d.recView, { name, vip:false }, text, d.recView.round || 1, [], r.images);
          const post = d.recommend.find(x => x.id === id);
          if(post) post.topic = topic;
          ids.push(id);
        });
        if(!ids.length){ toast('内容为空，请检查后重试'); return; }
        d.recView.round = (d.recView.round || 1) + 1;
        pruneRecommend(d, d.recView);
        const round = d.recView.round || 1;
        d.recView.items = ids.map(id => ({ id, r: round })).concat(d.recView.items);
        store.save();
        s.close();
        homeFilter = 'recommend';
        rollLive(d);
        renderHome();
        toast(`已添加 ${ids.length} 条推荐内容`);
      };
    }

    function refreshDiscover(participantNames, authors){
      if(discoverGenerating) return;
      discoverGenerating = true;
      startRefreshSpin();
      const d = store.get();
      d.discoverParticipants = participantNames || [];
      store.save();
      if(currentTab === 'discover') renderDiscover();
      const people = (participantNames || []).map(n => {
        const hit = (authors || []).find(x => x.name === n);
        const bits = [String(n)];
        if(hit && hit.identity) bits.push('身份：' + hit.identity);
        if(hit && hit.persona) bits.push('人设：' + String(hit.persona).slice(0, 160));
        return bits.join('｜');
      }).join('\n');
      toast('正在生成热搜…');
      requestHotBundle(people).then(bundle => {
        const hot = normalizeHotList(bundle.hot);
        if(hot.length < 10) throw new Error('热搜内容不足');
        d.hotList = hot;
        const topics = sanitizeTopics(bundle.topics);
        d.discoverTopics = topics.slice(0, 8);

    function parseHotBundle(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const box = s.match(/\{[\s\S]*\}/);
      if(box) s = box[0];
      try{
        const o = JSON.parse(s);
        const hotArr = Array.isArray(o.hot) ? o.hot : (Array.isArray(o.hotList) ? o.hotList : (Array.isArray(o.list) ? o.list : []));
        const topicArr = Array.isArray(o.topics) ? o.topics : (Array.isArray(o.topicList) ? o.topicList : []);
        return {
          hot: parseHotJson(JSON.stringify(hotArr)),
          topics: parseTopicJson(JSON.stringify(topicArr))
        };
      }catch(e){}
      return { hot: parseHotJson(s), topics: parseTopicJson(s) };
    }

    function parseHotJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          return list.map((x, i) => {
            let type = String((x && x.type) || '').trim();
            if(HOT_TYPE_ORDER.indexOf(type) < 0) type = i < 1 ? '沸' : (i < 3 ? '爆' : (i < 8 ? '热' : '新'));
            return {
              tag: String((x && (x.tag || x.title || x.name)) || '').trim().slice(0, 20),
              type
            };
          }).filter(x => x.tag);
        }
      }catch(e){}
      return [];
    }

    function parseTopicJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          return list.map(x => {
            const name = typeof x === 'string' ? x : ((x && (x.name || x.tag || x.title)) || '');
            return { name: String(name).trim().replace(/^#|#$/g, '').slice(0, 20) };
          }).filter(x => x.name);
        }
      }catch(e){}
      return [];
    }

    function topicMixPosts(tag, seed){
      const out = [topicDiscussPost(tag, seed, 0)];
      const s0 = topicStarPost(tag, seed, 0) || topicGossipPost(tag, seed, 0);

      out.push(topicDiscussPost(tag, seed, 1));
      const s1 = topicStarPost(tag, seed, 1) || topicGossipPost(tag, seed, 1);

    function parseTopicAiJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const box = s.match(/\{[\s\S]*\}/);
      if(box) s = box[0];
      const list = x => (Array.isArray(x) ? x : [])
        .map(v => String(v == null ? '' : v).trim())
        .filter(Boolean);
      try{
        const o = JSON.parse(s);
        if(!o || typeof o !== 'object') return null;
        const post = String(o.post || o.text || '').trim();
        const images = list(o.images || o.imgs);
        const comments = list(o.comments);
        const reposts = list(o.reposts);
        const discuss = list(o.discuss).length ? list(o.discuss) : comments;
        const gossip = list(o.gossip);
        const star = list(o.star);
        if(!post) return null;
        return { post, images, comments, reposts, discuss, gossip, star };
      }catch(e){
        return null;
      }
    }

    function topicAiFill(tag, pin, extras, repaint, mask, handlers){
      const apply = o => {
        if(!o) return;
        if(o.post){
          const t = String(o.post).trim();
          pin.text = t.indexOf('#' + tag) >= 0 ? t : ('#' + tag + '#\n' + t);
        }
        const imgs = (o.images || []).slice(0, 9);
        if(imgs.length){
          pin.imgs = postImages(imgs);
          let k = 1;
          (extras || []).forEach(p => {
            if(p.kind !== 'gossip') return;
            const one = imgs[k % imgs.length];
            k++;
            p.imgs = one ? postImages([one]) : [];
          });
        }
        const fill = (kind, list) => {
          const posts = (extras || []).filter(p => p.kind === kind);
          (list || []).forEach((t, i) => {
            if(posts[i] && t) posts[i].text = String(t).trim();
          });
        };
        fill('discuss', o.discuss);
        fill('gossip', o.gossip);
        fill('star', o.star);
        const usedNames = new Set();
        pin.cmts = (o.comments || []).slice(0, 5).map((t, i) =>
          makeEntry('netizen', uniqueNick(shuffle(NETIZEN_NAMES.slice())[0], usedNames), String(t).trim(), {
            aiThread: true,
            time: (i * 4 + 2) + '分钟前'
          })
        );
        pin.rps = (o.reposts || []).slice(0, 4).map((t, i) =>
          makeEntry('netizen', uniqueNick(shuffle(NETIZEN_NAMES.slice())[0], usedNames), String(t).trim(), {
            aiRepost: true,
            time: (i * 6 + 1) + '分钟前',
            rpN: rndInt(3, 160)
          })
        );
        pin.comments = Math.max(pin.comments || 0, pin.cmts.length);
        pin.reposts = Math.max(pin.reposts || 0, pin.rps.length);
        if(mask && mask.isConnected) repaint();
      };
      const fail = msg => {
        if(handlers && handlers.err) handlers.err(msg);

      const starNames = (extras || []).filter(p => p.kind === 'star').map(p => p.name).filter(Boolean);
      const gossipNames = (extras || []).filter(p => p.kind === 'gossip').map(p => p.name).filter(Boolean);
      const nDisc = (extras || []).filter(p => p.kind === 'discuss').length;
      const nGossip = (extras || []).filter(p => p.kind === 'gossip').length;
      const nStar = (extras || []).filter(p => p.kind === 'star').length;
      const want = [
        `话题置顶博文 1 条（60-110字，必须以#${tag}#开头）`,

        nGossip ? `营销号跟进博文 ${nGossip} 条（每条40-90字，要有新角度）` : '',
        nStar ? `明星本人微博 ${nStar} 条（每条25-60字，语气自然）` : '',
        '置顶博文评论区 5 条（每条15-40字，网友口吻，互相呼应但不重复）',
        '置顶博文转发语 4 条（每条10-30字）'
      ].filter(Boolean).join('；');
      const who = [];
      if(starNames.length) who.push('明星昵称：' + starNames.join('、'));
      if(gossipNames.length) who.push('营销号昵称：' + gossipNames.join('、'));
      Phone.chatWithAI([
        { role: 'system', content: '你是微博话题页内容生成器。根据给定话题一次性生成整套真实的微博话题页内容，每次都要重新创作，不要套用固定模板。要求：内容口语化、有信息量、观点多样，不站队、不人身攻击。全部简体中文，' + rule + '不要提及 AI。只输出 JSON，不要解释、不要代码块。' },
        { role: 'user', content: `话题：#${tag}#\n${who.length ? who.join('\n') + '\n' : ''}请生成：${want}。\n输出格式（严格 JSON）：\n{"post":"话题博文正文","images":["配图文字1","配图文字2"],"discuss":["网友讨论1","网友讨论2"],"gossip":["营销号博文1","营销号博文2"],"star":["明星微博1","明星微博2"],"comments":["评论1","评论2","评论3","评论4","评论5"],"reposts":["转发语1","转发语2","转发语3","转发语4"]}` }
      ]).then(raw => {

    const NOTICE_FILTERS = {
      at: ['所有@我的', '微博里@我的', '评论里@我的'],

    function nowHM(){
      const t = new Date();
      return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    }

    function isVipName(n){
      return FOLLOWED_NAMES.has(n) || /WayV|威神V/i.test(String(n || ''));
    }

    function msgNotices(){
      const d = store.get();
      const my = myCmtName();
      const chars = authorList().filter(a => a && a.name && a.name !== my);
      const likeFans = chars.filter(a => !isWayvAccount(a.name));
      const likeNetizens = NETIZEN_NAMES.filter(n => !isWayvAccount(n));
      const at = [];
      const cmt = [];
      const like = [];
      const mine = d.feed.filter(x => x.mine && (!x.owner || x.owner === d.activeId));
      const addAt = (p, name, avatar, text, time, kind) => {
        at.push({
          kind, name, avatar: avatar || '', text: String(text || ''), time: time || '',
          postId: p.id, quote: String(p.text || '').slice(0, 30),
          thumb: (p.imgs || [])[0] || '', vip: isVipName(name)
        });
      };
      d.feed.forEach(p => {
        if(!p) return;
        if(!isMeName(p.name) && String(p.text || '').indexOf('@' + my) >= 0){
          addAt(p, p.name, p.avatar, p.text, p.time, 'post');
        }
        (p.cmts || []).forEach(e => {
          if(!e || e.name === my) return;
          if(String(e.text || '').indexOf('@' + my) >= 0){
            addAt(p, e.name, e.avatar, e.text, e.time, 'cmt');
          }
        });
      });
      mine.forEach(p => {
        (p.cmts || []).forEach(e => {
          if(!e || e.name === my) return;
          cmt.push({
            kind: 'mine', name: e.name, avatar: e.avatar || '',
            text: String(e.text || ''), time: e.time || '',
            quote: String(p.text || '').slice(0, 30), postId: p.id,
            thumb: (p.imgs || [])[0] || '', vip: isVipName(e.name)
          });
        });
      });
      mine.forEach(p => {
        const c = Math.min(parseInt(p.likes || 0, 10) || 0, 6);
        if(c <= 0) return;
        const pool = likeFans.concat(likeNetizens.map(n => ({ name: n, avatar: '' })));
        if(!pool.length) return;
        const used = {};
        const start = marketHash(p.id) % pool.length;
        for(let i = 0; i < c; i++){
          let who = null;
          for(let k = 0; k < pool.length; k++){
            const cand = pool[(start + i + k) % pool.length];
            if(cand && !used[cand.name]){ who = cand; break; }
          }
          if(!who) who = pool[(start + i) % pool.length];
          used[who.name] = true;
          like.push({
            kind: 'like', name: who.name,
            avatar: who.avatar || '',
            time: p.time || '', postId: p.id,
            quote: String(p.text || '').slice(0, 30),
            thumb: (p.imgs || [])[0] || '', vip: isVipName(who.name)
          });
        }
      });
      return { at, cmt, like };
    }

    function msgRow(ico, title, preview, badge, cat, extra){
      return `<div class="wb-chat-row wb-msg-cat" data-cat="${cat}">
