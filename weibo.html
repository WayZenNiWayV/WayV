    function renderMePanel(mine){
      const panel = body.querySelector('#wbMePanel');
      if(!panel) return;
      if(meTab === 'album'){
        const imgs = [];
        mine.forEach(x => (x.imgs || []).forEach(src => imgs.push(src)));
        if(!imgs.length){
          panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><rect x="3.2" y="3.6" width="17.6" height="16.8" rx="2.4"/><circle cx="8.8" cy="9.2" r="1.8"/><path d="M20.8 15.2l-4.2-4.2a1.9 1.9 0 0 0-2.7 0L6.4 19.6"/></svg>', '还没有照片，发微博时带上图片吧');
          return;
        }
        panel.innerHTML = `<div class="wb-post-imgs" style="margin:0 12px 10px;">${imgs.map(src => `<div class="wb-post-img"><img src="${esc(imgSrc(src))}" alt=""></div>`).join('')}</div>`;
        return;
      }
      if(meTab === 'draft'){
        const drafts = store.get().drafts || [];
        if(!drafts.length){
          panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><path d="M3.6 6.2h5.2l1.9 2.6h9.7v10.4H3.6z"/><path d="M3.6 9.6h16.8"/></svg>', '草稿箱是空的');
          return;
        }
        panel.innerHTML = drafts.map(x => `
          <div class="wb-draft" data-id="${esc(x.id)}">
            <div class="wb-draft-top">
              <span>${esc(x.time || '草稿')}</span>
              <button class="wb-draft-del" data-del="${esc(x.id)}" type="button">删除</button>
            </div>
            <div class="wb-draft-text">${x.text ? hlHtml(x.text) : `<span style="color:var(--wb-ink-soft)">${x.video ? '[视频]' : '[图片]'}</span>`}</div>
            ${(x.video && x.video.src) ? `<div class="wb-draft-imgs"><img src="${esc(x.video.src)}" alt=""></div>` : ''}
            ${(x.imgs && x.imgs.length) ? `<div class="wb-draft-imgs">${x.imgs.slice(0, 4).map(src => `<img src="${esc(imgSrc(src))}" alt="">`).join('')}</div>` : ''}
          </div>`).join('') + '<div class="wb-end">点击草稿继续编辑</div>';
        panel.querySelectorAll('.wb-draft').forEach(el => {
          el.onclick = e => {
            if(e.target.closest('.wb-draft-del')) return;
            const draft = (store.get().drafts || []).find(x => x.id === el.dataset.id);
            if(draft) openCompose(null, draft);
          };
        });
        panel.querySelectorAll('.wb-draft-del').forEach(b => {
          b.onclick = e => {
            e.stopPropagation();
            const dd = store.get();
            dd.drafts = (dd.drafts || []).filter(x => x.id !== b.dataset.del);
            store.save();
            toast('草稿已删除');
            renderMe();
          };
        });
        return;
      }
      const list = meTab === 'likes'
        ? store.get().feed.concat(store.get().recommend || []).filter(x => x.liked)
        : mine;
      if(!list.length){
        panel.innerHTML = meTab === 'likes'
          ? meEmpty('<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>', '还没有赞过任何微博')
          : meEmpty('<svg viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2.2"/><path d="M8 8.6h8M8 12.6h8M8 16.6h4.6"/></svg>', '还没有发过微博，点右上角 + 试试');
        return;
      }
      const d = store.get();
      panel.innerHTML = list.map(x => postHtml(x, meInfo(d))).join('');
      panel.querySelectorAll('.wb-post').forEach(el => {
        const post = findPost(d, el.dataset.id);
        if(!post) return;
        el.querySelectorAll('.wb-act').forEach(btn => {
          btn.onclick = ev => {
            ev.stopPropagation();
            const act = btn.dataset.act;
            if(act === 'like'){
              post.liked = !post.liked;
              post.likes = Math.max(0, (post.likes || 0) + (post.liked ? 1 : -1));
              store.save();
              renderMe();
            } else if(act === 'comment'){
              openPostDetail(post, 'comment');
            } else if(ev.target.closest('.wb-act-num')){
              openPostDetail(post, 'repost');
            } else {
              openRepostSheet(post);
            }
          };
        });
        el.onclick = ev => {
          if(ev.target.closest('.wb-act') || ev.target.closest('.wb-more-btn')) return;
          openPostDetail(post, 'comment');
        };
        bindPostMenu(el, post, renderMe);
      });
    }

    function toDataUrl(file){
      if(Phone && Phone.fileToBase64) return Phone.fileToBase64(file);
      return new Promise((res, rej) => {
        const rd = new FileReader();
        rd.onload = () => res(rd.result);
        rd.onerror = rej;
        rd.readAsDataURL(file);
      });
    }

    function loadAccount(id){
      const d = store.get();
      const acc = (d.accounts || []).find(a => a.id === id);
      if(!acc) return false;
      store.save();
      d.activeId = id;
      ACCOUNT_FIELDS.forEach(k => { d.profile[k] = acc[k]; });
      store.save();
      return true;
    }

    function deleteAccount(id){
      const d = store.get();
      if((d.accounts || []).length <= 1){ toast('至少保留一个账号'); return; }
      const idx = d.accounts.findIndex(a => a.id === id);
      if(idx < 0) return;
      const wasActive = d.activeId === id;
      d.accounts.splice(idx, 1);
      if(wasActive){
        d.activeId = d.accounts[0].id;
        ACCOUNT_FIELDS.forEach(k => { d.profile[k] = d.accounts[0][k]; });
      }
      store.save();
      meTab = 'posts';
      renderMe();
      toast('账号已注销');
    }

      const s = openSheet(`

        </div>`);

      const create = () => {
        const nameVal = (input.value || '').trim();
        if(!nameVal){ toast('请输入昵称'); return; }
        const d = store.get();
        store.save();
        const acc = { id:'a' + Date.now(), name:nameVal, avatar:'', bio:'', verify:'none', persona:null, cover:'' };
        d.accounts.push(acc);
        d.activeId = acc.id;
        ACCOUNT_FIELDS.forEach(k => { d.profile[k] = acc[k]; });
        store.save();
        s.close();
        meTab = 'posts';
        renderMe();
        toast('已创建并切换到新账号');

      s.mask.querySelector('[data-act="cancel"]').onclick = s.close;
      s.mask.querySelector('[data-act="create"]').onclick = create;
      input.addEventListener('keydown', e => { if(e.key === 'Enter') create(); });

    function openAccountSheet(){
      const d = store.get();
      const list = d.accounts || [];
      const s = openSheet(`
        <div class="wb-sheet-head"><span>切换账号</span></div>
        <div class="wb-acc-list">
          ${list.map((a, i) => `
            <div class="wb-acc-row ${a.id === d.activeId ? 'on' : ''}" data-idx="${i}">
              ${avatarHtml(a.name || '未命名', a.avatar, 'wb-acc-avatar')}
              <div class="wb-acc-name">${esc(a.name || '未命名')}</div>
              ${a.id === d.activeId ? '<span class="wb-acc-tag">当前</span>' : ''}
              ${list.length > 1 ? `<button class="wb-acc-del" data-del="${i}" type="button">注销</button>` : ''}
            </div>`).join('')}
        </div>
        <div class="wb-sheet-item" data-act="add">＋ 新增账号</div>
        <div class="wb-sheet-item danger" data-act="cancel">取消</div>`);
      s.mask.querySelectorAll('.wb-acc-row').forEach(row => {
        row.onclick = e => {
          const acc = list[parseInt(row.dataset.idx, 10)];
          if(!acc) return;
          const del = e.target.closest('.wb-acc-del');
          if(del){
            if(del.dataset.confirm !== '1'){
              del.dataset.confirm = '1';
              del.textContent = '确认注销';
              return;
            }
            s.close();
            deleteAccount(acc.id);
            return;
          }
          if(acc.id === d.activeId){ s.close(); return; }
          loadAccount(acc.id);
          s.close();
          meTab = 'posts';
          renderMe();
          toast(`已切换到 ${acc.name || '未命名'}`);
        };
      });
      s.mask.querySelector('[data-act="add"]').onclick = () => { s.close(); openAddAccountSheet(); };
      s.mask.querySelector('[data-act="cancel"]').onclick = s.close;
    }

    function openImageViewer(srcs, start){
      const list = (srcs || []).filter(Boolean);
      if(!list.length) return;
      let cur = Math.max(0, Math.min(start || 0, list.length - 1));
      const mask = document.createElement('div');
      mask.className = 'wb-viewer';
      mask.innerHTML = `
        <span class="wb-viewer-count"></span>
        <img alt="">
        ${list.length > 1 ? `<button class="wb-viewer-nav prev" type="button" aria-label="上一张">‹</button><button class="wb-viewer-nav next" type="button" aria-label="下一张">›</button>` : ''}`;
      app.appendChild(mask);
      const img = mask.querySelector('img');
      const count = mask.querySelector('.wb-viewer-count');
      const paint = () => {
        img.src = imgSrc(list[cur]);
        count.textContent = list.length > 1 ? `${cur + 1} / ${list.length}` : '';
      };
      paint();
      requestAnimationFrame(() => mask.classList.add('show'));
      let closed = false;
      const close = () => {
        if(closed) return;
        closed = true;
        mask.classList.remove('show');
        setTimeout(() => mask.remove(), 200);
      };
      mask.onclick = e => {
        const nav = e.target.closest('.wb-viewer-nav');
        if(nav){
          cur = nav.classList.contains('prev')
            ? (cur + list.length - 1) % list.length
            : (cur + 1) % list.length;
          paint();
          return;
        }
        close();
      };
    }

      '评论区有没有人跟我一样想多了。','我承认我被这条戳到了。','这波我先磕为敬。'];

    const NETIZEN_SYSTEM = '你是微博评论区的网友生成器，为一条微博生成多条来自不同真实用户的评论。昵称各不相同，像真实微博ID（2-8个字，可用数字或英文缩写）；评论内容必须贴合这条微博的具体内容，口语化、观点多样、每条20-40字；不要重复，不要套话，不用「沙发」「前排」等占楼词；全部使用普通话简体中文，不要出现粤语用字或方言。只输出JSON数组。';

    function parseNetizenJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          return list.map(x => ({
            name: String(x.name || x.user || x.id || '').trim(),
            text: stripMeMentions(toMandarin(String(x.comment || x.text || x.content || '').trim()))
          })).filter(x => x.text);
        }
      }catch(e){}
      return [];
    }

    async function requestNetizenComments(post, count){
      if(!Phone || !Phone.chatWithAI) return [];
      const raw = await Phone.chatWithAI([
        { role:'system', content: NETIZEN_SYSTEM },
        { role:'user', content:`博主 @${post.name} 发了这条微博：「${String(post.text || '').replace(/\s+/g, ' ').slice(0, 120)}」\n请生成 ${count} 条不同的网友评论。\n输出格式（严格 JSON 数组）：\n[{"name":"网友昵称","comment":"评论内容"}]` }
      ]);
      return parseNetizenJson(raw);
    }

    async function aiFillNetizens(post, list, repaint){
      const targets = list.filter(e => e.kind === 'netizen' && !e.aiFilled);
      if(!targets.length) return;
      targets.forEach(e => { e.aiFilled = true; });
      let items = [];
      try{ items = await requestNetizenComments(post, targets.length); }catch(e){ return; }
      if(!items.length) return;
      const used = new Set();
      targets.forEach((e, i) => {
        const it = items[i % items.length];
        if(it.name){
          const name = used.has(it.name) ? it.name + (i + 1) : it.name;
          used.add(name);
          e.name = name;
        }
        if(it.text) e.text = it.text;
      });
      store.save();
      if(typeof repaint === 'function') repaint();
    }

    function parseRobertJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          const out = list.map((x, i) => {
            if(typeof x === 'string') return { idx:i + 1, text:stripMeMentions(toMandarin(x.trim())) };
            return {
              idx: Number(x.idx || x.index || i + 1),
              text: stripMeMentions(toMandarin(String(x.comment || x.text || x.content || '').trim()))
            };
          }).filter(x => x.text);
          if(out.length) return out;
        }
      }catch(e){}
      const out = [];
      const re = /"comment"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
      let m;
      while((m = re.exec(s))) out.push({ idx: out.length + 1, text: stripMeMentions(toMandarin(m[1].replace(/\\"/g, '"'))) });
      return out;
    }

    async function requestRoberts(posts){
      if(!Phone || !Phone.chatWithAI) throw new Error('未连接 AI');
      const lines = posts.map((p, i) =>
        `${i + 1}. @${p.name}：${String(p.text || '').replace(/\s+/g, ' ').slice(0, 90)}`
      ).join('\n');
      const messages = [
        { role:'system', content: ROBERT_SYSTEM },
        { role:'user', content:`请为下面每条微博各写一条「微博罗伯特」的评论：\n${lines}\n\n要求：犀利狠毒、阴阳怪气、一针见血，短句口语化，可带一两个 emoji；不骂脏话，不攻击外貌，不涉及政治。\n输出格式（严格 JSON 数组）：\n[{"idx":1,"comment":"评论内容"}]` }
      ];
      const raw = await Phone.chatWithAI(messages);
      const items = parseRobertJson(raw);
      const out = [];
      items.forEach((it, i) => {
        const pos = (it.idx >= 1 && it.idx <= posts.length) ? it.idx - 1 : i;
        if(posts[pos] && !out[pos]) out[pos] = it.text;
      });
      return out;
    }

    function fallbackRobert(){
      return ROBERT_FALLBACK[Math.floor(Math.random() * ROBERT_FALLBACK.length)];
    }

    function setRobert(post, text){
      post.robert = { text: String(text || '').trim() || fallbackRobert(), at: Date.now() };
      store.save();
      return post.robert.text;
    }

    async function requestRobertText(post){
      try{
        const texts = await requestRoberts([post]);
        return (texts[0] || '').trim();
      }catch(e){
        return '';
      }
    }

    function rndInt(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
    function entryId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function makeEntry(kind, name, text, extra){
      return Object.assign({
        id: entryId(), kind, name, text, time: '刚刚',
        likes: kind === 'robert' ? rndInt(30, 320) : rndInt(2, 90),
        liked: false, replies: []
      }, extra || {});
    }

    function makeNetizens(n){
      const names = shuffle(NETIZEN_NAMES.slice()).slice(0, n);
      const texts = shuffle(NETIZEN_TEXTS.slice()).slice(0, n);
      return names.map((name, i) =>
        makeEntry('netizen', name, texts[i % texts.length] || '', { time: (i * 3 + 2) + '分钟前' })
      );
    }

    function myCmtName(){
      const char = meChar();
      const p = store.get().profile;
      return (p.name || '').trim() || (char && char.name) || '我';
    }

    function findEntry(list, id){
      for(const e of list){
        if(e.id === id) return e;
        const hit = findEntry(e.replies || [], id);
        if(hit) return hit;
      }
      return null;
    }

    function dtFanLabel(name){
      const arr = ['铁粉2', '钻粉3', '钻粉4', '金粉1', '铁粉1', '粉丝'];
      let h = 0;
      for(const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 9973;
      return arr[h % arr.length];
    }

    function ensureLikers(post){
      if(Array.isArray(post.likers) && post.likers.length) return;
      let h = 0;
      for(const ch of String(post.id || '')) h = (h * 31 + ch.charCodeAt(0)) % 9973;
      const base = NETIZEN_NAMES;
      const n = 5 + (h % 4);
      const out = [];
      for(let i = 0; i < n; i++) out.push(base[(h + i * 7) % base.length]);
      post.likers = out;
    }

    function dtPostHtml(p, me){
      const own = (p.mine && (!p.owner || !me || p.owner === me.id)) ? me : null;
      const name = own ? own.name : p.name;

            ${(q.imgs && q.imgs.length) ? `<div class="wb-dt-post-quote-imgs">${q.imgs.slice(0, 9).map(src => `<div class="wb-post-img"><img src="${esc(imgSrc(src))}" alt=""></div>`).join('')}</div>` : ''}

      return `<div class="wb-dt-post">

        </div>
        <div class="wb-dt-post-text">${hlHtml(p.text)}</div>

      return `<div class="wb-dt-cm${d ? ' is-reply' : ''}" data-cid="${esc(e.id)}">
        <div class="wb-dt-cm-ava">

          ${e.quote ? `<div class="wb-dt-cm-quote"><span class="wb-dt-cm-quote-at">@${esc(e.quote.name)}：</span>${hlHtml(e.quote.text || '')}</div>` : ''}
          ${e.text ? `<div class="wb-dt-cm-bubble${e.pending ? ' pending' : ''}">${hlHtml(e.text)}</div>` : ''}

            <div class="wb-dt-cm-acts">

    function pickLocalImages(cb, max){
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
      inp.onchange = async () => {
        const out = [];
        for(const f of Array.from(inp.files || []).slice(0, max || 9)){
          try{ out.push({ src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        if(out.length) cb(out);
      };
      inp.click();
    }

      openImageSourceSheet(src => {

        </div>`).join('');
      box.querySelectorAll('[data-picked-del]').forEach(el => {

      const s = openSheet(`

    function bindDtActions(box, getList, repaint, countCb){
      box.onclick = ev => {
        const btn = ev.target.closest('button');
        if(!btn || !box.contains(btn)) return;
        const itemEl = btn.closest('.wb-dt-cm');
        if(!itemEl) return;
        const entry = findEntry(getList(), itemEl.dataset.cid);
        if(!entry) return;
        if(btn.dataset.like){
          entry.liked = !entry.liked;
          entry.likes = Math.max(0, (entry.likes || 0) + (entry.liked ? 1 : -1));
          btn.classList.toggle('on', entry.liked);
          btn.innerHTML = ICON.heart + '<span>' + entry.likes + '</span>';
          store.save();
          return;
        }
        if(btn.dataset.sad){ toast('已踩过这条'); return; }
        if(btn.dataset.repost){
          openEntryRepostSheet(entry, (text, me) => {
            getList().unshift(makeEntry('me', me.name, text, {
              likes: 0,
              avatar: me.avatar,
              quote: { name: entry.name, text: entry.text || '' }
            }));
            store.save();
            if(countCb) countCb('repost');
            repaint();
          });
          return;
        }
        if(btn.dataset.reply){
          const rb = itemEl.querySelector(':scope > .wb-dt-cm-main > .wb-dt-replybox');
          if(!rb) return;
          rb.hidden = !rb.hidden;
          if(!rb.hidden) setTimeout(() => rb.querySelector('.wb-cm-input').focus(), 60);
          return;
        }
        if(btn.dataset.img){
          const rb = btn.closest('.wb-dt-replybox');
          if(!rb) return;
          rb._picked = rb._picked || [];
          const max = 9 - rb._picked.length;
          if(max <= 0){ toast('最多9张'); return; }
          attachImages(imgs => {
            rb._picked.push(...imgs.slice(0, max));
            paintPicked(rb.querySelector('[data-picked="1"]'), rb._picked);
          }, max);
          return;
        }
        if(btn.dataset.send){
          const rb = btn.closest('.wb-dt-replybox');
          const inp = rb.querySelector('.wb-cm-input');
          const val = (inp.value || '').trim();
          const imgs = (rb._picked || []).map(x => x.src);
          if(!val && !imgs.length){ toast('说点什么吧'); return; }
          entry.replies = entry.replies || [];
          entry.replies.push(makeEntry('me', myCmtName(), val, { likes: 0, imgs }));
          store.save();
          if(countCb) countCb('comment');
          repaint();
        }
      };
    }

    function attachRobert(list, post, repaint, force, cacheKey){
      const key = cacheKey || 'robert';
      const cached = (!force && post[key] && post[key].text) ? post[key].text : '';
      const entry = makeEntry('robert', ROBERT_NAME, cached || '正在锐评…', { pending: !cached });
      const at = list.length > 1 ? rndInt(1, list.length) : list.length;
      list.splice(at, 0, entry);
      repaint();
      if(cached) return;
      requestRobertText(post).then(text => {
        entry.pending = false;
        entry.text = text || fallbackRobert();
        post[key] = { text: entry.text, at: Date.now() };
        store.save();
        repaint();
      });
    }

    function ensureCmts(post){
      if(!Array.isArray(post.cmts)) post.cmts = [];
      if(!post.cmts.length){
        post.cmts.push(...makeNetizens(3));
        post.comments = Math.max(post.comments || 0, post.cmts.length);
      }
    }

        barBtns[1].querySelector('span').textContent = post.comments || 0;
        barBtns[2].querySelector('span').textContent = post.likes || 0;

      const paintList = () => {

      mask.querySelector('.wb-ti-ok').onclick = () => {
        const text = ta.value.trim();
        if(!text){ toast('请输入文字'); return; }
        const CV = 720, pad = 70, font = 'px "PingFang SC","Microsoft YaHei",sans-serif';
        const cv = document.createElement('canvas');
        cv.width = CV; cv.height = CV;
        const ctx = cv.getContext('2d');
        let fs = 52, lineH = 78, lines = [];
        while(fs >= 20){
          lineH = Math.round(fs * 1.55);
          ctx.font = fs + font;
          lines = [];
          let curLine = '';
          for(const ch of Array.from(text)){
            if(ch === '\n'){ lines.push(curLine); curLine = ''; continue; }
            const test = curLine + ch;
            if(ctx.measureText(test).width > CV - pad * 2 && curLine){ lines.push(curLine); curLine = ch; }
            else curLine = test;
          }
          if(curLine) lines.push(curLine);
          if(lines.length * lineH <= CV - pad * 2) break;
          fs -= 2;
        }
        ctx.fillStyle = colors[cur].bg;
        ctx.fillRect(0, 0, CV, CV);
        ctx.fillStyle = colors[cur].fg;
        ctx.font = fs + font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const total = lines.length * lineH;
        const startY = CV / 2 - total / 2 + lineH / 2;
        lines.forEach((ln, i) => ctx.fillText(ln, CV / 2, startY + i * lineH));
        close();
        onDone({ type:'text', src: cv.toDataURL('image/png'), text, bg: colors[cur].bg });
      };
    }

    function wrapCanvasText(ctx, text, maxW){
      const lines = [];
      let cur = '';
      for(const ch of Array.from(text)){
        if(ch === '\n'){ lines.push(cur); cur = ''; continue; }
        const test = cur + ch;
        if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = ch; }
        else cur = test;
      }
      if(cur) lines.push(cur);
      return lines;
    }

      requestAnimationFrame(() => mask.classList.add('show'));

      const panel = mask.querySelector('.wb-compose');
      const bgEl = mask.querySelector('#wbComposeBg');
      const ta = mask.querySelector('#wbComposeText');
      const mirror = mask.querySelector('#wbComposeMirror');
      const countEl = mask.querySelector('#wbComposeCount');
      const imgsBox = mask.querySelector('#wbComposeImgs');
      const fileEl = mask.querySelector('#wbComposeFile');
      const bgFileEl = mask.querySelector('#wbComposeBgFile');

      let initSnapshot = '';

      const snap = () => JSON.stringify({ t: ta.value.trim(), i: composeImages.map(x => x.src), b: composeBg });

      const pickVideo = () => composeImages.find(x => x.type === 'video') || null;
      const pickImgs = () => composeImages.filter(x => x.type !== 'video').map(x => x.src);

      const saveDraft = () => {
        const text = ta.value.trim();
        const imgs = pickImgs();
        const vid = pickVideo();
        if(!text && !imgs.length && !vid){
          if(draftKey){
            const dd = store.get();
            dd.drafts = (dd.drafts || []).filter(x => x.id !== draftKey);
            store.save();
          }
          return;
        }
        if(snap() === initSnapshot) return;
        const dd = store.get();
        const now = new Date();
        const stamp = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const id = draftKey || ('dft' + Date.now());
        const exist = (dd.drafts || []).find(x => x.id === id);
        if(exist){
          exist.text = text;
          exist.imgs = imgs;
          exist.video = vid;
          exist.bg = composeBg;
          exist.time = stamp;
        } else {
          dd.drafts.unshift({ id, text, imgs, video: vid, bg: composeBg, time: stamp });
        }
        store.save();
        toast('已保存到草稿箱');
        if(currentTab === 'me') renderMe();
      };

      const close = skipDraft => {
        if(!skipDraft) saveDraft();
        mask.classList.remove('show');
        setTimeout(() => mask.remove(), 220);
      };

      const syncMirror = () => {
        mirror.innerHTML = hlHtml(ta.value) + '\n';
        mirror.scrollTop = ta.scrollTop;
        countEl.textContent = `${ta.value.length}/280`;
      };

      const insertText = str => {
        const s = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
        const e = ta.selectionEnd == null ? s : ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + str + ta.value.slice(e);
        ta.selectionStart = ta.selectionEnd = s + str.length;
        ta.focus();
        syncMirror();
      };

      const renderImgs = () => {
        imgsBox.classList.toggle('show', composeImages.length > 0);
        imgsBox.innerHTML = composeImages.map((img, i) => `
          <div class="wb-compose-img${img.type === 'video' ? ' is-video' : ''}">
            <img src="${esc(imgSrc(img.src))}" alt="">
            ${img.type === 'video' ? `<span class="wb-compose-video-badge">${esc(img.duration || '00:15')}</span>` : ''}
            <span class="wb-compose-img-del" data-del="${i}">×</span>
          </div>`).join('');
        imgsBox.querySelectorAll('.wb-compose-img-del').forEach(del => {
          del.onclick = () => {
            composeImages.splice(parseInt(del.dataset.del, 10), 1);
            renderImgs();
          };
        });
      };

      const applyBg = () => {
        if(composeBg){
          bgEl.style.backgroundImage = `url("${composeBg}")`;
          panel.classList.add('has-bg');
        } else {
          bgEl.style.backgroundImage = '';
          panel.classList.remove('has-bg');
        }
      };

      mask.querySelector('.wb-compose-cancel').onclick = () => close();
      mask.onclick = e => { if(e.target === mask) close(); };
      ta.addEventListener('input', syncMirror);
      ta.addEventListener('scroll', () => { mirror.scrollTop = ta.scrollTop; });
      if(editPost) ta.value = editPost.text || '';
      else if(draftPost) ta.value = draftPost.text || '';
      renderImgs();
      applyBg();
      syncMirror();
      initSnapshot = snap();
      setTimeout(() => ta.focus(), 120);

      fileEl.onchange = async () => {
        const files = Array.from(fileEl.files || []);
        for(const f of files){
          if(composeImages.length >= 9){ toast('最多9张'); break; }
          try{ composeImages.push({ type:'image', src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        fileEl.value = '';
        renderImgs();
      };

      bgFileEl.onchange = async () => {
        const f = bgFileEl.files && bgFileEl.files[0];
        bgFileEl.value = '';
        if(!f) return;
        try{
          composeBg = await toDataUrl(f);
          applyBg();
          toast('背景已更换');
        }catch(e){ toast('背景读取失败'); }
      };

      mask.querySelectorAll('.wb-tool').forEach(b => {
        b.onclick = () => {
          const tool = b.dataset.tool;
          if(tool === 'img'){
            openImageSourceSheet(src => {
              if(src === 'local') fileEl.click();
              else openTextImageEditor(img => {
                if(composeImages.length >= 9){ toast('最多9张'); return; }
                composeImages.push(img);
                renderImgs();
              });
            });
          } else if(tool === 'video'){
            openVideoEditor(vid => {
              composeImages = composeImages.filter(x => x.type !== 'video');
              composeImages.unshift(vid);
              renderImgs();
            });
          } else if(tool === 'topic'){
            insertText('#');
          } else if(tool === 'at'){
            openAtSheet(nm => insertText('@' + nm + ' '));
          } else if(tool === 'super'){
            openSuperTopicSheet(topicName => insertText(`#${topicName}# `));
          }
        };
      });

      mask.querySelector('.wb-compose-send').onclick = () => {
        const text = ta.value.trim();
        const vid = pickVideo();
        const imgSrcs = pickImgs();
        if(!text && !composeImages.length){ toast('说点什么吧'); return; }
        const d = store.get();
        if(draftKey) d.drafts = (d.drafts || []).filter(x => x.id !== draftKey);
        if(editPost){
          const target = d.feed.find(x => x.id === editPost.id)
            || (d.recommend || []).find(x => x.id === editPost.id);
          if(target){
            target.text = text;
            target.imgs = imgSrcs;
            target.video = vid ? { src:vid.src, duration:vid.duration, views:vid.views, text:vid.text } : null;
          }
          store.save();
          close(true);
          toast('微博已更新');
          if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
          else renderHome();
          return;
        }
        const now = new Date();
        d.feed.unshift({
          id: 'my' + Date.now(),
          name,
          avatar,
          vip: VERIFY[p.verify] ? p.verify !== 'none' : false,
          mine: true,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          ts: now.getTime(),
          text,
          imgs: imgSrcs,
          video: vid ? { src:vid.src, duration:vid.duration, views:vid.views, text:vid.text } : null,
          owner: d.activeId,
          likes: 0, comments: 0, reposts: 0, liked: false
        });
        d.profile.posts = (parseInt(d.profile.posts, 10) || 0) + 1;
        store.save();
        close(true);
        toast('发送成功');
        if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
        else switchTab('home');
      };
    }

    rollLive();
    switchTab('me');
  };

  function bootWeibo(){
    if(!document.body || !document.body.hasAttribute('data-wb-standalone')) return;
    if(window.mountWeiboApp) window.mountWeiboApp(document, window.Phone || null, null);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootWeibo);
  else bootWeibo();
})();
</script>
