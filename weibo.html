<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.wb-app{
  --wb-orange:#ffa15e;
  --wb-orange-deep:#e08040;
  --wb-orange-soft:#ffe2ca;
  --wb-ink:#4a382b;
  --wb-ink-soft:#ab9a8c;
  --wb-line:rgba(255,205,170,.5);
  --wb-card:rgba(255,255,255,.66);
  display:flex;flex-direction:column;flex:1;height:0;min-height:0;
  background:linear-gradient(180deg,#fffdfa 0%,#fff8f1 45%,#fff2e7 100%);
  position:relative;overflow:hidden;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--wb-ink);
}
.wb-app::before{content:"";position:absolute;top:-18%;right:-25%;width:75%;height:48%;background:radial-gradient(circle,rgba(255,186,136,.26) 0%,transparent 70%);pointer-events:none;}
.wb-app::after{content:"";position:absolute;bottom:-12%;left:-20%;width:70%;height:45%;background:radial-gradient(circle,rgba(255,226,196,.42) 0%,transparent 70%);pointer-events:none;}

.wb-status-bar{height:calc(var(--phone-w,420px)*0.095 + var(--safe-top,0px));
  padding:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.015) calc(var(--phone-w,420px)*0.064) 0;
  display:flex;justify-content:space-between;align-items:center;
  font-size:calc(var(--phone-w,420px)*0.04);font-weight:600;color:var(--wb-ink);
  position:relative;z-index:5;flex-shrink:0;}
.wb-status-icons{display:flex;gap:calc(var(--phone-w,420px)*0.016);align-items:center;}
.wb-status-icons svg{display:block;flex-shrink:0;}
.wb-status-bar .sig-icon,.wb-status-bar .wifi-icon{width:calc(var(--phone-w,420px)*0.045);height:calc(var(--phone-w,420px)*0.045);}
.wb-status-bar .bat-icon{width:calc(var(--phone-w,420px)*0.062);height:calc(var(--phone-w,420px)*0.034);}

.wb-topbar{flex-shrink:0;min-height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;position:relative;z-index:5;}
.wb-title{font-size:16px;font-weight:700;color:var(--wb-ink);pointer-events:none;}
.wb-title-wrap{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;}
.wb-title-broom{width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;color:#8a8a8a;
  display:none;align-items:center;justify-content:center;border-radius:50%;}
.wb-title-broom.on{display:flex;}
.wb-title-broom:active{background:rgba(0,0,0,.06);}
.wb-title-broom svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wb-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:var(--wb-orange);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  transition:transform .1s,background .15s;box-shadow:0 3px 10px -4px rgba(200,110,20,.42);}
.wb-icon-btn:active{transform:scale(.9);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.wb-icon-btn-plus{width:34px;height:34px;}
.wb-icon-btn-plus svg{width:19px;height:19px;stroke-width:2.4;}
.wb-top-actions{margin-left:auto;display:flex;gap:8px;}

.wb-body{flex:1;overflow-y:auto;position:relative;z-index:2;-webkit-overflow-scrolling:touch;}
.wb-body::-webkit-scrollbar{width:0;}

.wb-segment{display:flex;justify-content:center;gap:24px;padding:6px 0 10px;}
.wb-seg{border:none;background:none;font-family:inherit;font-size:14px;color:var(--wb-ink-soft);cursor:pointer;padding:4px 2px;position:relative;}
.wb-seg.active{color:var(--wb-ink);font-weight:700;}
.wb-seg.active::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--wb-orange);}

.wb-live-strip{display:flex;gap:18px;padding:6px 14px 12px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;
  overscroll-behavior-x:contain;cursor:grab;}
.wb-live-strip.dragging{cursor:grabbing;scroll-behavior:auto;}
.wb-live-strip::-webkit-scrollbar{height:0;}
.wb-live-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;
  -webkit-user-select:none;user-select:none;}
.wb-live-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;background:linear-gradient(135deg,#ffd6b4,#ffa66b);
  border:2px solid rgba(255,255,255,.95);cursor:default;
  box-shadow:0 3px 10px -5px rgba(180,100,40,.5);}
.wb-live-avatar img{width:100%;height:100%;object-fit:cover;}
.wb-live-avatar.live{border-color:var(--wb-orange);cursor:pointer;animation:wbLivePulse 1.3s ease-in-out infinite;}
@keyframes wbLivePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,161,94,.55),0 3px 10px -5px rgba(180,100,40,.5);}
  55%{box-shadow:0 0 0 7px rgba(255,161,94,0),0 3px 10px -5px rgba(180,100,40,.5);}
}
.wb-live-name{width:72px;font-size:10px;color:var(--wb-ink-soft);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center;}

.wb-draft{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);border-radius:12px;
  padding:10px 12px;margin:0 12px 8px;cursor:pointer;transition:background .15s;}
.wb-draft:active{background:rgba(255,244,232,.92);}
.wb-draft-top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--wb-ink-soft);}
.wb-draft-text{font-size:13px;line-height:1.55;margin-top:6px;color:var(--wb-ink);white-space:pre-wrap;
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.wb-draft-imgs{display:flex;gap:4px;margin-top:7px;}
.wb-draft-imgs img{width:44px;height:44px;object-fit:cover;border-radius:7px;}
.wb-draft-del{border:none;background:rgba(0,0,0,.05);color:var(--wb-ink-soft);font-family:inherit;
  font-size:11px;padding:4px 9px;border-radius:9px;cursor:pointer;}
.wb-draft-del:active{background:rgba(214,84,58,.16);color:#c9553f;}

@keyframes wbSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wb-icon-btn.spin svg{animation:wbSpin .55s ease;}

.wb-loading{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 12px 10px;
  padding:16px;border-radius:14px;background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.85);font-size:12.5px;color:var(--wb-ink-soft);
  box-shadow:0 4px 16px -10px rgba(190,110,40,.35);}
.wb-loading-spin{width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,140,60,.28);border-top-color:var(--wb-orange);
  animation:wbSpin .8s linear infinite;}

.wb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;background:linear-gradient(135deg,#ffd6b4,#ffa66b);}
.wb-avatar img{width:100%;height:100%;object-fit:cover;}

.wb-post{position:relative;background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:13px 13px 6px;margin:0 12px 10px;
  box-shadow:0 4px 16px -10px rgba(190,110,40,.35);cursor:pointer;}
.wb-post-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px;padding-right:30px;}
.wb-post-head .wb-avatar{width:38px;height:38px;font-size:14px;flex:none;}
.wb-post-meta{flex:1;min-width:0;padding-top:1px;}
.wb-post-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:4px;overflow:hidden;}
.wb-vip{width:14px;height:14px;border-radius:50%;background:var(--wb-orange);color:#fff;font-size:9px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.wb-vip.v-yellow{background:linear-gradient(135deg,#ffd34d,#eaa600);}
.wb-vip.v-gold{background:linear-gradient(135deg,#ffe9a3,#d99b16);}
.wb-post-time{font-size:11.5px;color:var(--wb-ink-soft);margin-top:3px;}
.wb-post-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;}
.wb-post-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.wb-post-img{aspect-ratio:1;overflow:hidden;background:#ffead9;}
.wb-post-img.empty{background:transparent;}
.wb-post-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
.wb-viewer{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;
  align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;}
.wb-viewer.show{opacity:1;}
.wb-viewer img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.88);
  transition:transform .22s cubic-bezier(.2,.8,.3,1);user-select:none;-webkit-user-drag:none;}
.wb-viewer.show img{transform:scale(1);}
.wb-viewer-count{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;
  font-size:12px;opacity:.85;pointer-events:none;}
.wb-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wb-viewer-nav.prev{left:10px;}
.wb-viewer-nav.next{right:10px;}
.wb-post-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  margin-bottom:8px;background:#1d1d1d;}
.wb-post-video img{width:100%;height:100%;object-fit:cover;display:block;}
.wb-post-video::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none;}
.wb-post-video-meta{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 9px 8px;font-size:11.5px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.45);z-index:2;pointer-events:none;}
.wb-post-video-dur{font-variant-numeric:tabular-nums;letter-spacing:.4px;}
.wb-post-actions{display:flex;align-items:center;gap:4px;padding:6px 0 5px;}
.wb-robert-ava{flex:none;width:24px;height:24px;border-radius:8px;
  background:linear-gradient(135deg,#ffbb8f,#ff93a5);color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
.wb-robert-tag{font-size:9px;font-weight:700;color:#fff;background:rgba(255,145,90,.85);
  border-radius:4px;padding:1px 4px;letter-spacing:.4px;}
.wb-act{flex:1;border:none;background:none;border-radius:9px;padding:6px 0;font-size:12px;
  color:var(--wb-ink-soft);font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,transform .1s;}
.wb-act:active{transform:scale(.96);}
.wb-act[data-act="like"]{color:var(--wb-ink-soft);}
.wb-act.liked{color:#ff8200;font-weight:600;}
.wb-act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-act.liked svg{fill:currentColor;stroke:currentColor;}
.wb-post-more{position:absolute;top:9px;right:9px;z-index:3;}
.wb-more-btn{width:26px;height:26px;border:none;border-radius:8px;background:none;
  color:var(--wb-ink-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:background .15s,transform .1s,color .15s;}
.wb-more-btn:active{transform:scale(.9);background:rgba(255,140,60,.16);color:var(--wb-orange-deep);}
.wb-more-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-more-menu{position:absolute;right:0;top:29px;min-width:108px;background:rgba(255,252,248,.99);
  border:1px solid rgba(255,255,255,.85);border-radius:11px;padding:4px;
  box-shadow:0 10px 26px -12px rgba(150,80,20,.55);display:flex;flex-direction:column;gap:2px;
  animation:wbFade .14s ease;z-index:6;}
.wb-more-item{border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--wb-ink);
  text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;}
.wb-more-item:active{background:rgba(255,140,60,.16);color:var(--wb-orange-deep);}
.wb-more-item.danger{color:#c9553f;}
.wb-more-item.danger:active{background:rgba(214,84,58,.14);color:#c9553f;}
.wb-post-quote-head svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}

.wb-me-cover{position:relative;height:152px;flex-shrink:0;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#ffb673 0%,#ffc794 28%,#ffdcba 58%,#ffedda 82%,#fffaf4 100%);
  background-size:cover;background-position:center;transition:background .2s;}
.wb-me-cover.has-img::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(60,25,5,.16),rgba(60,25,5,.34));}
.wb-me-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;
  background:linear-gradient(180deg,transparent,rgba(255,249,243,.9));pointer-events:none;}
.wb-cover-back{position:absolute;left:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,background .15s;}
.wb-cover-back:active{transform:scale(.92);background:rgba(255,255,255,.42);}
.wb-cover-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-acts{position:absolute;right:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);display:flex;gap:10px;z-index:3;}
.wb-cover-btn{width:32px;height:32px;border-radius:50%;border:none;
  background:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--wb-orange);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:0 4px 14px -6px rgba(120,60,10,.55);transition:transform .12s,background .15s,color .15s;}
.wb-cover-btn:active{transform:scale(.92);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-cover-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-plus{width:34px;height:34px;}
.wb-cover-plus svg{width:19px;height:19px;stroke-width:2.4;}

.wb-me-main{position:relative;padding:0 15px;margin-top:-44px;z-index:2;}
.wb-me-head{display:flex;align-items:flex-end;gap:12px;}
.wb-me-avatar{width:78px;height:78px;font-size:28px;border:3px solid #fff;flex-shrink:0;
  box-shadow:0 6px 18px -8px rgba(190,110,40,.55);}
.wb-me-headinfo{flex:1;min-width:0;padding-bottom:6px;}
.wb-me-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.35;}
.wb-me-stats{display:flex;align-items:baseline;gap:22px;margin-top:16px;}
.wb-me-stat{display:flex;align-items:baseline;gap:5px;}
.wb-me-stat b{font-size:17px;font-weight:700;color:var(--wb-ink);}
.wb-me-stat span{font-size:12px;color:var(--wb-ink-soft);}
.wb-me-bio-row{display:flex;align-items:flex-start;gap:10px;margin-top:12px;}
.wb-me-bio{flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--wb-ink-soft);word-break:break-word;}
.wb-me-edit{flex-shrink:0;align-self:flex-end;margin-bottom:8px;width:30px;height:30px;padding:0;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--wb-orange-deep);
  font-family:inherit;cursor:pointer;transition:transform .12s,background .15s;}
.wb-me-edit:active{transform:scale(.92);background:rgba(255,140,60,.12);}
.wb-me-tabs{display:flex;align-items:center;margin:14px -15px 0;padding:0 6px;
  border-top:1px solid var(--wb-line);}
.wb-me-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 0 10px;
  background:none;border:none;font-family:inherit;font-size:13px;color:var(--wb-ink-soft);
  cursor:pointer;position:relative;transition:color .15s;}
.wb-me-tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.wb-me-tab.on{color:var(--wb-ink);font-weight:700;}
.wb-me-tab.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;border-radius:2px;background:var(--wb-orange);}
.wb-me-panel{padding:10px 0 0;}
.wb-me-empty{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 20px 34px;color:var(--wb-ink-soft);font-size:12.5px;}
.wb-me-empty svg{width:38px;height:38px;fill:none;stroke:rgba(255,168,110,.62);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-me-edit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.wb-avatar-switchable{cursor:pointer;transition:transform .12s;}
.wb-avatar-switchable:active{transform:scale(.96);}
.wb-app.wb-me-mode > .wb-topbar{display:none;}
.wb-app.wb-me-mode > .wb-status-bar{position:absolute;left:0;right:0;top:0;z-index:6;background:none;
  padding-top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.055);
  color:#fff;text-shadow:0 1px 4px rgba(70,30,10,.5);}
.wb-app.wb-me-mode > .wb-status-bar .bat-icon rect:nth-child(2){fill:rgba(255,255,255,.92);}

.wb-card{background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;margin:0 12px 10px;overflow:hidden;
  box-shadow:0 4px 16px -12px rgba(190,110,40,.4);}

.wb-search{display:flex;align-items:center;gap:8px;margin:4px 12px 12px;padding:9px 13px;
  background:rgba(255,255,255,.78);border-radius:20px;border:1px solid rgba(255,255,255,.8);}
.wb-search-ico{font-size:14px;opacity:.7;}
.wb-search input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:13.5px;color:var(--wb-ink);min-width:0;}
.wb-search input::placeholder{color:var(--wb-ink-soft);}
.wb-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 8px;font-size:14px;font-weight:700;}
.wb-hot-time{font-size:11px;color:var(--wb-orange-deep);font-weight:500;background:rgba(255,140,60,.12);padding:2px 8px;border-radius:9px;}
.wb-hot-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
.wb-hot-row:active{background:rgba(255,200,160,.18);}
.wb-hot-rank{width:18px;font-size:12px;font-weight:700;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-hot-rank.top{color:var(--wb-orange-deep);}
.wb-hot-tag{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-hot-heat{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-topics{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 14px;}
.wb-topic{font-size:12px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.8);
  border:1px solid var(--wb-line);color:var(--wb-orange-deep);cursor:pointer;}
.wb-topic:active{transform:scale(.96);}

.wb-chat-row{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;}
.wb-chat-row:active{background:rgba(255,200,160,.18);}
.wb-chat-row+.wb-chat-row{border-top:1px solid var(--wb-line);}
.wb-chat-avatar{width:44px;height:44px;font-size:17px;}
.wb-chat-info{flex:1;min-width:0;}
.wb-chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}

<script>
(function(){
  const TAB_TITLES = { home:'微博', discover:'发现', chat:'私信', me:'我' };

  const VERIFY = {
    none:{ label:'', cls:'' },
    yellow:{ label:'黄V', cls:'v-yellow' },
    orange:{ label:'橙V', cls:'v-orange' },
    gold:{ label:'金V', cls:'v-gold' }
  };

  const MEMBER_NAMES = {
    '钱锟':'威神V_钱锟_KUN',
    '李永钦 TEN':'威神V_TEN_李永钦',
    '肖俊':'威神V_肖俊',
    '黄冠亨':'威神V_黄冠亨_HENDERY',
    '刘扬扬':'威神V_扬扬_YANGYANG'
  };

  const MEMBER_DEVICES = {
    '威神V_钱锟_KUN':'iPhone Duo',
    '威神V_肖俊':'iPhone Duo',
    '威神V_扬扬_YANGYANG':'iPhone Duo',
    '威神V_TEN_李永钦':'OPPO Find X9 Pro',
    '威神V_黄冠亨_HENDERY':'iPhone 16',
    'WayV_official':''
  };

  function postDevice(p){
    if(!p) return 'iPhone';
    const key = p.name || '';
    return Object.prototype.hasOwnProperty.call(MEMBER_DEVICES, key) ? MEMBER_DEVICES[key] : 'iPhone';
  }

  function postDeviceLabel(p){
    const dev = postDevice(p);
    const isWayv = dev === '' || Object.prototype.hasOwnProperty.call(MEMBER_DEVICES, (p && p.name) || '');
    if(!isWayv) return '来自 ' + (p && p.video ? '微博视频号' : 'iPhone');
    if(!dev) return '发布于 韩国';
    return '来自 ' + (p.video ? '微博视频号' : dev) + ' · 发布于 韩国';
  }

  const MEMBER_ALIASES = {
    '威神V_钱锟_KUN': ['钱锟', 'KUN', 'kun'],
    '威神V_TEN_李永钦': ['李永钦', '李永钦 TEN', 'TEN', 'Ten', 'ten'],
    '威神V_肖俊': ['肖俊', '德俊', '肖德俊', 'XIAOJUN', 'xiaojun'],
    '威神V_黄冠亨_HENDERY': ['黄冠亨', 'HENDERY', 'Hendery', 'hendery'],
    '威神V_扬扬_YANGYANG': ['刘扬扬', '扬扬', 'YANGYANG', 'yangyang']
  };

  const WEIBO_NICKS = { '造型师姐姐': '造型师姐姐Mia' };

  const CANTON_WORDS = [
    ['唔該','谢谢'],['唔使','不用'],['唔好意思','不好意思'],['點解','为什么'],['邊度','哪里'],['屋企','家里'],
    ['搞掂','搞定'],['而家','现在'],['咁樣','这样'],['咁嘅','这样的'],['係咪','是不是'],['得閒','有空'],
    ['唔','不'],['嘅','的'],['咁','这么'],['係','是'],['嚟','来'],['冇','没有'],['咗','了'],['睇','看'],
    ['靚','漂亮'],['靓','漂亮'],['嗰','那'],['佢','他'],['哋','们'],['咩','什么'],['乜','什么'],['噉','这样'],
    ['喺','在'],['啲','的'],['嘢','东西'],['俾','给'],['攰','累'],['搵','找']
  ];

  function toMandarin(s){
    let t = String(s == null ? '' : s);
    CANTON_WORDS.forEach(w => { t = t.split(w[0]).join(w[1]); });
    return t;
  }

  function normName(n){ return String(n == null ? '' : n).replace(/\s+/g, '').toUpperCase(); }

  function isWayvAccount(n){
    const s = String(n == null ? '' : n).trim();
    if(!s) return false;
    if(/WayV|威神V/i.test(s)) return true;
    const k = normName(s);
    return Object.keys(MEMBER_ALIASES).some(canon =>
      MEMBER_ALIASES[canon].some(a => {
        const t = normName(a);
        return k === t || (/[^\x00-\x7F]/.test(t) && k.indexOf(t) >= 0);
      })
    );
  }

  function memberWeiboName(n){
    const s = String(n == null ? '' : n).trim();
    if(!s) return s;
    if(Object.prototype.hasOwnProperty.call(MEMBER_NAMES, s)) return MEMBER_NAMES[s];

  function timeToTs(label, base){
    const now = base || Date.now();
    const s = String(label == null ? '' : label).trim();
    if(!s) return now;
    if(/刚刚|此刻/.test(s)) return now;
    let m;
    if((m = s.match(/(\d+)\s*秒前/))) return now - parseInt(m[1], 10) * 1000;
    if((m = s.match(/(\d+)\s*分钟前/))) return now - parseInt(m[1], 10) * 60000;
    if((m = s.match(/(\d+)\s*小时前/))) return now - parseInt(m[1], 10) * 3600000;
    if((m = s.match(/(\d+)\s*天前/))) return now - parseInt(m[1], 10) * 86400000;
    if((m = s.match(/昨天\s*(\d{1,2}):(\d{2})/))){
      const d = new Date(now); d.setDate(d.getDate() - 1); d.setHours(parseInt(m[1], 10), parseInt(m[2], 10), 0, 0);
      return d.getTime();
    }
    if((m = s.match(/^(\d{1,2}):(\d{2})$/))){
      const d = new Date(now); d.setHours(parseInt(m[1], 10), parseInt(m[2], 10), 0, 0);
      if(d.getTime() > now + 60000) d.setDate(d.getDate() - 1);
      return d.getTime();
    }
    if((m = s.match(/(\d{1,2})月(\d{1,2})日/))){
      const d = new Date(now); d.setMonth(parseInt(m[1], 10) - 1, parseInt(m[2], 10)); d.setHours(0, 0, 0, 0);
      if(d.getTime() > now) d.setFullYear(d.getFullYear() - 1);
      return d.getTime();
    }
    const wk = { '周一':1, '周二':2, '周三':3, '周四':4, '周五':5, '周六':6, '周日':0, '周天':0 };
    for(const k in wk){
      if(s.indexOf(k) === 0){
        const d = new Date(now);
        let back = d.getDay() - wk[k];
        if(back <= 0) back += 7;
        d.setDate(d.getDate() - back); d.setHours(0, 0, 0, 0);
        return d.getTime();
      }
    }
    return now;
  }

  function timeTextByTs(ts){
    const t = Number(ts) || 0;
    if(!t) return '刚刚';
    const diff = Date.now() - t;
    if(diff < 60000) return '刚刚';
    if(diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    const d = new Date(t), n = new Date();
    const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    if(d.toDateString() === n.toDateString()) return hm;
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if(d.toDateString() === y.toDateString()) return '昨天 ' + hm;
    if(d.getFullYear() === n.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function postTimeText(p){
    if(!p) return '';
    const ts = Number(p.ts) || 0;
    return ts ? timeTextByTs(ts) : String(p.time || '');
  }

  function refreshTimeLabels(root){
    const scope = root || document;
    scope.querySelectorAll('.wb-post-time[data-ts], .wb-dt-post-time[data-ts]').forEach(el => {
      const ts = Number(el.dataset.ts) || 0;
      if(!ts) return;
      const dev = el.dataset.dev || '';
      el.textContent = timeTextByTs(ts) + (dev ? ' · ' + dev : '');
    });
  }

  const TEXT_IMG_CACHE = {};

  const TEXT_IMG_STYLES = [
    { c1:'#fff4e6', c2:'#ffe2c4', fg:'#7a4a1e' },

  function textImage(text, seed){
    const t = String(text == null ? '' : text).trim();
    if(!t) return '';
    const key = (seed || 0) + '|' + t;
    if(TEXT_IMG_CACHE[key]) return TEXT_IMG_CACHE[key];
    const st = TEXT_IMG_STYLES[Math.abs(seed || 0) % TEXT_IMG_STYLES.length];
    const CV = 640, pad = 88;
    const cv = document.createElement('canvas');
    cv.width = CV; cv.height = CV;
    const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, CV, CV);
    grad.addColorStop(0, st.c1);
    grad.addColorStop(1, st.c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CV, CV);
    const font = s => `${s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    const wrap = () => {
      const out = [];
      let cur = '';
      for(const ch of Array.from(t)){
        if(ch === '\n'){ out.push(cur); cur = ''; continue; }
        const test = cur + ch;
        if(ctx.measureText(test).width > CV - pad * 2 && cur){ out.push(cur); cur = ch; }
        else cur = test;
      }
      if(cur) out.push(cur);
      return out;
    };
    let fs = 64, lineH = 0, lines = [];
    while(fs >= 22){
      ctx.font = font(fs);
      lineH = Math.round(fs * 1.7);
      lines = wrap();
      if(lines.length * lineH <= CV - pad * 2) break;
      fs -= 3;
    }
    ctx.fillStyle = st.fg;
    ctx.font = font(fs);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const total = lines.length * lineH;
    const startY = CV / 2 - total / 2 + lineH / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, CV / 2, startY + i * lineH));
    ctx.globalAlpha = .2;
    ctx.strokeStyle = st.fg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(26, 26, CV - 52, CV - 52, 26);
    else ctx.rect(26, 26, CV - 52, CV - 52);
    ctx.stroke();
    ctx.globalAlpha = 1;
    const url = cv.toDataURL('image/png');
    TEXT_IMG_CACHE[key] = url;
    return url;
  }

  function imgSrc(src){
    const s = String(src == null ? '' : src);
    if(s.indexOf('txt:') !== 0) return s;
    const body = s.slice(4);
    let seed = 0;
    for(let i = 0; i < body.length; i++) seed = (seed * 31 + body.charCodeAt(i)) % 9973;
    return textImage(body, seed);
  }

  function pickScene(){
    const usable = SCENE_KEYS.filter(k => k !== 'none');
    return usable[Math.floor(Math.random() * usable.length)];
  }

  function sceneList(it){
    let list = it && it.scenes;
    if(typeof list === 'string') list = list.split(/[,，、\s]+/);
    if(!Array.isArray(list) || !list.length) list = [it && it.scene ? it.scene : ''];
    list = list.map(s => String(s || '').trim()).filter(s => SCENE_KEYS.indexOf(s) >= 0);
    if(!list.length) list = [pickScene()];
    return list.slice(0, 9);
  }

  function imageTexts(it){
    let list = it && it.images;
    if(typeof list === 'string') list = list.split(/[,，、\n]+/);
    if(!Array.isArray(list)) list = [];
    list = list.map(s => String(s == null ? '' : s).trim()).filter(Boolean).slice(0, 9);
    if(list.length) return list;
    const text = String((it && it.text) || '').trim();
    if(!text) return [];
    const parts = text.split(/[，。！？；、,.!?;~～\s]+/).map(s => s.trim()).filter(Boolean);
    if(parts.length >= 3) return parts.slice(0, 3);
    const one = parts.join(' ').slice(0, 16) || text.slice(0, 16);
    return [one];
  }

  function postImages(texts){
    const list = (Array.isArray(texts) ? texts : []).slice(0, 9)
      .map(t => String(t == null ? '' : t).trim()).filter(Boolean);
    return list.map(t => 'txt:' + t);
  }

  const NO_IMG_POST_IDS = ['official1', 'official2', 'p1', 'p2', 'p3', 'p4', 'p5'];

  function createStore(Phone){
    const KEY = 'weibo_data';
    let data = null;
    const blankAccount = id => ({ id, name:'', avatar:'', bio:'', verify:'none', persona:null, cover:'' });
    const defaults = () => ({
      v: 11,
      profile:{ following:6, followers:0, posts:0, name:'', avatar:'', bio:'记录生活，也记录你。', verify:'none', persona:null, cover:'' },
      accounts:[ blankAccount('a1') ],
      activeId:'a1',
      feed: DEFAULT_FEED.map(p => Object.assign({}, p, { imgs:(p.imgs || []).slice() })),
      recommend: [],
      recView:{ round:1, items:[] },
      drafts: [],
      batches: [],
      chats: DEFAULT_CHATS.map(c => Object.assign({}, c)),
      dms: {},
      seenNotices: [],
      superTopics: SUPER_TOPICS.map(t => Object.assign({}, t))
    });
    function get(){
      if(data) return data;
      let saved = null;
      try{
        saved = (Phone && Phone.getData) ? Phone.getData('weibo') : JSON.parse(localStorage.getItem(KEY) || 'null');
      }catch(e){ saved = null; }
      if(saved && !Array.isArray(saved.feed)) saved = null;
      data = Object.assign(defaults(), saved || {});
      if(!Array.isArray(data.feed) || !data.feed.length){
        data.feed = defaults().feed;
        data.feed.forEach(x => bumpBigCounts(x));
      }
      if(!Array.isArray(data.chats) || !data.chats.length) data.chats = defaults().chats;
      if(!Array.isArray(data.superTopics) || !data.superTopics.length) data.superTopics = defaults().superTopics;
      if(!data.v || data.v < 3){
        const base = defaults().profile;
        const old = data.profile || {};
        data.profile = Object.assign(base, {
          name: old.name || '',
          avatar: old.avatar || '',
          bio: old.bio || base.bio,
          verify: old.verify || 'none'
        });
        data.v = 3;
      }
      data.profile = Object.assign(defaults().profile, data.profile || {});
      if(!Array.isArray(data.accounts) || !data.accounts.length){
        const a = blankAccount('a1');
        ACCOUNT_FIELDS.forEach(k => { a[k] = data.profile[k]; });
        data.accounts = [a];
      }
      if(!data.activeId || !data.accounts.some(a => a.id === data.activeId)) data.activeId = data.accounts[0].id;
      data.feed.forEach(x => { if(x.mine && !x.owner) x.owner = data.accounts[0].id; });
      if(!data.v || data.v < 5){
        data.feed.forEach(x => { if(MEMBER_NAMES[x.name]) x.name = MEMBER_NAMES[x.name]; });
        data.chats.forEach(c => { if(MEMBER_NAMES[c.name]) c.name = MEMBER_NAMES[c.name]; });
        OFFICIAL_POSTS.forEach(op => {
          if(!data.feed.some(x => x.id === op.id)) data.feed.unshift(Object.assign({}, op, { imgs:(op.imgs || []).slice() }));
        });
        if(!data.profile.following) data.profile.following = 6;
      }
      if(!Array.isArray(data.recommend)) data.recommend = [];
      if(!data.v || data.v < 6){
        data.feed.concat(data.recommend || []).forEach(x => {
          if(x.following && !x.unfollowed && !FOLLOWED_NAMES.has(x.name)) x.following = false;
        });
        data.profile.following = FOLLOWED_NAMES.size;
      }
      if(!data.v || data.v < 8){
        data.feed.forEach(x => {
          if(NO_IMG_POST_IDS.indexOf(x.id) >= 0) x.imgs = [];
        });
      }
      if(!Array.isArray(data.drafts)) data.drafts = [];
      if(!Array.isArray(data.batches)) data.batches = [];
      if(!data.recView || !Array.isArray(data.recView.items)) data.recView = { round:1, items:[] };
      data.feed.concat(data.recommend || []).forEach(x => {
        if(Array.isArray(x.rps)) x.rps = x.rps.filter(e => e.kind !== 'robert');
      });
      if(!data.v || data.v < 9){
        data.feed.concat(data.recommend || []).forEach(x => {
          if(!x.mine) bumpBigCounts(x);
        });
      }
      if(!data.v || data.v < 11){
        data.feed.concat(data.recommend || []).forEach(x => {
          if(!Array.isArray(x.imgs)) x.imgs = [];
          if(!x.imgs.length) return;
          if(x.imgs.every(s => String(s).indexOf('txt:') === 0)) return;
          x.imgs = postImages(imageTexts(x));
        });
      }
      if(!data.v || data.v < 12){
        const byName = {};
        (data.chats || []).forEach(c => { byName[c.name] = c; });
        const merged = DEFAULT_CHATS.map(c => byName[c.name] || Object.assign({}, c));
        (data.chats || []).forEach(c => {
          if(!DEFAULT_CHATS.some(x => x.name === c.name)) merged.push(c);
        });
        data.chats = merged;
        if(!data.dms || typeof data.dms !== 'object') data.dms = {};
      }
      if(!data.v || data.v < 13){
        const fix = x => {
          if(!x) return;
          if(!x.mine){
            const mapped = weiboNick(x.name);
            if(mapped && mapped !== x.name){
              x.name = mapped;
              if(isWayvAccount(mapped)){
                x.following = true;
                if(!x.avatar) x.avatar = MEMBER_SELFIE[mapped] || '';
              }
            }
            if(x.text) x.text = toMandarin(x.text);
          }
          if(!x.ts) x.ts = timeToTs(x.time);
        };
        data.feed.concat(data.recommend || []).forEach(fix);
        (data.batches || []).forEach(b => {
          if(!b.ts && b.time) b.ts = timeToTs(b.time);
        });
      }
      if(!data.v || data.v < 14){
        const meNames = new Set();
        const addMe = n => {
          const t = String(n == null ? '' : n).trim();
          if(t) meNames.add(t);
        };
        addMe(data.profile && data.profile.name);
        (data.accounts || []).forEach(a => addMe(a && a.name));
        data.feed = data.feed.filter(x => !(x && /^atseed/.test(String(x.id || ''))));
        data.feed.forEach(x => {
          if(!x || x.mine || !x.text) return;
          meNames.forEach(n => { x.text = String(x.text).split('@' + n).join('').trim(); });
        });
        delete data.atSeeded;
      }
      if(!data.v || data.v < 15){
        data.chats = [];
        data.dms = {};
        data.seenNotices = [];
        data.feed.forEach(x => {
          if(!x || x.mine || !Array.isArray(x.cmts)) return;
          x.cmts = x.cmts.filter(e => e && e.name !== x.name);
        });
      }
      if(!data.v || data.v < 16){
        data.recommend = [];
        data.recView = { round: 1, items: [] };
      }
      if(!data.v || data.v < 17){
        (data.recommend || []).forEach(x => applyMarketStats(x));
        (data.feed || []).forEach(x => applyMarketStats(x));
      }
      data.v = 17;
      return data;
    }
    function save(){
      if(!data) return;
      if(Phone && Phone.setData) Phone.setData('weibo', data);
      else { try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
    }
    return { get, save };
  }

  function imgsGrid(list, cls){
    const imgs = (list || []).filter(Boolean).slice(0, 9);
    if(!imgs.length) return '';
    const cells = imgs.map(src => `<div class="wb-post-img"><img src="${esc(imgSrc(src))}" alt=""></div>`);
    while(cells.length % 3) cells.push('<div class="wb-post-img empty"></div>');
    return `<div class="${cls || 'wb-post-imgs'}">${cells.join('')}</div>`;
  }

  function videoHtml(p){
    const v = p && p.video;
    if(!v || !v.src) return '';
    return `<div class="wb-post-video">
      <img src="${esc(v.src)}" alt="">
      <div class="wb-post-video-meta">
        <span>${esc(v.views || '1.2万次观看')}</span>
        <span class="wb-post-video-dur">${esc(v.duration || '00:15')}</span>
      </div>
    </div>`;
  }

  function postHtml(p, me){
    const own = (p.mine && (!p.owner || !me || p.owner === me.id)) ? me : null;

          <div class="wb-post-name">${esc(name)}${vKey === 'none' ? '' : `<span class="wb-vip${vipCls}">V</span>`}</div>
          <div class="wb-post-time" data-ts="${Number(p.ts) || 0}" data-dev="${esc(postDeviceLabel(p))}">${esc(postTimeText(p))} · ${postDeviceLabel(p)}</div>
        </div>
      </div>
      <div class="wb-post-text">${hlHtml(p.text)}</div>
      ${vid}
      ${imgs}
      ${quoteHtml}
      <div class="wb-post-actions">
        <button class="wb-act" data-act="repost">${ICON.repost}<span class="wb-act-num">${p.reposts || 0}</span></button>
        <button class="wb-act" data-act="comment">${ICON.comment}<span>${p.comments || 0}</span></button>
        <button class="wb-act ${p.liked ? 'liked' : ''}" data-act="like">${ICON.heart}<span>${p.likes || 0}</span></button>
      </div>
    </div>`;
  }

  function initStatusBar(app){

    const iconsEl = app.querySelector('#wbStatusIcons');
    const SIG = '<svg class="sig-icon" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2.4" height="4" rx="0.6"/><rect x="3.4" y="6" width="2.4" height="6" rx="0.6"/><rect x="6.8" y="4" width="2.4" height="8" rx="0.6"/><rect x="10.2" y="2" width="2.4" height="10" rx="0.6"/><rect x="13.6" y="0" width="2.4" height="12" rx="0.6"/></svg>';
    const WIFI = '<svg class="wifi-icon" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.5a10 10 0 0114 0"/><path d="M3.2 7a6 6 0 019.6 0"/><path d="M5.6 9.2a2.5 2.5 0 014.8 0"/><circle cx="8" cy="11" r="0.7" fill="currentColor" stroke="none"/></svg>';
    const BAT = '<svg class="bat-icon" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="currentColor"/><rect x="21.2" y="4" width="1.8" height="4" rx="0.6" fill="currentColor"/></svg>';

    };
    tick();
    const timer = setInterval(() => {
      if(!app.isConnected){ clearInterval(timer); return; }
      tick();

  window.mountWeiboApp = function(container, Phone, onClose){
    const app = (container && container.querySelector && container.querySelector('#wbApp')) || document.getElementById('wbApp');
    if(!app) return;
    const body = app.querySelector('#wbBody');
    const titleEl = app.querySelector('#wbTopTitle');
    const tabs = Array.from(app.querySelectorAll('.wb-tab'));
    const store = createStore(Phone);
    const rawSave = store.save;
    store.save = function(){
      const d = store.get();
      const acc = (d.accounts || []).find(a => a.id === d.activeId);
      if(acc) ACCOUNT_FIELDS.forEach(k => { acc[k] = d.profile[k]; });
      rawSave();
    };
    let currentTab = 'me';
    let homeFilter = 'recommend';
    let meTab = 'posts';
    let msgPanel = 'list';
    let openMenuEl = null;
    let followOrder = null;
    let liveName = '';
    let refreshing = false;

    initStatusBar(app);
    const timeTimer = setInterval(() => {
      if(!app.isConnected){ clearInterval(timeTimer); return; }
      refreshTimeLabels(app);
    }, 60000);

    function toast(msg){
      if(Phone && Phone.toast) Phone.toast(msg);
      else {
        const t = document.createElement('div');
        t.className = 'wb-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1600);
      }
    }
    function meChar(){
      try{ return (Phone && Phone.getCurrentChar) ? Phone.getCurrentChar() : null; }catch(e){ return null; }
    }

    function meNames(){
      const set = new Set();
      const add = n => {
        const t = String(n == null ? '' : n).trim();
        if(!t) return;
        set.add(t);
        if(MEMBER_NAMES[t]) set.add(MEMBER_NAMES[t]);
        const canon = memberWeiboName(t);
        if(canon) set.add(canon);
      };
      const p = (store.get().profile) || {};
      add(p.name);
      const cur = meChar();
      if(cur) add(cur.name);
      try{
        const g = (Phone && Phone.getGlobalData) ? Phone.getGlobalData('homeInfo') : null;
        if(g) add(g.name);
      }catch(e){}
      return set;
    }

    function isMeName(n){
      return !!n && meNames().has(String(n));
    }

    function stripMeMentions(text){
      let s = String(text == null ? '' : text);
      meNames().forEach(n => { s = s.split('@' + n).join(''); });
      return s.replace(/\s{2,}/g, ' ').trim();
    }

    app.querySelector('#wbBackBtn').onclick = () => { if(typeof onClose === 'function') onClose(); };
    if(typeof onClose !== 'function') app.querySelector('#wbBackBtn').style.visibility = 'hidden';
    app.querySelector('#wbComposeBtn').onclick = () => openCompose();
    app.querySelector('#wbRefreshBtn').onclick = refreshFeed;
    const clearBtn = app.querySelector('#wbMsgClearBtn');
    if(clearBtn) clearBtn.onclick = clearAllNotices;
    document.addEventListener('click', e => {
      if(openMenuEl && !(e.target.closest && e.target.closest('.wb-post-more'))) closeMenu();
    }, true);
    document.addEventListener('click', e => {
      if(!(e.target && e.target.closest)) return;
      if(e.target.closest('.wb-viewer')) return;
      const img = e.target.closest('.wb-post-img img, .wb-dt-cm-imgs img');
      if(!img) return;
      const box = img.closest('.wb-post-imgs, .wb-dt-imgs, .wb-dt-post-quote-imgs, .wb-dt-cm-imgs') || img.parentElement;
      const all = Array.from(box.querySelectorAll('img'));
      e.stopPropagation();
      e.preventDefault();
      openImageViewer(all.map(x => x.getAttribute('src')), all.indexOf(img));
    }, true);
    tabs.forEach(t => { t.onclick = () => switchTab(t.dataset.tab); });

    function switchTab(tab){
      closeMenu();
      currentTab = tab;
      if(tab !== 'chat') msgPanel = 'list';
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      titleEl.textContent = TAB_TITLES[tab] || '微博';
      const broom = app.querySelector('#wbMsgClearBtn');
      if(broom) broom.classList.toggle('on', tab === 'chat');
      app.classList.toggle('wb-me-mode', tab === 'me');
      render();
    }

    function render(){
      closeMenu();
      body.scrollTop = 0;
      if(currentTab === 'home') renderHome();
      else if(currentTab === 'discover') renderDiscover();
      else if(currentTab === 'chat') renderChats();
      else renderMe();
    }

    function closeMenu(){
      if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; }
    }

    function bindPostMenu(el, post, refresh){
      const box = el.querySelector('.wb-post-more');
      const btn = el.querySelector('.wb-more-btn');
      if(!box || !btn) return;
      const d = store.get();
      const mine = !!post.mine && (!post.owner || post.owner === d.activeId);
      btn.onclick = e => {
        e.stopPropagation();
        const opened = box.querySelector('.wb-more-menu');
        closeMenu();
        if(opened) return;
        const followed = isFollowed(post);
        const items = [
          { k:'edit', label:'编辑' },
          { k:'del', label:'删除', danger:true }
        ].concat(mine ? [] : [
          { k:'follow', label: followed ? '取消关注' : '关注' },
          { k:'report', label:'举报', danger:true }
        ]);
        const menu = document.createElement('div');
        menu.className = 'wb-more-menu';
        menu.innerHTML = items.map(it => `<button class="wb-more-item${it.danger ? ' danger' : ''}" data-k="${it.k}" type="button">${it.label}</button>`).join('');
        box.appendChild(menu);
        openMenuEl = menu;
        menu.querySelectorAll('.wb-more-item').forEach(item => {
          item.onclick = ev => {
            ev.stopPropagation();
            const k = item.dataset.k;
            if(k === 'edit'){
              closeMenu();
              openCompose(post);
            } else if(k === 'report'){
              closeMenu();
              toast('已举报，我们会尽快处理');
            } else if(k === 'del'){
              if(item.dataset.confirm !== '1'){
                item.dataset.confirm = '1';
                item.textContent = '再点一次删除';
                setTimeout(() => {
                  if(!item.isConnected) return;
                  item.dataset.confirm = '';
                  item.textContent = '删除';
                }, 2500);
                return;
              }
              closeMenu();
              const dd = store.get();
              const idx = dd.feed.findIndex(x => x.id === post.id);
              if(idx >= 0) dd.feed.splice(idx, 1);
              else if(Array.isArray(dd.recommend)){
                const ri = dd.recommend.findIndex(x => x.id === post.id);
                if(ri >= 0) dd.recommend.splice(ri, 1);
              }
              dd.batches = (dd.batches || []).map(b => Object.assign({}, b, {
                postIds:(b.postIds || []).filter(id => id !== post.id)
              }));
              if(mine) dd.profile.posts = Math.max(0, (parseInt(dd.profile.posts, 10) || 0) - 1);
              store.save();
              toast('微博已删除');
              refresh();
            } else if(k === 'follow'){
              closeMenu();
              const dd = store.get();
              const following = parseInt(dd.profile.following, 10) || 0;
              const targets = dd.feed.filter(x => x.name === post.name)
                .concat((dd.recommend || []).filter(x => x.name === post.name));
              (targets.length ? targets : [post]).forEach(t => {
                t.unfollowed = followed;
                t.following = !followed;
              });
              if(followed){
                dd.profile.following = Math.max(0, following - 1);
                toast('已取消关注');
              } else {
                dd.profile.following = following + 1;
                toast('关注成功');
              }
              store.save();
              refresh();
            }
          };
        });
      };
    }

    function removePost(post){
      const dd = store.get();
      const idx = dd.feed.findIndex(x => x.id === post.id);
      if(idx >= 0) dd.feed.splice(idx, 1);
      else if(Array.isArray(dd.recommend)){
        const ri = dd.recommend.findIndex(x => x.id === post.id);
        if(ri >= 0) dd.recommend.splice(ri, 1);
      }
      dd.batches = (dd.batches || []).map(b => Object.assign({}, b, {
        postIds:(b.postIds || []).filter(id => id !== post.id)
      }));
      const mine = !!post.mine && (!post.owner || post.owner === dd.activeId);
      if(mine) dd.profile.posts = Math.max(0, (parseInt(dd.profile.posts, 10) || 0) - 1);
      store.save();
      toast('微博已删除');
    }

    function blockAuthor(name){
      const dd = store.get();
      const ids = new Set();
      dd.feed.filter(x => x.name === name).forEach(x => ids.add(x.id));
      (dd.recommend || []).filter(x => x.name === name).forEach(x => ids.add(x.id));
      dd.feed = dd.feed.filter(x => x.name !== name);
      if(Array.isArray(dd.recommend)) dd.recommend = dd.recommend.filter(x => x.name !== name);
      dd.batches = (dd.batches || []).map(b => Object.assign({}, b, {
        postIds:(b.postIds || []).filter(id => !ids.has(id))
      }));
      store.save();
      toast('已拉黑 ' + shortName(name));
    }

    function meInfo(d){
      const char = meChar();
      const p = d.profile || {};
      return {
        id: d.activeId,
        name: (p.name || '').trim() || ((char && char.name) || '我'),
        avatar: p.avatar || (char && char.avatar) || '',
        verify: VERIFY[p.verify] ? p.verify : 'none'
      };
    }

    function findPost(d, id){
      return d.feed.find(x => x.id === id) || (d.recommend || []).find(x => x.id === id) || null;
    }

    function shuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function isFollowed(p){
       if(!p) return false;
      if(p.mine) return true;
      if(isWayvAccount(p.name)) return true;
      if(p.unfollowed) return false;
      return !!(p.official || p.following || FOLLOWED_NAMES.has(p.name));
    }

    function followSources(d){
      const rec = (d.recommend || []).filter(x => !x.mine && !isMeName(x.name) && !x.unfollowed && (x.following || x.official));
      const all = d.feed.filter(x => !x.mine && !isMeName(x.name) && isFollowed(x)).concat(rec);
      if(!followOrder) return all;
      const map = {};
      all.forEach(x => { map[x.id] = x; });
      const ordered = followOrder.map(id => map[id]).filter(Boolean);
      all.forEach(x => { if(ordered.indexOf(x) < 0) ordered.push(x); });
      return ordered;
    }

    const REC_TARGET = 10;

    function recAccounts(){
      const seen = new Set();
      const out = [];
      REC_ACCOUNTS.forEach(a => {
        const n = String(a.name || '').trim();
        if(!n || seen.has(n)) return;
        if(isWayvAccount(n) || isMeName(n) || FOLLOWED_NAMES.has(n)) return;
        seen.add(n);
        out.push(a);
      });
      return out;
    }

    function recommendPool(d){
      const bots = (d.recommend || [])
        .filter(x => x && !isFollowed(x) && !isMeName(x.name) && !isWayvAccount(x.name));
      const others = [];
      const seenName = {};
      d.feed.forEach(x => {
        if(!x || x.mine || isMeName(x.name) || isFollowed(x) || isWayvAccount(x.name)) return;
        if(seenName[x.name]) return;
        seenName[x.name] = true;
        others.push(x);
      });
      const map = {};
      others.concat(bots).forEach(x => { map[x.id] = x; });
      return { others, bots, map, total: others.length + bots.length };
    }

    function makeRecPost(d, view, author, text, round){
      const withImg = Math.random() < 0.45;
      const post = {
        id: 'rc' + (round || 1) + '_' + Date.now().toString(36) + '_' + bigRnd(1000, 9999),
        name: author.name,
        avatar: '',
        vip: !!author.vip,
        time: '刚刚',
        ts: Date.now() - bigRnd(0, 50) * 60000,
        text,
        imgs: withImg ? postImages(imageTexts({ text })) : [],
        likes: 0,
        comments: 0,
        reposts: 0,
        liked: false,
        cmts: []
      };
      applyMarketStats(post);
      d.recommend.push(post);
      return post.id;
    }

    function makeFreshRecommend(d, view, count){
      const accounts = recAccounts();
      if(!accounts.length) return [];
      const shownNames = {};
      (view.items || []).forEach(it => {
        const p = findPost(d, it.id);
        if(p && p.name) shownNames[p.name] = true;
      });
      const recent = new Set(Array.isArray(view.recentAuthors) ? view.recentAuthors : []);
      const usedTexts = new Set(Array.isArray(view.recentTexts) ? view.recentTexts : []);
      const fresh = [];
      for(let i = 0; i < count; i++){
        let pool = accounts.filter(a => !shownNames[a.name] && !recent.has(a.name));
        if(!pool.length) pool = accounts.filter(a => !shownNames[a.name]);
        if(!pool.length){
          recent.clear();
          pool = accounts;
        }
        const author = pool[bigRnd(0, pool.length - 1)];
        let textPool = REC_TEXTS.filter(t => !usedTexts.has(t));
        if(!textPool.length){
          usedTexts.clear();
          textPool = REC_TEXTS.slice();
        }
        let text = textPool[bigRnd(0, textPool.length - 1)];
        if(Math.random() < 0.35) text += ' ' + REC_TAGS[bigRnd(0, REC_TAGS.length - 1)];
        usedTexts.add(text);
        shownNames[author.name] = true;
        recent.add(author.name);
        fresh.push(makeRecPost(d, view, author, text, view.round || 1));
      }
      view.recentAuthors = Array.from(recent).slice(-60);
      view.recentTexts = Array.from(usedTexts).slice(-50);
      return fresh;
    }

    function recViewInit(d){
      if(!d.recView || !Array.isArray(d.recView.items)) d.recView = { round: 1, items: [] };
      if(!d.recView.round) d.recView.round = 1;
      const { map } = recommendPool(d);
      const alive = d.recView.items.filter(it => map[it.id]);
      if(alive.length !== d.recView.items.length) d.recView.items = alive;
      if(d.recView.items.length < REC_TARGET){
        const fresh = makeFreshRecommend(d, d.recView, REC_TARGET - d.recView.items.length);
        fresh.forEach(id => d.recView.items.push({ id, r: d.recView.round }));
      }
      store.save();
      return d.recView;
    }

    function recommendList(d){
      const view = recViewInit(d);
      const { map } = recommendPool(d);
      const alive = view.items.filter(it => map[it.id]);
      if(alive.length !== view.items.length){
        view.items = alive;
        store.save();
      }
      return alive.map(it => map[it.id]);
    }

    function pruneRecommend(d, view){
      const cutoff = (view.round || 1) - 4;
      if(cutoff < 1) return;
      const drop = view.items.filter(it => (it.r || 1) <= cutoff).map(it => it.id);
      if(!drop.length) return;
      view.items = view.items.filter(it => (it.r || 1) > cutoff);
      d.recommend = (d.recommend || []).filter(x => {
        if(drop.indexOf(x.id) < 0) return true;
        if(x.liked) return true;
        return false;
      });
    }

    function rotateRecommend(d){
      const view = recViewInit(d);
      view.round = (view.round || 1) + 1;
      pruneRecommend(d, view);
      const fresh = makeFreshRecommend(d, view, 4);
      fresh.forEach(id => view.items.unshift({ id, r: view.round }));
      store.save();
    }

    function shortName(n){
      const s = String(n || '').replace('威神V_', '');
      return s.split('_')[0] || n;
    }

    function livePeople(d){

        if(!p.name || seen.has(p.name)) return;
        seen.add(p.name);

    function rollLive(d){
      const ppl = livePeople(d || store.get());
      liveName = (ppl.length && Math.random() < 0.1)
        ? ppl[Math.floor(Math.random() * ppl.length)].name
        : '';

    function bindLiveStrip(el){
      if(!el) return;
      let dragging = false, startX = 0, startLeft = 0, moved = false;
      el.addEventListener('pointerdown', e => {
        if(e.pointerType !== 'mouse' || e.button !== 0) return;
        dragging = true; moved = false;
        startX = e.clientX; startLeft = el.scrollLeft;
        el.classList.add('dragging');
      });
      el.addEventListener('pointermove', e => {
        if(!dragging) return;
        const dx = e.clientX - startX;
        if(Math.abs(dx) > 4){
          moved = true;
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
        }
        if(moved){
          el.scrollLeft = startLeft - dx;
          e.preventDefault();
        }
      });
      const end = () => {
        if(!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('click', e => {
        if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
      }, true);
    }

            </div>

          </div>`;
        }).join('')}
      </div>`;
    }

    function memberFallbackList(){
      return Object.keys(MEMBER_NAMES)
        .filter(n => !isMeName(n))
        .map(n => ({ name: n, avatar: '', identity: 'WayV成员', persona: '' }))
        .concat([{ name:'WayV_official', avatar:'wayv.jpg', identity:'WayV官方账号', persona:'官方口吻，发布公告、行程和官方物料' }]);

    function charAvatar(ch, d){
      if(ch.avatar) return ch.avatar;
      const mapped = weiboNick(ch.name);
      const hit = d.feed.find(x => x.name === mapped && x.avatar);
      if(hit) return hit.avatar;
      return MEMBER_SELFIE[mapped] || '';
    }

    function parsePostJson(raw){
      let s = String(raw || '').trim();
      const fence = s.match(/```(?:json)?[\s\S]*?```/i);
      if(fence) s = fence[0].replace(/```(?:json)?/gi, '');
      const arr = s.match(/\[[\s\S]*\]/);
      if(arr) s = arr[0];
      try{
        const list = JSON.parse(s);
        if(Array.isArray(list)){
          const out = list.map(x => {
            let scenes = x.scenes;
            if(typeof scenes === 'string') scenes = scenes.split(/[,，、\s]+/);
            if(!Array.isArray(scenes)) scenes = [];
            let images = x.images || x.imgs || x['配图文字'];
            if(typeof images === 'string') images = images.split(/[,，、\n]+/);
            if(!Array.isArray(images)) images = [];
            return {
              name: String(x.name || x['角色'] || '').trim(),
              text: toMandarin(String(x.text || x.content || x['内容'] || '').trim()),
              scene: String(x.scene || x['配图'] || '').trim(),
              scenes: scenes.map(s => String(s || '').trim()).filter(Boolean),
              images: images.map(s => String(s || '').trim()).filter(Boolean).slice(0, 9)
            };
          }).filter(x => x.text);
          if(out.length) return out;
        }
      }catch(e){}
      const out = [];
      const re = /"name"\s*:\s*"([^"]*)"[\s\S]*?"text"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
      let m;
      while((m = re.exec(s))) out.push({ name: m[1], text: toMandarin(m[2].replace(/\\n/g, '\n').replace(/\\"/g, '"')), scene:'', scenes:[], images:[] });
      return out.filter(x => x.text);
    }

    async function generateBatch(){
      const d = store.get();
      let authors = authorList();
      if(!authors.length) authors = memberFallbackList();
      if(!authors.some(a => a.name === 'WayV_official')){
        authors = authors.concat([{ name:'WayV_official', avatar:'wayv.jpg', identity:'WayV官方账号', persona:'官方口吻，发布公告、行程和官方物料' }]);
      }
      authors = authors.filter(a => a && !isMeName(a.name));
      if(!authors.length) throw new Error('还没有可以发微博的联系人');
      if(!Phone || !Phone.chatWithAI) throw new Error('未连接 AI');
      if(Math.random() < 0.2) return 0;
      const wayvAuthors = authors.filter(a => isWayvAccount(a.name));
      const otherAuthors = authors.filter(a => !isWayvAccount(a.name));
      const want = 1 + Math.floor(Math.random() * 3);
      const bag = [];
      wayvAuthors.forEach(a => { for(let i = 0; i < 6; i++) bag.push(a); });
      otherAuthors.forEach(a => bag.push(a));
      const recentNames = new Set((d.feed || []).slice(0, 12).filter(x => x && !x.mine).map(x => weiboNick(x.name)));
      const picked = [];
      const seen = new Set();
      let otherPicked = 0;
      shuffle(bag).forEach(a => {
        if(picked.length >= want) return;
        const key = weiboNick(a.name);
        if(seen.has(key)) return;
        const isWayv = isWayvAccount(a.name);
        if(!isWayv && otherPicked >= 1) return;
        seen.add(key);
        if(!isWayv) otherPicked++;
        picked.push(a);
      });
      if(wayvAuthors.length && !picked.some(a => isWayvAccount(a.name))){
        const w = shuffle(wayvAuthors).find(a => !recentNames.has(weiboNick(a.name))) || wayvAuthors[Math.floor(Math.random() * wayvAuthors.length)];
        if(w && !seen.has(weiboNick(w.name))){
          seen.add(weiboNick(w.name));
          picked.unshift(w);
          if(picked.length > want) picked.pop();
        }
      }
      if(!picked.length) picked.push(authors[Math.floor(Math.random() * authors.length)]);
      const lines = picked.map((c, i) => {
        const bits = [];
        if(c.identity) bits.push('身份：' + c.identity);
        if(c.persona) bits.push('人设：' + c.persona);
        return `${i + 1}. ${c.name}${bits.length ? '（' + bits.join('；') + '）' : ''}`;
      }).join('\n');
      const messages = [
        { role:'system', content:'你是微博内容生成器，根据每个人的设定写出真实、自然、有生活感的微博正文。所有内容必须使用普通话简体中文，严禁出现粤语用字（唔、嘅、咁、係、嚟、冇、咗、睇、靓等）和粤语表达；即使人物来自广东、香港、澳门，或设定里提到会说粤语，发微博也必须写普通话。只输出 JSON 数组，不要输出解释或代码块标记。' },
        { role:'user', content:`请为下面每个人各写一条微博，共 ${picked.length} 条：\n${lines}\n\n要求：\n1. 完全贴合该人物的人设与语气，不要串味；\n2. 每条 20-60 字，像真人随手发的日常，不要用"大家好"这类开场白；\n3. 最多带 1 个 #话题#，可加少量 emoji；\n4. 不要提及这是 AI 生成；\n5. 每条配 1-9 张图，用 images 数组表示每张图上要写的文字（一句话、几个字都行，就像随手拍的图上的字），文字要像在描述这些图，比如"今晚的首尔"配上夜景和自拍；张数 1-9 张不等，不要超过 9 张；\n6. 全部用普通话简体中文，绝对不能出现粤语、粤语用字或方言词（唔/嘅/咁/係/嚟/冇/咗/睇/靓 一律不允许）；\n7. 正文里不要 @ 任何人，也不要 @ 粉丝或用户。\n\n输出格式（严格 JSON 数组）：\n[{"name":"角色名","text":"微博正文","images":["图上文字1","图上文字2"]}]` }
      ];
      const raw = await Phone.chatWithAI(messages);
      const items = parsePostJson(raw);
      if(!items.length) throw new Error('没有解析到微博内容');
      const batchId = 'b' + Date.now();
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      (d.batches || []).forEach(b => {
        (b.postIds || []).forEach(id => {
          const old = d.feed.find(x => x.id === id);
          if(old && old.time === '刚刚') old.time = b.time;
        });
      });
      const postIds = [];
      items.slice(0, picked.length).forEach((it, i) => {
        const key = weiboNick(it.name);
        const ch = picked.find(c => weiboNick(c.name) === key || c.name === it.name) || picked[i] || picked[0];
        if(!ch || isMeName(ch.name)) return;
        const mappedName = weiboNick(ch.name);
        const texts = imageTexts(it).map(t => stripMeMentions(toMandarin(t)));
        const post = {
          id: batchId + '_' + i,
          name: mappedName,
          avatar: charAvatar(ch, d),
          vip: true,
          following: true,
          time: '刚刚',
          ts: Date.now(),
          text: stripMeMentions(toMandarin(it.text)),
          imgs: postImages(texts),
          likes: bigRnd(10000, 68000),
          comments: bigRnd(5000, 9600),
          reposts: bigRnd(5000, 9600),
          liked: false,
          batch: batchId
        };
        d.feed.unshift(post);
        postIds.push(post.id);
      });
      if(!postIds.length) throw new Error('没有生成到内容');
      d.batches.unshift({ id: batchId, time, ts: now.getTime(), postIds });
      store.save();
      return postIds.length;
    }

    async function regenerateFollow(){
      refreshing = true;
      if(currentTab === 'home') renderHome();
      try{
        const n = await generateBatch();
        refreshing = false;
        followOrder = null;
        rollLive(store.get());
        if(currentTab === 'home') renderHome();
        toast(n ? `已生成 ${n} 条新微博` : '这次没有人发新微博');
      }catch(err){
        refreshing = false;
        rollLive(store.get());
        if(currentTab === 'home') renderHome();
        toast('生成失败：' + ((err && err.message) ? err.message : '请检查 API 设置'));
      }
    }

    function refreshFeed(){
      const btn = app.querySelector('#wbRefreshBtn');
      if(btn){
        btn.classList.remove('spin');
        void btn.offsetWidth;
        btn.classList.add('spin');
        setTimeout(() => btn.classList.remove('spin'), 600);
      }
      const d = store.get();
      closeMenu();

        rollLive(d);
        renderHome();
        toast('为你推荐了新内容');

        render();

    function renderHome(){
      const d = store.get();
      const me = meInfo(d);
      const isFollow = homeFilter === 'follow';
      const list = isFollow ? followSources(d) : recommendList(d);
      const strip = isFollow ? liveStripHtml(d) : '';

        ? `<div class="wb-loading"><span class="wb-loading-spin"></span>正在刷新微博…</div>`

        <div class="wb-segment">

        </div>
        ${strip}
        ${loading}
        ${list.length
          ? list.map(x => postHtml(x, me)).join('') + '<div class="wb-end">已经到底啦 ~</div>'
          : (loading ? '' : `<div class="wb-end">${isFollow ? '点右上角刷新，让关注的人发微博' : '暂时没有推荐内容'}</div>`)}`;
      body.querySelectorAll('.wb-seg').forEach(b => {

      });
      bindLiveStrip(body.querySelector('.wb-live-strip'));
      body.querySelectorAll('.wb-post').forEach(el => {
        const post = findPost(d, el.dataset.id);
        if(!post) return;
        el.querySelectorAll('.wb-act').forEach(btn => {
          btn.onclick = ev => {
            ev.stopPropagation();
            const act = btn.dataset.act;
            if(act === 'like'){
              post.liked = !post.liked;
              post.likes += post.liked ? 1 : -1;
              store.save();
              btn.classList.toggle('liked', post.liked);
              btn.innerHTML = `${ICON.heart}<span>${post.likes}</span>`;
            } else if(act === 'comment'){
              openPostDetail(post, 'comment');
            } else if(ev.target.closest('.wb-act-num')){
              openPostDetail(post, 'repost');
            } else {
              openRepostSheet(post);
            }
          };
        });
        el.onclick = ev => {
          if(ev.target.closest('.wb-act') || ev.target.closest('.wb-more-btn')) return;
          openPostDetail(post, 'comment');
        };
        bindPostMenu(el, post, renderHome);
      });
    }

        </div>

    const DM_REPLIES = {
      '威神V_钱锟_KUN': '一起加油吧！( ´▽` )',
      '威神V_TEN_李永钦': 'I’m TEN LEE',

      '威神V_扬扬_YANGYANG': '羊羊is here!! 我来啦 哈哈哈哈'
    };

    const NOTICE_FILTERS = {
      at: ['所有@我的', '微博里@我的', '评论里@我的'],
      cmt: ['所有评论', '博主发表的评论', '评论了我的微博'],
      like: ['收到的赞']
    };
    const noticeFilter = { at: 0, cmt: 0, like: 0 };
    let noticeMask = null;

    function nowHM(){
      const t = new Date();
      return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    }

    function isVipName(n){
      return FOLLOWED_NAMES.has(n) || /WayV|威神V/i.test(String(n || ''));
    }

    function msgNotices(){
      const d = store.get();
      const my = myCmtName();
      const chars = authorList().filter(a => a && a.name && a.name !== my);
      const likeFans = chars.filter(a => !isWayvAccount(a.name));
      const likeNetizens = NETIZEN_NAMES.filter(n => !isWayvAccount(n));
      const at = [];
      const cmt = [];
      const like = [];
      const mine = d.feed.filter(x => x.mine && (!x.owner || x.owner === d.activeId));
      const addAt = (p, name, avatar, text, time, kind) => {
        at.push({
          kind, name, avatar: avatar || '', text: String(text || ''), time: time || '',
          postId: p.id, quote: String(p.text || '').slice(0, 30),
          thumb: (p.imgs || [])[0] || '', vip: isVipName(name)
        });
      };
      d.feed.forEach(p => {
        if(!p) return;
        if(!isMeName(p.name) && String(p.text || '').indexOf('@' + my) >= 0){
          addAt(p, p.name, p.avatar, p.text, p.time, 'post');
        }
        (p.cmts || []).forEach(e => {
          if(!e || e.name === my) return;
          if(String(e.text || '').indexOf('@' + my) >= 0){
            addAt(p, e.name, e.avatar, e.text, e.time, 'cmt');
          }
        });
      });
      mine.forEach(p => {
        (p.cmts || []).forEach(e => {
          if(!e || e.name === my) return;
          cmt.push({
            kind: 'mine', name: e.name, avatar: e.avatar || '',
            text: String(e.text || ''), time: e.time || '',
            quote: String(p.text || '').slice(0, 30), postId: p.id,
            thumb: (p.imgs || [])[0] || '', vip: isVipName(e.name)
          });
        });
      });
      mine.forEach(p => {
        const c = Math.min(parseInt(p.likes || 0, 10) || 0, 6);
        if(c <= 0) return;
        const pool = likeFans.concat(likeNetizens.map(n => ({ name: n, avatar: '' })));
        if(!pool.length) return;
        const used = {};
        const start = marketHash(p.id) % pool.length;
        for(let i = 0; i < c; i++){
          let who = null;
          for(let k = 0; k < pool.length; k++){
            const cand = pool[(start + i + k) % pool.length];
            if(cand && !used[cand.name]){ who = cand; break; }
          }
          if(!who) who = pool[(start + i) % pool.length];
          used[who.name] = true;
          like.push({
            kind: 'like', name: who.name,
            avatar: who.avatar || '',
            time: p.time || '', postId: p.id,
            quote: String(p.text || '').slice(0, 30),
            thumb: (p.imgs || [])[0] || '', vip: isVipName(who.name)
          });
        }
      });
      return { at, cmt, like };
    }

    function msgRow(ico, title, preview, badge, cat, extra){
      return `<div class="wb-chat-row wb-msg-cat" data-cat="${cat}">
        <div class="wb-msg-ico ${ico}">${extra || ''}</div>
        <div class="wb-chat-info">
          <div class="wb-chat-top"><span class="wb-chat-name">${esc(title)}</span></div>
          <div class="wb-chat-preview">${esc(preview)}</div>
        </div>
        ${badge ? `<span class="wb-badge">${esc(badge)}</span>` : ''}
        <span class="wb-msg-arrow">›</span>
      </div>`;
    }

    function noticeSig(x){
      return [x.kind, x.name, String(x.text || '').slice(0, 60), x.postId].join('|');
    }

    function unseenList(list, d){
      const seen = new Set(Array.isArray(d.seenNotices) ? d.seenNotices : []);
      return list.filter(x => !seen.has(noticeSig(x)));
    }

    function clearAllNotices(){
      const d = store.get();
      const n = msgNotices();
      const seen = new Set(Array.isArray(d.seenNotices) ? d.seenNotices : []);
      [].concat(n.at, n.cmt, n.like).forEach(x => seen.add(noticeSig(x)));
      d.seenNotices = Array.from(seen).slice(-400);
      (d.chats || []).forEach(c => { c.unread = 0; });
      store.save();
      if(currentTab === 'chat') renderChats();
      toast('已清除全部消息提醒');
    }

          ${msgRow('ico-cmt', '评论', cmt.length ? `${cmt[0].name}：${cmt[0].text}` : '还没有新的评论', cmt.length ? String(cmt.length) : '', 'cmt', ICON.comment)}
          ${msgRow('ico-like', '赞', like.length ? `${like[0].name}赞了你的微博` : '还没有收到赞', like.length ? String(like.length) : '', 'like', ICON.heart)}

                <div class="wb-chat-preview">${esc(c.preview || '')}</div>
              </div>
              ${c.unread ? `<span class="wb-badge">${esc(c.unread)}</span>` : ''}
            </div>`).join('') : '<div class="wb-msg-empty">暂无私信</div>'}
        </div>
        <div class="wb-end">私信 · 和喜欢的人聊聊天</div>`;
      body.querySelectorAll('.wb-msg-cat').forEach(row => {
        row.onclick = () => { msgPanel = row.dataset.cat; openNoticePanel(row.dataset.cat); };
      });
      body.querySelectorAll('.wb-chat-row[data-id]').forEach(row => {
        row.onclick = () => {
          const c = (store.get().chats || []).find(x => x.id === row.dataset.id);
          if(c) openDmChat(c);
        };

    function openNoticePanel(cat){

      const paint = () => {
        const n = msgNotices();
        const all = cat === 'at' ? n.at : cat === 'cmt' ? n.cmt : n.like;
        const filters = NOTICE_FILTERS[cat];
        const fi = noticeFilter[cat] || 0;
        const list = all.filter(x => fi === 0 || (cat === 'at'
          ? (fi === 1 ? x.kind === 'post' : x.kind === 'cmt')
          : (fi === 1 ? x.kind === 'poster' : x.kind === 'mine')));
        const empty = cat === 'at' ? '还没有人@你' : cat === 'cmt' ? '还没有新的评论' : '还没有收到赞';
        mask.innerHTML = `
          <div class="wb-status-bar wb-nb-status"><span>${nowHM()}</span><span class="wb-status-icons">${iconsHtml}</span></div>
          <div class="wb-nb-bar">
            <button class="wb-nb-back" type="button" aria-label="返回">${DT_ICON.back}</button>
            <button class="wb-nb-title" type="button">${esc(filters[fi])}${filters.length > 1 ? '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>' : ''}</button>
            <button class="wb-nb-set" type="button">设置</button>
          </div>
          <div class="wb-nb-list">
            ${list.length ? list.map((x, i) => `
              <div class="wb-nb-row" data-idx="${i}">
                <div class="wb-nb-ava">${avatarHtml(x.name, x.avatar, '')}${x.vip ? '<span class="wb-nb-vb">V</span>' : ''}</div>
                <div class="wb-nb-main">
                  <div class="wb-nb-name">${esc(x.name)}</div>
                  <div class="wb-nb-sub">${esc(cat === 'like' ? '赞了你的微博' : noticeSub(x))} ${esc(x.time || '')}</div>

                    <button class="wb-nb-btn" data-act="reply">${ICON.comment}回复</button>
                    <button class="wb-nb-btn" data-act="like">${ICON.heart}赞</button>

              </div>`).join('') : `<div class="wb-nb-empty">${esc(empty)}</div>`}
          </div>`;

        mask.querySelector('.wb-nb-back').onclick = close;
        mask.querySelector('.wb-nb-set').onclick = () => toast('设置页开发中');
        const titleBtn = mask.querySelector('.wb-nb-title');
        if(titleBtn) titleBtn.onclick = () => {
          if(filters.length < 2) return;
          const bar = mask.querySelector('.wb-nb-bar');

          if(old){ old.remove(); return; }
          const drop = document.createElement('div');

        mask.querySelectorAll('.wb-nb-row[data-idx]').forEach(row => {
          const x = list[parseInt(row.dataset.idx, 10)];

              if(act === 'reply'){

                if(post) openPostDetail(post, 'comment'); else toast('原微博已不可见');
              } else if(act === 'like'){
                b.classList.toggle('on');
              } else toast('更多操作开发中');
            };
          });
        });
      };
      paint();
    }

    function openDmChat(chat){
      if(dmMask){ dmMask.remove(); dmMask = null; }
      const d = store.get();
      if(!d.dms || typeof d.dms !== 'object') d.dms = {};
      if(!Array.isArray(d.dms[chat.id])) d.dms[chat.id] = [];
      chat.unread = 0;
      store.save();

      const me = meInfo(d);
      const iconsHtml = (app.querySelector('#wbStatusIcons') || {}).innerHTML || '';
      const replyText = DM_REPLIES[chat.name] || '';

          <input class="wb-dm-input" id="wbDmInput">
          <button class="wb-dm-send" id="wbDmSend" type="button">发送</button>
        </div>`;
      app.appendChild(mask);
      dmMask = mask;

      const dmBody = mask.querySelector('.wb-dm-body');
      const input = mask.querySelector('#wbDmInput');
      let typing = false;

      const paint = () => {
        const msgs = d.dms[chat.id] || [];
        const bubble = (isMe, name, avatar, text) => `
          <div class="wb-dm-row${isMe ? ' me' : ''}">
            <div class="wb-dm-ava">${avatarHtml(name, avatar, '')}${isMe ? '' : '<span class="wb-dm-vb">V</span>'}</div>
            <div class="wb-dm-bubble${isMe ? ' me' : ''}">${esc(text)}</div>
          </div>`;
        dmBody.innerHTML = `
          ${msgs.map(m => m.mine
            ? bubble(true, me.name, me.avatar, m.text)
            : bubble(false, chat.name, chat.avatar, m.text)).join('')}
          ${typing ? `
            <div class="wb-dm-row">
              <div class="wb-dm-ava">${avatarHtml(chat.name, chat.avatar, '')}<span class="wb-dm-vb">V</span></div>
              <div class="wb-dm-bubble wb-dm-typing"><i></i><i></i><i></i></div>
            </div>` : ''}
          <div class="wb-dm-tip">由于对方没有主动回复，你只能发送一条文字留言消息，需要对方关注或主动回复后才能继续发送。开通会员能发送更多留言消息</div>`;
        dmBody.scrollTop = dmBody.scrollHeight;
      };

      const send = text => {
        const t = String(text || '').trim();
        if(!t) return;
        const msgs = d.dms[chat.id] || (d.dms[chat.id] = []);
        msgs.push({ mine: true, text: t, time: nowHM() });
        chat.preview = t;
        chat.time = '刚刚';
        store.save();
        typing = !!replyText;
        paint();
        if(!replyText) return;
        setTimeout(() => {
          typing = false;
          msgs.push({ mine: false, text: replyText, time: nowHM() });
          chat.preview = replyText;
          store.save();
          paint();
        }, 1000);
      };

      mask.querySelector('.wb-dm-back').onclick = () => {
        mask.remove();
        if(dmMask === mask) dmMask = null;
        renderChats();
      };
      mask.querySelector('.wb-dm-set').onclick = () => toast('设置页开发中');
      mask.querySelector('#wbDmSend').onclick = () => { const v = input.value; input.value = ''; send(v); };
      input.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); const v = input.value; input.value = ''; send(v); }
      });
      mask.querySelectorAll('.wb-dm-chip').forEach(chip => {
        chip.onclick = () => send(chip.textContent);
      });
      paint();
    }

        if(e.target.closest('.wb-cover-back,.wb-cover-acts')) return;
        openCoverSheet();
      };
      body.querySelector('#wbMePlus').onclick = () => openCompose();
      const backEl = body.querySelector('#wbMeBack');
      if(backEl) backEl.onclick = () => { if(typeof onClose === 'function') onClose(); };
      body.querySelectorAll('.wb-me-tab').forEach(t => {
        t.onclick = () => { meTab = t.dataset.tab; renderMe(); };
      });

      body.scrollTop = keepTop;
    }

    function meEmpty(svg, text){
      return `<div class="wb-me-empty">${svg}<span>${text}</span></div>`;
