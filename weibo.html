  <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.wb-app{
  --wb-orange:#ff8200;
  --wb-orange-deep:#ef6a00;
  --wb-orange-soft:#ffd9b3;
  --wb-ink:#3d2a1c;
  --wb-ink-soft:#a08a7a;
  --wb-line:rgba(255,196,150,.55);
  --wb-card:rgba(255,255,255,.62);
  display:flex;flex-direction:column;flex:1;height:0;min-height:0;
  background:linear-gradient(180deg,#fff9f3 0%,#fff1e4 45%,#ffe8d6 100%);
  position:relative;overflow:hidden;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--wb-ink);
}
.wb-app::before{content:"";position:absolute;top:-18%;right:-25%;width:75%;height:48%;background:radial-gradient(circle,rgba(255,168,92,.35) 0%,transparent 70%);pointer-events:none;}
.wb-app::after{content:"";position:absolute;bottom:-12%;left:-20%;width:70%;height:45%;background:radial-gradient(circle,rgba(255,214,170,.5) 0%,transparent 70%);pointer-events:none;}

.wb-status-bar{height:calc(var(--phone-w,420px)*0.095 + var(--safe-top,0px));
  padding:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.015) calc(var(--phone-w,420px)*0.064) 0;
  display:flex;justify-content:space-between;align-items:center;
  font-size:calc(var(--phone-w,420px)*0.04);font-weight:600;color:var(--wb-ink);
  position:relative;z-index:5;flex-shrink:0;}
.wb-status-icons{display:flex;gap:calc(var(--phone-w,420px)*0.016);align-items:center;}
.wb-status-icons svg{display:block;flex-shrink:0;}
.wb-status-bar .sig-icon,.wb-status-bar .wifi-icon{width:calc(var(--phone-w,420px)*0.045);height:calc(var(--phone-w,420px)*0.045);}
.wb-status-bar .bat-icon{width:calc(var(--phone-w,420px)*0.062);height:calc(var(--phone-w,420px)*0.034);}

.wb-topbar{flex-shrink:0;min-height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;position:relative;z-index:5;}
.wb-title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;color:var(--wb-ink);pointer-events:none;}
.wb-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:var(--wb-orange);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  transition:transform .1s,background .15s;box-shadow:0 3px 10px -4px rgba(200,110,20,.42);}
.wb-icon-btn:active{transform:scale(.9);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.wb-icon-btn-plus{width:34px;height:34px;}
.wb-icon-btn-plus svg{width:19px;height:19px;stroke-width:2.4;}
.wb-top-actions{margin-left:auto;display:flex;gap:8px;}

.wb-body{flex:1;overflow-y:auto;position:relative;z-index:2;-webkit-overflow-scrolling:touch;}
.wb-body::-webkit-scrollbar{width:0;}

.wb-segment{display:flex;justify-content:center;gap:24px;padding:6px 0 10px;}
.wb-seg{border:none;background:none;font-family:inherit;font-size:14px;color:var(--wb-ink-soft);cursor:pointer;padding:4px 2px;position:relative;}
.wb-seg.active{color:var(--wb-ink);font-weight:700;}
.wb-seg.active::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--wb-orange);}

.wb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;background:linear-gradient(135deg,#ffc285,#ff8200);}
.wb-avatar img{width:100%;height:100%;object-fit:cover;}

.wb-post{position:relative;background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:12px 13px;margin:0 12px 10px;
  box-shadow:0 4px 16px -10px rgba(190,110,40,.35);}
.wb-post-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.wb-post.is-mine .wb-post-head{padding-right:54px;}
.wb-post-meta{flex:1;min-width:0;}
.wb-post-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;}
.wb-vip{width:14px;height:14px;border-radius:50%;background:var(--wb-orange);color:#fff;font-size:9px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.wb-vip.v-yellow{background:linear-gradient(135deg,#ffd34d,#eaa600);}
.wb-vip.v-gold{background:linear-gradient(135deg,#ffe9a3,#d99b16);}
.wb-post-time{font-size:11px;color:var(--wb-ink-soft);margin-top:2px;}
.wb-post-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;}
.wb-post-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.wb-post-img{aspect-ratio:1;overflow:hidden;background:#ffe4cc;}
.wb-post-img img{width:100%;height:100%;object-fit:cover;}
.wb-post-actions{display:flex;gap:8px;}
.wb-act{flex:1;border:none;background:rgba(255,255,255,.5);border-radius:9px;padding:6px 0;font-size:12px;
  color:var(--wb-ink-soft);font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s,transform .1s;}
.wb-act:active{transform:scale(.96);}
.wb-act.liked{color:var(--wb-orange-deep);background:rgba(255,140,60,.14);}
.wb-act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-act.liked svg{fill:currentColor;}
.wb-own{width:24px;height:24px;border:none;border-radius:7px;
  background:none;color:var(--wb-ink-soft);display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;transition:background .15s,transform .1s,color .15s;}
.wb-own:active{transform:scale(.92);background:rgba(255,140,60,.16);color:var(--wb-orange-deep);}
.wb-own.del:active{background:rgba(214,84,58,.18);color:#c9553f;}
.wb-own svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-post-own{position:absolute;top:8px;right:9px;display:flex;gap:4px;z-index:2;}
.wb-post-quote-head svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}

.wb-me-cover{position:relative;height:152px;flex-shrink:0;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#ff8f2e 0%,#ffa552 28%,#ffc183 58%,#ffdcbb 82%,#fff4e8 100%);
  background-size:cover;background-position:center;transition:background .2s;}
.wb-me-cover.has-img::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(60,25,5,.16),rgba(60,25,5,.34));}
.wb-me-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;
  background:linear-gradient(180deg,transparent,rgba(255,249,243,.9));pointer-events:none;}
.wb-cover-back{position:absolute;left:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,background .15s;}
.wb-cover-back:active{transform:scale(.92);background:rgba(255,255,255,.42);}
.wb-cover-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-acts{position:absolute;right:12px;top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.125);display:flex;gap:10px;z-index:3;}
.wb-cover-btn{width:32px;height:32px;border-radius:50%;border:none;
  background:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--wb-orange);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:0 4px 14px -6px rgba(120,60,10,.55);transition:transform .12s,background .15s,color .15s;}
.wb-cover-btn:active{transform:scale(.92);background:#fff4e8;color:var(--wb-orange-deep);}
.wb-cover-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-cover-plus{width:34px;height:34px;}
.wb-cover-plus svg{width:19px;height:19px;stroke-width:2.4;}

.wb-me-main{position:relative;padding:0 15px;margin-top:-44px;z-index:2;}
.wb-me-head{display:flex;align-items:flex-end;gap:12px;}
.wb-me-avatar{width:78px;height:78px;font-size:28px;border:3px solid #fff;flex-shrink:0;
  box-shadow:0 6px 18px -8px rgba(190,110,40,.55);}
.wb-me-headinfo{flex:1;min-width:0;padding-bottom:6px;}
.wb-me-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.35;}
.wb-me-stats{display:flex;align-items:baseline;gap:22px;margin-top:16px;}
.wb-me-stat{display:flex;align-items:baseline;gap:5px;}
.wb-me-stat b{font-size:17px;font-weight:700;color:var(--wb-ink);}
.wb-me-stat span{font-size:12px;color:var(--wb-ink-soft);}
.wb-me-bio-row{display:flex;align-items:flex-start;gap:10px;margin-top:12px;}
.wb-me-bio{flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--wb-ink-soft);word-break:break-word;}
.wb-me-edit{flex-shrink:0;align-self:flex-end;margin-bottom:8px;width:30px;height:30px;padding:0;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--wb-orange-deep);
  font-family:inherit;cursor:pointer;transition:transform .12s,background .15s;}
.wb-me-edit:active{transform:scale(.92);background:rgba(255,140,60,.12);}
.wb-me-tabs{display:flex;align-items:center;margin:14px -15px 0;padding:0 6px;
  border-top:1px solid var(--wb-line);}
.wb-me-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 0 10px;
  background:none;border:none;font-family:inherit;font-size:13px;color:var(--wb-ink-soft);
  cursor:pointer;position:relative;transition:color .15s;}
.wb-me-tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.wb-me-tab.on{color:var(--wb-ink);font-weight:700;}
.wb-me-tab.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;border-radius:2px;background:var(--wb-orange);}
.wb-me-panel{padding:10px 0 0;}
.wb-me-empty{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:40px 20px 34px;color:var(--wb-ink-soft);font-size:12.5px;}
.wb-me-empty svg{width:38px;height:38px;fill:none;stroke:rgba(255,168,110,.62);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-me-edit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.wb-avatar-switchable{cursor:pointer;transition:transform .12s;}
.wb-avatar-switchable:active{transform:scale(.96);}
.wb-app.wb-me-mode .wb-topbar{display:none;}
.wb-app.wb-me-mode .wb-status-bar{position:absolute;left:0;right:0;top:0;z-index:6;background:none;
  padding-top:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.055);
  color:#fff;text-shadow:0 1px 4px rgba(70,30,10,.5);}
.wb-app.wb-me-mode .wb-status-bar .bat-icon rect:nth-child(2){fill:rgba(255,255,255,.92);}

.wb-card{background:var(--wb-card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);border-radius:14px;margin:0 12px 10px;overflow:hidden;
  box-shadow:0 4px 16px -12px rgba(190,110,40,.4);}

.wb-search{display:flex;align-items:center;gap:8px;margin:4px 12px 12px;padding:9px 13px;
  background:rgba(255,255,255,.78);border-radius:20px;border:1px solid rgba(255,255,255,.8);}
.wb-search-ico{font-size:14px;opacity:.7;}
.wb-search input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:13.5px;color:var(--wb-ink);min-width:0;}
.wb-search input::placeholder{color:var(--wb-ink-soft);}
.wb-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 8px;font-size:14px;font-weight:700;}
.wb-hot-time{font-size:11px;color:var(--wb-orange-deep);font-weight:500;background:rgba(255,140,60,.12);padding:2px 8px;border-radius:9px;}
.wb-hot-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
.wb-hot-row:active{background:rgba(255,200,160,.18);}
.wb-hot-rank{width:18px;font-size:12px;font-weight:700;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-hot-rank.top{color:var(--wb-orange-deep);}
.wb-hot-tag{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-hot-heat{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-topics{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 14px;}
.wb-topic{font-size:12px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.8);
  border:1px solid var(--wb-line);color:var(--wb-orange-deep);cursor:pointer;}
.wb-topic:active{transform:scale(.96);}

.wb-chat-row{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;}
.wb-chat-row:active{background:rgba(255,200,160,.18);}
.wb-chat-row+.wb-chat-row{border-top:1px solid var(--wb-line);}
.wb-chat-avatar{width:44px;height:44px;font-size:17px;}
.wb-chat-info{flex:1;min-width:0;}
.wb-chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.wb-chat-name{font-size:14.5px;font-weight:600;}
.wb-chat-time{font-size:11px;color:var(--wb-ink-soft);flex-shrink:0;}
.wb-chat-preview{font-size:12.5px;color:var(--wb-ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wb-orange);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.wb-end{text-align:center;font-size:11px;color:var(--wb-ink-soft);padding:10px 0 18px;}

.wb-tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.72);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.7);
  padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);position:relative;z-index:5;}
.wb-tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 0;cursor:pointer;color:var(--wb-ink-soft);font-family:inherit;transition:color .15s;}
.wb-tab-ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.62;
  transition:transform .18s,opacity .18s;}
.wb-tab-label{font-size:10.5px;font-weight:500;}
.wb-tab.active{color:var(--wb-orange-deep);}
.wb-tab.active .wb-tab-ico{opacity:1;transform:translateY(-1px);}
.wb-tab.active .wb-tab-label{font-weight:700;}

.wb-sheet-mask{position:absolute;inset:0;z-index:30;background:rgba(60,35,15,.28);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;animation:wbFade .18s ease;}
.wb-sheet{width:100%;max-height:88%;overflow-y:auto;background:rgba(255,252,248,.97);border-radius:18px 18px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;animation:wbUp .25s cubic-bezier(.32,.72,0,1);}
.wb-sheet-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;}
.wb-sheet-cancel,.wb-sheet-send{border:none;font-family:inherit;font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;}
.wb-sheet-cancel{background:rgba(0,0,0,.05);color:var(--wb-ink-soft);}
.wb-sheet-send{background:var(--wb-orange);color:#fff;font-weight:600;}
.wb-sheet-text{width:100%;height:120px;border:1px solid var(--wb-line);border-radius:12px;padding:10px 12px;
  font-family:inherit;font-size:14px;line-height:1.6;color:var(--wb-ink);background:#fff;outline:none;resize:none;}
.wb-sheet-text:focus{border-color:var(--wb-orange);}

.wb-compose-mask{position:absolute;inset:0;z-index:30;background:rgba(60,35,15,.3);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;opacity:0;transition:opacity .2s ease;}
.wb-compose-mask.show{opacity:1;}
.wb-compose{width:100%;background:rgba(255,252,248,.98);border-radius:18px 18px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;
  transform:translateY(24px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
.wb-compose-mask.show .wb-compose{transform:translateY(0);}
.wb-compose-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;}
.wb-compose-cancel,.wb-compose-send{border:none;font-family:inherit;font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;}
.wb-compose-cancel{background:rgba(0,0,0,.05);color:var(--wb-ink-soft);}
.wb-compose-send{background:var(--wb-orange);color:#fff;font-weight:600;}
.wb-compose-body{display:flex;gap:10px;align-items:flex-start;}
.wb-compose-body .wb-avatar{width:36px;height:36px;font-size:14px;}
.wb-compose{position:relative;overflow:hidden;}
.wb-compose>*{position:relative;z-index:2;}
.wb-compose-bg{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;
  background-repeat:no-repeat;opacity:0;transition:opacity .2s;pointer-events:none;}
.wb-compose.has-bg .wb-compose-bg{opacity:1;}
.wb-compose.has-bg::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(255,252,248,.72);
  pointer-events:none;}
.wb-compose-field textarea{position:relative;z-index:2;width:100%;height:110px;border:none;background:none;
  outline:none;resize:none;font-family:inherit;font-size:14px;line-height:1.6;padding:0;margin:0;
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--wb-ink);overflow-y:auto;}
.wb-compose-field textarea::placeholder{color:var(--wb-ink-soft);-webkit-text-fill-color:var(--wb-ink-soft);}
.wb-compose-tools{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--wb-line);}
.wb-tool{width:30px;height:30px;border:none;border-radius:9px;background:rgba(255,255,255,.8);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wb-tool:active{transform:scale(.94);}
.wb-tool svg{width:18px;height:18px;fill:none;stroke:var(--wb-orange-deep);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.wb-tool.bg-on{background:rgba(255,140,60,.18);}
.wb-tool.diamond{margin-right:2px;}
.wb-tool.diamond svg{stroke:#4aa3ff;}
.wb-compose-count{margin-left:auto;font-size:11px;color:var(--wb-ink-soft);}
.wb-compose-field{min-width:0;position:relative;}
.wb-compose-body .wb-compose-field{flex:1;}
.wb-compose-mirror{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
  font-family:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  color:var(--wb-ink);}
.wb-hl{color:#2f80ed;}
.wb-compose-imgs{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;}
.wb-compose-imgs.show{display:grid;}
.wb-compose-img{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#ffe4cc;}
.wb-compose-img img{width:100%;height:100%;object-fit:cover;display:block;}
.wb-compose-img-del{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;display:flex;
  align-items:center;justify-content:center;cursor:pointer;}
.wb-compose-imgs .wb-compose-add{aspect-ratio:1;border-radius:9px;border:1px dashed rgba(255,168,110,.75);

  const ACCOUNT_FIELDS = ['name','avatar','bio','verify','persona','cover'];

  const ICON = {

  };

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const hlHtml = s => esc(s).replace(/([#@])([^\s@<]+)/g, m => `<span class="wb-hl">${m}</span>`);

  function avatarHtml(name, src, cls){
    const letter = esc(String(name || '我').charAt(0));
    if(src) return `<div class="wb-avatar ${cls || ''}"><img src="${esc(src)}" alt=""></div>`;
    return `<div class="wb-avatar ${cls || ''}">${letter}</div>`;
  }

  function createStore(Phone){
    const KEY = 'weibo_data';
    let data = null;
    const blankAccount = id => ({ id, name:'', avatar:'', bio:'', verify:'none', persona:null, cover:'' });
    const defaults = () => ({
      v: 5,
      profile:{ following:6, followers:0, posts:0, name:'', avatar:'', bio:'记录生活，也记录你。', verify:'none', persona:null, cover:'' },
      accounts:[ blankAccount('a1') ],
      activeId:'a1',
      feed: DEFAULT_FEED.map(p => Object.assign({}, p, { imgs:(p.imgs || []).slice() })),
      recommend: RECOMMEND_POOL.map(p => Object.assign({}, p, { imgs:(p.imgs || []).slice() })),
      chats: DEFAULT_CHATS.map(c => Object.assign({}, c)),
      superTopics: SUPER_TOPICS.map(t => Object.assign({}, t))
    });
    function get(){
      if(data) return data;
      let saved = null;
      try{
        saved = (Phone && Phone.getData) ? Phone.getData('weibo') : JSON.parse(localStorage.getItem(KEY) || 'null');
      }catch(e){ saved = null; }
      if(saved && !Array.isArray(saved.feed)) saved = null;
      data = Object.assign(defaults(), saved || {});
      if(!Array.isArray(data.feed) || !data.feed.length) data.feed = defaults().feed;
      if(!Array.isArray(data.chats) || !data.chats.length) data.chats = defaults().chats;
      if(!Array.isArray(data.superTopics) || !data.superTopics.length) data.superTopics = defaults().superTopics;
      if(!data.v || data.v < 3){
        const base = defaults().profile;
        const old = data.profile || {};
        data.profile = Object.assign(base, {
          name: old.name || '',
          avatar: old.avatar || '',
          bio: old.bio || base.bio,
          verify: old.verify || 'none'
        });
        data.v = 3;
      }
      data.profile = Object.assign(defaults().profile, data.profile || {});
      if(!Array.isArray(data.accounts) || !data.accounts.length){
        const a = blankAccount('a1');
        ACCOUNT_FIELDS.forEach(k => { a[k] = data.profile[k]; });
        data.accounts = [a];
      }
      if(!data.activeId || !data.accounts.some(a => a.id === data.activeId)) data.activeId = data.accounts[0].id;
      data.feed.forEach(x => { if(x.mine && !x.owner) x.owner = data.accounts[0].id; });
      if(!data.v || data.v < 5){
        data.feed.forEach(x => { if(MEMBER_NAMES[x.name]) x.name = MEMBER_NAMES[x.name]; });
        data.chats.forEach(c => { if(MEMBER_NAMES[c.name]) c.name = MEMBER_NAMES[c.name]; });
        OFFICIAL_POSTS.forEach(op => {
          if(!data.feed.some(x => x.id === op.id)) data.feed.unshift(Object.assign({}, op, { imgs:(op.imgs || []).slice() }));
        });
        if(!data.profile.following) data.profile.following = 6;
      }
      if(!Array.isArray(data.recommend) || !data.recommend.length){
        data.recommend = RECOMMEND_POOL.map(p => Object.assign({}, p, { imgs:(p.imgs || []).slice() }));
      }
      data.v = 5;
      return data;
    }
    function save(){
      if(!data) return;
      if(Phone && Phone.setData) Phone.setData('weibo', data);
      else { try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
    }
    return { get, save };
  }

  function postHtml(p, me){
    const own = (p.mine && (!p.owner || !me || p.owner === me.id)) ? me : null;
    const name = own ? own.name : p.name;
    const avatar = own ? own.avatar : p.avatar;
    const vKey = own ? (own.verify || 'none') : (p.vip ? 'orange' : 'none');
    const vipCls = vKey === 'yellow' ? ' v-yellow' : (vKey === 'gold' ? ' v-gold' : '');
    const imgs = (p.imgs && p.imgs.length)
      ? `<div class="wb-post-imgs">${p.imgs.map(src => `<div class="wb-post-img"><img src="${esc(src)}" alt=""></div>`).join('')}</div>`
      : '';
    const q = p.quote;
    const quoteHtml = q
      ? `<div class="wb-post-quote">
          <div class="wb-post-quote-head">${ICON.repost}<span>@${esc(q.name)}</span></div>
          <div class="wb-post-quote-text">${hlHtml(q.text || '')}</div>
          ${(q.imgs && q.imgs.length) ? `<div class="wb-post-quote-imgs">${q.imgs.map(src => `<div class="wb-post-img"><img src="${esc(src)}" alt=""></div>`).join('')}</div>` : ''}
        </div>`
      : '';
    const ownBtns = own
      ? `<div class="wb-post-own">
          <button class="wb-own" data-own="edit" type="button" aria-label="编辑">${ICON.edit}</button>
          <button class="wb-own del" data-own="del" type="button" aria-label="删除">${ICON.trash}</button>
        </div>`
      : '';
    return `<div class="wb-post${own ? ' is-mine' : ''}" data-id="${esc(p.id)}">
      ${ownBtns}
      <div class="wb-post-head">
        ${avatarHtml(name, avatar)}
        <div class="wb-post-meta">
          <div class="wb-post-name">${esc(name)}${vKey === 'none' ? '' : `<span class="wb-vip${vipCls}">V</span>`}</div>
          <div class="wb-post-time">${esc(p.time)} · 来自 iPhone</div>
        </div>
      </div>
      <div class="wb-post-text">${hlHtml(p.text)}</div>
      ${imgs}
      ${quoteHtml}
      <div class="wb-post-actions">
        <button class="wb-act" data-act="repost">${ICON.repost}<span>${p.reposts || ''}</span></button>
        <button class="wb-act" data-act="comment">${ICON.comment}<span>${p.comments || ''}</span></button>
        <button class="wb-act ${p.liked ? 'liked' : ''}" data-act="like">${ICON.heart}<span>${p.likes || 0}</span></button>
      </div>
    </div>`;
  }

  function initStatusBar(app){
    const timeEl = app.querySelector('#wbStatusTime');
    const iconsEl = app.querySelector('#wbStatusIcons');
    const SIG = '<svg class="sig-icon" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2.4" height="4" rx="0.6"/><rect x="3.4" y="6" width="2.4" height="6" rx="0.6"/><rect x="6.8" y="4" width="2.4" height="8" rx="0.6"/><rect x="10.2" y="2" width="2.4" height="10" rx="0.6"/><rect x="13.6" y="0" width="2.4" height="12" rx="0.6"/></svg>';
    const WIFI = '<svg class="wifi-icon" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.5a10 10 0 0114 0"/><path d="M3.2 7a6 6 0 019.6 0"/><path d="M5.6 9.2a2.5 2.5 0 014.8 0"/><circle cx="8" cy="11" r="0.7" fill="currentColor" stroke="none"/></svg>';
    const BAT = '<svg class="bat-icon" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="currentColor"/><rect x="21.2" y="4" width="1.8" height="4" rx="0.6" fill="currentColor"/></svg>';
    const tick = () => {
      const d = new Date();
      if(timeEl) timeEl.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    tick();
    const timer = setInterval(() => {
      if(!app.isConnected){ clearInterval(timer); return; }
      tick();
    }, 30000);
    if(iconsEl) iconsEl.innerHTML = SIG + WIFI + BAT;
  }

  window.mountWeiboApp = function(container, Phone, onClose){
    const app = (container && container.querySelector && container.querySelector('#wbApp')) || document.getElementById('wbApp');
    if(!app) return;
    const body = app.querySelector('#wbBody');
    const titleEl = app.querySelector('#wbTopTitle');
    const tabs = Array.from(app.querySelectorAll('.wb-tab'));
    const store = createStore(Phone);
    const rawSave = store.save;
    store.save = function(){
      const d = store.get();
      const acc = (d.accounts || []).find(a => a.id === d.activeId);
      if(acc) ACCOUNT_FIELDS.forEach(k => { acc[k] = d.profile[k]; });
      rawSave();
    };
    let currentTab = 'me';
    let homeFilter = 'recommend';
    let meTab = 'posts';

    initStatusBar(app);

    function toast(msg){
      if(Phone && Phone.toast) Phone.toast(msg);
      else {
        const t = document.createElement('div');
        t.className = 'wb-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1600);
      }
    }
    function meChar(){
      try{ return (Phone && Phone.getCurrentChar) ? Phone.getCurrentChar() : null; }catch(e){ return null; }
    }

    app.querySelector('#wbBackBtn').onclick = () => { if(typeof onClose === 'function') onClose(); };
    if(typeof onClose !== 'function') app.querySelector('#wbBackBtn').style.visibility = 'hidden';
    app.querySelector('#wbComposeBtn').onclick = () => openCompose();
    tabs.forEach(t => { t.onclick = () => switchTab(t.dataset.tab); });

    function switchTab(tab){
      currentTab = tab;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      titleEl.textContent = TAB_TITLES[tab] || '微博';
      app.classList.toggle('wb-me-mode', tab === 'me');
      render();
    }

    function render(){
      body.scrollTop = 0;
      if(currentTab === 'home') renderHome();
      else if(currentTab === 'discover') renderDiscover();
      else if(currentTab === 'chat') renderChats();
      else renderMe();
    }

    function bindOwnActions(el, post, refresh){
      const editBtn = el.querySelector('[data-own="edit"]');
      if(editBtn) editBtn.onclick = () => openCompose(post);
      const delBtn = el.querySelector('[data-own="del"]');
      if(delBtn) delBtn.onclick = () => {
        if(delBtn.dataset.confirm !== '1'){
          delBtn.dataset.confirm = '1';
          toast('再点一次删除');
          setTimeout(() => { delBtn.dataset.confirm = ''; }, 2500);
          return;
        }
        const dd = store.get();
        const idx = dd.feed.findIndex(x => x.id === post.id);
        if(idx >= 0) dd.feed.splice(idx, 1);
        dd.profile.posts = Math.max(0, (parseInt(dd.profile.posts, 10) || 0) - 1);
        store.save();
        toast('微博已删除');
        refresh();
      };
    }

    function meInfo(d){
      const char = meChar();
      const p = d.profile || {};
      return {
        id: d.activeId,
        name: (p.name || '').trim() || ((char && char.name) || '我'),
        avatar: p.avatar || (char && char.avatar) || '',
        verify: VERIFY[p.verify] ? p.verify : 'none'
      };
    }

    function findPost(d, id){
      return d.feed.find(x => x.id === id) || (d.recommend || []).find(x => x.id === id) || null;
    }

    function shuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function isFollowed(p){
      return !!p.mine || !!p.official || !!p.following || FOLLOWED_NAMES.has(p.name);
    }

    function recommendList(d){
      const pool = (d.recommend && d.recommend.length) ? d.recommend : RECOMMEND_POOL;
      return shuffle(pool).slice(0, 7);
    }

    function renderHome(){
      const d = store.get();
      const me = meInfo(d);
      const list = homeFilter === 'follow' ? d.feed.filter(isFollowed) : recommendList(d);
      body.innerHTML = `
        <div class="wb-segment">
          <button class="wb-seg ${homeFilter === 'follow' ? 'active' : ''}" data-filter="follow">关注</button>
          <button class="wb-seg ${homeFilter === 'recommend' ? 'active' : ''}" data-filter="recommend">推荐</button>
        </div>
        ${list.length
          ? list.map(x => postHtml(x, me)).join('') + '<div class="wb-end">已经到底啦 ~</div>'
          : `<div class="wb-end">${homeFilter === 'follow' ? '还没有关注的微博' : '暂时没有推荐内容'}</div>`}`;
      body.querySelectorAll('.wb-seg').forEach(b => {
        b.onclick = () => { homeFilter = b.dataset.filter; renderHome(); };
      });
      body.querySelectorAll('.wb-post').forEach(el => {
        const post = findPost(d, el.dataset.id);
        if(!post) return;
        el.querySelectorAll('.wb-act').forEach(btn => {
          btn.onclick = () => {
            const act = btn.dataset.act;
            if(act === 'like'){
              post.liked = !post.liked;
              post.likes += post.liked ? 1 : -1;
              store.save();
              btn.classList.toggle('liked', post.liked);
              btn.innerHTML = `${ICON.heart}<span>${post.likes}</span>`;
            } else if(act === 'comment'){
              toast('评论功能开发中');
            } else {
              openRepostSheet(post);
            }
          };
        });
        bindOwnActions(el, post, renderHome);
      });
    }

    function renderDiscover(){
      body.innerHTML = `
        <div class="wb-search">
          <span class="wb-search-ico">🔍</span>
          <input id="wbSearchInput" placeholder="搜索微博、用户、话题">

      const input = body.querySelector('#wbSearchInput');

        if(e.key === 'Enter' && input.value.trim()) toast(`正在搜索「${input.value.trim()}」`);

      body.querySelectorAll('.wb-hot-row').forEach(row => {

              <div class="wb-chat-info">
                <div class="wb-chat-top"><span class="wb-chat-name">${esc(c.name)}</span><span class="wb-chat-time">${esc(c.time)}</span></div>
                <div class="wb-chat-preview">${esc(c.preview)}</div>
              </div>
              ${c.unread ? `<span class="wb-badge">${esc(c.unread)}</span>` : ''}
            </div>`).join('')}
        </div>
        <div class="wb-end">私信 · 和喜欢的人聊聊天</div>`;
      body.querySelectorAll('.wb-chat-row').forEach(row => {
        row.onclick = () => toast('私信对话开发中');
      });
    }

    function renderMe(){
      const keepTop = body.scrollTop;
      const char = meChar();
      const d = store.get();
      const p = d.profile;
      const charName = (char && char.name) || '我';
      const charAvatar = (char && char.avatar) || '';
      const name = (p.name || '').trim() || charName;
      const avatar = p.avatar || charAvatar;
      const bio = (p.bio || '').trim();
      const vKey = VERIFY[p.verify] ? p.verify : 'none';
      const vipCls = vKey === 'yellow' ? ' v-yellow' : (vKey === 'gold' ? ' v-gold' : '');
      const coverVal = p.cover || '';
      const coverIsImg = coverVal.indexOf('data:') === 0;
      const coverCss = (!coverIsImg && coverVal) ? (COVERS[parseInt(coverVal.slice(2), 10)] || COVERS[0]).css : '';
      const coverAttr = coverIsImg ? ` style="background-image:url('${esc(coverVal)}')"` : (coverCss ? ` style="background:${coverCss}"` : '');
      const mine = d.feed.filter(x => x.mine && x.owner === d.activeId);
      const zzp = mine.reduce((a, x) => a + (x.likes || 0) + (x.comments || 0) + (x.reposts || 0), 0);
      const backBtn = typeof onClose === 'function'
        ? `<button class="wb-cover-back" id="wbMeBack" type="button" aria-label="返回"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>`

      body.innerHTML = `

            <button class="wb-cover-btn wb-cover-plus" id="wbMePlus" type="button" aria-label="发微博">

              <div class="wb-me-name">${esc(name)}${vKey === 'none' ? '' : `<span class="wb-vip${vipCls}">V</span>`}</div>

              <svg viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L7.6 18.3l-3.6.8.8-3.6z"/></svg>

    function renderMePanel(mine){
      const panel = body.querySelector('#wbMePanel');
      if(!panel) return;
      if(meTab === 'album'){
        const imgs = [];
        mine.forEach(x => (x.imgs || []).forEach(src => imgs.push(src)));
        if(!imgs.length){
          panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><rect x="3.2" y="3.6" width="17.6" height="16.8" rx="2.4"/><circle cx="8.8" cy="9.2" r="1.8"/><path d="M20.8 15.2l-4.2-4.2a1.9 1.9 0 0 0-2.7 0L6.4 19.6"/></svg>', '还没有照片，发微博时带上图片吧');
          return;
        }
        panel.innerHTML = `<div class="wb-post-imgs" style="margin:0 12px 10px;">${imgs.map(src => `<div class="wb-post-img"><img src="${esc(src)}" alt=""></div>`).join('')}</div>`;
        return;
      }
      if(meTab === 'draft'){
        panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><path d="M3.6 6.2h5.2l1.9 2.6h9.7v10.4H3.6z"/><path d="M3.6 9.6h16.8"/></svg>', '草稿箱是空的');
        return;
      }
      const list = meTab === 'likes' ? store.get().feed.filter(x => x.liked) : mine;
      if(!list.length){
        panel.innerHTML = meTab === 'likes'
          ? meEmpty('<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>', '还没有赞过任何微博')
          : meEmpty('<svg viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2.2"/><path d="M8 8.6h8M8 12.6h8M8 16.6h4.6"/></svg>', '还没有发过微博，点右上角 + 试试');
        return;
      }
      const d = store.get();
      panel.innerHTML = list.map(x => postHtml(x, meInfo(d))).join('');
      panel.querySelectorAll('.wb-post').forEach(el => {
        const post = d.feed.find(x => x.id === el.dataset.id);
        if(!post) return;
        el.querySelectorAll('.wb-act').forEach(btn => {
          btn.onclick = () => {
            const act = btn.dataset.act;
            if(act === 'like'){
              post.liked = !post.liked;
              post.likes = Math.max(0, (post.likes || 0) + (post.liked ? 1 : -1));
              store.save();
              renderMe();
            } else if(act === 'comment'){
              toast('评论功能开发中');
            } else {
              openRepostSheet(post);
            }
          };
        });
        bindOwnActions(el, post, renderMe);
      });
    }

    function toDataUrl(file){
      if(Phone && Phone.fileToBase64) return Phone.fileToBase64(file);
      return new Promise((res, rej) => {
        const rd = new FileReader();
        rd.onload = () => res(rd.result);
        rd.onerror = rej;
        rd.readAsDataURL(file);
      });
    }

    function loadAccount(id){
      const d = store.get();

      if(!acc) return false;

      d.activeId = id;
      ACCOUNT_FIELDS.forEach(k => { d.profile[k] = acc[k]; });
      store.save();
      return true;
    }

    function deleteAccount(id){
      const d = store.get();
      if((d.accounts || []).length <= 1){ toast('至少保留一个账号'); return; }
      const idx = d.accounts.findIndex(a => a.id === id);
      if(idx < 0) return;
      const wasActive = d.activeId === id;
      d.accounts.splice(idx, 1);
      if(wasActive){
        d.activeId = d.accounts[0].id;
        ACCOUNT_FIELDS.forEach(k => { d.profile[k] = d.accounts[0][k]; });
      }
      store.save();
      meTab = 'posts';
      renderMe();
      toast('账号已注销');
    }

    function wrapCanvasText(ctx, text, cx, cy, lineHeight, maxLines, maxWidth){
      const lines = [];
      let line = '';
      for(const ch of text.split('')){
        const test = line + ch;
        if(ctx.measureText(test).width > maxWidth && line){
          lines.push(line);
          line = ch;
          if(lines.length >= maxLines) break;
        } else line = test;
      }
      if(lines.length < maxLines && line) lines.push(line);
      const startY = cy - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
    }

        </div>`);
      const ta = s.mask.querySelector('#wbTxtInput');

        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = curFg;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        wrapCanvasText(ctx, text, 200, 200, 34, 9, 340);
        s.close();
        onDone({ type:'text', src: cv.toDataURL('image/jpeg', 0.85), text, bg: curBg });
      };
    }

    function openSuperTopicSheet(onPick){
      const list = store.get().superTopics || [];
      const s = openSheet(`
        <div class="wb-sheet-head"><span>我关注的超话</span></div>
        <div class="wb-sheet-list">
          ${list.map((t, i) => `
            <div class="wb-sheet-row" data-idx="${i}">
              <div class="wb-topic-ico">${ICON.diamond}</div>
              <div class="wb-sheet-row-name">${esc(t.name)}</div>
              <div class="wb-sheet-row-meta">${esc(t.meta || '')}</div>
            </div>`).join('')}
        </div>
        <div class="wb-sheet-item danger" data-cancel="1">取消</div>`);
      s.mask.querySelectorAll('.wb-sheet-row').forEach(row => {
        row.onclick = () => {
          const t = list[parseInt(row.dataset.idx, 10)];
          s.close();
          if(t) onPick(t.name);
        };
      });
      s.mask.querySelector('[data-cancel]').onclick = s.close;
    }

    function openRepostSheet(post){
      const char = meChar();
      const p = store.get().profile;
      const name = (p.name || '').trim() || ((char && char.name) || '我');
      const avatar = p.avatar || (char && char.avatar) || '';
      const hasVip = VERIFY[p.verify] ? p.verify !== 'none' : false;
      const isOwn = post.mine && (!post.owner || post.owner === store.get().activeId);
      const targetName = isOwn ? name : post.name;
      let repostImgs = [];
      let withComment = false;
      const s = openSheet(`
        <div class="wb-sheet-head">
          <button class="wb-sheet-cancel" type="button">取消</button>
          <span>转发微博</span>
          <button class="wb-sheet-send" type="button" id="wbRepostSend">转发</button>
        </div>
        <div class="wb-sheet-quote">
          ${avatarHtml(targetName, isOwn ? avatar : post.avatar)}
          <div class="wb-sheet-quote-main">
            <div class="wb-sheet-quote-name">@${esc(targetName)}</div>
            <div class="wb-sheet-quote-text">${hlHtml(post.text)}</div>
          </div>
        </div>
        <div class="wb-compose-field">
          <div class="wb-compose-mirror" id="wbRepostMirror"></div>
          <textarea id="wbRepostText" maxlength="140" placeholder="说点什么……"></textarea>
        </div>
        <div class="wb-compose-imgs" id="wbRepostImgs"></div>
        <div class="wb-sheet-foot">
          <button class="wb-tool" data-tool="img" type="button" aria-label="图片">${ICON.img}</button>
          <label class="wb-check" id="wbRepostCheck">
            <span class="wb-check-box"><svg viewBox="0 0 24 24"><polyline points="3 12.5 9 18 21 4"/></svg></span>
            <span>同时评论</span>
          </label>
        </div>
        <input type="file" accept="image/*" id="wbRepostFile" style="display:none">`);
      const ta = s.mask.querySelector('#wbRepostText');
      const mirror = s.mask.querySelector('#wbRepostMirror');
      const imgsBox = s.mask.querySelector('#wbRepostImgs');
      const fileEl = s.mask.querySelector('#wbRepostFile');
      const syncMirror = () => {
        mirror.innerHTML = hlHtml(ta.value) + '\n';
        mirror.scrollTop = ta.scrollTop;
      };
      const renderImgs = () => {
        imgsBox.classList.toggle('show', repostImgs.length > 0);
        imgsBox.innerHTML = repostImgs.map((img, i) => `
          <div class="wb-compose-img">
            <img src="${esc(img.src)}" alt="">
            <span class="wb-compose-img-del" data-del="${i}">×</span>
          </div>`).join('');
        imgsBox.querySelectorAll('.wb-compose-img-del').forEach(del => {
          del.onclick = () => {
            repostImgs.splice(parseInt(del.dataset.del, 10), 1);
            renderImgs();
          };
        });
      };
      ta.addEventListener('input', syncMirror);
      ta.addEventListener('scroll', () => { mirror.scrollTop = ta.scrollTop; });
      s.mask.querySelector('[data-tool="img"]').onclick = () => {
        openImageSourceSheet(src => {
          if(src === 'local') fileEl.click();
          else openTextImageEditor(img => {
            if(repostImgs.length >= 9){ toast('最多9张'); return; }
            repostImgs.push(img);
            renderImgs();
          });
        });
      };
      fileEl.onchange = async () => {
        const files = Array.from(fileEl.files || []);
        for(const f of files){
          if(repostImgs.length >= 9){ toast('最多9张'); break; }
          try{ repostImgs.push({ type:'image', src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        fileEl.value = '';
        renderImgs();
      };
      s.mask.querySelector('#wbRepostCheck').onclick = () => {
        withComment = !withComment;
        s.mask.querySelector('#wbRepostCheck').classList.toggle('on', withComment);
      };
      s.mask.querySelector('.wb-sheet-cancel').onclick = s.close;
      setTimeout(() => ta.focus(), 120);
      s.mask.querySelector('#wbRepostSend').onclick = () => {
        const text = ta.value.trim();
        const d = store.get();
        const now = new Date();
        post.reposts = (post.reposts || 0) + 1;
        if(withComment) post.comments = (post.comments || 0) + 1;
        d.feed.unshift({
          id: 'rp' + Date.now(),
          name,
          avatar,
          vip: hasVip,
          mine: true,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          text: text || '转发微博',
          imgs: repostImgs.map(i => i.src),
          owner: d.activeId,
          quote: { name: targetName, text: post.text, imgs: (post.imgs || []).slice() },
          likes: 0, comments: 0, reposts: 0, liked: false
        });
        store.save();
        s.close();
        toast(withComment ? '已转发并评论' : '已转发');
        if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
        else switchTab('home');
      };
    }

    function openCompose(editPost){
      const char = meChar();
      const p = store.get().profile;
      const name = (p.name || '').trim() || ((char && char.name) || '我');
      const avatar = p.avatar || (char && char.avatar) || '';
      let composeImages = editPost ? (editPost.imgs || []).map(src => ({ type:'image', src })) : [];
      let composeBg = '';
      const mask = document.createElement('div');
      mask.className = 'wb-compose-mask';
      mask.innerHTML = `
        <div class="wb-compose">
          <div class="wb-compose-bg" id="wbComposeBg"></div>
          <div class="wb-compose-head">
            <button class="wb-compose-cancel" type="button">取消</button>
            <span class="wb-compose-title">${editPost ? '编辑微博' : '发微博'}</span>
            <button class="wb-compose-send" type="button">${editPost ? '保存' : '发送'}</button>
          </div>
          <div class="wb-compose-body">
            ${avatarHtml(name, avatar)}
            <div class="wb-compose-field">
              <div class="wb-compose-mirror" id="wbComposeMirror"></div>
              <textarea id="wbComposeText" placeholder="分享新鲜事……" maxlength="280"></textarea>
            </div>
          </div>
          <div class="wb-compose-imgs" id="wbComposeImgs"></div>
          <div class="wb-compose-tools">
            <button class="wb-tool" data-tool="img" type="button" aria-label="图片">${ICON.img}</button>
            <button class="wb-tool" data-tool="topic" type="button" aria-label="话题">${ICON.topic}</button>
            <button class="wb-tool" data-tool="at" type="button" aria-label="提到">${ICON.at}</button>
            <button class="wb-tool diamond" data-tool="super" type="button" aria-label="超话">${ICON.diamond}</button>
            <span class="wb-compose-count" id="wbComposeCount">0/280</span>
          </div>
          <input type="file" accept="image/*" id="wbComposeFile" style="display:none">
          <input type="file" accept="image/*" id="wbComposeBgFile" style="display:none">
        </div>`;
      app.appendChild(mask);
      requestAnimationFrame(() => mask.classList.add('show'));

      const panel = mask.querySelector('.wb-compose');
      const bgEl = mask.querySelector('#wbComposeBg');
      const ta = mask.querySelector('#wbComposeText');
      const mirror = mask.querySelector('#wbComposeMirror');
      const countEl = mask.querySelector('#wbComposeCount');
      const imgsBox = mask.querySelector('#wbComposeImgs');
      const fileEl = mask.querySelector('#wbComposeFile');
      const bgFileEl = mask.querySelector('#wbComposeBgFile');

      const close = () => {
        mask.classList.remove('show');
        setTimeout(() => mask.remove(), 220);
      };

      const syncMirror = () => {
        mirror.innerHTML = hlHtml(ta.value) + '\n';
        mirror.scrollTop = ta.scrollTop;
        countEl.textContent = `${ta.value.length}/280`;
      };

      const insertText = str => {
        const s = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
        const e = ta.selectionEnd == null ? s : ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + str + ta.value.slice(e);
        ta.selectionStart = ta.selectionEnd = s + str.length;
        ta.focus();
        syncMirror();
      };

      const renderImgs = () => {
        imgsBox.classList.toggle('show', composeImages.length > 0);
        imgsBox.innerHTML = composeImages.map((img, i) => `
          <div class="wb-compose-img">
            <img src="${esc(img.src)}" alt="">
            <span class="wb-compose-img-del" data-del="${i}">×</span>
          </div>`).join('');
        imgsBox.querySelectorAll('.wb-compose-img-del').forEach(del => {
          del.onclick = () => {
            composeImages.splice(parseInt(del.dataset.del, 10), 1);
            renderImgs();
          };
        });
      };

      const applyBg = () => {
        if(composeBg){
          bgEl.style.backgroundImage = `url("${composeBg}")`;
          panel.classList.add('has-bg');
        } else {
          bgEl.style.backgroundImage = '';
          panel.classList.remove('has-bg');
        }
      };

      mask.querySelector('.wb-compose-cancel').onclick = close;
      mask.onclick = e => { if(e.target === mask) close(); };
      ta.addEventListener('input', syncMirror);
      ta.addEventListener('scroll', () => { mirror.scrollTop = ta.scrollTop; });
      if(editPost){
        ta.value = editPost.text || '';
        renderImgs();
      }
      syncMirror();
      setTimeout(() => ta.focus(), 120);

      fileEl.onchange = async () => {
        const files = Array.from(fileEl.files || []);
        for(const f of files){
          if(composeImages.length >= 9){ toast('最多9张'); break; }
          try{ composeImages.push({ type:'image', src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        fileEl.value = '';
        renderImgs();
      };

      bgFileEl.onchange = async () => {
        const f = bgFileEl.files && bgFileEl.files[0];
        bgFileEl.value = '';
        if(!f) return;
        try{
          composeBg = await toDataUrl(f);
          applyBg();
          toast('背景已更换');
        }catch(e){ toast('背景读取失败'); }
      };

      mask.querySelectorAll('.wb-tool').forEach(b => {
        b.onclick = () => {
          const tool = b.dataset.tool;
          if(tool === 'img'){
            openImageSourceSheet(src => {
              if(src === 'local') fileEl.click();
              else openTextImageEditor(img => {
                if(composeImages.length >= 9){ toast('最多9张'); return; }
                composeImages.push(img);
                renderImgs();
              });
            });
          } else if(tool === 'topic'){
            insertText('#');
          } else if(tool === 'at'){
            insertText('@');
          } else if(tool === 'super'){
            openSuperTopicSheet(topicName => insertText(`#${topicName}# `));
          }
        };
      });

      mask.querySelector('.wb-compose-send').onclick = () => {
        const text = ta.value.trim();
        if(!text && !composeImages.length){ toast('说点什么吧'); return; }
        const d = store.get();
        if(editPost){
          const target = d.feed.find(x => x.id === editPost.id);
          if(target){
            target.text = text;
            target.imgs = composeImages.map(i => i.src);
          }
          store.save();
          close();
          toast('微博已更新');
          if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
          else renderHome();
          return;
        }
        const now = new Date();
        d.feed.unshift({
          id: 'my' + Date.now(),
          name,
          avatar,
          vip: VERIFY[p.verify] ? p.verify !== 'none' : false,
          mine: true,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          text,
          imgs: composeImages.map(i => i.src),
          owner: d.activeId,
          likes: 0, comments: 0, reposts: 0, liked: false
        });
        d.profile.posts = (parseInt(d.profile.posts, 10) || 0) + 1;
        store.save();
        close();
        toast('发送成功');
        if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
        else switchTab('home');
      };
    }

    switchTab('me');
  };

  function bootWeibo(){
    if(!document.body || !document.body.hasAttribute('data-wb-standalone')) return;
    if(window.mountWeiboApp) window.mountWeiboApp(document, window.Phone || null, null);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootWeibo);
  else bootWeibo();
})();
</script>
</body>
</html>
