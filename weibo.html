        <div class="wb-chat-info">
          <div class="wb-chat-top"><span class="wb-chat-name">${esc(title)}</span></div>
          <div class="wb-chat-preview">${esc(preview)}</div>
        </div>
        ${badge ? `<span class="wb-badge">${esc(badge)}</span>` : ''}
        <span class="wb-msg-arrow">›</span>
      </div>`;
    }

    function noticeSig(x){
      return [x.kind, x.name, String(x.text || '').slice(0, 60), x.postId].join('|');
    }

    function unseenList(list, d){
      const seen = new Set(Array.isArray(d.seenNotices) ? d.seenNotices : []);
      return list.filter(x => !seen.has(noticeSig(x)));
    }

    function clearAllNotices(){
      const d = store.get();
      const n = msgNotices();
      const seen = new Set(Array.isArray(d.seenNotices) ? d.seenNotices : []);
      [].concat(n.at, n.cmt, n.like).forEach(x => seen.add(noticeSig(x)));
      d.seenNotices = Array.from(seen).slice(-400);
      (d.chats || []).forEach(c => { c.unread = 0; });
      store.save();
      if(currentTab === 'chat') renderChats();
      toast('已清除全部消息提醒');

        const subText = x => cat === 'like' ? '赞了你的微博' : noticeSub(x);
        mask.innerHTML = `

    function openDmChat(chat, onBack){
      if(dmMask){ dmMask.remove(); dmMask = null; }
      const d = store.get();
      if(!d.dms || typeof d.dms !== 'object') d.dms = {};
      if(!Array.isArray(d.dms[chat.id])) d.dms[chat.id] = [];
      chat.unread = 0;
      store.save();

      const me = meInfo(d);
      const replyText = DM_REPLIES[chat.name] || '';
      const mask = document.createElement('div');
      mask.className = 'wb-dm-mask';
      mask.innerHTML = `
        <div class="wb-dm-bar">
          <button class="wb-dm-back" type="button" aria-label="返回">${DT_ICON.back}</button>

        <div class="wb-dm-body"></div>
        <div class="wb-dm-quick">
          ${['晚上好', '一起加油', '想你了', '注意休息'].map(t => `<button class="wb-dm-chip" type="button">${esc(t)}</button>`).join('')}
        </div>
        <div class="wb-dm-inputbar">
          <input class="wb-dm-input" id="wbDmInput">
          <button class="wb-dm-send" id="wbDmSend" type="button">发送</button>
        </div>`;
      mask.style.zIndex = String(overlayZ());
      app.appendChild(mask);
      dmMask = mask;

      const dmBody = mask.querySelector('.wb-dm-body');
      const input = mask.querySelector('#wbDmInput');
      let typing = false;

      const paint = () => {
        const msgs = d.dms[chat.id] || [];
        const hasFailed = msgs.some(m => m.mine && m.failed);
        const bubble = (isMe, name, avatar, text, failed) => `
          <div class="wb-dm-row${isMe ? ' me' : ''}${failed ? ' failed' : ''}">
            <div class="wb-dm-ava">${avatarHtml(name, avatar, '')}${isMe ? '' : '<span class="wb-dm-vb">V</span>'}</div>
            <div class="wb-dm-bubble${isMe ? ' me' : ''}">${esc(text)}</div>
            ${failed ? `<button class="wb-dm-retry" type="button" aria-label="重新发送">↻</button>` : ''}
          </div>`;
        dmBody.innerHTML = `
          ${msgs.map(m => m.mine
            ? bubble(true, me.name, me.avatar, m.text, m.failed)
            : bubble(false, chat.name, chat.avatar, m.text, false)).join('')}
          ${typing ? `
            <div class="wb-dm-row">
              <div class="wb-dm-ava">${avatarHtml(chat.name, chat.avatar, '')}<span class="wb-dm-vb">V</span></div>
              <div class="wb-dm-bubble wb-dm-typing"><i></i><i></i><i></i></div>
            </div>` : ''}
          ${hasFailed ? `<div class="wb-dm-tip">由于对方没有主动回复，你只能发送一条文字留言消息，需要对方关注或主动回复后才能继续发送。开通会员能发送更多留言消息</div>` : ''}`;
        dmBody.scrollTop = dmBody.scrollHeight;
      };

      const send = text => {
        const t = String(text || '').trim();
        if(!t) return;
        const msgs = d.dms[chat.id] || (d.dms[chat.id] = []);
        const sentCount = msgs.filter(m => m.mine && !m.failed).length;
        const willFail = sentCount >= 1;
        msgs.push({ mine: true, text: t, time: nowHM(), failed: willFail });
        chat.time = '刚刚';
        if(willFail){
          const lastReply = msgs.slice().reverse().find(m => !m.mine);
          chat.preview = lastReply ? lastReply.text : replyText;
          store.save();
          paint();
          return;
        }
        chat.preview = t;
        store.save();
        typing = !!replyText;
        paint();
        if(!replyText) return;
        setTimeout(() => {
          typing = false;
          msgs.push({ mine: false, text: replyText, time: nowHM() });
          chat.preview = replyText;
          store.save();
          paint();
        }, 1000);
      };

      mask.querySelector('.wb-dm-back').onclick = () => {
        mask.remove();
        if(dmMask === mask) dmMask = null;
        if(typeof onBack === 'function') onBack();
        else renderChats();

      mask.querySelectorAll('.wb-dm-retry').forEach(btn => {
        btn.onclick = () => toast('对方未关注你，无法发送');
      });
      mask.querySelector('#wbDmSend').onclick = () => { const v = input.value; input.value = ''; send(v); };
      input.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); const v = input.value; input.value = ''; send(v); }
      });
      mask.querySelectorAll('.wb-dm-chip').forEach(chip => {
        chip.onclick = () => send(chip.textContent);
      });
      paint();
    }

    function meEmpty(svg, text){
      return `<div class="wb-me-empty">${svg}<span>${text}</span></div>`;
    }

    function renderMePanel(mine){
      const panel = body.querySelector('#wbMePanel');
      if(!panel) return;
      if(meTab === 'album'){
        const imgs = [];
        mine.forEach(x => (x.imgs || []).forEach(src => imgs.push(src)));
        if(!imgs.length){
          panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><rect x="3.2" y="3.6" width="17.6" height="16.8" rx="2.4"/><circle cx="8.8" cy="9.2" r="1.8"/><path d="M20.8 15.2l-4.2-4.2a1.9 1.9 0 0 0-2.7 0L6.4 19.6"/></svg>', '还没有照片，发微博时带上图片吧');
          return;
        }
        panel.innerHTML = `<div class="wb-post-imgs" style="margin:0 12px 10px;">${imgs.map(src => `<div class="wb-post-img"><img src="${esc(imgSrc(src))}" alt=""></div>`).join('')}</div>`;
        return;
      }
      if(meTab === 'draft'){
        const drafts = store.get().drafts || [];
        if(!drafts.length){
          panel.innerHTML = meEmpty('<svg viewBox="0 0 24 24"><path d="M3.6 6.2h5.2l1.9 2.6h9.7v10.4H3.6z"/><path d="M3.6 9.6h16.8"/></svg>', '草稿箱是空的');
          return;
        }
        panel.innerHTML = drafts.map(x => `
          <div class="wb-draft" data-id="${esc(x.id)}">
            <div class="wb-draft-top">
              <span>${esc(x.time || '草稿')}</span>
              <button class="wb-draft-del" data-del="${esc(x.id)}" type="button">删除</button>
            </div>
            <div class="wb-draft-text">${x.text ? hlHtml(x.text) : `<span style="color:var(--wb-ink-soft)">${x.video ? '[视频]' : '[图片]'}</span>`}</div>
            ${(x.video && x.video.src) ? `<div class="wb-draft-imgs"><img src="${esc(x.video.src)}" alt=""></div>` : ''}
            ${(x.imgs && x.imgs.length) ? `<div class="wb-draft-imgs">${x.imgs.slice(0, 4).map(src => `<img src="${esc(imgSrc(src))}" alt="">`).join('')}</div>` : ''}
          </div>`).join('') + '<div class="wb-end">点击草稿继续编辑</div>';
        panel.querySelectorAll('.wb-draft').forEach(el => {
          el.onclick = e => {
            if(e.target.closest('.wb-draft-del')) return;
            const draft = (store.get().drafts || []).find(x => x.id === el.dataset.id);
            if(draft) openCompose(null, draft);
          };
        });
        panel.querySelectorAll('.wb-draft-del').forEach(b => {
          b.onclick = e => {
            e.stopPropagation();
            const dd = store.get();
            dd.drafts = (dd.drafts || []).filter(x => x.id !== b.dataset.del);
            store.save();
            toast('草稿已删除');
            renderMe();
          };
        });
        return;
      }
      const list = meTab === 'likes'
        ? store.get().feed.concat(store.get().recommend || []).filter(x => x.liked)
        : mine;
      if(!list.length){
        panel.innerHTML = meTab === 'likes'
          ? meEmpty('<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>', '还没有赞过任何微博')
          : meEmpty('<svg viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2.2"/><path d="M8 8.6h8M8 12.6h8M8 16.6h4.6"/></svg>', '还没有发过微博，点右上角 + 试试');
        return;
      }
      const d = store.get();
      panel.innerHTML = list.map(x => postHtml(x, meInfo(d))).join('');
      panel.querySelectorAll('.wb-post').forEach(el => {
        const post = findPost(d, el.dataset.id);
        if(!post) return;
        el.querySelectorAll('.wb-act').forEach(btn => {
          btn.onclick = ev => {
            ev.stopPropagation();
            const act = btn.dataset.act;
            if(act === 'like'){
              post.liked = !post.liked;
              post.likes = Math.max(0, (post.likes || 0) + (post.liked ? 1 : -1));
              store.save();
              renderMe();
            } else if(act === 'comment'){
              openPostDetail(post, 'comment');
            } else if(ev.target.closest('.wb-act-num')){
              openPostDetail(post, 'repost');
            } else {
              openRepostSheet(post);
            }
          };
        });
        el.onclick = ev => {
          if(ev.target.closest('.wb-act') || ev.target.closest('.wb-more-btn')) return;
          openPostDetail(post, 'comment');
        };
        bindPostMenu(el, post, renderMe);
      });
    }

    function toDataUrl(file){
      if(Phone && Phone.fileToBase64) return Phone.fileToBase64(file);
      return new Promise((res, rej) => {
        const rd = new FileReader();
        rd.onload = () => res(rd.result);
        rd.onerror = rej;
        rd.readAsDataURL(file);
      });
    }

    function loadAccount(id){
      const d = store.get();
      const acc = (d.accounts || []).find(a => a.id === id);
      if(!acc) return false;
      store.save();
      d.activeId = id;
      ACCOUNT_FIELDS.forEach(k => { d.profile[k] = acc[k]; });
      store.save();
      return true;
    }

    function deleteAccount(id){
      const d = store.get();
      if((d.accounts || []).length <= 1){ toast('至少保留一个账号'); return; }
      const idx = d.accounts.findIndex(a => a.id === id);
      if(idx < 0) return;
      const wasActive = d.activeId === id;
      d.accounts.splice(idx, 1);
      if(wasActive){
        d.activeId = d.accounts[0].id;
        ACCOUNT_FIELDS.forEach(k => { d.profile[k] = d.accounts[0][k]; });
      }
      store.save();
      meTab = 'posts';
      renderMe();
      toast('账号已注销');
    }

    function openAddAccountSheet(){
      const s = openSheet(`

        </div>`);

      const create = () => {
        const nameVal = (input.value || '').trim();
        if(!nameVal){ toast('请输入昵称'); return; }
        const d = store.get();
        store.save();
        const acc = { id:'a' + Date.now(), name:nameVal, avatar:'', bio:'', verify:'none', persona:null, cover:'' };
        d.accounts.push(acc);
        d.activeId = acc.id;
        ACCOUNT_FIELDS.forEach(k => { d.profile[k] = acc[k]; });
        store.save();
        s.close();
        meTab = 'posts';
        renderMe();
        toast('已创建并切换到新账号');
      };
      s.mask.querySelector('[data-act="cancel"]').onclick = s.close;

      input.addEventListener('keydown', e => { if(e.key === 'Enter') create(); });
      setTimeout(() => input.focus(), 150);

    function openAccountSheet(){
      const d = store.get();
      const list = d.accounts || [];
      const s = openSheet(`
        <div class="wb-sheet-head"><span>切换账号</span></div>
        <div class="wb-acc-list">
          ${list.map((a, i) => `
            <div class="wb-acc-row ${a.id === d.activeId ? 'on' : ''}" data-idx="${i}">
              ${avatarHtml(a.name || '未命名', a.avatar, 'wb-acc-avatar')}
              <div class="wb-acc-name">${esc(a.name || '未命名')}</div>
              ${a.id === d.activeId ? '<span class="wb-acc-tag">当前</span>' : ''}
              ${list.length > 1 ? `<button class="wb-acc-del" data-del="${i}" type="button">注销</button>` : ''}
            </div>`).join('')}
        </div>
        <div class="wb-sheet-item" data-act="add">＋ 新增账号</div>
        <div class="wb-sheet-item danger" data-act="cancel">取消</div>`);
      s.mask.querySelectorAll('.wb-acc-row').forEach(row => {
        row.onclick = e => {
          const acc = list[parseInt(row.dataset.idx, 10)];
          if(!acc) return;
          const del = e.target.closest('.wb-acc-del');
          if(del){
            if(del.dataset.confirm !== '1'){
              del.dataset.confirm = '1';
              del.textContent = '确认注销';
              return;

            s.close();
            deleteAccount(acc.id);
            return;

          if(acc.id === d.activeId){ s.close(); return; }
          loadAccount(acc.id);
          s.close();
          meTab = 'posts';
          renderMe();
          toast(`已切换到 ${acc.name || '未命名'}`);
        };
      });
      s.mask.querySelector('[data-act="add"]').onclick = () => { s.close(); openAddAccountSheet(); };
      s.mask.querySelector('[data-act="cancel"]').onclick = s.close;
    }

    function openImageViewer(srcs, start){
      const list = (srcs || []).filter(Boolean);
      if(!list.length) return;
      let cur = Math.max(0, Math.min(start || 0, list.length - 1));
      const mask = document.createElement('div');
      mask.className = 'wb-viewer';
      mask.innerHTML = `
        <span class="wb-viewer-count"></span>
        <img alt="">
        ${list.length > 1 ? `<button class="wb-viewer-nav prev" type="button" aria-label="上一张">‹</button><button class="wb-viewer-nav next" type="button" aria-label="下一张">›</button>` : ''}`;
      app.appendChild(mask);
      const img = mask.querySelector('img');
      const count = mask.querySelector('.wb-viewer-count');
      const paint = () => {
        img.src = imgSrc(list[cur]);
        count.textContent = list.length > 1 ? `${cur + 1} / ${list.length}` : '';
      };
      paint();
      requestAnimationFrame(() => mask.classList.add('show'));
      let closed = false;
      const close = () => {
        if(closed) return;
        closed = true;
        mask.classList.remove('show');
        setTimeout(() => mask.remove(), 200);
      };
      mask.onclick = e => {
        const nav = e.target.closest('.wb-viewer-nav');
        if(nav){
          cur = nav.classList.contains('prev')
            ? (cur + list.length - 1) % list.length
            : (cur + 1) % list.length;
          paint();
          return;
        }
        close();
      };
    }

      mask.style.zIndex = String(overlayZ());

      mask.addEventListener('click', e => { if(e.target === mask) close(); });
      return { mask, close };
    }

    const LIKER_CAP = 20;
    function ensureLikers(post){
      if(!Array.isArray(post.likers)) post.likers = [];
      const total = Math.max(0, Math.round(Number(post.likes) || 0));
      const want = Math.min(total, LIKER_CAP);
      const need = Math.max(0, want - (post.liked ? 1 : 0));
      if(post.likers.length > need) post.likers = post.likers.slice(0, need);
      let h = 0;
      for(const ch of String(post.id || post.name || '')) h = (h * 31 + ch.charCodeAt(0)) % 9973;
      const base = NETIZEN_NAMES;
      const used = new Set(post.likers.concat([myCmtName()]));
      let step = 0;
      while(post.likers.length < need && step < base.length * 2){
        const n = base[(h + step * 7) % base.length];
        step++;
        if(used.has(n)) continue;
        used.add(n);
        post.likers.push(n);
      }
    }

      const inp = document.createElement('input');

      inp.onchange = async () => {
        const out = [];
        for(const f of Array.from(inp.files || []).slice(0, max || 9)){
          try{ out.push({ src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        if(out.length) cb(out);
      };
      inp.click();
    }

    function bindDtActions(box, getList, repaint, countCb){
      box.onclick = ev => {
        const btn = ev.target.closest('button');
        if(!btn || !box.contains(btn)) return;
        const itemEl = btn.closest('.wb-dt-cm');
        if(!itemEl) return;
        const entry = findEntry(getList(), itemEl.dataset.cid);
        if(!entry) return;
        if(btn.dataset.like){
          entry.liked = !entry.liked;
          entry.likes = Math.max(0, (entry.likes || 0) + (entry.liked ? 1 : -1));
          btn.classList.toggle('on', entry.liked);
          btn.innerHTML = ICON.heart + '<span>' + entry.likes + '</span>';
          store.save();
          return;
        }
        if(btn.dataset.sad){ toast('已踩过这条'); return; }
        if(btn.dataset.repost){
          openEntryRepostSheet(entry, (text, me) => {
            getList().unshift(makeEntry('me', me.name, text, {
              likes: 0,
              avatar: me.avatar,
              quote: { name: entry.name, text: entry.text || '' }
            }));
            store.save();
            if(countCb) countCb('repost');
            repaint();
          });
          return;
        }
        if(btn.dataset.reply){
          const rb = itemEl.querySelector(':scope > .wb-dt-cm-main > .wb-dt-replybox');
          if(!rb) return;
          rb.hidden = !rb.hidden;
          if(!rb.hidden) setTimeout(() => rb.querySelector('.wb-cm-input').focus(), 60);
          return;
        }
        if(btn.dataset.img){
          const rb = btn.closest('.wb-dt-replybox');
          if(!rb) return;
          rb._picked = rb._picked || [];
          const max = 9 - rb._picked.length;
          if(max <= 0){ toast('最多9张'); return; }
          attachImages(imgs => {
            rb._picked.push(...imgs.slice(0, max));
            paintPicked(rb.querySelector('[data-picked="1"]'), rb._picked);
          }, max);
          return;
        }
        if(btn.dataset.send){
          const rb = btn.closest('.wb-dt-replybox');
          const inp = rb.querySelector('.wb-cm-input');
          const val = (inp.value || '').trim();
          const imgs = (rb._picked || []).map(x => x.src);
          if(!val && !imgs.length){ toast('说点什么吧'); return; }
          entry.replies = entry.replies || [];
          entry.replies.push(makeEntry('me', myCmtName(), val, { likes: 0, imgs }));
          store.save();
          if(countCb) countCb('comment');
          repaint();
        }
      };
    }

    function attachRobert(list, post, repaint, force, cacheKey){
      const key = cacheKey || 'robert';
      const cached = (!force && post[key] && post[key].text) ? post[key].text : '';
      const entry = makeEntry('robert', ROBERT_NAME, cached || '正在锐评…', { pending: !cached });
      const at = list.length > 1 ? rndInt(1, list.length) : list.length;
      list.splice(at, 0, entry);
      repaint();
      if(cached) return;
      requestRobertText(post).then(text => {
        entry.pending = false;
        entry.text = text || '锐评生成失败，请检查 API 设置';
        post[key] = { text: entry.text, at: Date.now() };
        store.save();
        repaint();
      });
    }

    function ensureCmts(post){
      if(!Array.isArray(post.cmts)) post.cmts = [];
      if(!post.cmts.length){
        const tier = statTierOf(post);
        const n = (tier === 'star' || tier === 'market') ? 5 : 3;
        post.cmts.push(...makeNetizens(n, undefined, '正在生成评论…'));
      }
      post.comments = Math.max(post.comments || 0, post.cmts.length);
      if(post.hotTopic) filterWayvComments(post.cmts);
    }

    function filterWayvComments(list){
      if(!Array.isArray(list)) return;
      for(let i = list.length - 1; i >= 0; i--){
        const e = list[i];
        if(e && e.kind !== 'me' && isWayvAccount(e.name)){
          list.splice(i, 1);
        } else if(e && Array.isArray(e.replies)){
          filterWayvComments(e.replies);
        }
      }
    }

    function dayKey(offset){
      const d = new Date();
      if(offset) d.setDate(d.getDate() + offset);
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function isSignedToday(d, name){
      const map = (d && d.superSign) || {};
      return map[name] === dayKey(0);
    }

    function signToday(d, name){
      if(!d) return false;
      if(!d.superSign || typeof d.superSign !== 'object') d.superSign = {};
      if(isSignedToday(d, name)) return false;
      d.superSign[name] = dayKey(0);
      return true;
    }

    function memberProfilePosts(name){
      const d = store.get();
      const extra = MEMBER_EXTRA_POSTS[name] || [];
      if(!d.memberPosts || typeof d.memberPosts !== 'object') d.memberPosts = {};
      if(!Array.isArray(d.memberPosts[name])){
        d.memberPosts[name] = extra.map((x, i) => Object.assign({}, x, {
          id:'mp-' + name + '-' + i,
          name,
          avatar:MEMBER_SELFIE[name] || '',
          vip:true,
          following:true
        }));
        store.save();
      }
      const own = d.memberPosts[name].slice();
      const feed = (d.feed || []).concat(d.recommend || [])
        .filter(x => x && !x.mine && memberWeiboName(x.name) === name);
      const seen = {};
      return own.concat(feed).filter(x => {
        if(!x) return false;
        if(seen[x.id]) return false;
        seen[x.id] = true;
        return true;
      });
    }

    function openMemberDm(name){

      if(!Array.isArray(d.chats)) d.chats = [];
      const chatId = 'dm-' + memberWeiboName(name);
      let chat = d.chats.find(c => c.id === chatId);
      const avatar = MEMBER_SELFIE[memberWeiboName(name)] || '';

    let botProfileRepaint = null;
    const BOT_PROFILE_BUSY = new Set();

    function botProfilePosts(name){
      const d = store.get();
      if(!Array.isArray(d.recommend)) d.recommend = [];
      const own = d.recommend.filter(x => String(x.name || '').trim() === name);
      if(own.length >= 5) return own.slice().reverse();
      const times = ['昨天 15:52', '昨天 01:04', '11-7', '11-6', '11-5'];
      const need = 5 - own.length;
      const fresh = [];
      for(let i = 0; i < need; i++){
        const id = makeRecPost(d, { round: 1 }, { name, vip: true }, '正在用 API 生成…', 1, [], []);
        const p = findPost(d, id);
        if(p){
          p.time = times[(own.length + i) % times.length];
          p.ts = Date.now() - (i + 1) * 5 * 3600000;
          p.botPending = true;
          fresh.push(p);
        }
      }
      store.save();
      fillBotProfilePosts(name, fresh);
      return d.recommend.filter(x => String(x.name || '').trim() === name).slice().reverse();
    }

    async function fillBotProfilePosts(name, targets){
      if(!targets || !targets.length) return;
      const key = name;
      if(BOT_PROFILE_BUSY.has(key)) return;
      if(!Phone || !Phone.chatWithAI){
        targets.forEach(p => { p.text = '未配置 API，无法生成内容'; p.botPending = false; });
        store.save();
        if(botProfileRepaint) botProfileRepaint();
        return;
      }
      BOT_PROFILE_BUSY.add(key);
      try{
        const acc = { name, gossip: !isCrackAccount(name) };
        const authors = targets.map(() => acc);
        const items = await requestAiRecPosts(authors);
        targets.forEach((p, i) => {
          const it = items[i];
          if(!it){ p.text = '内容生成失败'; p.botPending = false; return; }
          p.text = toMandarin(String(it.text || '').trim()) || '内容生成失败';
          const images = (Array.isArray(it.images) ? it.images : [])
            .map(t => toMandarin(String(t == null ? '' : t).trim())).filter(Boolean).slice(0, 9);
          p.imgs = images.length ? postImages(images) : [];
          p.botPending = false;
          applyPostStats(p, true);
        });
        store.save();
        if(botProfileRepaint) botProfileRepaint();
      }catch(err){
        targets.forEach(p => { p.text = '生成失败：' + ((err && err.message) || '请检查 API 设置'); p.botPending = false; });
        store.save();
        if(botProfileRepaint) botProfileRepaint();
      } finally {
        BOT_PROFILE_BUSY.delete(key);
      }
    }

        topbar.appendChild(menu);

      syncTabs();
      syncCounts();

        const CV = 720, pad = Math.round(CV * 0.09), font = 'px "PingFang SC","Microsoft YaHei",sans-serif';
        const cv = document.createElement('canvas');
        cv.width = CV; cv.height = CV;
        const ctx = cv.getContext('2d');
        let fs = Math.round(CV * 0.075), lineH = 0, lines = [];
        while(fs >= 18){
          lineH = Math.round(fs * 1.75);
          ctx.font = fs + font;
          lines = [];
          let curLine = '';
          for(const ch of Array.from(text)){
            if(ch === '\n'){ lines.push(curLine); curLine = ''; continue; }
            const test = curLine + ch;
            if(ctx.measureText(test).width > CV - pad * 2 && curLine){ lines.push(curLine); curLine = ch; }
            else curLine = test;
          }
          if(curLine) lines.push(curLine);
          if(lines.length * lineH <= CV - pad * 2) break;
          fs -= 2;
        }
        ctx.fillStyle = colors[cur].bg;
        ctx.fillRect(0, 0, CV, CV);
        ctx.fillStyle = colors[cur].fg;
        ctx.font = fs + font;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const startY = (CV - lines.length * lineH) / 2;
        lines.forEach((ln, i) => ctx.fillText(ln, pad, startY + i * lineH));
        close();
        onDone({ type:'text', src: cv.toDataURL('image/png'), text, bg: colors[cur].bg, fg: colors[cur].fg });
      };
    }

    function wrapCanvasText(ctx, text, maxW){
      const lines = [];
      let cur = '';
      for(const ch of Array.from(text)){
        if(ch === '\n'){ lines.push(cur); cur = ''; continue; }
        const test = cur + ch;
        if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = ch; }
        else cur = test;
      }
      if(cur) lines.push(cur);
      return lines;
    }

      };

      const applyBg = () => {
        if(composeBg){
          bgEl.style.backgroundImage = `url("${composeBg}")`;
          panel.classList.add('has-bg');
        } else {
          bgEl.style.backgroundImage = '';
          panel.classList.remove('has-bg');
        }
      };

      mask.querySelector('.wb-compose-cancel').onclick = () => close();
      mask.onclick = e => { if(e.target === mask) close(); };
      ta.addEventListener('input', syncMirror);
      ta.addEventListener('scroll', () => { mirror.scrollTop = ta.scrollTop; });
      if(editPost) ta.value = editPost.text || '';
      else if(draftPost) ta.value = draftPost.text || '';
      renderImgs();
      applyBg();
      syncMirror();
      initSnapshot = snap();
      setTimeout(() => ta.focus(), 120);

      fileEl.onchange = async () => {
        const files = Array.from(fileEl.files || []);
        for(const f of files){
          if(composeImages.length >= 9){ toast('最多9张'); break; }
          try{ composeImages.push({ type:'image', src: await toDataUrl(f) }); }
          catch(e){ toast('图片读取失败'); }
        }
        fileEl.value = '';
        renderImgs();
      };

      bgFileEl.onchange = async () => {
        const f = bgFileEl.files && bgFileEl.files[0];
        bgFileEl.value = '';
        if(!f) return;
        try{
          composeBg = await toDataUrl(f);
          applyBg();
          toast('背景已更换');
        }catch(e){ toast('背景读取失败'); }
      };

      mask.querySelectorAll('.wb-tool').forEach(b => {
        b.onclick = () => {
          const tool = b.dataset.tool;
          if(tool === 'img'){
            openImageSourceSheet(src => {
              if(src === 'local') fileEl.click();
              else openTextImageEditor(img => {
                if(composeImages.length >= 9){ toast('最多9张'); return; }
                composeImages.push(img);
                renderImgs();
              });
            });
          } else if(tool === 'video'){
            openVideoEditor(vid => {
              composeImages = composeImages.filter(x => x.type !== 'video');
              composeImages.unshift(vid);
              renderImgs();
            });
          } else if(tool === 'topic'){
            insertText('#');
          } else if(tool === 'at'){
            openAtSheet(nm => insertText('@' + nm + ' '));
          } else if(tool === 'super'){
            openSuperTopicSheet(topicName => insertText(`#${topicName}# `));
          }
        };
      });

      mask.querySelector('.wb-compose-send').onclick = () => {
        const text = ta.value.trim();
        const vid = pickVideo();
        const imgSrcs = pickImgs();
        if(!text && !composeImages.length){ toast('说点什么吧'); return; }
        const d = store.get();
        if(draftKey) d.drafts = (d.drafts || []).filter(x => x.id !== draftKey);
        if(editPost){
          const target = d.feed.find(x => x.id === editPost.id)
            || (d.recommend || []).find(x => x.id === editPost.id);
          if(target){
            target.text = text;
            target.imgs = imgSrcs;
            target.video = vid ? { src:vid.src, duration:vid.duration, views:vid.views, text:vid.text } : null;
          }
          store.save();
          close(true);
          toast('微博已更新');
          if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
          else renderHome();
          return;
        }
        const now = new Date();
        d.feed.unshift({
          id: 'my' + Date.now(),
          name,
          avatar,
          vip: VERIFY[p.verify] ? p.verify !== 'none' : false,
          mine: true,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          ts: now.getTime(),
          text,
          imgs: imgSrcs,
          video: vid ? { src:vid.src, duration:vid.duration, views:vid.views, text:vid.text } : null,
          owner: d.activeId,
          likes: rndInt(0, 3), comments: 0, reposts: 0, liked: false
        });
        d.profile.posts = (parseInt(d.profile.posts, 10) || 0) + 1;
        store.save();
        close(true);
        toast('发送成功');
        if(currentTab === 'me'){ meTab = 'posts'; renderMe(); }
        else switchTab('home');
      };
    }

    rollLive();
    switchTab('me');
  };

  function bootWeibo(){
    if(!document.body || !document.body.hasAttribute('data-wb-standalone')) return;
    if(window.mountWeiboApp) window.mountWeiboApp(document, window.Phone || null, null);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootWeibo);
  else bootWeibo();
})();
