<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.wc-app{
  display:flex;flex-direction:column;height:100%;
  background:linear-gradient(180deg,var(--green-bg),#e6f5ec);
  position:relative;overflow:hidden;
}
.wc-app::before{
  content:"";position:absolute;top:-20%;left:-20%;width:70%;height:50%;
  background:radial-gradient(circle,rgba(124,204,155,.35) 0%,transparent 70%);
  pointer-events:none;
}
.wc-app::after{
  content:"";position:absolute;bottom:-10%;right:-20%;width:70%;height:50%;
  background:radial-gradient(circle,rgba(184,226,198,.4) 0%,transparent 70%);
  pointer-events:none;
}

.wc-topbar{flex-shrink:0;min-height:48px;padding:0 14px;padding-top:env(safe-area-inset-top,0px);
  ;
  display:flex;align-items:center;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;z-index:5;
}
.wc-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:16px;font-weight:700;color:var(--green-ink);pointer-events:none;
}
.wc-top-actions{display:flex;gap:6px;margin-left:auto;}
.wc-back-btn{margin-right:auto;}
.wc-icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.6);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:16px;transition:transform .1s,background .15s;
}
.wc-icon-btn:active{transform:scale(.9);background:rgba(184,226,198,.6);}
.wc-icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.wc-body{
  flex:1;overflow-y:auto;position:relative;z-index:2;
  -webkit-overflow-scrolling:touch;
}
.wc-body::-webkit-scrollbar{width:0;}

.wc-tab-panel{display:none;animation:wcFade .25s ease;}
.wc-tab-panel.active{display:block;}
@keyframes wcFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* chat list */
.wc-chat-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;
  transition:background .12s;position:relative;
}
.wc-chat-item:active{background:rgba(184,226,198,.25);}
.wc-avatar{
  width:46px;height:46px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;
  overflow:hidden;position:relative;
}
.wc-avatar.group{border-radius:11px;}
.wc-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-chat-info{flex:1;min-width:0;}
.wc-chat-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.wc-chat-name{font-size:15px;font-weight:600;color:var(--green-ink);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-chat-time{font-size:11px;color:var(--green-ink-soft);flex-shrink:0;}
.wc-chat-preview{font-size:13px;color:var(--green-ink-soft);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-badge{
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:#ff5252;color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.wc-divider{height:1px;background:rgba(214,236,217,.6);margin-left:74px;}

/* contacts */
.wc-contacts-action{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;transition:background .12s;
}
.wc-contacts-action:active{background:rgba(184,226,198,.25);}
.wc-contacts-icon{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.wc-contacts-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-contacts-label{font-size:15px;color:var(--green-ink);font-weight:500;}
.wc-section-title{
  padding:14px 16px 4px;font-size:12px;color:var(--green-ink-soft);
  font-weight:600;letter-spacing:.5px;
}
.wc-contact-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 16px;cursor:pointer;transition:background .12s;
}
.wc-contact-item:active{background:rgba(184,226,198,.25);}
.wc-contact-name{font-size:14px;color:var(--green-ink);}

/* moments */
.wc-moments-banner{
  height:200px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7ccc9b 0%,#3fa96a 100%);
}
.wc-moments-banner::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2) 0%,transparent 45%);
}
.wc-moments-banner-cover{
  position:absolute;inset:0;object-fit:cover;width:100%;height:100%;
}
.wc-moments-user{
  position:absolute;right:16px;bottom:-26px;
  display:flex;align-items:flex-end;gap:10px;z-index:5;
}
.wc-moments-nick{
  font-size:15px;font-weight:700;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
  padding-bottom:6px;
}
.wc-moments-avatar{
  width:52px;height:52px;border-radius:10px;
  background:linear-gradient(135deg,var(--green-soft),var(--green-mid));
  border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:20px;font-weight:700;overflow:hidden;
}
.wc-moments-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-moments-list{padding:36px 16px 20px;}
.wc-moment-item{padding:14px 0;border-bottom:1px solid rgba(214,236,217,.5);}
.wc-moment-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.wc-moment-avatar{
  width:40px;height:40px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:15px;font-weight:600;overflow:hidden;
}
.wc-moment-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-moment-name{font-size:14px;font-weight:600;color:var(--green-deep);}
.wc-moment-content{font-size:14px;color:var(--green-ink);line-height:1.55;padding-left:50px;margin-bottom:8px;word-break:break-word;white-space:pre-wrap;}
.wc-moment-images{padding-left:50px;margin-bottom:8px;}
.wc-moment-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:200px;}
.wc-moment-img{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--green-soft);}
.wc-moment-img img{width:100%;height:100%;object-fit:cover;}
.wc-moment-time-row{display:flex;align-items:center;justify-content:space-between;padding-left:50px;}
.wc-moment-time{font-size:11px;color:var(--green-ink-soft);}
.wc-moment-actions{display:flex;gap:12px;}
.wc-moment-action{
  display:flex;align-items:center;gap:3px;font-size:11px;
  color:var(--green-ink-soft);cursor:pointer;border:none;background:none;
  padding:2px 0;
}
.wc-moment-action.liked{color:#ff5252;}
.wc-moment-action svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-moment-likes{
  background:rgba(240,248,240,.7);border-radius:6px;padding:7px 10px;
  margin:6px 0 4px 50px;font-size:12px;color:var(--green-deep);
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}
.wc-moment-likes svg{width:13px;height:13px;fill:#ff5252;stroke:none;flex-shrink:0;}

/* me page */
.wc-me-header{
  display:flex;align-items:center;gap:14px;padding:20px 16px 16px;
}
.wc-me-avatar{
  width:64px;height:64px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-soft),var(--green-mid));
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:26px;font-weight:700;overflow:hidden;border:2px solid #fff;
  box-shadow:0 4px 14px -4px rgba(40,130,70,.3);
}
.wc-me-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-me-info{flex:1;min-width:0;}
.wc-me-name{font-size:20px;font-weight:700;color:var(--green-ink);}
.wc-me-id{font-size:13px;color:var(--green-ink-soft);margin-top:4px;}
.wc-me-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:14px;margin:0 16px 12px;overflow:hidden;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-me-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  cursor:pointer;transition:background .12s;
}
.wc-me-item:active{background:rgba(184,226,198,.2);}
.wc-me-item + .wc-me-item{border-top:1px solid rgba(214,236,217,.5);}
.wc-me-item-icon{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.wc-me-item-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-me-item-label{flex:1;font-size:14px;color:var(--green-ink);}
.wc-me-item-arrow{color:var(--green-ink-soft);font-size:14px;}

.wc-me-header-arrow{
  color:var(--green-ink-soft);font-size:22px;
  margin-left:auto;padding-right:4px;cursor:pointer;
  line-height:1;
}
.wc-me-avatar-wrap{cursor:pointer;}

.wc-wallet-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.wc-wallet-body::-webkit-scrollbar{width:0;}
.wc-wallet-summary{
  background:linear-gradient(135deg,#2aa36e,#5ab88a);color:#fff;
  border-radius:14px;padding:18px 20px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(42,163,110,.25);
}
.wc-wallet-balance-label{font-size:12px;opacity:.8;margin-bottom:4px}
.wc-wallet-balance-amount{font-size:28px;font-weight:700;letter-spacing:.5px;color:#fff}
.wc-wallet-sub-row{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.wc-wallet-sub-item{flex:1}
.wc-wallet-sub-label{font-size:11px;opacity:.8}
.wc-wallet-sub-amount{font-size:15px;font-weight:600;margin-top:2px}
.wc-wallet-sub-amount.in{color:#cdf5db}
.wc-wallet-sub-amount.out{color:#ffe0e0}
.wc-wallet-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.wc-wallet-tab{
  padding:6px 12px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--green-ink-soft);font-size:12px;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.wc-wallet-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.wc-wallet-extract{
  margin-left:auto;padding:6px 10px;border-radius:16px;border:none;
  background:rgba(142,68,173,.1);color:#8e44ad;font-size:12px;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.wc-wallet-extract:disabled{opacity:.5;cursor:not-allowed}
.wc-wallet-empty{
  text-align:center;color:#999;font-size:13px;
  padding:60px 20px;line-height:2;
}
.wc-wallet-list{display:flex;flex-direction:column;gap:6px}
.wc-wallet-record{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;position:relative;
}
.wc-wallet-record-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wc-wallet-record-icon{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;flex-shrink:0;
}
.wc-wallet-record-icon.in{background:#2aa36e}
.wc-wallet-record-icon.out{background:#e74c3c}
.wc-wallet-record-info{flex:1;min-width:0}
.wc-wallet-record-note{font-size:14px;color:var(--green-ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-wallet-record-meta{font-size:11px;color:var(--green-ink-soft);margin-top:2px}
.wc-wallet-record-amount{font-size:15px;font-weight:700;flex-shrink:0}
.wc-wallet-record-amount.in{color:#2aa36e}
.wc-wallet-record-amount.out{color:#e74c3c}
.wc-wallet-del{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border:none;background:rgba(0,0,0,.06);
  border-radius:50%;color:#888;font-size:14px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.wc-wallet-record:active .wc-wallet-del{opacity:1}

/* profile edit page */
.wc-profile-body{
  flex:1;overflow-y:auto;padding:14px 16px;
  -webkit-overflow-scrolling:touch;
}
.wc-profile-body::-webkit-scrollbar{width:0;}
.wc-profile-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:14px;overflow:hidden;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-profile-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;cursor:pointer;transition:background .12s;
}
.wc-profile-row:active{background:rgba(184,226,198,.2);}
.wc-profile-row + .wc-profile-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-profile-label{
  font-size:14px;color:var(--green-ink);font-weight:500;
  min-width:60px;flex-shrink:0;
}
.wc-profile-val{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;
}
.wc-profile-text{
  font-size:14px;color:var(--green-ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:60%;text-align:right;
}
.wc-profile-arrow{color:var(--green-ink-soft);font-size:16px;flex-shrink:0;}
.wc-profile-avatar{
  width:42px;height:42px;border-radius:10px;
}

/* bottom tab bar */
.wc-tabbar{
  flex-shrink:0;display:flex;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.6);
  padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);
  position:relative;z-index:5;
}
.wc-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:4px 0;
  color:var(--green-ink-soft);transition:color .15s;
}
.wc-tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-tab.active{color:var(--green-deep);}
.wc-tab.active svg{fill:rgba(63,169,106,.15);}
.wc-tab-label{font-size:11px;font-weight:500;}

/* chat detail sub-page */
.wc-chat-detail{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-chat-detail.show{transform:translateX(0) !important;}
.wc-cd-topbar{
  flex-shrink:0;min-height:48px;display:flex;align-items:center;gap:8px;
padding:0 12px;padding-top:calc(var(--phone-w) * 0.11);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;
}
.wc-cd-back{
  width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,.6);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;
}
.wc-cd-back:active{transform:scale(.9);}
.wc-cd-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:15px;font-weight:600;color:var(--green-ink);
  pointer-events:none;max-width:55%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wc-cd-right{display:flex;gap:4px;margin-left:auto;align-items:center;}
.wc-cd-heart{
  width:34px;height:34px;border-radius:50%;border:none;background:none;
  color:#ff6b8a;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s;
}
.wc-cd-heart:active{transform:scale(.85);}
.wc-cd-heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-cd-heart.pulse svg{animation:wcHeartPulse .6s ease;}
@keyframes wcHeartPulse{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.95)}100%{transform:scale(1)}}

/* 心声 panel */
.wc-heart-panel{
  position:absolute;inset:0;z-index:35;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fff5f7,#ffe8ee);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-heart-panel.show{transform:translateX(0) !important;}
.wc-heart-topbar{
  flex-shrink:0;min-height:48px;display:flex;align-items:center;gap:8px;
  padding:0 12px;padding-top:calc(var(--phone-w) * 0.11);
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;
}
.wc-heart-topbar .wc-cd-back{background:rgba(255,255,255,.7);color:#ff6b8a;}
.wc-heart-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:15px;font-weight:600;color:#c44569;
}
.wc-heart-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.wc-heart-body::-webkit-scrollbar{width:0;}
.wc-heart-empty{
  text-align:center;color:#c44569;padding:60px 20px;font-size:13px;line-height:1.8;
}
.wc-heart-item{
  background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;
  box-shadow:0 2px 10px rgba(196,69,105,.08);position:relative;
}
.wc-heart-item-time{font-size:11px;color:#c44569;opacity:.6;margin-bottom:6px;}
.wc-heart-item-content{font-size:14px;color:#5a3a45;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.wc-heart-del{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  border:none;background:rgba(196,69,105,.1);color:#c44569;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
}
.wc-heart-gen{
  flex-shrink:0;padding:12px 16px;background:rgba(255,255,255,.5);
  border-top:1px solid rgba(196,69,105,.15);
}
.wc-heart-gen-btn{
  width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#ff8fa3,#ff6b8a);color:#fff;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 14px rgba(255,107,138,.35);
}
.wc-heart-gen-btn:active{transform:scale(.98);}
.wc-heart-gen-btn:disabled{opacity:.5;cursor:not-allowed;}
.wc-heart-gen-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* 心声小弹窗 */
.wc-heart-popup{
  position:fixed;z-index:2000;width:280px;max-height:340px;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-radius:16px;box-shadow:0 8px 32px rgba(196,69,105,.18);
  border:1px solid rgba(255,255,255,.6);
  opacity:0;transform:translateY(-6px) scale(.96);
  transition:opacity .2s,transform .2s;
}
.wc-heart-popup.show{opacity:1;transform:translateY(0) scale(1);}
.wc-heart-popup-arrow{
  position:absolute;top:-7px;right:16px;width:14px;height:14px;
  background:rgba(255,255,255,.85);
  border-left:1px solid rgba(255,255,255,.6);
  border-top:1px solid rgba(255,255,255,.6);
  transform:rotate(45deg);
}
.wc-heart-popup-head{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid rgba(196,69,105,.1);
}
.wc-heart-popup-title{font-size:13px;font-weight:600;color:#c44569;}
.wc-heart-popup-close{
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(196,69,105,.1);color:#c44569;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
}
.wc-heart-popup-body{
  flex:1;overflow-y:auto;padding:10px 14px;min-height:60px;max-height:200px;
}
.wc-heart-popup-body::-webkit-scrollbar{width:3px;}
.wc-heart-popup-body::-webkit-scrollbar-thumb{background:rgba(196,69,105,.2);border-radius:3px;}
.wc-heart-popup-empty{
  text-align:center;font-size:12px;color:#c44569;padding:18px 6px;line-height:1.6;
}
.wc-heart-popup-item{
  background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;margin-bottom:8px;
}
.wc-heart-popup-time{font-size:10px;color:#c44569;opacity:.6;margin-bottom:3px;}
.wc-heart-popup-content{font-size:12px;color:#5a3a45;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.wc-heart-popup-foot{
  flex-shrink:0;padding:8px 14px;border-top:1px solid rgba(196,69,105,.1);
}
.wc-heart-popup-gen{
  width:100%;padding:8px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#ff8fa3,#ff6b8a);color:#fff;
  font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.wc-heart-popup-gen:active{transform:scale(.98);}
.wc-heart-popup-gen:disabled{opacity:.5;cursor:not-allowed;}
/* 聊天设置 page */
.wc-settings-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-settings-page.show{transform:translateX(0) !important;}
.wc-set-body{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;}
.wc-set-body::-webkit-scrollbar{width:0;}
.wc-set-card{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:16px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-set-profile{
  display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;
}
.wc-set-profile:active{background:rgba(184,226,198,.15);}
.wc-set-profile .wc-avatar{width:52px;height:52px;border-radius:12px;flex-shrink:0;}
.wc-set-profile-info{flex:1;min-width:0;}
.wc-set-profile-name{font-size:17px;font-weight:700;color:var(--green-ink);}
.wc-set-profile-sign{font-size:12px;color:var(--green-ink-soft);margin-top:3px;}
.wc-set-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .12s;
}
.wc-set-row:active{background:rgba(184,226,198,.2);}
.wc-set-row + .wc-set-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-set-label{font-size:14px;color:var(--green-ink);font-weight:500;flex-shrink:0;}
.wc-set-val{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;color:var(--green-ink-soft);font-size:13px;
}
.wc-set-val-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;text-align:right;}
.wc-set-arrow{color:var(--green-ink-soft);font-size:16px;flex-shrink:0;}
.wc-set-slider-row{
  padding:14px 16px;
}
.wc-set-slider-row + .wc-set-slider-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-set-slider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wc-set-slider-head .wc-set-label{flex-shrink:0;}
.wc-set-slider-val{font-size:14px;color:var(--green-deep);font-weight:600;}
.wc-set-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--green-deep) 0%,var(--green-deep) var(--pct,50%),rgba(0,0,0,.1) var(--pct,50%),rgba(0,0,0,.1) 100%);
  outline:none;
}
.wc-set-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--green-ink);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);
  cursor:pointer;
}
.wc-set-slider::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--green-ink);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;
}
.wc-set-toggle{
  width:44px;height:26px;border:none;border-radius:13px;
  background:rgba(0,0,0,.12);cursor:pointer;position:relative;transition:background .2s;
  padding:0;flex-shrink:0;
}
.wc-set-toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;
}
.wc-set-toggle.on{background:var(--green-deep);}
.wc-set-toggle.on::after{left:21px;}
.wc-set-btn-green{
  display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:var(--green-deep);color:#fff;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin:4px 0;
}
.wc-set-btn-green:active{opacity:.9;}
.wc-set-btn-outline{
  display:block;width:100%;padding:13px;border:1.5px solid var(--green-ink);border-radius:12px;
  background:rgba(255,255,255,.5);color:var(--green-ink);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin:4px 0;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-outline:active{background:rgba(255,255,255,.3);}
.wc-set-btn-outline svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-btn-half-wrap{display:flex;gap:10px;}
.wc-set-btn-half-wrap .wc-set-btn-outline{flex:1;margin:0;}
.wc-set-btn-restart{
  display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:rgba(255,255,255,.6);color:var(--green-ink);font-size:14px;font-weight:500;
  font-family:inherit;cursor:pointer;margin-top:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-restart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-btn-delete{
  display:block;width:100%;padding:13px;border:1px solid #e74c3c;border-radius:12px;
  background:rgba(231,76,60,.06);color:#e74c3c;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-delete svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-sub-row{
  display:flex;align-items:center;gap:8px;padding:10px 16px 14px 16px;
  background:rgba(238,250,242,.5);
}
.wc-set-sub-label{font-size:12px;color:var(--green-ink-soft);}
.wc-set-sub-input{
  width:60px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
  font-size:14px;color:var(--green-ink);text-align:center;background:#fff;outline:none;
}
.wc-set-sub-input:focus{border-color:var(--green-deep);}
.wc-set-divider{height:14px;}

/* ========== 记忆 page ========== */
.wc-mem-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-mem-page.show{transform:translateX(0) !important;}
.wc-mem-body{flex:1;overflow-y:auto;padding:16px;}
.wc-mem-body::-webkit-scrollbar{width:0;}
.wc-mem-header{
  background:linear-gradient(135deg,#fff,#f4fbf6);
  border-radius:16px;padding:20px;margin-bottom:20px;
  box-shadow:0 4px 15px rgba(63,169,106,.1);
}
.wc-mem-title{font-size:16px;font-weight:600;color:var(--green-ink);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.wc-mem-title::before{content:'💭';font-size:18px;}
.wc-mem-stats{display:flex;gap:12px;}
.wc-mem-stat{flex:1;text-align:center;padding:12px;background:rgba(238,250,242,.6);border-radius:12px;}
.wc-mem-stat-num{font-size:22px;font-weight:700;color:var(--green-deep);}
.wc-mem-stat-label{font-size:11px;color:var(--green-ink-soft);margin-top:4px;}
.wc-mem-section{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 4px 15px rgba(63,169,106,.1);
  position:relative;min-height:180px;padding-bottom:60px;
}
.wc-mem-section-title{font-size:15px;font-weight:600;color:var(--green-ink);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.wc-mem-section-title::before{content:'📝';font-size:16px;}
.wc-mem-list{display:flex;flex-direction:column;gap:10px;}
.wc-mem-empty{text-align:center;color:var(--green-ink-soft);padding:40px 16px;font-size:13px;line-height:1.6;}
.wc-mem-item{
  position:relative;background:rgba(238,250,242,.6);
  border-radius:12px;padding:12px 60px 12px 12px;
  border:1px solid rgba(214,236,217,.5);
}
.wc-mem-item-content{font-size:13px;color:var(--green-ink);line-height:1.5;margin-bottom:4px;white-space:pre-wrap;word-break:break-word;}
.wc-mem-item-time{font-size:11px;color:var(--green-ink-soft);}
.wc-mem-item-actions{
  position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s;
}
.wc-mem-item:hover .wc-mem-item-actions{opacity:1;}
.wc-mem-item-actions button{
  width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.wc-mem-edit-btn{background:rgba(63,169,106,.1);color:var(--green-deep);}
.wc-mem-del-btn{background:rgba(231,76,60,.1);color:#e74c3c;}
.wc-mem-add-btn{
  position:absolute;right:16px;bottom:16px;
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--green-deep);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(63,169,106,.4);
  transition:transform .2s,box-shadow .2s;
}
.wc-mem-add-btn:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(63,169,106,.5);}
.wc-mem-add-btn:active{transform:scale(.95);}
.wc-cd-messages{
  flex:1;overflow-y:auto;padding:12px 14px;
  display:flex;flex-direction:column;gap:12px;
}
.wc-cd-messages::-webkit-scrollbar{width:0;}
.wc-msg{
  display:flex;gap:8px;max-width:92%;align-items:flex-start;
}
.wc-msg .wc-avatar{width:36px;height:36px;flex-shrink:0;font-size:14px;}
.wc-msg-bubble{
  padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;position:relative;margin-top:2px;
}
.wc-msg-bubble::before,.wc-msg-bubble::after{display:none !important;}
.wc-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.wc-msg.user .wc-msg-bubble{background:#95ec69;color:#000;border-top-right-radius:4px;border-bottom-right-radius:18px;}
.wc-msg.ai{align-self:flex-start;}
.wc-msg.ai .wc-msg-bubble{background:#fff;border:1px solid #e0e0e0;color:#000;border-top-left-radius:4px;}
.wc-msg .wc-msg-name{
  font-size:11px;color:rgba(30,58,80,.55);margin-bottom:4px;line-height:1;
}
.wc-msg.user .wc-msg-name{text-align:right;}
.wc-msg.typing{align-self:flex-start;background:var(--green-bubble,#fff);border:1px solid rgba(0,0,0,.04);padding:10px 14px;border-radius:16px;position:relative;}
.wc-msg.typing::before{content:'';position:absolute;left:-6px;top:12px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid var(--green-bubble,#fff);}
.wc-typing-dots{display:flex;gap:4px;align-items:center;}
.wc-typing-dots span{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#a8d5a2,#4aa663);animation:wcDotBounce 1.2s ease-in-out infinite;}
.wc-typing-dots span:nth-child(1){animation-delay:0s;}
.wc-typing-dots span:nth-child(2){animation-delay:.2s;}
.wc-typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes wcDotBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.wc-cd-input-area{
  flex-shrink:0;padding:10px 12px;background:rgba(255,255,255,.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;
}
.wc-cd-input{
  flex:1;border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;font-size:14px;color:var(--green-ink);font-family:inherit;
  outline:none;background:#fff;max-height:80px;resize:none;min-height:40px;
}
.wc-cd-input:focus{border-color:var(--green-deep);}
.wc-cd-send{
  width:40px;height:40px;border-radius:50%;background:var(--green-deep);
  color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.wc-cd-send:active{transform:scale(.9);}
.wc-cd-send:disabled{background:var(--line);cursor:not-allowed;}
.wc-cd-send svg{width:18px;height:18px;fill:currentColor;}
.wc-cd-voice-btn{
  width:40px;height:40px;border-radius:50%;background:#fff;color:#222;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s;
}
.wc-cd-voice-btn:active{transform:scale(.9);}
.wc-cd-voice-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transform:rotate(90deg);}
.wc-cd-plus-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:#fff;color:#222;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  padding:0;transition:transform .1s;
}
.wc-cd-plus-btn:active{transform:scale(.9);}
.wc-cd-plus-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-cd-plus-panel{
  display:none;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:14px 16px;gap:12px;
}
.wc-cd-plus-panel.show{display:block;}
.wc-plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.wc-plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .12s;}
.wc-plus-item:active{transform:scale(.93);}
.wc-plus-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.wc-plus-item span{font-size:12px;color:#555;}
.wc-voice-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.wc-voice-modal.show{display:flex;}
.wc-voice-modal-body{background:#fff;border-radius:16px;padding:20px 24px 16px;min-width:280px;text-align:center;}
.wc-voice-dots{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;margin-bottom:8px;}
.wc-voice-dots span{width:10px;height:10px;border-radius:50%;background:var(--green-deep,#4aa663);animation:wcDotBounce 1s ease-in-out infinite;}
.wc-voice-dots span:nth-child(2){animation-delay:.15s;}
.wc-voice-dots span:nth-child(3){animation-delay:.3s;}
@keyframes wcDotBounce{
  0%,80%,100%{transform:translateY(0);opacity:.4;}
  40%{transform:translateY(-10px);opacity:1;}
}
.wc-voice-tip{font-size:13px;color:#666;margin-bottom:12px;}
.wc-voice-preview{display:flex;flex-direction:column;gap:8px;margin-top:0;}
.wc-voice-preview textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;resize:none;font-family:inherit;outline:none;}
.wc-voice-preview textarea:focus{border-color:var(--green-deep);}
.wc-voice-meta{font-size:12px;color:var(--green-deep);text-align:left;}
.wc-voice-actions{display:flex;gap:10px;justify-content:flex-end;}
.wc-voice-actions button{padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;}
.wc-voice-actions #wcVoiceCancel{background:#eee;color:#666;}
.wc-voice-actions #wcVoiceCancel:hover{background:#ddd;}
.wc-voice-actions #wcVoiceSend{background:var(--green-deep,#4aa663);color:#fff;}
.wc-voice-actions #wcVoiceSend:hover{opacity:.9;}
.wc-voice-bubble{
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
}
.wc-voice-bubble .wc-voice-play{display:flex;align-items:center;}
.wc-voice-bubble .wc-voice-bars{display:flex;gap:2px;align-items:center;}
.wc-voice-bubble .wc-voice-bars span{width:2px;background:currentColor;opacity:.5;border-radius:1px;height:4px;}
.wc-voice-bubble.playing .wc-voice-bars span{animation:wcVoiceBar 1s ease-in-out infinite;}
.wc-msg.user .wc-voice-bubble{background:var(--green-bubble,#95ec69);color:#fff;}
.wc-msg:not(.user) .wc-voice-bubble{background:#fff;color:#333;}
@keyframes wcVoiceBar{
  0%,100%{height:4px;opacity:.3}
  50%{height:14px;opacity:.9}
}
.wc-voice-dur{font-size:11px;opacity:.6;}
.wc-voice-transcript{background:#f0f0f0 !important;color:#333 !important;padding:4px 10px !important;border-radius:4px !important;display:inline-block;margin-top:4px;font-size:12px;line-height:1.5;}
.wc-time-divider{text-align:center;margin:6px 0 4px;line-height:1;}
.wc-time-divider span{
  display:inline-block;font-size:10px;color:#999;background:rgba(0,0,0,.06);
  padding:1px 8px;border-radius:8px;
}
.wc-cd-persona-btn{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px 4px 4px;border-radius:20px;
  background:rgba(255,255,255,.7);border:1px solid var(--green-soft);
  flex-shrink:0;
}
.wc-cd-persona-btn .wc-avatar{
  width:26px;height:26px;border-radius:50%;
  font-size:11px;
}
.wc-cd-persona-name{
  font-size:12px;color:var(--green-deep);font-weight:600;
  max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* sticker manager page */
.wc-sticker-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-sticker-page.show{transform:translateX(0);}
.wc-sticker-tabs{
  flex-shrink:0;display:flex;gap:6px;padding:8px 12px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  overflow-x:auto;align-items:center;
}
.wc-sticker-tabs::-webkit-scrollbar{display:none;}
.wc-sticker-tab{
  flex-shrink:0;padding:6px 14px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);color:var(--green-ink);
  font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;font-family:inherit;
}
.wc-sticker-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
.wc-sticker-tab-add{
  width:30px;height:30px;padding:0;border-radius:50%;
  background:var(--green-deep);color:#fff;border:none;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.wc-sticker-grid{
  flex:1;overflow-y:auto;padding:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  align-content:start;
}
.wc-sticker-grid::-webkit-scrollbar{width:0;}
.wc-sticker-item{
  border-radius:10px;background:rgba(255,255,255,.6);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;cursor:pointer;
}
.wc-sticker-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.wc-sticker-caption{
  padding:5px 6px;font-size:11px;color:var(--green-ink);
  line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

  font-size:13px;color:var(--green-ink-soft);
  font-weight:600;padding:10px 4px 6px;
}
.wc-ce-field{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;transition:background .12s;
}
.wc-ce-field:active{background:rgba(184,226,198,.2);}
.wc-ce-field + .wc-ce-field{border-top:1px solid rgba(214,236,217,.5);}
.wc-ce-label{
  font-size:14px;color:var(--green-ink);font-weight:500;
  min-width:70px;flex-shrink:0;
}
.wc-ce-value{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;
}
.wc-ce-text{
  font-size:14px;color:var(--green-ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:60%;text-align:right;
}
.wc-ce-arrow{color:var(--green-ink-soft);font-size:16px;flex-shrink:0;}
.wc-ce-avatar{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
}
.wc-ce-textarea{
  width:100%;min-height:80px;border:none;background:transparent;
  font-size:14px;color:var(--green-ink);font-family:inherit;
  outline:none;resize:vertical;padding:8px 0;line-height:1.5;
}
.wc-ce-input{
  flex:1;border:none;background:transparent;
  font-size:14px;color:var(--green-ink);font-family:inherit;
  outline:none;text-align:right;
}
.wc-ce-switch{
  width:44px;height:26px;border:none;border-radius:13px;
  background:rgba(0,0,0,.12);cursor:pointer;position:relative;transition:background .2s;
  padding:0;flex-shrink:0;
}
.wc-ce-switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;
}
.wc-ce-switch.on{background:var(--green-deep);}
.wc-ce-switch.on::after{left:21px;}
.wc-ce-npc-list{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 4px;
}
.wc-ce-npc-empty{
  grid-column:1/-1;color:var(--green-ink-soft);font-size:12px;padding:12px 0;text-align:center;
  border:1px dashed var(--line);border-radius:10px;
}
.wc-ce-npc-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:10px;
  background:rgba(184,226,198,.25);
  border:1px solid rgba(184,226,198,.4);
  cursor:pointer;transition:all .15s;
  min-width:0;
}
.wc-ce-npc-item:hover{
  background:rgba(184,226,198,.4);
}
.wc-ce-npc-item:active{transform:scale(.98);}
.wc-ce-npc-avatar{
  width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-soft),var(--green-mid));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.wc-ce-npc-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-ce-npc-info{flex:1;min-width:0;overflow:hidden;}
.wc-ce-npc-name{
  font-size:13px;font-weight:600;color:var(--green-deep);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wc-ce-npc-badge{
  font-size:10px;font-weight:500;padding:1px 5px;border-radius:7px;
  background:var(--green-deep);color:#fff;flex-shrink:0;
}
.wc-ce-npc-badge.dedicated{background:rgba(40,130,70,.15);color:var(--green-deep);border:1px solid rgba(40,130,70,.3);}
.wc-ce-npc-desc{
  font-size:11px;color:var(--green-ink-soft);margin-top:1px;
  display:flex;align-items:center;gap:4px;flex-wrap:nowrap;
  overflow:hidden;
}
.wc-ce-npc-tag-chip{
  display:inline-flex;align-items:center;
  padding:0 6px;border-radius:6px;
  background:rgba(184,226,198,.4);color:var(--green-deep);
  font-size:10px;font-weight:500;
  max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wc-ce-add-npc-row{
  display:flex;flex-direction:row;gap:8px;margin-top:10px;
}
.wc-ce-add-npc{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:10px 8px;border-radius:12px;
  border:1.5px dashed var(--green-deep);
  background:rgba(184,226,198,.1);color:var(--green-deep);
  font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;
  transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wc-ce-add-npc:hover{
  background:rgba(184,226,198,.25);border-color:var(--green-deep);
}
.wc-ce-add-npc:active{
  transform:scale(.97);
}
.wc-ce-delete-btn{
  display:block;width:calc(100% - 32px);margin:24px 16px 40px;
  padding:12px 0;border:none;border-radius:10px;
  background:#e74c3c;color:#fff;font-size:14px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:opacity .15s;
}
.wc-ce-delete-btn:active{opacity:.85;}

@keyframes wcFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  function getTags(){

  function avatarHTML(name, cls, avatar){
    if(avatar){
      return `<div class="wc-avatar ${cls||''}" style="background:linear-gradient(135deg,var(--green-soft),var(--green-mid))"><img src="${avatar}" alt=""></div>`;
    }
    const c = colorFor(name);
    const letter = name.charAt(0);
    return `<div class="wc-avatar ${cls||''}" style="background:linear-gradient(135deg,${c},${shade(c,-20)})">${letter}</div>`;
  }
  function shade(hex, percent){
    const num = parseInt(hex.slice(1),16);
    let r = (num >> 16) + percent, g = ((num >> 8) & 0x00FF) + percent, b = (num & 0x0000FF) + percent;
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }

  window.mountWeChatApp = function(container, Phone, onClose){

    let currentTab = 'chat';
    let chatHistory = {};
    const HISTORY_KEY = 'wechat_chat_history';

    function loadHistoryFromStorage(){
      try{
        const raw = localStorage.getItem(HISTORY_KEY);
        if(raw) chatHistory = JSON.parse(raw);
      }catch(e){ chatHistory = {}; }
    }
    function saveHistoryToStorage(){
      try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory)); }catch(e){}
    }
    loadHistoryFromStorage();

    function _timeOffsetFromLabel(label){
      if(!label) return 0;
      if(label.includes('刚刚')) return -60000;
      if(label.includes('秒')) return -30000;
      if(label.includes('分钟')) return -1800000;
      if(label.includes('小时')) return -3600000 * 3;
      if(label.includes('昨天')) return -86400000 - 3600000 * 5;
      if(label.includes('周一')) return -86400000 * 3;
      if(label.includes('周二')) return -86400000 * 2;
      if(label.includes('周三')) return -86400000;
      if(label.includes('周日')) return -86400000 * 4;
      if(/^\d{1,2}:\d{2}$/.test(label)) return -3600000 * 2;
      return -86400000 * 2;
    }

    function getHistory(chatId){
      if(!chatHistory[chatId]){
        const chat = MOCK_CHATS.find(c => c.id === chatId);
        if(!chat){ chatHistory[chatId] = []; return chatHistory[chatId]; }
        const baseTs = Date.now() + (_timeOffsetFromLabel(chat.time) || -3600000);
        if(chat.isGroup){
          const group = getGroups().find(g => g.id === chat.groupId);
          const members = group?.members.map(id => MOCK_CONTACTS.find(c=>c.id===id)).filter(Boolean) || [];
          const firstMember = members[0]?.name || '大家';
          chatHistory[chatId] = [
            { role:'ai', content:`大家好呀，欢迎来到${chat.name}～`, speakerName: firstMember, ts: baseTs }
          ];
        } else {
          const contact = MOCK_CONTACTS.find(c => c.id === chat.contactId);
          const lines = (contact?.openingLine || '').split('\n').filter(Boolean);
          if(lines.length){
            chatHistory[chatId] = lines.map((l,i) => ({ role:'ai', content:l, ts: baseTs - (lines.length - i - 1) * 60000 }));
          } else {
            chatHistory[chatId] = [
              { role:'ai', content:`你好呀～我是${chat.name}，最近怎么样？`, ts: baseTs }
            ];
          }
        }
      }
      return chatHistory[chatId];
    }

    function switchTab(tab){
      currentTab = tab;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      titleEl.textContent = TAB_TITLES[tab] || '微信';
      renderTab(tab);

    tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    app.querySelector('#wcPlusBtn').addEventListener('click', (e) => {

          <span>发起对话</span>
        </div>`;
            document.body.appendChild(menu);
      const rect = app.querySelector('#wcPlusBtn').getBoundingClientRect();
      menu.style.top = (rect.bottom + 6) + 'px';
      menu.style.right = (window.innerWidth - rect.right - 4) + 'px';
            menu.querySelectorAll('.wc-plus-item').forEach(it => {

    function openStartChat(){
      const opts = MOCK_CONTACTS.map(c => `<option value="${c.id}">${escAttr(c.name)}</option>`).join('');
      Phone.modal({
        title:'发起对话',
        fields:[{key:'contact',label:'选择联系人',type:'select',opts}],
        onOk: v => {
          const cid = v.contact;

          const c = MOCK_CONTACTS.find(x => x.id === cid);
          const exist = MOCK_CHATS.find(x => !x.isGroup && x.contactId === cid);
                   if(exist){ Phone.modal(null); return false; }
          const newChat = { id:'chat_'+cid, name:c.name, last:'开始聊天吧', time:'刚刚', unread:0, isGroup:false, contactId:cid };
          MOCK_CHATS.unshift(newChat);
          renderTab(currentTab);
          return v;

    function renderTab(tab){
      if(tab === 'chat') renderChatList();
      else if(tab === 'contacts') renderContacts();
      else if(tab === 'moments') renderMoments();
      else if(tab === 'me') renderMe();
    }

    document.addEventListener('wechat-data-updated', () => { renderTab(currentTab); });
    document.addEventListener('char-updated', () => { renderTab(currentTab); });

    function _fmtListTime(ts){
      if(!ts) return '';
      const d = new Date(ts);
      const d0 = new Date(); d0.setHours(0,0,0,0);
      const dm = new Date(ts); dm.setHours(0,0,0,0);
      const diffDay = Math.floor((d0 - dm) / 86400000);
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      if(diffDay === 0) return `${hh}:${mm}`;
      if(diffDay === 1) return `昨天`;
      if(diffDay < 7){
        const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        return wk;
      }
      return `${d.getMonth()+1}/${d.getDate()}`;
    }
    function _previewFromLastMsg(m, isGroup){
      if(!m) return '';
      if(m.type === 'sticker') return '[表情]';
      if(m.type === 'voice') return '[语音]';
      if(m.type === 'image') return '[图片]';
      if(m.type === 'video') return '[视频]';
      if(m.type === 'file') return '[文件]';
      let txt = m.content || '';
      txt = txt.replace(/\[表情[::][^\]]*\]/g, '[表情]');
      if(isGroup && m.role !== 'user' && m.speakerName){
        const me = Phone.getCurrentChar()?.name || '我';
        const who = m.speakerName === me ? '我' : m.speakerName;
        txt = (who || '') + '：' + txt;
      } else if(m.role === 'user'){
        txt = '我：' + txt;
      }
      return txt;
    }

    function renderChatList(){
      const groups = getGroups();
      const contacts = getContacts();
      const allTags = getTags();
      groups.forEach(g => {
        if(!MOCK_CHATS.some(c => c.isGroup && c.groupId === g.id)){
          MOCK_CHATS.unshift({
            id: 'chat_' + g.id, name: g.name,
            last: g.announcement ? '[群公告] ' + g.announcement.split('\n')[0] : '群聊已创建',
            time: '刚刚', unread: 0, isGroup: true, groupId: g.id
          });
        }
      });
      let html = '';
      const wechatData = Phone.getData('wechat') || {};
      const allSettings = wechatData.chatSettings || {};

      const validChats = MOCK_CHATS.filter(c => {
        if(c.isGroup){
          const g = groups.find(x => x.id === c.groupId);
          if(!g) return false;
          if(c.unread === undefined) c.unread = 0;
          c.pinned = !!(g.pinned);
        } else {
          const contact = contacts.find(x => x.id === c.contactId);
          if(!contact) return false;
          if(c.unread === undefined) c.unread = 0;
          c.pinned = false;
        }
        return true;
      });
      MOCK_CHATS.length = 0;
      MOCK_CHATS.push(...validChats);

      const enriched = MOCK_CHATS.map(c => {
        const hist = chatHistory[c.id] || [];
        let lastMsg = null, lastIdx = -1;
        for(let i = hist.length - 1; i >= 0; i--){
          const m = hist[i];
          if(m.role && m.role !== 'typing' && (m.content !== undefined || m.type)){ lastMsg = m; lastIdx = i; break; }
        }
        let preview, timeStr, ts;
        if(lastMsg){
          preview = _previewFromLastMsg(lastMsg, c.isGroup);
          ts = lastMsg.ts || 0;
          timeStr = _fmtListTime(ts);
        } else {
          preview = c.last || '';
          ts = 0;
          timeStr = c.time || '';
        }
        if(c.isGroup){
          const g = groups.find(x => x.id === c.groupId);
          if(g?.pinned) ts = ts + 86400000 * 36500;
        }
        return { c, preview, timeStr, ts };
      });

      enriched.sort((a,b) => b.ts - a.ts);

      enriched.forEach((item, i) => {
        const c = item.c;
        let displayName = c.name;
        let subName = '';
        if(c.isGroup){
          const group = groups.find(g => g.id === c.groupId);
          if(group && group.remark){
            displayName = group.remark;
            subName = c.name;
          }
        } else {
          const cs = allSettings[c.id] || {};
          if(cs.remark){
            displayName = cs.remark;
            subName = c.name;
          }
        }
        let avatarHtml;
        if(c.isGroup){
          const group = groups.find(g => g.id === c.groupId);
          if(group && group.avatar){
            avatarHtml = avatarHTML(group.name, '', group.avatar);
          } else {
            const memIds = group ? group.members : [];
            const mems = memIds.map(id => contacts.find(x=>x.id===id)).filter(Boolean).slice(0,4);
            avatarHtml = `<div class="wc-group-list-avatars">${mems.map(m => avatarHTML(m.name,'mini', m.avatar || '')).join('')}</div>`;
          }
        } else {
          const contact = contacts.find(x => x.id === c.contactId);
          avatarHtml = avatarHTML(c.name, '', contact?.avatar || '');
        }
        html += `<div class="wc-chat-item" data-id="${c.id}">
          ${avatarHtml}
          <div class="wc-chat-info">
            <div class="wc-chat-top"><span class="wc-chat-name">${escAttr(displayName)}</span><span class="wc-chat-time">${escAttr(item.timeStr)}</span></div>
            ${subName ? `<div class="wc-chat-subname">${escAttr(subName)}</div>` : ''}
            <div class="wc-chat-preview">${escAttr(item.preview)}</div>
          </div>
          ${c.unread ? `<span class="wc-badge">${c.unread}</span>` : ''}
        </div>`;
        if(i < enriched.length - 1) html += '<div class="wc-divider"></div>';
      });
      body.innerHTML = html;
      body.querySelectorAll('.wc-chat-item').forEach(el => {
        el.addEventListener('click', () => openChat(el.dataset.id));
      });
    }

    function renderContacts(){

    function openWallet(){
      function getWallet(){
        const d = Phone.getData('wechat');

      function saveWallet(w){
        const d = Phone.getData('wechat');

      const panel = document.createElement('div');
      panel.className = 'wc-chat-detail';

      function render(){
        const w = getWallet();
        let totalIn = 0, totalOut = 0;
        w.records.forEach(r => {
          if(r.type === 'in') totalIn += r.amount;
          else totalOut += r.amount;
        });
        const balance = totalIn - totalOut;

        let html = `<div class="wc-wallet-summary">
          <div class="wc-wallet-balance">
            <div class="wc-wallet-balance-label">余额</div>
            <div class="wc-wallet-balance-amount" style="color:${balance>=0?'#2aa36e':'#e74c3c'}">¥${balance.toFixed(2)}</div>
          </div>
          <div class="wc-wallet-sub-row">
            <div class="wc-wallet-sub-item">
              <div class="wc-wallet-sub-label">收入</div>
              <div class="wc-wallet-sub-amount in">+¥${totalIn.toFixed(2)}</div>
            </div>
            <div class="wc-wallet-sub-item">
              <div class="wc-wallet-sub-label">支出</div>
              <div class="wc-wallet-sub-amount out">-¥${totalOut.toFixed(2)}</div>
            </div>
          </div>
        </div>`;

        html += `<div class="wc-wallet-toolbar">
          <button class="wc-wallet-tab active" data-tab="all">全部</button>
          <button class="wc-wallet-tab" data-tab="in">收入</button>
          <button class="wc-wallet-tab" data-tab="out">支出</button>
          <button class="wc-wallet-extract" id="wcWalletExtract" title="从对话提取支出">💬 从对话提取</button>
        </div>`;

        const tab = body.querySelector('.wc-wallet-tab.active')?.dataset.tab || 'all';
        let records = [...w.records].sort((a,b) => b.ts - a.ts);
        if(tab !== 'all') records = records.filter(r => r.type === tab);

        if(!records.length){
          html += `<div class="wc-wallet-empty">暂无资金记录<br><span style="color:#bbb;font-size:12px">点击右上角 + 添加，或从对话提取</span></div>`;
        } else {
          html += `<div class="wc-wallet-list">`;
          records.forEach((r, idx) => {
            const time = new Date(r.ts);
            const timeStr = `${time.getMonth()+1}月${time.getDate()}日 ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
            const srcLabel = r.source === 'chat' ? '💬 对话' : '✏️ 手动';
            html += `<div class="wc-wallet-record" data-idx="${idx}">
              <div class="wc-wallet-record-left">
                <div class="wc-wallet-record-icon ${r.type}">${r.type === 'in' ? '+' : '-'}</div>
                <div class="wc-wallet-record-info">
                  <div class="wc-wallet-record-note">${escAttr(r.note || (r.type === 'in' ? '收入' : '支出'))}</div>
                  <div class="wc-wallet-record-meta">${srcLabel} · ${timeStr}</div>
                </div>
              </div>
              <div class="wc-wallet-record-amount ${r.type}">${r.type === 'in' ? '+' : '-'}¥${r.amount.toFixed(2)}</div>
              <button class="wc-wallet-del" data-del="${r.idx}" title="删除">×</button>
            </div>`;
          });
          html += `</div>`;
        }
        body.innerHTML = html;

        body.querySelectorAll('.wc-wallet-tab').forEach(el => {
          el.addEventListener('click', () => {
            body.querySelectorAll('.wc-wallet-tab').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            render();
          });
        });
        body.querySelectorAll('.wc-wallet-del').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const r = await Phone.modal({ title:'删除这条记录？', fields:[] });
            if(!r) return;
            const w2 = getWallet();
            const idx = parseInt(btn.dataset.del);
            w2.records.splice(idx, 1);
            saveWallet(w2);
            render();
          });
        });
        const exBtn = body.querySelector('#wcWalletExtract');
        if(exBtn){
          exBtn.addEventListener('click', extractFromChats);
        }

      async function extractFromChats(){
        const btn = body.querySelector('#wcWalletExtract');
        if(btn) { btn.disabled = true; btn.textContent = '分析中...'; }
        try{
          const allD = Phone.getData('wechat');
          const chatHist = allD.chatHistory || {};
          let allTexts = '';
          Object.entries(chatHist).forEach(([cid, msgs]) => {
            if(!Array.isArray(msgs)) return;
            const chatInfo = MOCK_CHATS.find(c => c.id === cid);
            const chatName = chatInfo ? chatInfo.name : cid;
            allTexts += `\n--- 和 ${chatName} 的对话 ---\n`;
            msgs.forEach(m => {
              if(m.content && !m.content.startsWith('[系统]') && !m.content.startsWith('[图片]')){
                const who = m.role === 'user' ? '我' : (m.speakerName || chatName);
                allTexts += `${who}：${m.content}\n`;
              }
            });
          });
          if(!allTexts.trim()){
            Phone.toast('没有对话记录可以分析');
            return;
          }

          const sys = `你是一个资金记录提取助手。分析下面的微信对话，从中提取所有明确提到的支出/消费行为。

规则：
1. 只提取对话中**明确提到金额或具体消费行为**的支出
2. 对于没有明确金额的，金额填 0
3. 对于有明确金额的（如"花了50块""付了120""咖啡35元""AA每人88"），提取数字
4. 返回严格的 JSON 数组，每个元素：{amount: 数字, note: "简短备注（如：给扬扬买咖啡）", source:"对话原文片段摘要"}
5. 如果没有任何支出，返回 []

只输出纯 JSON，不要有任何其他内容。`;
          const messages = [
            { role:'system', content:sys },
            { role:'user', content: allTexts.slice(-8000) }
          ];
          const reply = await Phone.chatWithAI(messages);
          let jsonStr = reply.trim();
          const start = jsonStr.indexOf('[');
          const end = jsonStr.lastIndexOf(']');
          if(start < 0 || end < 0) { Phone.toast('未提取到支出记录'); return; }
          jsonStr = jsonStr.slice(start, end+1);
          const items = JSON.parse(jsonStr);
          if(!Array.isArray(items) || !items.length){
            Phone.toast('对话中未发现支出记录');
            return;
          }

          const w = getWallet();
          let added = 0;
          items.forEach(it => {
            if(!it || typeof it.amount !== 'number') return;
            w.records.push({
              type: 'out',
              amount: it.amount,
              note: String(it.note || '对话消费').slice(0, 40),
              source: 'chat',
              sourceDetail: String(it.source || '').slice(0, 100),
              ts: Date.now()
            });
            added++;
          });
          saveWallet(w);
          Phone.toast(`从对话提取到 ${added} 条支出记录`);
          render();
        } catch(err){
          console.error(err);
          Phone.toast('提取失败，请重试');
        } finally {
          if(btn) { btn.disabled = false; btn.textContent = '💬 从对话提取'; }
        }
      }

      async function openAddModal(){
        const result = await Phone.modal({
          title:'添加资金记录',
          fields:[
            { key:'type', label:'类型', value:'out', type:'select', opts:'<option value="out">支出</option><option value="in">收入</option>' },
            { key:'amount', label:'金额（元）', value:'', type:'number', placeholder:'例如：50' },
            { key:'note', label:'备注', value:'', placeholder:'例如：买咖啡 / 发工资' }
          ],
          onOk: v => {
            const amt = parseFloat(v.amount);
            if(!amt || amt <= 0){ Phone.toast('请输入有效金额'); return null; }
            return {
              type: v.type,
              amount: amt,
              note: (v.note||'').trim()
            };
          }
        });
        if(!result) return;
        const w = getWallet();
        w.records.push({
          type: result.type,
          amount: result.amount,
          note: result.note || (result.type === 'in' ? '收入' : '支出'),
          source: 'manual',
          ts: Date.now()
        });
        saveWallet(w);
        render();
      }

        panel.classList.remove('show');

      const fieldMap = {
        name: { title:'修改名字', key:'name', label:'名字', value: char.name||'', type:'text' },

        patMsg: { title:'修改拍一拍', key:'patMsg', label:'拍一拍内容', value: profile.patMsg||'', type:'text' },
        signature: { title:'修改签名', key:'signature', label:'个性签名', value: profile.signature||'', type:'textarea' }
      };

      if(!cfg) return;

      const r = await Phone.modal({
        title: cfg.title,
        fields:[{ key: cfg.key, label: cfg.label, value: cfg.value, type: cfg.type, opts: cfg.opts }],
        onOk: v => {
          const val = (v[cfg.key]||'').trim();

            Phone.updateChar({ social: char.social });
          } else {

            Phone.updateChar({ wcProfile: profile });
          }
          return v;
        }
      });
      if(r) refreshProfileRow(detail, field);
    }

                {key:'identity',label:'身份',placeholder:'如：队友、同事',value:''},
                {key:'relationship',label:'关系',placeholder:'如：队友、朋友、亲戚',value:''}
              ]
            }).then(v => {
              if(v && v.name.trim()){

       const deleteBtn = body.querySelector('#wcCeDeleteBtn');

      function getBoundWorldbookNames(contact){
        const state = Phone._getState();
        const wbs = state.worldbooks || [];
        const ids = contact.worldbookIds || [];
        if(!ids.length) return '无';
        const names = wbs.filter(w => ids.includes(w.id)).map(w => w.name);
        return names.length ? names.join('、') : '无';
      }

      function openWorldbookPicker(contact, onDone){
        const state = Phone._getState();
        const wbs = state.worldbooks || [];
        const selected = new Set(contact.worldbookIds || []);
        const root = document.getElementById('modalRoot');
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        let body;
        if(!wbs.length){
          body = '<div style="font-size:13px;color:var(--green-ink-soft);padding:16px 0;text-align:center">暂无世界书，请先在世界书 App 中添加</div>';
        } else {
          body = wbs.map(wb => {
            const checked = selected.has(wb.id) ? 'checked' : '';
            return `<label style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;cursor:pointer">
              <input type="checkbox" data-wb-id="${wb.id}" ${checked} style="width:16px;height:16px;margin-top:2px">
              <div style="flex:1">
                <div style="font-size:13px;color:var(--green-ink)">${escAttr(wb.name)}${wb.global?' <span style="font-size:11px;color:var(--green-deep)">[全局]</span>':''}</div>
                <div style="font-size:11px;color:var(--green-ink-soft);margin-top:2px;white-space:pre-wrap;max-height:60px;overflow:hidden">${escAttr(wb.content||'')}</div>
              </div>
            </label>`;
          }).join('');
        }
        mask.innerHTML = `<div class="modal-box" style="animation:popIn .25s ease;max-height:80vh;overflow-y:auto">
          <h4>绑定世界书（可多选）</h4>
          <div>${body}</div>
          <div class="modal-actions"><button class="btn-cancel" data-act="cancel">取消</button>${wbs.length?'<button class="btn-ok" data-act="ok">确定</button>':''}</div>
        </div>`;
        root.appendChild(mask);
        const box = mask.querySelector('.modal-box');
        function dismiss(){ mask.style.animation='fadeIn .2s ease reverse'; box.style.animation='popIn .2s ease reverse'; setTimeout(()=>mask.remove(),180); }
        mask.addEventListener('click', e => {
          if(e.target === mask) dismiss();
          const act = e.target.dataset.act;
          if(act === 'cancel') dismiss();
          if(act === 'ok'){
            const ids = Array.from(mask.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.dataset.wbId);
            contact.worldbookIds = ids;
            dismiss();
            if(onDone) onDone();
          }
        });
      }

      // 返回按钮
      editPage.querySelector('.wc-ce-back').addEventListener('click', () => {
        editPage.classList.remove('show');
        setTimeout(() => editPage.remove(), 300);
      });

      render();
    }

    function uid(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

    function makeSubPage(title){
      const page = document.createElement('div');
      page.className = 'wc-sub-page';
      page.innerHTML = `<div class="wc-cd-topbar"><button class="wc-cd-back">‹</button><span class="wc-cd-title">${escAttr(title)}</span><div class="wc-sub-right"></div></div><div class="wc-sub-body"></div>`;
      app.appendChild(page);
      requestAnimationFrame(() => page.classList.add('show'));
      const body = page.querySelector('.wc-sub-body');
      const right = page.querySelector('.wc-sub-right');
      page.querySelector('.wc-cd-back').addEventListener('click', () => { page.classList.remove('show'); setTimeout(() => page.remove(), 300); });
      return { page, body, right };

    function openCreateGroup(){
      const { page, body } = makeSubPage('发起群聊');

      }

      avatarBar.querySelector('#wcCgAvatarCard').addEventListener('click', async () => {

          }
        });

      function updateAvatarPreview(){

          p.innerHTML = `<div class="wc-cg-avatar-placeholder">群</div>`;

      body.appendChild(avatarBar);

      const nameBar = document.createElement('div');

      body.appendChild(nameBar);

      const personaBar = document.createElement('div');
      personaBar.className = 'wc-cg-personabar';

        </div>`;

      function renderPersonaRow(){
        const row = personaBar.querySelector('#wcCgPersonaRow');

          row.innerHTML = `<div class="wc-cg-persona-tip" style="color:#c0392b">暂无可用人设，请先去"设置 → 人设"中创建</div>`;

        const curChar = getUserChar();

          <div class="wc-cg-persona-current" id="wcCgPersonaPick">

        row.querySelector('#wcCgPersonaPick').addEventListener('click', async () => {

          const r = await Phone.modal({

        if(id === 'user') return getUserChar().name || '我';
        const c = MOCK_CONTACTS.find(x=>x.id===id);
        return c ? c.name : '';
      }
      function memberAvatar(id){
        if(id === 'user'){
          const ch = getUserChar();
          return avatarHTML(ch.name || '我', '', ch.avatar || '');

        const c = MOCK_CONTACTS.find(x=>x.id===id);
        return c ? avatarHTML(c.name, '', c.avatar || '') : '';

        if(id === 'user'){

          return avatarHTML(ch.name || '我', 'chip', ch.avatar || '');

    function openGroupDetail(groupId){

      function getOwnerName(){

            packs = getStickerPacks();

            {key:'file',label:'或选择图片（可多选，选完记得在下方填含义）',type:'file',multiple:true},
            {key:'fcaptions',label:'上面图片的含义（每行一个，按顺序对应，可留空）',type:'textarea',value:'',placeholder:'威胁\n开心\n（空行表示不填含义）'}
          ],
          onOk: async v => {
            const active = getStickerPacks().find(p=>p.id===activeId);
            if(!active) return false;
            const urlRegex = /https?:\/\/[^\s"'<>]+/g;
            const capSplit = /：|:|\|/;
            (v.urls||'').split('\n').forEach(rawLine => {
              const line = rawLine.trim();
              if(!line) return;
              const matches = line.match(urlRegex);
              if(!matches) return;
              const url = matches[0];
              let caption = '';
              const idx = line.indexOf(url);
              if(idx > 0){
                const before = line.slice(0, idx).trim();
                caption = before.replace(capSplit, '').trim();
              }
              active.stickers.push({ id: uid(), src: url, caption });
            });
            const files = Array.isArray(v.file) ? v.file : (v.file ? [v.file] : []);
            const fCaps = (v.fcaptions||'').split('\n').map(s=>s.trim());
            for(let i=0; i<files.length; i++){
              const b64 = await Phone.fileToBase64(files[i]);
              active.stickers.push({ id: uid(), src: b64, caption: fCaps[i] || '' });
            }
            if(!active.stickers.length || (!urlRegex.test(v.urls||'') && !files.length)) return false;
            saveStickerPacks(getStickerPacks());
            render();
            return v;
          }
        });
      });

      page.querySelector('.wc-cd-back').addEventListener('click', () => {
        page.classList.remove('show');
        setTimeout(() => page.remove(), 300);
      });

      render();
    }

    function openStoryMode(chatId){
      const chat = MOCK_CHATS.find(c => c.id === chatId);
      if(!chat) return;
      const isGroup = !!chat.isGroup;
      const group = isGroup ? getGroups().find(g => g.id === chat.groupId) : null;
      let members = isGroup ? (group?.members.map(id => MOCK_CONTACTS.find(c=>c.id===id)).filter(Boolean) || []) : [];
      let char;
      if(isGroup && group?.userCharId){
        const allChars = (Phone._getState().characters || []);
        char = allChars.find(c => c.id === group.userCharId) || Phone.getCurrentChar();
      } else {
        char = Phone.getCurrentChar();
      }
      let userName = char.name || '我';
      let userAvatar = char.avatar || '';

      const wechatData = Phone.getData('wechat') || {};
      const cs = (wechatData.chatSettings || {})[chatId] || {};
      let displayName;
      if(isGroup && group?.remark) displayName = group.remark;
      else if(!isGroup && cs.remark) displayName = cs.remark;
      else displayName = chat.name;

      function getStoryHistory(){
        const d = Phone.getData('wechat');
        d.storyHistory = d.storyHistory || {};
        if(!d.storyHistory[chatId]) d.storyHistory[chatId] = [];
        return d.storyHistory[chatId];
      }
      function saveStoryHistory(h){
        const d = Phone.getData('wechat');
        d.storyHistory = d.storyHistory || {};
        d.storyHistory[chatId] = h;
        Phone.setData('wechat', d);
      }

      const panel = document.createElement('div');
      panel.className = 'wc-chat-detail';
      panel.innerHTML = `
        <div class="wc-cd-topbar">
          <button class="wc-cd-back">‹</button>
          <span class="wc-cd-title">线下 · ${escAttr(displayName)}</span>
        </div>
        <div class="wc-cd-messages" id="wcStoryMsgs"></div>
        <div class="wc-cd-input-area">
          <textarea class="wc-cd-input" id="wcStoryInput" placeholder="输入场景/动作/想法...（发送后AI会续写）" rows="1"></textarea>
          <button class="wc-cd-send" id="wcStorySend">${SVG.send}</button>
        </div>`;
      app.appendChild(panel);
      requestAnimationFrame(() => panel.classList.add('show'));

      const msgs = panel.querySelector('#wcStoryMsgs');
      const input = panel.querySelector('#wcStoryInput');
      const sendBtn = panel.querySelector('#wcStorySend');
      let history = getStoryHistory();
      let isReplying = false;

      function renderOneStoryMessage(m){
        const d = document.createElement('div');
        const isUserMsg = m.role === 'user';
        d.className = 'wc-msg ' + m.role;
        if(isUserMsg){
          d.innerHTML = `
            ${avatarHTML(userName, '', userAvatar)}
            <div>
              <div class="wc-msg-bubble">${escAttr(m.content)}</div>
            </div>`;
        } else {
          d.innerHTML = `
            <div style="display:flex;align-items:flex-end;gap:8px;max-width:85%">
              <div class="wc-msg-bubble" style="background:#fff">${escAttr(m.content)}</div>
            </div>`;
        }
        return d;
      }

      function renderMsgs(){
        msgs.innerHTML = '';
        if(!history.length){
          const empty = document.createElement('div');
          empty.style.cssText = 'text-align:center;color:#999;font-size:13px;padding:40px 20px;line-height:1.8';
          empty.innerHTML = `✨ 线下模式<br><span style="color:#bbb;font-size:12px">输入一个场景或动作，AI 会以第三人称续写</span>`;
          msgs.appendChild(empty);
          return;
        }
        history.forEach(m => msgs.appendChild(renderOneStoryMessage(m)));
        msgs.scrollTop = msgs.scrollHeight;
      }
      renderMsgs();

      function autoResize(){
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 100) + 'px';
      }
      input.addEventListener('input', autoResize);
      input.addEventListener('keydown', e => {
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          const val = input.value.trim();
          if(val) doSendAndReply(val);
        }
      });
      sendBtn.addEventListener('click', () => {
        const val = input.value.trim();
        if(val) doSendAndReply(val);
      });

      async function doSendAndReply(text){
        if(isReplying) return;
        isReplying = true;
        const ts = Date.now();
        history.push({ role:'user', content:text, ts });
        saveStoryHistory(history);
        input.value = ''; autoResize();
        renderMsgs();

        const t = document.createElement('div');
        t.className = 'wc-msg typing';
        t.innerHTML = `<div class="wc-typing-dots"><span></span><span></span><span></span></div>`;
        msgs.appendChild(t);
        msgs.scrollTop = msgs.scrollHeight;

        try{
          let sys;
          if(isGroup){
            sys = `你正在进行线下角色扮演。场景是群聊 "${chat.name}" 的一次离线RP场景。\n`;
            sys += `群成员：${members.map(m=>m.name).join('、')}\n`;
            const memberSettings = members.filter(m => m.roleSetting).map(m => `${m.name}：\n${m.roleSetting}`).join('\n\n');
            if(memberSettings) sys += `【角色人设】\n${memberSettings}\n`;
            sys += `用户 "${userName}" 给出了一个场景/动作/想法。\n`;
            sys += `⚠️ 这不是在线聊天！而是**线下故事补写**。你需要以第三人称叙事视角，描写角色们对用户输入的反应和接下来发生的事情。\n`;
            sys += `⚠️ 可以自由描写群内所有角色（${members.map(m=>m.name).join('、')}），但**严禁出现不在本群的无关人物**。\n`;
            sys += `⚠️ 允许使用括号、方括号、斜体等方式描写动作、表情、环境。可以有内心独白。\n`;
            sys += `⚠️ 至少写300字以上，用生动细腻的文笔，营造沉浸式的故事感。\n`;
            sys += `⚠️ 直接输出叙事段落，不要有任何前缀或格式。`;
          } else {
            const contact = MOCK_CONTACTS.find(c => c.id === chat.contactId);
            sys = `你正在进行线下角色扮演。你扮演的是 ${chat.name}。\n`;
            if(contact?.roleSetting) sys += `【你的人设】\n${contact.roleSetting}\n`;
            const userPersona = cs.persona || char.persona || '';
            if(userPersona) sys += `用户 "${userName}" 的人设：${userPersona}\n`;
            sys += `用户给出了一个场景/动作/想法。\n`;
            sys += `⚠️ 这不是在线聊天！而是**线下故事补写**。你需要以第三人称叙事视角，描写 ${chat.name} 对用户输入的反应和接下来发生的事情。\n`;
            sys += `⚠️ 可以描写 ${chat.name} 和用户，也可以在合理范围内出现其他角色，但**严禁出现与当前对话无关的人物**。\n`;
            sys += `⚠️ 允许使用括号、方括号、斜体等方式描写动作、表情、环境。可以有内心独白。\n`;
            sys += `⚠️ 至少写300字以上，用生动细腻的文笔，营造沉浸式的故事感。\n`;
            sys += `⚠️ 直接输出叙事段落，不要有任何前缀或格式。`;
          }

          let memSys = '';
          try {
            const allD = Phone.getData('wechat');
            const cm = allD.memories?.[chatId];
            if(cm?.core?.length){
              memSys += `\n\n【核心记忆 - 必须牢记】\n${cm.core.map(m => m.content).join('\n')}`;
            }
            if(cm?.storylines?.length){

      function formatTimestamp(ts, prevTs){
        if(!ts) return null;
        const d = new Date(ts);
        const pd = prevTs ? new Date(prevTs) : null;
        const MIN3 = 3 * 60 * 1000;
        if(!pd || (ts - prevTs) > MIN3){
          const d0 = new Date(); d0.setHours(0,0,0,0);
          const dm = new Date(ts); dm.setHours(0,0,0,0);
          const diffDay = Math.floor((d0 - dm) / 86400000);
          const hh = String(d.getHours()).padStart(2,'0');
          const mm = String(d.getMinutes()).padStart(2,'0');
          if(diffDay === 0) return `${hh}:${mm}`;
          if(diffDay === 1) return `昨天 ${hh}:${mm}`;
          if(diffDay < 7){
            const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
            return `${wk} ${hh}:${mm}`;
          }
          return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`;
        }
        return null;
      }
