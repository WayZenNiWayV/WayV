﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.wc-app{
  display:flex;flex-direction:column;flex:1;height:0;min-height:0;
  background:linear-gradient(180deg,var(--green-bg),#e6f5ec);
  position:relative;overflow:hidden;
}
.wc-app::before{
  content:"";position:absolute;top:-20%;left:-20%;width:70%;height:50%;
  background:radial-gradient(circle,rgba(124,204,155,.35) 0%,transparent 70%);
  pointer-events:none;
}
.wc-app::after{
  content:"";position:absolute;bottom:-10%;right:-20%;width:70%;height:50%;
  background:radial-gradient(circle,rgba(184,226,198,.4) 0%,transparent 70%);
  pointer-events:none;
}

.wc-topbar{flex-shrink:0;min-height:48px;padding:0 14px;
  display:flex;align-items:center;
    background:transparent;
  border-bottom:none;
  position:relative;z-index:5;
}
.wc-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:16px;font-weight:700;color:var(--green-ink);pointer-events:none;
}
.wc-top-actions{display:flex;gap:6px;margin-left:auto;}
.wc-back-btn{margin-right:auto;}
.wc-icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.6);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:16px;transition:transform .1s,background .15s;
}
.wc-icon-btn:active{transform:scale(.9);background:rgba(184,226,198,.6);}
.wc-icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.wc-body{
  flex:1;overflow-y:auto;position:relative;z-index:2;
  -webkit-overflow-scrolling:touch;
}
.wc-body::-webkit-scrollbar{width:0;}

.wc-tab-panel{display:none;animation:wcFade .25s ease;}
.wc-tab-panel.active{display:block;}
@keyframes wcFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* chat list */
.wc-chat-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;
  transition:background .12s;position:relative;
}
.wc-chat-item:active{background:rgba(184,226,198,.25);}
.wc-avatar{
  width:46px;height:46px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;
  overflow:hidden;position:relative;
}
.wc-avatar.group{border-radius:11px;}
.wc-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-chat-info{flex:1;min-width:0;}
.wc-chat-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.wc-chat-name{font-size:15px;font-weight:600;color:var(--green-ink);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-chat-time{font-size:11px;color:var(--green-ink-soft);flex-shrink:0;}
.wc-chat-preview{font-size:13px;color:var(--green-ink-soft);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-badge{
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:#ff5252;color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.wc-divider{height:1px;background:rgba(214,236,217,.6);margin-left:74px;}

/* contacts */
.wc-contacts-action{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;transition:background .12s;
}
.wc-contacts-action:active{background:rgba(184,226,198,.25);}
.wc-contacts-icon{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.wc-contacts-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-contacts-label{font-size:15px;color:var(--green-ink);font-weight:500;}
.wc-section-title{
  padding:14px 16px 4px;font-size:12px;color:var(--green-ink-soft);
  font-weight:600;letter-spacing:.5px;
}
.wc-contact-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 16px;cursor:pointer;transition:background .12s;
}
.wc-contact-item:active{background:rgba(184,226,198,.25);}
.wc-contact-name{font-size:14px;color:var(--green-ink);}

/* moments */
.wc-moments-banner{
  height:200px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7ccc9b 0%,#3fa96a 100%);
}
.wc-moments-banner::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2) 0%,transparent 45%);
}
.wc-moments-banner-cover{
  position:absolute;inset:0;object-fit:cover;width:100%;height:100%;
}
.wc-moments-user{
  position:absolute;right:16px;bottom:-26px;
  display:flex;align-items:flex-end;gap:10px;z-index:5;
}
.wc-moments-nick{
  font-size:15px;font-weight:700;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
  padding-bottom:6px;
}
.wc-moments-avatar{
  width:52px;height:52px;border-radius:10px;
  background:linear-gradient(135deg,var(--green-soft),var(--green-mid));
  border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:20px;font-weight:700;overflow:hidden;
}
.wc-moments-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-moments-list{padding:36px 16px 20px;}
.wc-moment-item{padding:14px 0;border-bottom:1px solid rgba(214,236,217,.5);}
.wc-moment-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.wc-moment-avatar{
  width:40px;height:40px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:15px;font-weight:600;overflow:hidden;
}
.wc-moment-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-moment-name{font-size:14px;font-weight:600;color:var(--green-deep);}
.wc-moment-content{font-size:14px;color:var(--green-ink);line-height:1.55;padding-left:50px;margin-bottom:8px;word-break:break-word;white-space:pre-wrap;}
.wc-moment-images{padding-left:50px;margin-bottom:8px;}
.wc-moment-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:200px;}
.wc-moment-img{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--green-soft);}
.wc-moment-img img{width:100%;height:100%;object-fit:cover;}
.wc-moment-time-row{display:flex;align-items:center;justify-content:space-between;padding-left:50px;}
.wc-moment-time{font-size:11px;color:var(--green-ink-soft);}
.wc-moment-actions{display:flex;gap:12px;}
.wc-moment-action{
  display:flex;align-items:center;gap:3px;font-size:11px;
  color:var(--green-ink-soft);cursor:pointer;border:none;background:none;
  padding:2px 0;
}
.wc-moment-action.liked{color:#ff5252;}
.wc-moment-action svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-moment-likes{
  background:rgba(240,248,240,.7);border-radius:6px;padding:7px 10px;
  margin:6px 0 4px 50px;font-size:12px;color:var(--green-deep);
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}
.wc-moment-likes svg{width:13px;height:13px;fill:#ff5252;stroke:none;flex-shrink:0;}

/* me page */
.wc-me-header{
  display:flex;align-items:center;gap:14px;padding:20px 16px 16px;
}
.wc-me-avatar{
  width:64px;height:64px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-soft),var(--green-mid));
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:26px;font-weight:700;overflow:hidden;border:2px solid #fff;
  box-shadow:0 4px 14px -4px rgba(40,130,70,.3);
}
.wc-me-avatar img{width:100%;height:100%;object-fit:cover;}
.wc-me-info{flex:1;min-width:0;}
.wc-me-name{font-size:20px;font-weight:700;color:var(--green-ink);}
.wc-me-id{font-size:13px;color:var(--green-ink-soft);margin-top:4px;}
.wc-me-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:14px;margin:0 16px 12px;overflow:hidden;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-me-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  cursor:pointer;transition:background .12s;
}
.wc-me-item:active{background:rgba(184,226,198,.2);}
.wc-me-item + .wc-me-item{border-top:1px solid rgba(214,236,217,.5);}
.wc-me-item-icon{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.wc-me-item-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-me-item-label{flex:1;font-size:14px;color:var(--green-ink);}
.wc-me-item-arrow{color:var(--green-ink-soft);font-size:14px;}

.wc-me-header-arrow{
  color:var(--green-ink-soft);font-size:22px;
  margin-left:auto;padding-right:4px;cursor:pointer;
  line-height:1;
}
.wc-me-avatar-wrap{cursor:pointer;}

.wc-wallet-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.wc-wallet-body::-webkit-scrollbar{width:0;}

.wc-fav-groups{
  display:flex;gap:8px;padding:10px 14px;overflow-x:auto;
  border-bottom:1px solid var(--line);flex-shrink:0;
  -webkit-overflow-scrolling:touch;
}
.wc-fav-groups::-webkit-scrollbar{display:none;}
.wc-fav-group-tab{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  padding:6px 14px;border-radius:16px;background:#f0f0f0;
  font-size:13px;color:#555;cursor:pointer;white-space:nowrap;
  transition:all .2s;
}
.wc-fav-group-tab.active{background:var(--green-deep);color:#fff;}
.wc-fav-group-count{
  font-size:11px;background:rgba(0,0,0,.1);padding:1px 6px;border-radius:8px;
}
.wc-fav-group-tab.active .wc-fav-group-count{background:rgba(255,255,255,.25);}
.wc-fav-group-del{
  font-size:16px;margin-left:2px;color:#999;cursor:pointer;line-height:1;
}
.wc-fav-group-tab.active .wc-fav-group-del{color:rgba(255,255,255,.8);}
.wc-fav-list{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;}
.wc-fav-list::-webkit-scrollbar{width:0;}
.wc-fav-empty{
  text-align:center;color:#999;padding:60px 20px;font-size:14px;
}
.wc-fav-item{
  background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;
}
.wc-fav-item-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.wc-fav-speaker{font-weight:600;font-size:13px;color:var(--green-deep);}
.wc-fav-meta{font-size:11px;color:#999;}
.wc-fav-content{
  font-size:14px;color:#333;line-height:1.5;word-break:break-word;
  margin-bottom:8px;white-space:pre-wrap;
}
.wc-fav-item-actions{
  position:absolute;top:8px;right:8px;display:flex;gap:6px;align-items:center;
}
.wc-fav-group-select{
  font-size:11px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;
  background:#fafafa;color:#555;outline:none;max-width:120px;
}
.wc-fav-del{
  width:24px;height:24px;padding:0;border:none;border-radius:50%;
  background:#fff0f0;color:#e74c3c;cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:14px;line-height:1;
}
.wc-fav-del:hover{background:#ffe0e0;}
.wc-wallet-summary{
  background:linear-gradient(135deg,#2aa36e,#5ab88a);color:#fff;
  border-radius:14px;padding:18px 20px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(42,163,110,.25);
}
.wc-wallet-balance-label{font-size:12px;opacity:.8;margin-bottom:4px}
.wc-wallet-balance-amount{font-size:28px;font-weight:700;letter-spacing:.5px;color:#fff}
.wc-wallet-sub-row{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.wc-wallet-sub-item{flex:1}
.wc-wallet-sub-label{font-size:11px;opacity:.8}
.wc-wallet-sub-amount{font-size:15px;font-weight:600;margin-top:2px}
.wc-wallet-sub-amount.in{color:#cdf5db}
.wc-wallet-sub-amount.out{color:#ffe0e0}
.wc-wallet-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.wc-wallet-tab{
  padding:6px 12px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--green-ink-soft);font-size:12px;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.wc-wallet-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.wc-wallet-extract{
  margin-left:auto;padding:6px 10px;border-radius:16px;border:none;
  background:rgba(142,68,173,.1);color:#8e44ad;font-size:12px;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.wc-wallet-extract:disabled{opacity:.5;cursor:not-allowed}
.wc-wallet-empty{
  text-align:center;color:#999;font-size:13px;
  padding:60px 20px;line-height:2;
}
.wc-wallet-list{display:flex;flex-direction:column;gap:6px}
.wc-wallet-record{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;position:relative;
}
.wc-wallet-record-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wc-wallet-record-icon{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;flex-shrink:0;
}
.wc-wallet-record-icon.in{background:#2aa36e}
.wc-wallet-record-icon.out{background:#e74c3c}
.wc-wallet-record-info{flex:1;min-width:0}
.wc-wallet-record-note{font-size:14px;color:var(--green-ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-wallet-record-meta{font-size:11px;color:var(--green-ink-soft);margin-top:2px}
.wc-wallet-record-amount{font-size:15px;font-weight:700;flex-shrink:0}
.wc-wallet-record-amount.in{color:#2aa36e}
.wc-wallet-record-amount.out{color:#e74c3c}
.wc-wallet-del{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border:none;background:rgba(0,0,0,.06);
  border-radius:50%;color:#888;font-size:14px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.wc-wallet-record:active .wc-wallet-del{opacity:1}

/* profile edit page */
.wc-profile-body{
  flex:1;overflow-y:auto;padding:14px 16px;
  -webkit-overflow-scrolling:touch;
}
.wc-profile-body::-webkit-scrollbar{width:0;}
.wc-profile-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:14px;overflow:hidden;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-profile-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;cursor:pointer;transition:background .12s;
}
.wc-profile-row:active{background:rgba(184,226,198,.2);}
.wc-profile-row + .wc-profile-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-profile-label{
  font-size:14px;color:var(--green-ink);font-weight:500;
  min-width:60px;flex-shrink:0;
}
.wc-profile-val{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;
}
.wc-profile-text{
  font-size:14px;color:var(--green-ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:60%;text-align:right;
}
.wc-profile-arrow{color:var(--green-ink-soft);font-size:16px;flex-shrink:0;}
.wc-profile-avatar{
  width:42px;height:42px;border-radius:10px;
}

/* bottom tab bar */
.wc-tabbar{
  flex-shrink:0;display:flex;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid rgba(255,255,255,.6);
  padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);
  position:relative;z-index:5;
}
.wc-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;padding:6px 0;min-height:46px;
  color:var(--green-ink-soft);transition:color .15s;
}
.wc-tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-tab.active{color:var(--green-deep);}
.wc-tab.active svg{fill:rgba(63,169,106,.15);}
.wc-tab-label{font-size:11px;font-weight:500;}

/* chat detail sub-page */
.wc-chat-detail{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1),padding-bottom .28s cubic-bezier(.32,.72,0,1);
  overflow:hidden;
}
.wc-chat-detail.show{transform:translateX(0) !important;}
.wc-cd-topbar{
  flex-shrink:0;min-height:48px;display:flex;align-items:center;gap:8px;
padding:0 12px;padding-top:calc(var(--phone-w) * 0.11);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;
}
.wc-cd-back{
  width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,.6);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;
}
.wc-cd-back:active{transform:scale(.9);}
.wc-cd-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:15px;font-weight:600;color:var(--green-ink);
  pointer-events:none;max-width:55%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wc-cd-right{display:flex;gap:4px;margin-left:auto;align-items:center;}
.wc-cd-heart{
  width:34px;height:34px;border-radius:50%;border:none;background:none;
  color:#ff6b8a;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s;
}
.wc-cd-heart:active{transform:scale(.85);}
.wc-cd-heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-cd-heart.pulse svg{animation:wcHeartPulse .6s ease;}
@keyframes wcHeartPulse{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.95)}100%{transform:scale(1)}}

/* 心声 panel */
.wc-heart-panel{
  position:absolute;inset:0;z-index:35;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fff5f7,#ffe8ee);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-heart-panel.show{transform:translateX(0) !important;}
.wc-heart-topbar{
  flex-shrink:0;min-height:48px;display:flex;align-items:center;gap:8px;
  padding:0 12px;padding-top:calc(var(--phone-w) * 0.11);
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.6);
  position:relative;
}
.wc-heart-topbar .wc-cd-back{background:rgba(255,255,255,.7);color:#ff6b8a;}
.wc-heart-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:15px;font-weight:600;color:#c44569;
}
.wc-heart-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
.wc-heart-body::-webkit-scrollbar{width:0;}
.wc-heart-empty{
  text-align:center;color:#c44569;padding:60px 20px;font-size:13px;line-height:1.8;
}
.wc-heart-item{
  background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;
  box-shadow:0 2px 10px rgba(196,69,105,.08);position:relative;
}
.wc-heart-item-time{font-size:11px;color:#c44569;opacity:.6;margin-bottom:6px;}
.wc-heart-item-content{font-size:14px;color:#5a3a45;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.wc-heart-del{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  border:none;background:rgba(196,69,105,.1);color:#c44569;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
}
.wc-heart-gen{
  flex-shrink:0;padding:12px 16px;background:rgba(255,255,255,.5);
  border-top:1px solid rgba(196,69,105,.15);
}
.wc-heart-gen-btn{
  width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#ff8fa3,#ff6b8a);color:#fff;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 14px rgba(255,107,138,.35);
}
.wc-heart-gen-btn:active{transform:scale(.98);}
.wc-heart-gen-btn:disabled{opacity:.5;cursor:not-allowed;}
.wc-heart-gen-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* 心声小弹窗 */
.wc-heart-popup{
  position:fixed;z-index:2000;width:280px;max-height:340px;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-radius:16px;box-shadow:0 8px 32px rgba(196,69,105,.18);
  border:1px solid rgba(255,255,255,.6);
  opacity:0;transform:translateY(-6px) scale(.96);
  transition:opacity .2s,transform .2s;
}
.wc-heart-popup.show{opacity:1;transform:translateY(0) scale(1);}
.wc-heart-popup-arrow{
  position:absolute;top:-7px;right:16px;width:14px;height:14px;
  background:rgba(255,255,255,.85);
  border-left:1px solid rgba(255,255,255,.6);
  border-top:1px solid rgba(255,255,255,.6);
  transform:rotate(45deg);
}
.wc-heart-popup-head{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid rgba(196,69,105,.1);
}
.wc-heart-popup-title{font-size:13px;font-weight:600;color:#c44569;}
.wc-heart-popup-close{
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(196,69,105,.1);color:#c44569;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
}
.wc-heart-popup-body{
  flex:1;overflow-y:auto;padding:10px 14px;min-height:60px;max-height:200px;
}
.wc-heart-popup-body::-webkit-scrollbar{width:3px;}
.wc-heart-popup-body::-webkit-scrollbar-thumb{background:rgba(196,69,105,.2);border-radius:3px;}
.wc-heart-popup-empty{
  text-align:center;font-size:12px;color:#c44569;padding:18px 6px;line-height:1.6;
}
.wc-heart-popup-item{
  background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;margin-bottom:8px;
}
.wc-heart-popup-time{font-size:10px;color:#c44569;opacity:.6;margin-bottom:3px;}
.wc-heart-popup-content{font-size:12px;color:#5a3a45;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.wc-heart-popup-foot{
  flex-shrink:0;padding:8px 14px;border-top:1px solid rgba(196,69,105,.1);
}
.wc-heart-popup-gen{
  width:100%;padding:8px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#ff8fa3,#ff6b8a);color:#fff;
  font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.wc-heart-popup-gen:active{transform:scale(.98);}
.wc-heart-popup-gen:disabled{opacity:.5;cursor:not-allowed;}
/* 聊天设置 page */
.wc-settings-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-settings-page.show{transform:translateX(0) !important;}
.wc-set-body{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;}
.wc-set-body::-webkit-scrollbar{width:0;}
.wc-set-card{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:16px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 4px 16px -8px rgba(40,130,70,.15);
}
.wc-set-profile{
  display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;
}
.wc-set-profile:active{background:rgba(184,226,198,.15);}
.wc-set-profile .wc-avatar{width:52px;height:52px;border-radius:12px;flex-shrink:0;}
.wc-set-profile-info{flex:1;min-width:0;}
.wc-set-profile-name{font-size:17px;font-weight:700;color:var(--green-ink);}
.wc-set-profile-sign{font-size:12px;color:var(--green-ink-soft);margin-top:3px;}
.wc-set-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .12s;
}
.wc-set-row:active{background:rgba(184,226,198,.2);}
.wc-set-row + .wc-set-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-set-label{font-size:14px;color:var(--green-ink);font-weight:500;flex-shrink:0;}
.wc-set-val{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;color:var(--green-ink-soft);font-size:13px;
}
.wc-set-val-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;text-align:right;}
.wc-set-arrow{color:var(--green-ink-soft);font-size:16px;flex-shrink:0;}
.wc-set-slider-row{
  padding:14px 16px;
}
.wc-set-slider-row + .wc-set-slider-row{border-top:1px solid rgba(214,236,217,.5);}
.wc-set-slider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wc-set-slider-head .wc-set-label{flex-shrink:0;}
.wc-set-slider-val{font-size:14px;color:var(--green-deep);font-weight:600;}
.wc-set-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--green-deep) 0%,var(--green-deep) var(--pct,50%),rgba(0,0,0,.1) var(--pct,50%),rgba(0,0,0,.1) 100%);
  outline:none;
}
.wc-set-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--green-ink);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);
  cursor:pointer;
}
.wc-set-slider::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--green-ink);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;
}
.wc-set-toggle{
  width:44px;height:26px;border:none;border-radius:13px;
  background:rgba(0,0,0,.12);cursor:pointer;position:relative;transition:background .2s;
  padding:0;flex-shrink:0;
}
.wc-set-toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;
}
.wc-set-toggle.on{background:var(--green-deep);}
.wc-set-toggle.on::after{left:21px;}
.wc-set-btn-green{
  display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:var(--green-deep);color:#fff;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin:4px 0;
}
.wc-set-btn-green:active{opacity:.9;}
.wc-set-btn-outline{
  display:block;width:100%;padding:13px;border:1.5px solid var(--green-ink);border-radius:12px;
  background:rgba(255,255,255,.5);color:var(--green-ink);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin:4px 0;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-outline:active{background:rgba(255,255,255,.3);}
.wc-set-btn-outline svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-btn-half-wrap{display:flex;gap:10px;}
.wc-set-btn-half-wrap .wc-set-btn-outline{flex:1;margin:0;}
.wc-set-btn-restart{
  display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:rgba(255,255,255,.6);color:var(--green-ink);font-size:14px;font-weight:500;
  font-family:inherit;cursor:pointer;margin-top:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-restart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-btn-delete{
  display:block;width:100%;padding:13px;border:1px solid #e74c3c;border-radius:12px;
  background:rgba(231,76,60,.06);color:#e74c3c;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.wc-set-btn-delete svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-set-sub-row{
  display:flex;align-items:center;gap:8px;padding:10px 16px 14px 16px;
  background:rgba(238,250,242,.5);
}
.wc-set-sub-label{font-size:12px;color:var(--green-ink-soft);}
.wc-set-sub-input{
  width:60px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
  font-size:14px;color:var(--green-ink);text-align:center;background:#fff;outline:none;
}
.wc-set-sub-input:focus{border-color:var(--green-deep);}
.wc-set-divider{height:14px;}

/* ========== 记忆 page ========== */
.wc-mem-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-mem-page.show{transform:translateX(0) !important;}
.wc-mem-body{flex:1;overflow-y:auto;padding:16px;}
.wc-mem-body::-webkit-scrollbar{width:0;}
.wc-mem-header{
  background:linear-gradient(135deg,#fff,#f4fbf6);
  border-radius:16px;padding:20px;margin-bottom:20px;
  box-shadow:0 4px 15px rgba(63,169,106,.1);
}
.wc-mem-title{font-size:16px;font-weight:600;color:var(--green-ink);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.wc-mem-title::before{content:'💭';font-size:18px;}
.wc-mem-stats{display:flex;gap:12px;}
.wc-mem-stat{flex:1;text-align:center;padding:12px;background:rgba(238,250,242,.6);border-radius:12px;}
.wc-mem-stat-num{font-size:22px;font-weight:700;color:var(--green-deep);}
.wc-mem-stat-label{font-size:11px;color:var(--green-ink-soft);margin-top:4px;}
.wc-mem-section{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 4px 15px rgba(63,169,106,.1);
  position:relative;padding-bottom:60px;transition:box-shadow .2s;
}
.wc-mem-section-head{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;
  padding:4px 0 10px;
}
.wc-mem-section-title{font-size:15px;font-weight:600;color:var(--green-ink);display:flex;align-items:center;gap:6px;margin:0;}
.wc-mem-section-title::before{content:'📝';font-size:16px;}
.wc-mem-section[data-kind="heart"] .wc-mem-section-title::before{content:'💗';}
.wc-mem-section[data-kind="core"] .wc-mem-section-title::before{content:'🧠';}
.wc-mem-section[data-kind="story"] .wc-mem-section-title::before{content:'🎬';}
.wc-mem-section-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 7px;border-radius:11px;
  background:rgba(63,169,106,.12);color:var(--green-deep);
  font-size:11px;font-weight:600;margin-left:4px;
}
.wc-mem-section-toggle{
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(63,169,106,.08);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s,background .2s;flex-shrink:0;
}
.wc-mem-section-toggle:hover{background:rgba(63,169,106,.18);}
.wc-mem-section-toggle svg{width:16px;height:16px;transition:transform .3s;}
.wc-mem-section.collapsed .wc-mem-section-toggle svg{transform:rotate(-90deg);}
.wc-mem-section-body{max-height:2000px;overflow:hidden;transition:max-height .35s ease,padding .25s;}
.wc-mem-section.collapsed .wc-mem-section-body{max-height:0;padding-top:0;padding-bottom:0;}
.wc-mem-section.collapsed{padding-bottom:16px;}
.wc-mem-list{display:flex;flex-direction:column;gap:10px;}
.wc-mem-empty{text-align:center;color:var(--green-ink-soft);padding:40px 16px;font-size:13px;line-height:1.6;}
.wc-mem-item{
  position:relative;background:rgba(238,250,242,.6);
  border-radius:12px;padding:12px 60px 12px 12px;
  border:1px solid rgba(214,236,217,.5);
}
.wc-mem-item-content{font-size:13px;color:var(--green-ink);line-height:1.5;margin-bottom:4px;white-space:pre-wrap;word-break:break-word;}
.wc-mem-item-time{font-size:11px;color:var(--green-ink-soft);}
.wc-mem-item-actions{
  position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s;
}
.wc-mem-item:hover .wc-mem-item-actions{opacity:1;}
.wc-mem-item-actions button{
  width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.wc-mem-edit-btn{background:rgba(63,169,106,.1);color:var(--green-deep);}
.wc-mem-del-btn{background:rgba(231,76,60,.1);color:#e74c3c;}
.wc-mem-add-btn{
  position:absolute;right:16px;bottom:16px;
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--green-deep);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(63,169,106,.4);
  transition:transform .2s,box-shadow .2s;
}
.wc-mem-add-btn:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(63,169,106,.5);}
.wc-mem-add-btn:active{transform:scale(.95);}
.wc-cd-messages{
  flex:1;overflow-y:auto;padding:12px 14px;
  display:flex;flex-direction:column;gap:12px;min-height:0;
}
.wc-cd-messages::-webkit-scrollbar{width:0;}
.wc-msg{
  display:flex;gap:8px;max-width:92%;align-items:flex-start;
}
.wc-msg .wc-avatar{width:36px;height:36px;flex-shrink:0;font-size:14px;}
.wc-msg-bubble{
  padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;position:relative;margin-top:2px;
}
.wc-msg-bubble::before,.wc-msg-bubble::after{display:none !important;}
.wc-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.wc-msg.user .wc-msg-bubble{background:#95ec69;color:#000;border-top-right-radius:4px;border-bottom-right-radius:18px;}
.wc-msg.ai{align-self:flex-start;}
.wc-msg.ai .wc-msg-bubble{background:#fff;border:1px solid #e0e0e0;color:#000;border-top-left-radius:4px;}
.wc-msg-quote{
  background:rgba(0,0,0,.06);border-left:3px solid rgba(0,0,0,.18);
  padding:6px 8px;margin-bottom:6px;border-radius:4px;font-size:12px;
  color:rgba(0,0,0,.6);line-height:1.4;word-break:break-word;
}
.wc-msg.user .wc-msg-quote{
  background:rgba(0,0,0,.08);border-left-color:rgba(0,0,0,.25);
}
.wc-msg-quote-speaker{font-weight:600;margin-right:4px;color:rgba(0,0,0,.55);}
.wc-recall-tip{
  display:inline-block;color:#999;
  font-size:12px;padding:3px 12px;border-radius:10px;
}
.wc-msg.system{display:flex;justify-content:center;width:100%;}
.wc-msg .wc-msg-name{
  font-size:11px;color:rgba(30,58,80,.55);margin-bottom:4px;line-height:1;
}
.wc-msg.user .wc-msg-name{text-align:right;}
.wc-msg.typing{align-self:flex-start;background:var(--green-bubble,#fff);border:1px solid rgba(0,0,0,.04);padding:10px 14px;border-radius:16px;position:relative;}
.wc-msg.typing::before{content:'';position:absolute;left:-6px;top:12px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid var(--green-bubble,#fff);}
.wc-typing-dots{display:flex;gap:4px;align-items:center;}
.wc-typing-dots span{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#a8d5a2,#4aa663);animation:wcDotBounce 1.2s ease-in-out infinite;}
.wc-typing-dots span:nth-child(1){animation-delay:0s;}
.wc-typing-dots span:nth-child(2){animation-delay:.2s;}
.wc-typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes wcDotBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.wc-cd-input{
  flex:1;border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;font-size:14px;color:var(--green-ink);font-family:inherit;
  outline:none;background:#fff;max-height:80px;resize:none;min-height:40px;
}
.wc-cd-input:focus{border-color:var(--green-deep);}
.wc-cd-send{
  width:40px;height:40px;border-radius:50%;background:var(--green-deep);
  color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.wc-cd-send:active{transform:scale(.9);}
.wc-cd-send:disabled{background:var(--line);cursor:not-allowed;}
.wc-cd-send svg{width:18px;height:18px;fill:currentColor;}
.wc-cd-voice-btn{
  width:40px;height:40px;border-radius:50%;background:#fff;color:#222;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s;
}
.wc-cd-voice-btn:active{transform:scale(.9);}
.wc-cd-voice-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transform:rotate(90deg);}
.wc-cd-plus-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:#fff;color:#222;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  padding:0;transition:transform .1s;
}
.wc-cd-plus-btn:active{transform:scale(.9);}
.wc-cd-plus-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-cd-plus-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:block;background:#eefaf2;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:14px 16px;gap:12px;
  height:240px;box-sizing:border-box;
  overflow-y:auto;
  transform:translateY(100%);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .18s;
}
.wc-cd-plus-panel.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.wc-plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.wc-plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .12s;}
.wc-plus-item:active{transform:scale(.93);}
.wc-plus-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);border:1px solid rgba(214,236,217,.6);box-shadow:0 2px 8px -3px rgba(40,130,70,.15);color:var(--green-deep);}
.wc-plus-icon svg{stroke:currentColor !important;fill:none;}
.wc-plus-item span{font-size:12px;color:var(--green-ink);}
.wc-voice-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.wc-voice-modal.show{display:flex;}
.wc-voice-modal-body{background:#fff;border-radius:16px;padding:20px 24px 16px;min-width:280px;text-align:center;}
.wc-voice-dots{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;margin-bottom:8px;}
.wc-voice-dots span{width:10px;height:10px;border-radius:50%;background:var(--green-deep,#4aa663);animation:wcDotBounce 1s ease-in-out infinite;}
.wc-voice-dots span:nth-child(2){animation-delay:.15s;}
.wc-voice-dots span:nth-child(3){animation-delay:.3s;}
@keyframes wcDotBounce{
  0%,80%,100%{transform:translateY(0);opacity:.4;}
  40%{transform:translateY(-10px);opacity:1;}
}
.wc-voice-tip{font-size:13px;color:#666;margin-bottom:12px;}
.wc-voice-preview{display:flex;flex-direction:column;gap:8px;margin-top:0;}
.wc-voice-preview textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;resize:none;font-family:inherit;outline:none;}
.wc-voice-preview textarea:focus{border-color:var(--green-deep);}
.wc-voice-meta{font-size:12px;color:var(--green-deep);text-align:left;}
.wc-voice-actions{display:flex;gap:10px;justify-content:flex-end;}
.wc-voice-actions button{padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;}
.wc-voice-actions #wcVoiceCancel{background:#eee;color:#666;}
.wc-voice-actions #wcVoiceCancel:hover{background:#ddd;}
.wc-voice-actions #wcVoiceSend{background:var(--green-deep,#4aa663);color:#fff;}
.wc-voice-actions #wcVoiceSend:hover{opacity:.9;}
.wc-voice-wrap{display:flex;flex-direction:column;gap:4px;max-width:210px;}
.wc-voice-bubble{
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  width:fit-content;max-width:200px;min-width:60px;box-sizing:border-box;
}
.wc-voice-bubble .wc-voice-play{display:flex;align-items:center;flex-shrink:0;}
.wc-voice-bubble .wc-voice-bars{display:flex;gap:2px;align-items:center;flex-shrink:0;}
.wc-voice-bubble .wc-voice-bars span{width:2px;background:currentColor;opacity:.5;border-radius:1px;height:4px;}
.wc-voice-bubble.playing .wc-voice-bars span{animation:wcVoiceBar 1s ease-in-out infinite;}
.wc-msg.user .wc-voice-bubble{background:var(--green-bubble,#95ec69);color:#fff;border-top-right-radius:4px;border-bottom-right-radius:18px;border-radius:18px;border-top-right-radius:4px;border-bottom-right-radius:18px;}
.wc-msg:not(.user) .wc-voice-bubble{background:#fff;color:#333;border:1px solid #e0e0e0;border-radius:18px;border-top-left-radius:4px;}
@keyframes wcVoiceBar{
  0%,100%{height:4px;opacity:.3}
  50%{height:14px;opacity:.9}
}
.wc-voice-dur{font-size:11px;opacity:.6;white-space:nowrap;flex-shrink:0;}
.wc-voice-transcript{
  background:rgba(0,0,0,.06);color:#333;
  padding:4px 10px;border-radius:6px;
  display:inline-block;font-size:12px;line-height:1.5;
  word-break:break-word;max-width:100%;
}

.wc-trans-btn{
  display:none;
}
.wc-trans-block{
  background:#f4f4f4;color:#333;
  padding:8px 12px;border-radius:8px;margin-top:4px;
  font-size:13px;line-height:1.6;word-break:break-word;
  max-width:240px;white-space:pre-wrap;
}
.wc-trans-foot{
  font-size:10px;color:#999;margin-top:3px;display:flex;align-items:center;gap:3px;
}
.wc-trans-foot::before{content:'✓';color:#1aad19;font-size:11px;line-height:1;}
.wc-time-divider{text-align:center;margin:6px 0 4px;line-height:1;}
.wc-time-divider span{
  display:inline-block;font-size:10px;color:#999;
  padding:1px 8px;border-radius:8px;
}
.wc-cd-persona-btn{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px 4px 4px;border-radius:20px;
  background:rgba(255,255,255,.7);border:1px solid var(--green-soft);
  flex-shrink:0;
}
.wc-cd-persona-btn .wc-avatar{
  width:26px;height:26px;border-radius:50%;
  font-size:11px;
}
.wc-cd-persona-name{
  font-size:12px;color:var(--green-deep);font-weight:600;
  max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* sticker manager page */
.wc-sticker-page{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-sticker-page.show{transform:translateX(0);}
.wc-sticker-tabs{
  flex-shrink:0;display:flex;gap:6px;padding:8px 12px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  overflow-x:auto;align-items:center;
}
.wc-sticker-tabs::-webkit-scrollbar{display:none;}
.wc-sticker-tab{
  flex-shrink:0;padding:6px 14px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);color:var(--green-ink);
  font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;font-family:inherit;
}
.wc-sticker-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
.wc-sticker-tab-add{
  width:30px;height:30px;padding:0;border-radius:50%;
  background:var(--green-deep);color:#fff;border:none;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.wc-sticker-grid{
  flex:1;overflow-y:auto;padding:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    align-content:start;
  grid-auto-rows:max-content;
}
.wc-sticker-grid::-webkit-scrollbar{width:0;}
.wc-sticker-item{
  border-radius:10px;background:rgba(255,255,255,.6);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;cursor:pointer;
}
.wc-sticker-item img{width:100%;aspect-ratio:1;object-fit:contain;display:block;}
.wc-sticker-caption{
  padding:5px 6px;font-size:11px;color:var(--green-ink);
  line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.4);
}
.wc-sticker-del{
  position:absolute;top:3px;right:3px;width:18px;height:18px;
  border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;
  font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.wc-sticker-fab{
  position:absolute;bottom:18px;right:18px;
  width:52px;height:52px;border-radius:50%;
  background:var(--green-deep);color:#fff;border:none;
  font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(40,130,70,.4);
  display:flex;align-items:center;justify-content:center;
}
.wc-sticker-fab:active{transform:scale(.92);}
.wc-sticker-empty{
  grid-column:1/-1;text-align:center;color:var(--green-ink-soft);
  padding:50px 20px;font-size:13px;line-height:1.6;
}
.wc-sticker-group-actions{display:none;}
.wc-stk-top-actions{display:flex;gap:2px;margin-left:auto;}

/* emoji picker in chat */
.wc-cd-emoji-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:#fff;color:#222;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  padding:0;transition:transform .1s;
}
.wc-cd-emoji-btn:active{transform:scale(.9);}
.wc-cd-emoji-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wc-emoji-picker{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  background:#eefaf2;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;
  height:260px;
  box-sizing:border-box;
  transform:translateY(100%);opacity:0;pointer-events:none;

}
.wc-emoji-picker.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.wc-emoji-tabs{
  display:flex;gap:4px;padding:8px 12px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;flex-shrink:0;
}
.wc-emoji-tabs::-webkit-scrollbar{display:none;}
.wc-emoji-tab{
  flex-shrink:0;padding:5px 12px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);color:var(--green-ink);
  font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;
}
.wc-emoji-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
.wc-emoji-grid{
  flex:1;overflow-y:auto;padding:10px;min-height:0;
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px; 
  align-content:start;
}
.wc-emoji-grid::-webkit-scrollbar{width:6px;}
.wc-emoji-grid::-webkit-scrollbar-thumb{background:rgba(63,169,106,.3);border-radius:2px;}
.wc-emoji-item{
  border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.6);display:flex;flex-direction:column;
  transition:transform .12s;
  min-height:60px;overflow:hidden;
}
.wc-emoji-item:active{transform:scale(.92);}
.wc-emoji-item img{width:100%;height:auto;display:block;}
.wc-emoji-cap{font-size:10px;color:var(--green-ink);padding:3px 2px;background:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;flex-shrink:0;}
.wc-emoji-empty{
  grid-column:1/-1;text-align:center;color:var(--green-ink-soft);
  padding:30px 16px;font-size:12px;
}
.wc-msg.image{padding:4px;background:none;border:none;max-width:50%;}
.wc-msg.image img{max-width:100%;border-radius:10px;display:block;}
.wc-msg-img-cap{font-size:12px;color:var(--green-ink);margin-top:4px;padding:0 4px;line-height:1.4;}

.wc-msg-bubble{position:relative;-webkit-user-select:none;user-select:none;cursor:default}
.wc-msg-bubble.selected{box-shadow:0 0 0 2px var(--green-deep)}
.wc-msg.selected{opacity:.6}
.wc-cm-menu{
  position:fixed;z-index:9999;background:#4a4a4a;border-radius:10px;
  padding:4px;display:grid;grid-template-columns:repeat(5,minmax(40px,auto));
  gap:2px;justify-content:center;box-sizing:border-box;
  max-width:calc(100vw - 16px);
  box-shadow:0 4px 20px rgba(0,0,0,.3);animation:cmPopIn .15s ease;
}
@keyframes cmPopIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.wc-cm-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:5px 6px;border-radius:7px;cursor:pointer;color:#fff;
  font-size:10px;white-space:nowrap;font-family:inherit;
  transition:background .1s;min-width:0;
}
.wc-cm-item:hover,.wccm-item:active{background:rgba(255,255,255,.15)}
.wc-cm-item svg{width:16px;height:16px;flex-shrink:0}
.wc-cm-item.danger{color:#ff6b6b}
.wc-cd-input-area{
  flex-shrink:0;padding:10px 12px;background:#eefaf2;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;flex-direction:row;align-items:center;gap:8px;
}
.wc-cd-input-row{
  display:flex;gap:8px;align-items:flex-end;width:100%;
}
.wc-cm-quote-bar{
  background:#f0f0f0;color:#888;border-radius:8px;
  padding:7px 10px;font-size:12px;width:100%;max-width:100%;
  box-sizing:border-box;display:flex;align-items:center;gap:8px;
  position:relative;animation:quoteSlideIn .2s ease;
  border-left:3px solid #ccc;
}
.wc-cm-quote-bar::before{display:none;}
.wc-cm-quote-bar .wc-quote-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-cm-quote-bar .wc-quote-close{cursor:pointer;font-size:16px;color:#999;line-height:1;padding:0 2px;flex-shrink:0;}
.wc-cm-quote-bar .wc-quote-close:hover{color:#666;}
@keyframes quoteSlideIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.wc-cm-multibar{
  position:sticky;bottom:0;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);padding:8px 14px;
  display:flex;gap:10px;align-items:center;z-index:5;
  border-top:1px solid var(--line);justify-content:flex-end;
}

.wc-sub-page{
  position:absolute;inset:0;z-index:25;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eefaf2,#e6f5ec);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.wc-sub-page.show{transform:translateX(0) !important;}
.wc-sub-body{flex:1;overflow-y:auto;padding-top:8px;}
.wc-sub-body::-webkit-scrollbar{width:0;}
.wc-sub-right{display:flex;align-items:center;gap:4px;padding-right:6px;}
.wc-icon-btn{
  width:32px;height:32px;border:none;border-radius:50%;
  color:var(--green-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.wc-icon-btn:active{background:rgba(0,0,0,.05);}
.wc-contacts-count{font-size:12px;color:var(--green-ink-soft);margin-left:auto;margin-right:4px}

.wc-group-avatars{
  width:44px;height:44px;border-radius:8px;overflow:hidden;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  gap:1px;background:rgba(255,255,255,.6);flex-shrink:0;
  border:1px solid rgba(214,236,217,.5);
}
.wc-group-avatars .avatar{width:100%;height:100%;font-size:11px;border-radius:0;}
.wc-group-more{
  grid-column:1/-1;font-size:10px;color:var(--green-ink-soft);
  background:rgba(184,226,198,.3);display:flex;align-items:center;justify-content:center;
  grid-row:2;
}

.wc-group-head{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  padding:18px 16px;background:rgba(255,255,255,.4);
  border-bottom:1px solid rgba(214,236,217,.5);
}
.wc-group-mem{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.wc-group-mem .avatar{width:42px;height:42px;font-size:13px;}
.wc-group-mem-name{font-size:11px;color:var(--green-ink);max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wc-group-mem-rm{
  position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;
  background:rgba(231,76,60,.9);color:#fff;border:none;font-size:13px;line-height:1;
  cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;
}
.wc-group-add .avatar{background:rgba(184,226,198,.5);color:var(--green-deep);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px dashed var(--green-deep);}
.wc-group-mem-plus{
  width:42px;height:42px;border-radius:8px;background:rgba(184,226,198,.5);
  border:1px dashed var(--green-deep);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:300;
}

.wc-switch{
  width:44px;height:26px;border:none;border-radius:13px;
  background:rgba(0,0,0,.12);cursor:pointer;position:relative;transition:background .2s;
  padding:0;
}
.wc-switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;
}
.wc-switch.on{background:var(--green-deep);}
.wc-switch.on::after{left:21px;}

.wc-group-exit{
  display:block;width:calc(100% - 32px);margin-left:16px;
  padding:12px 0;border:none;border-radius:10px;
  background:rgba(255,255,255,.7);font-size:14px;cursor:pointer;
  color:var(--green-ink);font-family:inherit;
}
.wc-group-exit:active{background:rgba(255,255,255,.5);}

.wc-tag-check{
  width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);
  background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.wc-tag-check.on{
  background:var(--green-deep);border-color:var(--green-deep);
}
.wc-tag-check.on::after{
  content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);
}
.wc-group-minus{
  width:42px;height:42px;border-radius:8px;background:rgba(231,76,60,.15);
  border:1px dashed #e74c3c;color:#e74c3c;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:300;
  cursor:pointer;
}
.wc-group-minus-mode .wc-group-mem-rm{display:flex;}
.wc-chat-subname{
  font-size:12px;color:var(--green-ink-soft);
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wc-group-user-badge{
  position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  font-size:9px;color:#fff;background:var(--green-deep);padding:0 3px;
  border-radius:3px;line-height:1.4;white-space:nowrap;
}
.wc-plus-menu{
  position:fixed;z-index:1000;width:150px;background:#fff;
  border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);
  overflow:hidden;animation:wcFade .15s ease-out;
}
.wc-plus-menu .wc-plus-item{
  display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;
  font-size:13px;color:var(--green-ink);cursor:pointer;
  transition:background .15s;
}

.wc-plus-menu .wc-plus-item:hover{background:rgba(230,245,233,.6);}
.wc-plus-menu .wc-plus-item:not(:last-child){border-bottom:1px solid rgba(214,236,217,.5);}
.wc-plus-menu .wc-plus-item svg{width:18px;height:18px;color:var(--green-deep);flex-shrink:0;}
/* 创建群聊 page */

.wc-cg-avatar-card{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(255,255,255,.55);border-radius:14px;border:1px solid rgba(214,236,217,.5);cursor:pointer;transition:background .15s;}
.wc-cg-avatar-card:active{background:rgba(230,245,233,.8);}

.wc-cg-avatar-hint-title{font-size:14px;color:var(--green-ink);font-weight:500;}

.wc-cg-namebar{

  padding:6px 14px;border:none;border-radius:16px;font-size:13px;font-weight:600;
