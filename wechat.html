            .map(c => `<option value="${c.id}">${escAttr(c.name)}</option>`).join('');
          Phone.modal({
            title:'添加成员',
            fields:[{key:'member',label:'选择联系人',type:'select',opts}]
          }).then(v => {
            if(v && v.member){ g.members.push(v.member); saveGroups(groups); render(); }
          });
        });
        card.querySelectorAll('[data-field]').forEach(row => {
          row.addEventListener('click', () => {
            const field = row.dataset.field;
            const label = field==='name'?'群聊名称':field==='announcement'?'群公告':'备注';
            const cur = field==='name'?g.name:field==='announcement'?g.announcement:g.remark;
            const type = field==='announcement'?'textarea':'text';
            Phone.modal({
              title:'编辑' + label,
              fields:[{key:'val',label:label,type,value:cur||'',placeholder:'请输入'}],
              onOk: v => {
                const val = (v.val||'').trim();
                if(field==='name'){ if(!val) return false; g.name = val; }
                else if(field==='announcement') g.announcement = val;
                else g.remark = val;
                saveGroups(groups); render();
                return v;
              }
            });
          });
        });
        swCard.querySelectorAll('.wc-switch').forEach(sw => {
          sw.addEventListener('click', () => {
            if(sw.dataset.sw === 'dnd') g.doNotDisturb = !g.doNotDisturb;
            if(sw.dataset.sw === 'pin') g.pinned = !g.pinned;
            saveGroups(groups); render();
          });
        });
        swCard.querySelector('[data-field="manage"]').addEventListener('click', () => {
          showGroupManage();
        });
        exitBtn.addEventListener('click', () => {
          if(!confirm(`确定退出群聊「${g.name}」？`)) return;
          groups.splice(idx, 1);
          saveGroups(groups);
          page.classList.remove('show'); setTimeout(() => page.remove(), 300);
          renderTab(currentTab);
        });
      }

      function showGroupManage(){
        const { page: mp, body: mb } = makeSubPage('群管理');
        const char = Phone.getCurrentChar();
        const userName = char.name || '我';
        const userAvatar = char.avatar || '';
        let mems = g.members.map(id => MOCK_CONTACTS.find(c=>c.id===id)).filter(Boolean);
        {
          const oid = g.owner || 'user';
          const ownerMember = oid === 'user' ? null : MOCK_CONTACTS.find(c=>c.id===oid);
          if(ownerMember){ mems = [ownerMember, ...mems.filter(m => m.id !== ownerMember.id)]; }
        }

        function mkOwnerItem(id, name, avatar, isOn){
          return `<div class="wc-cg-row ${isOn?'on':''}" data-owner="${id}">
            <div class="wc-cg-indicator">${isOn?'✓':''}</div>
            ${avatarHTML(name, '', avatar || '')}
            <div class="wc-cg-row-name">${escAttr(name)}${id==='user'?' <span class="wc-cg-badge">用户</span>':''}</div>
          </div>`;
        }

        mb.innerHTML = `<div class="wc-cg-block-title" style="padding:16px 16px 8px">转让群主（谨慎操作）</div>
          <div class="wc-cg-list">
            ${mkOwnerItem('user', userName, userAvatar, g.owner==='user')}
            ${mems.map(m => mkOwnerItem(m.id, m.name, m.avatar || '', g.owner===m.id)).join('')}
          </div>`;

        mb.querySelectorAll('.wc-cg-row').forEach(it => {
          it.addEventListener('click', () => {
            const newOwner = it.dataset.owner;
            if(newOwner === g.owner){ mp.classList.remove('show'); setTimeout(()=>mp.remove(),300); return; }
            const name = it.querySelector('.wc-cg-row-name').textContent.trim();
            if(!confirm(`确定将群主转让给 ${name}？`)) return;
            g.owner = newOwner;
            saveGroups(groups);
            mp.classList.remove('show'); setTimeout(()=>mp.remove(),300);
            page.classList.remove('show'); setTimeout(()=>page.remove(),300);
            openGroupDetail(g.id);
          });
        });
      }

      render();
      const onDataUpdated = () => {
        const fresh = getGroups().find(gg => gg.id === groupId);
        if(fresh){ Object.assign(g, fresh); render(); }
      };
      document.addEventListener('wechat-data-updated', onDataUpdated);
      document.addEventListener('char-updated', onDataUpdated);
      const origRemove = page.remove.bind(page);
      page.remove = () => {
        document.removeEventListener('wechat-data-updated', onDataUpdated);
        document.removeEventListener('char-updated', onDataUpdated);
        origRemove();
      };
    }

      plus.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

        Phone.modal({
          title:'新建标签',
          fields:[{key:'name',label:'标签名称',value:'',placeholder:'例如：亲友、同事'}],

    function openTagEdit(tagId){
      const tags = getTags();
      const idx = tags.findIndex(t => t.id === tagId);
      if(idx < 0) return;
      const t = tags[idx];
      const { page, body, right } = makeSubPage('标签成员');

      const renameBtn = document.createElement('button');
      renameBtn.className = 'wc-icon-btn'; renameBtn.style.background = 'none';
      renameBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
      renameBtn.title = '重命名';
      right.appendChild(renameBtn);
      renameBtn.addEventListener('click', () => {
        Phone.modal({
          title:'重命名标签',
          fields:[{key:'name',label:'标签名称',value:t.name}],
          onOk: v => {
            const name = (v.name||'').trim();
            if(!name) return false;
            t.name = name; saveTags(tags); page.querySelector('.wc-cd-title').textContent = t.name; render();
            return v;
          }
        });
      });

      function render(){
        const allContacts = MOCK_CONTACTS;
        body.innerHTML = '';
        const head = document.createElement('div');
        head.style.cssText = 'padding:14px 16px;font-size:13px;color:var(--green-ink-soft)';
        head.textContent = `标签「${t.name}」共 ${t.memberIds.length} 位成员（一个联系人可同时存在于多个标签）`;
        body.appendChild(head);

        const card = document.createElement('div');
        card.className = 'wc-profile-card';
        allContacts.forEach(c => {
          const checked = t.memberIds.includes(c.id);
          const row = document.createElement('div');
          row.className = 'wc-profile-row';
          row.innerHTML = `
            ${avatarHTML(c.name, '', c.avatar || '')}
            <span style="flex:1;font-size:14px;color:var(--green-ink)">${escAttr(c.name)}</span>
            <span class="wc-tag-check ${checked?'on':''}" data-id="${c.id}"></span>`;
          row.querySelector('.wc-tag-check').addEventListener('click', e => {
            e.stopPropagation();
            if(checked) t.memberIds = t.memberIds.filter(id => id !== c.id);
            else t.memberIds.push(c.id);
            saveTags(tags); render();
          });
          card.appendChild(row);
        });
        body.appendChild(card);

        const delBtn = document.createElement('button');
        delBtn.className = 'wc-group-exit';
        delBtn.textContent = '删除标签';
        delBtn.style.color = '#e74c3c';
        delBtn.style.marginTop = '24px';
        body.appendChild(delBtn);
        delBtn.addEventListener('click', () => {
          if(!confirm(`确定删除标签「${t.name}」？联系人不会被删除，只是移除分组归属。`)) return;
          tags.splice(idx, 1);
          saveTags(tags);
          page.classList.remove('show'); setTimeout(() => page.remove(), 300);
        });
      }
      render();
      page.querySelector('.wc-cd-title').textContent = t.name;
    }

      function formatTimestamp(ts, prevTs){
        if(!ts) return null;
        const d = new Date(ts);
        const pd = prevTs ? new Date(prevTs) : null;
        const MIN3 = 3 * 60 * 1000;
        if(!pd || (ts - prevTs) > MIN3){
          const d0 = new Date(); d0.setHours(0,0,0,0);
          const dm = new Date(ts); dm.setHours(0,0,0,0);
          const diffDay = Math.floor((d0 - dm) / 86400000);
          const hh = String(d.getHours()).padStart(2,'0');
          const mm = String(d.getMinutes()).padStart(2,'0');
          if(diffDay === 0) return `${hh}:${mm}`;
          if(diffDay === 1) return `昨天 ${hh}:${mm}`;
          if(diffDay < 7){
            const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
            return `${wk} ${hh}:${mm}`;
          }
          return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`;
        }
        return null;
      }

      async function showEditMessageModal(initialContent, isAIMessage){
        return new Promise((resolve) => {
          const root = document.getElementById('modalRoot');
          const mask = document.createElement('div');
          mask.className = 'modal-mask';
          
          mask.innerHTML = `
            <div class="modal-box" style="animation:popIn .25s ease;max-width:400px;width:90%">
              <h4>编辑消息</h4>
              <div style="margin:12px 0">
                <textarea id="editMsgTextarea" style="width:100%;min-height:100px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical;box-sizing:border-box;line-height:1.5">${escAttr(initialContent)}</textarea>
              </div>
              <div style="margin-bottom:12px"><button id="editMsgSplitBtn" style="width:100%;padding:8px;border:1px solid var(--green-deep);border-radius:8px;background:transparent;color:var(--green-deep);cursor:pointer;font-size:13px">分割</button></div>
              <div class="modal-actions">
                <button class="btn-cancel" data-act="cancel">取消</button>
                <button class="btn-ok" data-act="ok">保存</button>
              </div>
            </div>
          `;
          
          root.appendChild(mask);
          const box = mask.querySelector('.modal-box');
          const textarea = mask.querySelector('#editMsgTextarea');
          const splitBtn = mask.querySelector('#editMsgSplitBtn');
          
          function dismiss(){ 
            mask.style.animation='fadeIn .2s ease reverse'; 
            box.style.animation='popIn .2s ease reverse'; 
            setTimeout(()=>{ mask.remove(); },180); 
          }
          
          if(splitBtn){
            splitBtn.addEventListener('click', () => {
              const full = textarea.value;
              const parts = full.split('\n').map(s => s.trim()).filter(Boolean);
              resolve({ action: 'split', parts });
              dismiss();
            });
          }
          
          textarea.addEventListener('keydown', e => {
            if(e.key === 'Escape'){
              resolve(null);
              dismiss();
            }
          });
          
          mask.addEventListener('click', e => {
            if(e.target===mask) { resolve(null); dismiss(); }
            if(e.target.dataset.act==='cancel') { resolve(null); dismiss(); }
            if(e.target.dataset.act==='ok') { 
              resolve(textarea.value); 
              dismiss(); 
            }
          });
          
          setTimeout(() => textarea.focus(), 100);
        });
      }

          const foot = document.createElement('div');

      async function handleMenuAction(key, el){
        const idx = parseInt(el.dataset.msgIdx);
        const isUser = el.dataset.isUser === '1';
        const content = el.dataset.content || '';
        const h = getHistory(chatId);
        const msg = h[idx];
        if(!msg) return;

        switch(key){
          case 'copy':{
            navigator.clipboard.writeText(content).then(() => Phone.toast('已复制')).catch(() => {
              const ta = document.createElement('textarea'); ta.value = content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); Phone.toast('已复制');
            });
            break;
          }
          case 'edit':{
            const result = await showEditMessageModal(content, msg.role === 'ai');
            if(result && typeof result === 'object' && result.action === 'split'){
              const h = getHistory(chatId);
              const pos = parseInt(el.dataset.msgIdx);
              const target = h[pos];
              if(!target){ break; }
              const parts = result.parts;
              if(parts.length === 0){ Phone.toast('内容为空'); break; }
              target.content = parts[0];
              target.edited = true;
              const newMsgs = parts.slice(1).map((text, i) => Object.assign({}, target, { content: text, ts: Date.now() + i }));
              h.splice(pos + 1, 0, ...newMsgs);
              saveHistoryToStorage(); renderMsgs();
              Phone.toast('已分割为' + parts.length + '条');
            } else if(result && typeof result === 'string' && result !== content){
              msg.content = result; msg.edited = true;
              saveHistoryToStorage(); renderMsgs();
              Phone.toast('已修改');
            }
            break;
          }
          case 'quote':{
            const bubble = el.querySelector('.wc-msg-bubble');
            const inputArea = detail.querySelector('#wcCdInputArea');
            const inputRow = inputArea.querySelector('.wc-cd-input-row');
            const inputEl = detail.querySelector('#wcCdInput');
            if(inputEl && inputArea && inputRow){
              const speakerName = msg.speakerName || (msg.role === 'user' ? userName : chat.name);
              inputEl.dataset.quoteIdx = idx;
              inputEl.dataset.quoteText = content.slice(0, 50);
              inputEl.dataset.quoteSpeaker = speakerName;
              const existing = inputArea.querySelector('.wc-cm-quote-bar');
              if(existing) existing.remove();
              const qbar = document.createElement('div');
              qbar.className = 'wc-cm-quote-bar';
              qbar.innerHTML = `<span class="wc-quote-text">${escAttr(speakerName)}: ${escAttr(content.slice(0,40))}${content.length>40?'...':''}</span><span class="wc-quote-close" id="wcQuoteClose">×</span>`;
              inputArea.insertBefore(qbar, inputRow);
              qbar.querySelector('#wcQuoteClose').addEventListener('click', () => {
                delete inputEl.dataset.quoteIdx; delete inputEl.dataset.quoteText; delete inputEl.dataset.quoteSpeaker;
                qbar.remove();
              });
              inputEl.focus();
            }
            break;
          }
          case 'multi':{
            toggleMultiSelect(el, idx);
            break;
          }
          case 'fav':{
            const d = Phone.getData('wechat');
            d.favorites = d.favorites || [];
            const exists = d.favorites.some(f => f.chatId === chatId && f.msgIdx === idx);
            if(exists){ Phone.toast('已收藏过'); return; }
            d.favorites.push({ id:'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), groupId:'default', chatId, msgIdx:idx, content, speakerName:msg.speakerName||chat.name, role:msg.role, ts:Date.now() });
            Phone.setData('wechat', d); Phone.toast('已收藏');
            break;
          }
          case 'recall':{
            msg.recalled = true;
            msg.content = '';
            msg.type = undefined;
            saveHistoryToStorage();
            renderMsgs();
            Phone.toast('已撤回');
            break;
          }
          case 'del':{
            const r = await Phone.modal({ title:'确定删除这条消息？', fields:[] });
            if(!r) return;
            h.splice(idx, 1); saveHistoryToStorage(); renderMsgs(); Phone.toast('已删除');
            break;
          }
          case 'trans':{
            toggleTranslate(el, content);
            break;
          }
          case 'rewrite':{
            const r = await Phone.modal({
              title:'重写回复',
              fields:[
                {key:'hint',label:'提示词（可选）',value:'',type:'textarea',placeholder:'描述你希望的回复方向、语气、剧情发展等，留空则直接重新生成'}
              ],
              buttons:[
                {text:'直接生成',value:'auto',style:'success'},
                {text:'按提示生成',value:'hint',style:'primary'},
                {text:'取消',value:'cancel',style:'ghost'}
              ]
            });
            if(!r || r === 'cancel') return;
            const hint = r === 'hint' ? '' : (r.hint || '');
            const bubble = el.querySelector('.wc-msg-bubble');
            bubble.innerHTML = `<div class="wc-typing-dots"><span></span><span></span><span></span></div>`;
            try{
              let sys = buildSystemPrompt(true);
              if(hint) sys += `\n\n【用户指定的回复方向】\n${hint}`;
              const ctxMessages = buildContextMessages(idx);
              const rawReply = await Phone.chatWithAI(ctxMessages);
              let finalText = rawReply.trim();
              const contact = chat.contactId ? MOCK_CONTACTS.find(c => c.id === chat.contactId) : null;
              if(contact?.fontType === '繁体') finalText = toTraditional(finalText);
              msg.content = finalText; saveHistoryToStorage();
              renderMsgs(); Phone.toast('已重写');
            } catch(e){
              bubble.textContent = content; Phone.toast('重写失败');
            }
            break;
          }
        }
      }

      function buildSystemPrompt(forRewrite){
        let sys;
        if(isGroup){
          sys = `你在微信群聊 "${chat.name}" 中。\n`;
          sys += `群成员：${members.map(m=>m.name).join('、')}\n`;
          const ms = members.filter(m=>m.roleSetting).map(m=>`${m.name}：\n${m.roleSetting}`).join('\n\n');
          if(ms) sys += `【角色人设】\n${ms}\n`;
          sys += `用户 "${userName}" 在群里发消息，你需要选择**至少3个不同**的群成员依次回复，每人发1-3条消息。\n`;
          if(char.persona) sys += `用户人设：${char.persona}\n`;
          sys += `回复格式：【角色名】：说的话\n`;
          sys += `⚠️ 只能选择群内成员，严禁无关人物出场。\n`;
          sys += `⚠️ 纯对白，不描写动作表情。\n`;
          sys += `⚠️ 每次最多30字，长内容用 ||| 分隔多条。\n`;
        } else {
          sys = `你是 ${chat.name}。\n`;
          const c = MOCK_CONTACTS.find(c=>c.id===chat.contactId);
          if(c?.roleSetting) sys += `【你的人设】\n${c.roleSetting}\n`;
          if(c?.writingStyle?.length) sys += `【文风参考（请模仿这些话法和语气）】\n${c.writingStyle.slice(0,15).map(s => s.trim()).filter(Boolean).join('\n')}\n`;
          if(cs.persona||char.persona) sys += `用户"${userName}"的人设：${cs.persona||char.persona}\n`;
          sys += `自然活泼地回复，根据时间调整内容。\n`;
          sys += `⚠️ 你是${chat.name}，禁止无关人物出场。\n`;
        }
        let memSys = '';
        try{ const _d=Phone.getData('wechat'); const cm=_d.memories?.[chatId]; if(cm?.core?.length) memSys+=`\n\n【核心记忆】\n${cm.core.map(m=>m.content).join('\n')}`; if(cm?.storylines?.length) memSys+=`\n\n【剧情线】\n${cm.storylines.map(m=>m.content).join('\n')}`; const hvs=_d.heartVoices?.[chatId]; if(hvs?.length) memSys+=`\n\n【你的内心独白（心声）】\n${hvs.slice(0,5).map(h=>h.content).join('\n')}`; }catch(e){}
        if(memSys) sys+=memSys;
        return sys;
      }

      function buildContextMessages(upToIdx){
        const sys = buildSystemPrompt(false);
        const h = getHistory(chatId);
        const cs_val = (Phone.getData('wechat').chatSettings||{})[chatId]||{};
        const ctxLen = cs_val.contextLength || 20;

          if(m.type==='voice') content = `[语音] ${m.content}`;
          messages.push({role,content});
        });

      function renderMsgs(){

      function renderEmojiPicker(){

      let callEl = null;
      let callConnected = false;
      let callEnded = false;
      let callBusy = false;

      let connectTimer = null;
      let callTimer = null;
      let replyTimer = null;

      let callDirection = 'outgoing';

      let callTier = 'normal';

      let callTargets = [];

      let ringOn = false;
      let callMedia = 'voice';
      let videoOpening = false;
      let videoSaved = false;
      let videoModuleLoading = null;

      function callClock(sec){
        const m = Math.floor(sec / 60), s = sec % 60;
        return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      }

      const RING_BEEP_GAP = 0.85;
      const RING_GROUP_GAP = 1400;
      let ringStep = 0;

      function ringBeepOnce(){
        if(!ringOn || !ringCtx) return;
        if(ringCtx.state === 'suspended') ringCtx.resume().catch(() => {});
        const t0 = ringCtx.currentTime + 0.04;
        const osc = ringCtx.createOscillator();
        const gain = ringCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 442;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.055, t0 + 0.03);
        gain.gain.setValueAtTime(0.055, t0 + 0.34);
        gain.gain.linearRampToValueAtTime(0, t0 + 0.40);
        osc.connect(gain);
        gain.connect(ringCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.42);
      }

      function startRingtone(){
        if(ringOn) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        try{
          if(!ringCtx || ringCtx.state === 'closed') ringCtx = new AC();
          if(ringCtx.state === 'suspended') ringCtx.resume().catch(() => {});
        }catch(e){ return; }
        ringOn = true;
        ringStep = 0;
        const tick = () => {
          if(!ringOn || !ringCtx) return;
          try{ ringBeepOnce(); }catch(e){}
          ringStep = (ringStep + 1) % 3;
          ringTimer = setTimeout(tick, ringStep === 0 ? RING_BEEP_GAP * 1000 + RING_GROUP_GAP : RING_BEEP_GAP * 1000);
        };
        tick();
      }

      function stopRingtone(){
        ringOn = false;
        if(ringTimer){ clearTimeout(ringTimer); ringTimer = null; }
        if(ringCtx){
          try{ ringCtx.close(); }catch(e){}
          ringCtx = null;
        }
      }

      function callCloseness(){
        const c = callPartner();
        let score = 34;
        if(c?.roleSetting) score += 18;
        const h = Array.isArray(history) ? history.length : 0;
        score += Math.min(h, 40) * 0.7;
        if(cs.remark) score += 5;
        try{
          const allD = Phone.getData('wechat') || {};
          const cm = allD.memories?.[chatId];
          if(cm?.core?.length) score += 6;
          if(cm?.storylines?.length) score += 5;
          if(allD.heartVoices?.[chatId]?.length) score += 4;
        }catch(e){}
        if(cs.persona || char.persona) score += 3;
        return Math.min(100, Math.round(score));
      }

      function callPlan(){
        const score = callCloseness();
        if(score >= 65){
          return { score, tier:'close', answer:true, delay: 1800 + Math.random() * 1100 };
        }
        if(score >= 45){
          return { score, tier:'normal', answer:true, delay: 3000 + Math.random() * 2000 };
        }
        if(score >= 30){
          const yes = Math.random() < 0.45;
          return {
            score, tier:'far', answer: yes,
            delay: yes ? 6200 + Math.random() * 2800 : 0,
            ringMs: yes ? 0 : 9000
          };
        }
        const yes = Math.random() < 0.12;
        return {
          score, tier:'cold', answer: yes,
          delay: yes ? 7000 + Math.random() * 2000 : 0,
          ringMs: yes ? 0 : 5600
        };
      }

      function callNoAnswer(kind){
        if(!callEl || callConnected || callEnded) return;
        stopRingtone();
        endCall();
        addCallRecord(kind === 'reject' ? 'declined' : 'missed');
        const statusEl = callEl.querySelector('.wc-call-status');
        if(statusEl) statusEl.textContent = kind === 'reject' ? '对方已拒绝' : '对方无应答';
        const wrap = callEl.querySelector('.wc-call-avatar-wrap');
        if(wrap) wrap.style.opacity = '.5';
        const el = callEl;
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => { if(el.parentNode) el.remove(); }, 320);
        }, 1900);
      }

      function callPartner(){
        if(callTargets.length) return callTargets[0];
        if(isGroup) return members[0] || null;
        return MOCK_CONTACTS.find(c => c.id === chat.contactId) || null;
      }

      function callPartyName(){
        const names = callTargets.map(t => t.name).filter(Boolean);
        if(names.length > 1) return names.join('、');
        return names[0] || displayName;
      }

      function callRecordName(){
        if(callTargets.length > 1) return callTargets.map(t => t.name).filter(Boolean).join('、');
        return displayName;
      }

      function resolveCallMember(name){
        if(!callTargets.length) return null;
        if(!name) return callTargets[0];
        return callTargets.find(t => t.name === name)
          || callTargets.find(t => t.name && (t.name.includes(name) || name.includes(t.name)))
          || callTargets[0];
      }

      function callMiniAvatar(who, member){
        const m = member || callTargets[0] || null;
        const av = who === 'ai' ? (m?.avatar || '') : userAvatar;
        const nm = who === 'ai' ? (m?.name || displayName) : userName;
        if(av) return `<div class="wc-call-bubble-mini"><img src="${escAttr(av)}" alt=""></div>`;
        const col = colorFor(nm || '我');
        return `<div class="wc-call-bubble-mini" style="background:linear-gradient(135deg,${col},${shade(col,-20)})">${escAttr((nm || '我').charAt(0))}</div>`;
      }

      function buildCallSystem(){
        const c = callPartner();
        const multi = callTargets.length > 1;
        const mediaWord = callMedia === 'video' ? '视频' : '语音';
        let sys;
        if(multi){
          sys = `你正在同时扮演「${callTargets.map(t => t.name).join('」「')}」这几位角色，此刻正和「${userName}」打一通真实的多人${mediaWord}电话。\n`;
          sys += `\n【本次通话成员】${callTargets.map(t => t.name).join('、')}（共 ${callTargets.length} 人在线）\n`;
          const settingText = callTargets.filter(t => t.roleSetting).map(t => `${t.name}：\n${t.roleSetting}`).join('\n\n');
          if(settingText) sys += `\n【各成员人设】\n${settingText}\n`;
        } else {
          const speaker = isGroup ? (c?.name || chat.name) : displayName;
          sys = `你正在扮演「${speaker}」，此刻正和「${userName}」打一通真实的${mediaWord}电话。\n`;
        }
        if(!multi && c?.roleSetting) sys += `\n【角色人设】\n${c.roleSetting}\n`;
        if(!multi && c?.writingStyle?.length){
          sys += `\n【说话风格参考（模仿这种语气）】\n${c.writingStyle.slice(0,12).map(s => s.trim()).filter(Boolean).join('\n')}\n`;
        }
        if(!multi && (c?.fontType || c?.voice)){
          const fv = [];
          if(c.fontType) fv.push(`字体：${c.fontType}`);
          if(c.voice) fv.push(`语音：${c.voice}`);
          sys += `\n【语言设置】${fv.join('，')}\n`;
        }
        if(!multi && c?.npcs && c.npcs.length){
          const rels = c.npcs.map(n => `${n.name}（${n.identity||''}${n.relationship ? '，'+n.relationship : ''}）`).filter(Boolean).join('、');
          if(rels) sys += `\n【关系网】${rels}\n`;
        }
        const userPersona = cs.persona || char.persona || '';
        if(userPersona) sys += `\n「${userName}」的人设：${userPersona}\n`;
        try{
          const allD = Phone.getData('wechat');
          const cm = allD.memories?.[chatId];
          if(cm?.core?.length) sys += `\n【核心记忆 - 必须牢记】\n${cm.core.map(m => m.content).join('\n')}\n`;
          if(cm?.storylines?.length) sys += `\n【剧情线 - 必须据此发挥】\n${cm.storylines.map(m => m.content).join('\n')}\n`;
          const hvs = allD.heartVoices?.[chatId];
          if(hvs?.length) sys += `\n【你的心声（只在心里想过，不要直接说出来）】\n${hvs.slice(0,4).map(h => h.content).join('\n')}\n`;
        }catch(e){}
        try{
          const state = Phone._getState();
          const wbs = state.worldbooks || [];
          const ids = new Set();
          (c?.worldbookIds || []).forEach(id => ids.add(id));
          (cs.worldbookGroupIds || []).forEach(id => ids.add(id));
          wbs.forEach(w => { if(w.global) ids.add(w.id); });
          const active = wbs.filter(w => ids.has(w.id));
          if(active.length){
            sys += '\n【必须遵守的设定】';
            active.forEach(w => { sys += `\n- ${w.name}：${w.content}`; });
            sys += '\n';
          }
        }catch(e){}
        sys += `\n【通话规则】\n`;
        sys += `1. 这是打电话，不是发微信。用口语说话，像真的在电话里随口说出来的，不要书面语。\n`;
        sys += `2. 每次只说 1~3 句，最多 60 字。想多说就拆成几条，用 ||| 分隔。\n`;
        sys += `3. 允许在括号内写极少量语气或动作描写，例如（停顿了一下）（笑），一条消息最多一处，不要堆砌。\n`;
        sys += `4. 必须延续之前微信聊天里的话题和关系，也要接住电话里刚说过的话，不要重复说过的话。\n`;
        if(multi){
          sys += `5. 这是多人${mediaWord}通话：**每一条都必须以【角色名】：开头**，例如 【${callTargets[0]?.name||'钱锟'}】：喂？听得见吗。\n`;
          sys += `6. 不同成员轮流说话，不要同一个人连续说很多条；只使用【本次通话成员】里的人。\n`;
          sys += `7. 只输出说出来的话，不要写旁白，不要写群名。\n`;
        } else {
          sys += `5. 只输出说出来的话，不要写【角色名】，不要写第三人称旁白。\n`;
        }
        if(callMedia === 'video'){
          sys += `\n【视频画面】你们正开着视频，能看见对方。可以偶尔自然地提到画面里的细节（表情、穿着、身后的环境），但不要刻意描述。\n`;
        }
        sys += `\n【你和「${userName}」的关系】${callTierText()}\n`;
        return sys;
      }

      function callTierText(){
        if(callTier === 'close') return '你们很亲近。说话随意、亲昵，可以撒娇、打趣、直接表达想念，不用客套。';
        if(callTier === 'normal') return '你们关系平常，能正常聊天，带一点熟络但不黏腻，语气自然。';
        if(callTier === 'far') return '你们还不算熟，关系有点距离。语气要克制、略带疏离和客气，回答简短，不会一上来就热情。';
        return '你们几乎没什么交情。语气疏远、冷淡，话少，不主动示好，回答要短。';
      }

      async function callAI(extraUser){
        const VALID = ['system','user','assistant','tool'];
        const ctx = [];
        history.filter(m => m.role && (m.content !== undefined || m.type === 'call')).slice(-24).forEach(m => {
          const raw = m.role === 'ai' ? 'assistant' : (m.role === 'user' ? 'user' : null);
          if(!raw) return;
          ctx.push({
            role: VALID.includes(raw) ? raw : 'user',
            content: m.type === 'image'
              ? (m.caption ? `[图片：${m.caption}]` : '[图片]')
              : (m.type === 'call'
                  ? (m.status === 'connected'
                      ? `[${m.kind === 'video' ? '视频' : '语音'}通话 ${callClock(m.duration || 0)}]`
                      : `[${m.kind === 'video' ? '视频' : '语音'}通话未接通]`)
                  : String(m.content || ''))
          });
        });
        const multi = callTargets.length > 1;
        const transcriptMsgs = callTranscript.map(t => ({
          role: t.role,
          content: (multi && t.role === 'assistant' && t.speakerName)
            ? `【${t.speakerName}】：${t.content}`
            : t.content
        }));
        const messages = [{ role:'system', content: buildCallSystem() }, ...ctx, ...transcriptMsgs];
        if(extraUser) messages.push({ role:'user', content: extraUser });
        const rawReply = await Phone.chatWithAI(messages);
        let text = (rawReply || '').trim();
        if(!multi){
          const ft = callPartner()?.fontType || '';
          if(ft === '繁体') text = toTraditional(text);
        }
        return text;
      }

      function callScroll(){
        if(!callEl) return;
        const b = callEl.querySelector('.wc-call-bubbles');
        if(b) b.scrollTop = b.scrollHeight;
      }

      function callAddBubble(who, text, member){
        if(!callEl || callEnded) return;
        const b = callEl.querySelector('.wc-call-bubbles');
        if(!b) return;
        const row = document.createElement('div');
        row.className = 'wc-call-bubble-row ' + (who === 'ai' ? 'ai' : 'user');
        const showName = who === 'ai' && callTargets.length > 1 && member?.name;
        row.innerHTML = `${callMiniAvatar(who, member)}<div class="wc-call-bubble-wrap">${showName ? `<div class="wc-call-bubble-name">${escAttr(member.name)}</div>` : ''}<div class="wc-call-bubble">${escAttr(text)}</div></div>`;
        b.appendChild(row);
        callScroll();
      }

      function callShowTyping(member){
        if(!callEl || callEnded) return;
        callRemoveTyping();
        const b = callEl.querySelector('.wc-call-bubbles');
        if(!b) return;
        const row = document.createElement('div');
        row.className = 'wc-call-bubble-row ai wc-call-typing-row';
        row.innerHTML = `${callMiniAvatar('ai', member)}<div class="wc-call-bubble-wrap"><div class="wc-call-bubble typing"><div class="wc-call-typing"><span></span><span></span><span></span></div></div></div>`;
        b.appendChild(row);
        callScroll();
      }

      function callRemoveTyping(){
        if(!callEl) return;
        const t = callEl.querySelector('.wc-call-typing-row');
        if(t) t.remove();
      }

      function callParseLines(text){
        const multi = callTargets.length > 1;
        const lines = String(text || '').replace(/\r/g,'').replace(/\|\|\|/g,'\n').split('\n').map(s => s.trim()).filter(Boolean);
        if(!multi){
          return lines.map(t => ({ member: callTargets[0] || null, text: t }));
        }
        let last = callTargets[0] || null;
        return lines.map(line => {
          const m = line.match(/^[【〖\[［「『]\s*([^】〗\]］」』]{1,24}?)\s*[】〗\]］」』]\s*[：:．.]\s*/);
          if(m){
            const who = resolveCallMember(m[1].trim());
            last = who || last;
            return { member: last, text: line.slice(m[0].length).trim() };
          }
          return { member: last, text: line };
        }).filter(p => p.text);
      }

      function callAddAiText(text){
        const parts = callParseLines(text);
        if(!parts.length) return Promise.resolve();
        return new Promise(resolve => {
          let i = 0;
          const step = () => {
            if(callEnded || !callEl){ resolve(); return; }
            const p = parts[i++];
            const body = (callTargets.length > 1 && p.member?.fontType === '繁体')
              ? toTraditional(p.text)
              : p.text;
            const speakerName = (callTargets.length > 1 ? (p.member?.name || callPartyName()) : callPartyName());
            callTranscript.push({ role:'assistant', content: body, speakerName, ts: Date.now() });
            callAddBubble('ai', body, p.member);
            if(i < parts.length) setTimeout(step, 420);
            else resolve();
          };
          step();
        });
      }

      function callCharOpening(){
        if(callEnded || !callEl) return;
        callBusy = true;
        const opener = callTargets.length > 1
          ? callTargets[Math.floor(Math.random() * callTargets.length)]
          : (callTargets[0] || null);
        callShowTyping(opener);
        (async () => {
          let text = '';
          const multi = callTargets.length > 1;
          const toneHint = callTier === 'close'
            ? '语气亲近自然，可以直接关心对方或表达想念。'
            : (callTier === 'normal'
              ? '语气自然平常，像平时聊天一样开口。'
              : '你们关系还生疏，语气要克制客气，别一上来就太热络。');
          const openHint = multi
            ? `（这是 ${callTargets.length} 人语音通话，刚接通。请让其中 1~2 个人先开口，每条都要用【角色名】：开头。${toneHint}）`
            : `（电话接通了，你们刚开始通话。请你先开口说第一句话。${toneHint}）`;
          try{
            text = await callAI(openHint);
          }catch(e){}
          if(callEnded){ callBusy = false; return; }
          callRemoveTyping();
          if(!text){
            const closePool = ['喂？今天怎么样呀？','喂——想我了吗？','怎么突然打电话过来啦？','喂，听得见吗？'];
            const farPool = ['喂，哪位？','喂？有事吗？','……你好。','喂，我在，你说。'];
            const pool = callTier === 'close' ? closePool : (callTier === 'normal' ? closePool.concat(farPool) : farPool);
            text = pool[Math.floor(Math.random() * pool.length)];
            if(multi){
              const a = callTargets[Math.floor(Math.random() * callTargets.length)];
              const b = callTargets[Math.floor(Math.random() * callTargets.length)];
              const line2 = '听得见吗？';
              text = `【${a.name}】：${text}\n【${b.name}】：${line2}`;
            }
          }
          await callAddAiText(text);
          callBusy = false;
        })();
      }

      function connectCall(){
        if(callConnected || callEnded || !callEl) return;
        if(connectTimer){ clearTimeout(connectTimer); connectTimer = null; }
        stopRingtone();
        callConnected = true;
        callEl.classList.add('connected');
        const statusEl = callEl.querySelector('.wc-call-status');
        if(statusEl) statusEl.textContent = '00:00';
        callSeconds = 0;
        callTimer = setInterval(() => {
          if(callEnded){ clearInterval(callTimer); callTimer = null; return; }
          callSeconds++;
          if(statusEl) statusEl.textContent = callClock(callSeconds);
        }, 1000);
        setTimeout(callCharOpening, 650);
      }

      function sendCallMessage(){
        if(!callEl || !callConnected || callEnded || callBusy) return;
        const inp = callEl.querySelector('.wc-call-input');
        if(!inp) return;
        const val = inp.value.trim();
        if(!val) return;
        inp.value = '';
        inp.style.height = 'auto';
        callTranscript.push({ role:'user', content: val, ts: Date.now() });
        callAddBubble('user', val);
        const typist = callTargets.length > 1
          ? callTargets[Math.floor(Math.random() * callTargets.length)]
          : (callTargets[0] || null);
        callShowTyping(typist);
        callBusy = true;
        replyTimer = setTimeout(async () => {
          replyTimer = null;
          if(callEnded){ callBusy = false; return; }
          let text = '';
          try{ text = await callAI(); }catch(e){}
          if(callEnded){ callBusy = false; return; }
          callRemoveTyping();
          if(!text){
            text = callTargets.length > 1
              ? `【${typist?.name || callTargets[0].name}】：（停顿了一下）…怎么不说话了？`
              : '（停顿了一下）…怎么不说话了？';
          }
          await callAddAiText(text);
          callBusy = false;
        }, 3000);
      }

      function pushCallRecord(status, direction, duration, transcript, kind){
        const participants = callTargets.map(t => ({ name: t.name || '', avatar: t.avatar || '' })).filter(p => p.name);
        const msg = {
          role:'ai', type:'call',
          kind: kind === 'video' ? 'video' : 'voice',
          direction: direction || 'outgoing',
          status: status,
          duration: duration || 0,
          transcript: Array.isArray(transcript) ? transcript : [],
          participants: participants,
          speakerName: callRecordName(),
          ts: Date.now()
        };
        history.push(msg);
        msg._idx = history.length - 1;
        saveHistoryToStorage();
        _notifyChatUpdated();
        if(document.body.contains(msgs)){
          msgs.scrollTop = msgs.scrollHeight;
        }
        return msg;
      }

      function addCallRecord(status){
        if(callSaved) return;
        callSaved = true;
        const dur = callConnected ? callSeconds : 0;
        const transcript = callTranscript
          .filter(t => t && t.content)
          .map(t => ({ role: t.role, content: t.content, speakerName: t.speakerName || '', ts: t.ts || Date.now() }));
        pushCallRecord(status || (callConnected ? 'connected' : 'missed'), callDirection, dur, transcript);
      }

      function openCallRecord(m){
        const existing = document.querySelector('.wc-callrec-mask');
        if(existing) existing.remove();
        const parts = Array.isArray(m.participants) && m.participants.length
          ? m.participants
          : [{ name: m.speakerName || displayName || chat.name, avatar: (callPartner()?.avatar || '') }];
        const whoName = parts.length > 1 ? parts.map(p => p.name).join('、') : (parts[0].name || displayName || chat.name);
        const trans = Array.isArray(m.transcript) ? m.transcript : [];
        const dur = m.duration || 0;
        const mask = document.createElement('div');
        mask.className = 'wc-callrec-mask';
        mask.innerHTML = `
          <div class="wc-callrec-box">
            <div class="wc-callrec-head">
              <span class="wc-callrec-title">与 ${escAttr(whoName)} 的${m.kind === 'video' ? '视频' : '语音'}通话</span>
              <button class="wc-callrec-close" aria-label="关闭">×</button>
            </div>
            <div class="wc-callrec-meta">
              <span>通话时长 ${callClock(dur)}</span>
              <button class="wc-callrec-del" aria-label="删除记录">🗑️</button>
            </div>
            <div class="wc-callrec-body"></div>
          </div>`;
        document.body.appendChild(mask);
        const body = mask.querySelector('.wc-callrec-body');
        if(!trans.length){
          body.innerHTML = '<div class="wc-callrec-empty">暂无通话内容</div>';
        } else {
          trans.forEach(t => {
            const isUser = t.role === 'user';
            const speaker = isUser ? null : (parts.find(p => p.name === t.speakerName) || parts[0]);
            const nm = isUser ? (userName || '我') : (speaker?.name || whoName);
            const av = isUser ? (userAvatar || '') : (speaker?.avatar || '');
            const tm = t.ts ? new Date(t.ts) : null;
            const hhmm = tm ? `${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}` : '';
            const col = colorFor(nm || '友');
            const avatarInner = av ? `<img src="${escAttr(av)}" alt="">` : escAttr((nm || '友').charAt(0));
            const avatarStyle = av ? '' : ` style="background:linear-gradient(135deg,${col},${shade(col,-20)})"`;
            const row = document.createElement('div');
            row.className = 'wc-callrec-row' + (isUser ? ' user' : '');
            row.innerHTML = `
              <div class="wc-callrec-avatar"${avatarStyle}>${avatarInner}</div>
              <div class="wc-callrec-main">
                <div class="wc-callrec-name">${escAttr(nm)}${hhmm ? '  ' + hhmm : ''}</div>
                <div class="wc-callrec-bubble">${escAttr(t.content)}</div>
              </div>`;
            body.appendChild(row);
          });
        }
        const close = () => {
          mask.style.animation = 'wcFadeIn .18s ease reverse';
          setTimeout(() => mask.remove(), 180);
        };
        mask.querySelector('.wc-callrec-close').addEventListener('click', close);
        mask.addEventListener('click', e => { if(e.target === mask) close(); });
        mask.querySelector('.wc-callrec-del').addEventListener('click', () => {
          const idx = m._idx !== undefined ? m._idx : history.indexOf(m);
          if(idx >= 0) history.splice(idx, 1);
          saveHistoryToStorage();
          _notifyChatUpdated();
          close();
          renderMsgs();
        });
      }

      function endCall(){
        if(callEnded) return;
        callEnded = true;
        callBusy = false;
        stopRingtone();
        if(connectTimer){ clearTimeout(connectTimer); connectTimer = null; }
        if(replyTimer){ clearTimeout(replyTimer); replyTimer = null; }
        if(callTimer){ clearInterval(callTimer); callTimer = null; }
      }

      function hangupCall(){
        if(!callEl) return;
        const already = callEnded;
        endCall();
        if(!already){
          addCallRecord(callConnected ? 'connected' : 'cancelled');
          const statusEl = callEl.querySelector('.wc-call-status');
          if(statusEl) statusEl.textContent = '通话已结束';
        }
        const el = callEl;
        el.classList.remove('show');
        setTimeout(() => { if(el.parentNode) el.remove(); }, 320);
      }

      function openCallMemberPicker(media){
        const isVideo = media === true || media === 'video';
        if(!isGroup){ if(isVideo) openVideoCall(); else openVoiceCall(); return; }
        const existing = document.querySelector('.wc-callpick-mask');
        if(existing) existing.remove();
        closePanels();
        const list = members.filter(m => m && m.name);
        if(!list.length){ Phone.toast('群内暂无可通话成员'); return; }
        const picked = new Set(list.map(m => m.id));
        const mask = document.createElement('div');
        mask.className = 'wc-callpick-mask';
        mask.innerHTML = `
          <div class="wc-callpick-box">
            <div class="wc-callpick-head">
              <span class="wc-callpick-title">选择${isVideo ? '视频' : '通话'}成员</span>
              <button class="wc-callpick-close" aria-label="关闭">×</button>
            </div>
            <div class="wc-callpick-list"></div>
            <div class="wc-callpick-foot">
              <button class="wc-callpick-cancel">取消</button>
              <button class="wc-callpick-ok">发起${isVideo ? '视频' : '通话'}</button>
            </div>
          </div>`;
        document.body.appendChild(mask);
        const listEl = mask.querySelector('.wc-callpick-list');
                const headEl = mask.querySelector('.wc-callpick-head');
        if(headEl){
          const titleEl = headEl.querySelector('.wc-callpick-title');
          const rowEl = document.createElement('div');
          rowEl.className = 'wc-callpick-title-row';
          if(titleEl) rowEl.appendChild(titleEl);
          const subEl = document.createElement('span');
          subEl.className = 'wc-callpick-sub';
          subEl.innerHTML = '已选 <b class="wc-callpick-count">' + list.length + '</b> / ' + list.length + ' 人';
          rowEl.appendChild(subEl);
          headEl.insertBefore(rowEl, headEl.firstChild);
        }
        list.forEach(m => {
          const col = colorFor(m.name || '友');
          const avatarInner = m.avatar
            ? `<img src="${escAttr(m.avatar)}" alt="">`
            : escAttr((m.name || '友').charAt(0));
          const avatarStyle = m.avatar ? '' : ` style="background:linear-gradient(135deg,${col},${shade(col,-20)})"`;
          const row = document.createElement('div');
                    row.className = 'wc-callpick-row' + (picked.has(m.id) ? ' on' : '');
          row.dataset.mid = m.id;
          row.innerHTML = `
            <div class="wc-callpick-avatar"${avatarStyle}>${avatarInner}</div>
            <div class="wc-callpick-name">${escAttr(m.name)}</div>
            <div class="wc-callpick-check${picked.has(m.id) ? ' on' : ''}"></div>`;
          row.addEventListener('click', () => {
            if(picked.has(m.id)) picked.delete(m.id);
            else picked.add(m.id);
                       const on = picked.has(m.id);
            row.classList.toggle('on', on);
            row.querySelector('.wc-callpick-check').classList.toggle('on', on);
            const cntEl = mask.querySelector('.wc-callpick-count');
            if(cntEl) cntEl.textContent = picked.size;
          });
          listEl.appendChild(row);
        });
        const close = () => {
          mask.style.animation = 'wcFadeIn .18s ease reverse';
          setTimeout(() => mask.remove(), 180);
        };
        mask.querySelector('.wc-callpick-close').addEventListener('click', close);
        mask.querySelector('.wc-callpick-cancel').addEventListener('click', close);

      const VIDEO_BG_MAP = {
        '钱锟':'kunv.mp4', 'kun':'kunv.mp4', '锟哥':'kunv.mp4', '锟':'kunv.mp4',
        '李永钦':'tenv.mp4', 'ten':'tenv.mp4', 'ten哥':'tenv.mp4', '永钦':'tenv.mp4',

      function videoBgFor(list){
        for(const t of (list || [])){
          if(!t) continue;
          const keys = [t.name, t.remark, t.contactName, t.remarkName]
            .filter(Boolean)
            .map(s => String(s).trim());
          for(const k of keys){
            const hit = VIDEO_BG_MAP[k] || VIDEO_BG_MAP[k.toLowerCase()];
            if(hit) return hit;
          }
        }
        return '';
      }

      function loadVideoModule(){
        if(window.mountVideoCall) return Promise.resolve(true);
        if(videoModuleLoading) return videoModuleLoading;
        videoModuleLoading = (async () => {
          try{
            const res = await fetch('video.html?v=' + Date.now());
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            doc.querySelectorAll('style').forEach(s => {
              const style = document.createElement('style');
              style.textContent = s.textContent;
              document.head.appendChild(style);
            });
            const scripts = doc.querySelectorAll('script');
            for(const s of scripts){
              const script = document.createElement('script');
              script.textContent = s.textContent;
              document.body.appendChild(script);
            }
          }catch(e){}
          if(!window.mountVideoCall) videoModuleLoading = null;
          return !!window.mountVideoCall;
        })();
        return videoModuleLoading;
      }

      function videoParseParts(text){
        const fallbackName = callTargets.length > 1
          ? (callPartner()?.name || callTargets[0]?.name || displayName)
          : (callTargets[0]?.name || displayName);
        return callParseLines(text).map(p => {
          const member = p.member || callTargets[0] || null;
          const name = callTargets.length > 1 ? (member?.name || fallbackName) : fallbackName;
          const body = (callTargets.length > 1 && member?.fontType === '繁体') ? toTraditional(p.text) : p.text;
          return { name, text: body };
        }).filter(p => p.text);
      }

      async function videoAI(hint){
        let text = '';
        try{ text = await callAI(hint); }catch(e){}
        if(!text){
          const warm = ['喂？看得见我吗？', '怎么突然视频呀？', '喂——想我了吗？'];
          const cold = ['喂？有事吗？', '……你好。', '喂，我在。'];
          const pool = callTier === 'close' ? warm : (callTier === 'normal' ? warm.concat(cold) : cold);
          text = pool[Math.floor(Math.random() * pool.length)];
          if(callTargets.length > 1){
            const a = callTargets[Math.floor(Math.random() * callTargets.length)];
            text = `【${a.name}】：${text}\n【${a.name}】：看得见。`;
          }
        }
        return videoParseParts(text);
      }

      async function openVideoCall(opts){
        opts = opts || {};
        if(videoOpening && !document.querySelector('.vc-call')){ videoOpening = false; stopRingtone(); }
        if(videoOpening) return;
        if(!document.body.contains(detail)) return;
        if(document.querySelector('.wc-call') || document.querySelector('.vc-call') || document.querySelector('.wc-incoming')) return;
        videoOpening = true;
        closePanels();
        const defaultTargets = opts.targets && opts.targets.length
          ? opts.targets.slice()
          : (isGroup ? (members[0] ? [members[0]] : []) : (MOCK_CONTACTS.find(c => c.id === chat.contactId) ? [MOCK_CONTACTS.find(c => c.id === chat.contactId)] : []));
        callTargets = defaultTargets.filter(t => t && t.name);
        if(!callTargets.length){ videoOpening = false; Phone.toast('暂无可通话对象'); return; }
        const partner = callPartner();
        const pAvatar = partner?.avatar || '';
        const multiCall = callTargets.length > 1;
        const pName = multiCall
          ? (chat.name || callTargets.map(t => t.name).join('、'))
          : (isGroup ? (partner?.name || chat.name) : displayName);
        const pColor = colorFor((partner?.name || pName) || '友');
        const plan = callPlan();
        callMedia = 'video';
        callDirection = 'outgoing';
        callTier = plan.tier;
        callScore = plan.score;
        callTranscript = [];
        videoSaved = false;
        const openingHint = multiCall
          ? `（这是 ${callTargets.length} 人视频通话，刚接通。请让其中 1~2 个人先开口，每条都要用【角色名】：开头。语气要符合你们的关系。）`
          : `（视频电话接通了，你们刚开始视频通话。请你先开口说第一句话，语气要符合你们的关系。）`;
        const ok = await loadVideoModule();
        if(!ok){ videoOpening = false; callMedia = 'voice'; Phone.toast('视频通话加载失败'); return; }
        if(!document.body.contains(detail)){ videoOpening = false; callMedia = 'voice'; return; }
        const cfg = {
          name: pName,
          avatar: pAvatar,
          color: pColor,
          video: videoBgFor(callTargets),
          userName: userName || '我',
          userAvatar: userAvatar || '',
          incoming: false,
          plan,
          targets: callTargets.map(t => ({ name: t.name || '', avatar: t.avatar || '', fontType: t.fontType || '' })),
          transcript: callTranscript,
          ring: { start: startRingtone, stop: stopRingtone },
          ai: {
            opening: () => videoAI(openingHint),
            reply: () => videoAI()
          },
          onEnd: (info) => {
            videoOpening = false;
            callMedia = 'voice';
            stopRingtone();
            if(videoSaved) return;
            videoSaved = true;
            const status = info?.status || (info?.connected ? 'connected' : 'missed');
            const dur = info?.connected ? (info?.seconds || 0) : 0;
            const tr = callTranscript
              .filter(t => t && t.content)
              .map(t => ({ role: t.role, content: t.content, speakerName: t.speakerName || '', ts: t.ts || Date.now() }));
            pushCallRecord(status, 'outgoing', dur, tr, 'video');
          }
        };
        window.mountVideoCall(detail, cfg);
      }

      function startIncomingCall(member){
        if(!document.body.contains(detail)) return;
        if(document.querySelector('.wc-call') || document.querySelector('.vc-call') || document.querySelector('.wc-incoming')) return;
        closePanels();
        const incomingList = Array.isArray(member) ? member.filter(x => x && x.name) : (member && member.name ? [member] : []);
        const caller = incomingList[0] || callPartner();
        if(caller && caller.name) callTargets = incomingList.length ? incomingList : [caller];
        const score = callCloseness();
        callScore = score;
        callTier = score >= 65 ? 'close' : (score >= 45 ? 'normal' : (score >= 30 ? 'far' : 'cold'));
        const pAvatar = caller?.avatar || '';
        const pName = callTargets.length > 1
          ? callTargets.map(t => t.name).join('、')
          : (isGroup ? (caller?.name || chat.name) : displayName);
        const pColor = colorFor((caller?.name || pName) || '友');
        const avatarInner = pAvatar
          ? `<img src="${escAttr(pAvatar)}" alt="">`
          : escAttr((pName || '友').charAt(0));
        const avatarBg = pAvatar ? '' : ` style="background:linear-gradient(135deg,${pColor},${shade(pColor,-20)})"`;
        const tipText = callTargets.length > 1 ? `${callTargets.length} 人邀请你进行语音通话…` : '邀请你进行语音通话…';
        const el = document.createElement('div');
        el.className = 'wc-incoming';

            <button class="wc-incoming-btn decline" aria-label="拒绝">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            </button>
            <button class="wc-incoming-btn accept" aria-label="接听">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            </button>
          </div>`;
        detail.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        try{ startRingtone(); }catch(e){}
        let done = false;
        let autoTimer = null;
        const finish = () => {
          if(done) return false;
          done = true;
          if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
          stopRingtone();
          el.classList.remove('show');
          setTimeout(() => { if(el.parentNode) el.remove(); }, 280);
          return true;
        };
        autoTimer = setTimeout(() => {
          if(finish()) pushCallRecord('missed', 'incoming', 0, []);
        }, 26000);
        el.querySelector('.wc-incoming-btn.decline').addEventListener('click', () => {
          if(!finish()) return;
          pushCallRecord('declined', 'incoming', 0, []);
          charAfterDeclinedCall();
        });
        el.querySelector('.wc-incoming-btn.accept').addEventListener('click', () => {
          if(!finish()) return;
          const targets = callTargets.slice();
          setTimeout(() => openVoiceCall({ incoming: true, targets }), 240);
        });
      }

      function buildDeclineCallSystem(){
        const c = callPartner();
        const who = isGroup ? (c?.name || chat.name) : displayName;
        let sys = `你正在扮演「${who}」，此刻和「${userName}」在微信上聊天。\n`;
        sys += `你刚刚主动给「${userName}」打了一通语音电话，但被对方拒绝了（没接）。\n`;
        if(c?.roleSetting) sys += `\n【角色人设】\n${c.roleSetting}\n`;
        if(c?.writingStyle?.length){
          sys += `\n【说话风格参考（模仿这种语气）】\n${c.writingStyle.slice(0,12).map(s => s.trim()).filter(Boolean).join('\n')}\n`;
        }
        const userPersona = cs.persona || char.persona || '';
        if(userPersona) sys += `\n「${userName}」的人设：${userPersona}\n`;
        try{
          const allD = Phone.getData('wechat');
          const cm = allD.memories?.[chatId];
          if(cm?.core?.length) sys += `\n【核心记忆】\n${cm.core.map(m => m.content).join('\n')}\n`;
        }catch(e){}
        sys += `\n【现在要做的事】\n`;
        sys += `你要在微信里接着发 2~3 条消息，追问对方为什么没接，表达疑惑、关心或撒娇（例如：怎么不接？/ 有什么事吗？/ 别生气啦）。\n`;
        sys += `【规则】\n1. 只输出你说的话，不要写角色名，不要旁白和括号动作。\n2. 每条不超过 30 字，用 ||| 分隔。\n3. 语气必须符合你们的关系。\n`;
        sys += `\n【你和「${userName}」的关系】${callTierText()}\n`;
        return sys;
      }

      function charAfterDeclinedCall(retry){
        retry = retry || 0;
        if(isOfflineMode) return;
        if(!document.body.contains(msgs)) return;
        if(isReplying){
          if(retry < 6) setTimeout(() => charAfterDeclinedCall(retry + 1), 1500);
          return;
        }
        isReplying = true;
        const t = document.createElement('div');
        t.className = 'wc-msg typing';
        t.innerHTML = '<div class="wc-typing-dots"><span></span><span></span><span></span></div>';
        msgs.appendChild(t);
        msgs.scrollTop = msgs.scrollHeight;

        (async () => {
          let text = '';
          try{
            const VALID_ROLES = ['system','user','assistant','tool'];
            const messages = [{ role:'system', content: buildDeclineCallSystem() }, ...history
              .filter(m => m.role && m.content !== undefined)
              .map(m => ({
                role: (() => {
                  const raw = m.role === 'typing' ? 'user' : (m.role === 'ai' ? 'assistant' : m.role);
                  return VALID_ROLES.includes(raw) ? raw : 'user';
                })(),
                content: m.type === 'image' ? (m.caption ? `[图片：${m.caption}]` : '[图片]')
                  : (m.type === 'call' ? (m.kind === 'video' ? '[视频通话]' : '[语音通话]') : String(m.content || ''))
              }))];
            text = await Phone.chatWithAI(messages);
          }catch(e){}
          if(!document.body.contains(msgs)){ isReplying = false; return; }
          t.remove();
          const contact = MOCK_CONTACTS.find(c => c.id === chat.contactId);
          const speaker = isGroup ? (callPartner()?.name || displayName) : displayName;
          const ft = isGroup ? (callPartner()?.fontType || '') : (contact?.fontType || '');
          let parts = String(text || '').replace(/\r/g,'').split(/\|\|\||\n+/).map(s => s.trim()).filter(Boolean);
          if(!parts.length){
            parts = (callScore >= 65)
              ? ['怎么不接？', '有什么事吗？', '别生气啦，等你有空再打给我。']
              : ['怎么不接？', '有什么事吗？', '看到回我一下。'];
          }
          parts = parts.slice(0, 3);
          const toPush = parts.map((p, i) => ({
            role:'ai',
            content: (ft === '繁体') ? toTraditional(p) : p,
            speakerName: speaker,
            ts: Date.now() + i
          }));
          toPush.forEach(mm => history.push(mm));
          saveHistoryToStorage();
          let i = 0;
          const reveal = () => {
            if(i >= toPush.length){
              _notifyChatUpdated();
              isReplying = false;
              return;
            }
            const mm = toPush[i];
            mm._idx = history.indexOf(mm);
            msgs.appendChild(renderOneMessage(mm));
            msgs.scrollTop = msgs.scrollHeight;
            i++;
            setTimeout(reveal, 550 + Math.random() * 450);
          };
          reveal();
        })();
      }

      function maybeCharInitiateCall(){
        try{
          if(isOfflineMode) return;
          if(!document.body.contains(detail) || isReplying) return;
          if(document.querySelector('.wc-call') || document.querySelector('.wc-incoming')) return;
          if(!history.some(m => m.role === 'user')) return;
          let caller = null;
          if(isGroup){
            const pool = members.filter(m => m && m.name);
            if(!pool.length) return;
            caller = pool[Math.floor(Math.random() * pool.length)];
          }
          aiReplyCountSinceCall++;
          const now = Date.now();
          if(now - lastCharCallAt < 6 * 60 * 1000) return;
          const score = callCloseness();
          let prob = 0.12;
          if(score >= 65) prob = 0.3;
          else if(score >= 45) prob = 0.2;
          const force = aiReplyCountSinceCall >= 12;
          if(!force && Math.random() > prob) return;
          setTimeout(() => {
            if(!document.body.contains(detail) || isReplying) return;
            if(document.querySelector('.wc-call') || document.querySelector('.wc-incoming')) return;
            if(Date.now() - lastCharCallAt < 6 * 60 * 1000) return;
            lastCharCallAt = Date.now();
            aiReplyCountSinceCall = 0;
            startIncomingCall(caller || undefined);
          }, 1600 + Math.random() * 1600);
        }catch(e){}
      }

                { key:'bg', label:'背景色', value:'#ffffff', type:'color' },
                { key:'fg', label:'文字颜色', value:'#1a1a1a', type:'color' }
              ]
            });

            const txt = (t.text||'').trim(); if(!txt){ Phone.toast('请输入文字'); return; }
            const src = await genTextImage(txt, t.bg || '#ffffff', t.fg || '#1a1a1a');

            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*';
            inp.onchange = async () => {
              const f = inp.files[0]; if(!f) return;
              const compressImg = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => {
                  const img = new Image();
                  img.onload = () => {
                    const maxSide = 600;
                    let { width:w, height:h } = img;
                    if(w > maxSide || h > maxSide){
                      if(w >= h){ h = Math.round(h * maxSide / w); w = maxSide; }
                      else { w = Math.round(w * maxSide / h); h = maxSide; }
                    }
                    const cv = document.createElement('canvas');
                    cv.width = w; cv.height = h;
                    cv.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(cv.toDataURL('image/jpeg', 0.75));
                  };
                  img.src = reader.result;
                };
                reader.readAsDataURL(f);
              });
              const r2 = await Phone.modal({
                title:'发送图片',
                fields:[{ key:'caption', label:'配文（可选）', value:'', type:'textarea' }]
              });
              sendImage({ src:compressImg, caption: r2 ? (r2.caption || '').trim() : '' });
            };
            inp.click();

      function genTextImage(text, bg='#ffffff', fg='#1a1a1a'){
        return new Promise(resolve => {
          const CW = 600, CH = 600, pad = 40;
          const c = document.createElement('canvas');
          c.width = CW; c.height = CH;
          const ctx = c.getContext('2d');
          let fs = 36, lineH, lines2;
          while(fs >= 18){
            lineH = fs * 1.5;
            ctx.font = fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
            lines2 = []; let cur = '';
            for(const ch of (text||'').split('')){
              const t2 = cur + ch;
              if(ctx.measureText(t2).width > CW - pad*2){ lines2.push(cur); cur = ch; }
              else cur = t2;
            }
            if(cur) lines2.push(cur);
            if(lines2.length * lineH + pad*2 <= CH) break;
            fs -= 2;
          }
          ctx.fillStyle = bg; ctx.fillRect(0,0,CW,CH);
          ctx.fillStyle = fg; ctx.font = fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textBaseline = 'top';
          const startY = (CH - lines2.length * lineH) / 2;
          lines2.forEach((ln,i) => ctx.fillText(ln, pad, startY + i*lineH));
          resolve(c.toDataURL('image/png'));
        });
      }

      function _walletOp(){
        const d = Phone.getData('wechat') || {};
        if(!d.wallet){
          d.wallet = { records: [{ type:'in', amount:500, note:'初始余额', source:'system', ts: Date.now() - 86400000 }] };
          Phone.setData('wechat', d);
        }
        d.wallet = d.wallet || { records:[] };
        const get = () => {
          let totalIn = 0, totalOut = 0;
          (d.wallet.records || []).forEach(r => { if(r.type==='in') totalIn+=r.amount; else totalOut+=r.amount; });
          return { records: d.wallet.records, balance: totalIn - totalOut, totalIn, totalOut };
        };
        const save = (records) => {
          d.wallet.records = records;
          Phone.setData('wechat', d);
        };
        const add = (type, amount, note, source) => {
          const recs = d.wallet.records || [];
          recs.push({ type, amount, note: note || (type==='in'?'收入':'支出'), source: source || 'transfer', ts: Date.now() });
          d.wallet.records = recs;
          Phone.setData('wechat', d);
        };
        return { get, save, add };
      }

      function parseAISendCommands(rawReply, defaultSpeakerName){
        let text = rawReply;
        const commands = [];

        const transferRe = /[\[【]转账[：:]\s*([0-9]+(?:\.[0-9]+)?)(?:\s*[：:]\s*([^\]】]*))?[\]】]/g;
        let m;
        while((m = transferRe.exec(text)) !== null){
          const amt = parseFloat(m[1]);
          const note = (m[2] || '').trim();
          if(amt > 0 && amt <= 50000){
            commands.push({ speakerName: defaultSpeakerName, type:'transfer', amount: amt, note });
          }
        }
        text = text.replace(transferRe, '');

        const rpRe = /[\[【]红包[：:]\s*([0-9]+(?:\.[0-9]+)?)(?:\s*[：:]\s*([^\]】]*))?[\]】]/g;
        while((m = rpRe.exec(text)) !== null){
          const amt = parseFloat(m[1]);
          const msg = (m[2] || '').trim() || '恭喜发财，大吉大利';
          if(amt > 0 && amt <= 50000){
            commands.push({ speakerName: defaultSpeakerName, type:'redpacket', amount: amt, count: 1, rpType:'fixed', msg });
          }
        }
        text = text.replace(rpRe, '');

        const rpRandomRe = /[\[【]红包拼手气[：:]\s*([0-9]+(?:\.[0-9]+)?)\s*[：:]\s*([0-9]+)(?:\s*[：:]\s*([^\]】]*))?[\]】]/g;
        while((m = rpRandomRe.exec(text)) !== null){
          const amt = parseFloat(m[1]);
          const cnt = parseInt(m[2]) || 1;
          const msg = (m[3] || '').trim() || '恭喜发财，大吉大利';
          if(amt > 0 && cnt > 0 && cnt <= 100 && amt / cnt <= 200){
            commands.push({ speakerName: defaultSpeakerName, type:'redpacket', amount: amt, count: cnt, rpType:'random', msg });
          }
        }
        text = text.replace(rpRandomRe, '');

        const callRe = /[\[【](?:语音通话|打电话|来电|语音电话)(?:[：:]\s*([^\]】]*))?[\]】]/g;
        while((m = callRe.exec(text)) !== null){
          commands.push({ speakerName: defaultSpeakerName, type:'call', target: (m[1] || '').trim() });
        }
        text = text.replace(callRe, '');

        text = text.replace(/\|\|\|\|/g, '|||').replace(/^\|\|\|?/g, '').replace(/\|\|\|?$/g, '').trim();
        return { replyText: text, commands };
      }

      function executeAISendCommands(commands){
        if(!commands || !commands.length) return;
        const tsBase = Date.now();
        commands.forEach((c, i) => {
          const ts = tsBase + i;
          if(c.type === 'transfer'){
            history.push({
              role:'ai', type:'transfer', source:'char',
              content:`[转账 ¥${c.amount.toFixed(2)}]`,
              amount: c.amount, note: c.note || '转账',
              toName: userName, toContactId: '',
              status:'pending', speakerName: c.speakerName,
              openList:[], ts, msgId:'xfer_char_' + ts
            });
          } else if(c.type === 'redpacket'){
            history.push({
              role:'ai', type:'redpacket', source:'char',
              content:`[微信红包 ¥${c.amount.toFixed(2)}]`,
              amount: c.amount, count: c.count || 1,
              rpType: c.rpType || 'fixed',
              msg: c.msg || '恭喜发财，大吉大利',
              toName: userName, toContactId: '',
              speakerName: c.speakerName,
              openList:[], ts, msgId:'rp_char_' + ts
            });
          } else if(c.type === 'call'){
            if(!pendingCharCall) pendingCharCall = { callers: [], ts };
            pendingCharCall.callers.push({ speakerName: c.speakerName || '', target: c.target || '' });
          }
        });
        saveHistoryToStorage();
        _notifyChatUpdated();
      }

      function collectPendingIncomingPayments(){
        const pending = [];
        const scanCount = Math.min(30, history.length);
        for(let i = history.length - 1; i >= Math.max(0, history.length - scanCount); i--){
          const m = history[i];
          if(!m) continue;

          const isUserOutgoingXfer = m.role === 'user' && m.source === 'self' && m.type === 'transfer';
          const isUserOutgoingRP  = m.role === 'user' && m.source === 'self' && m.type === 'redpacket';
          const isCharOutgoingXfer = m.role === 'ai' && m.source === 'char' && m.type === 'transfer';
          const isCharOutgoingRP  = m.role === 'ai' && m.source === 'char' && m.type === 'redpacket';

          if(isUserOutgoingXfer && m.status !== 'claimed' && m.status !== 'rejected'){
            pending.push({ direction:'toAI', kind:'transfer', ref:m, amount:m.amount, note:m.note||'' });
          } else if(isUserOutgoingRP){
            const openedList = m.openList || [];
            const totalCount = m.count || 1;
            if(openedList.some(o => o.name === chat.name)) continue;
            if(openedList.length < totalCount){
              pending.push({ direction:'toAI', kind:'redpacket', ref:m, amount:m.amount, msg:m.msg||'', rpType:m.rpType||'fixed', count:totalCount });
            }
          } else if(isCharOutgoingXfer && m.status !== 'claimed' && m.status !== 'rejected'){
            pending.push({ direction:'toUser', kind:'transfer', ref:m, amount:m.amount, note:m.note||'' });
          } else if(isCharOutgoingRP){
            const openedList = m.openList || [];
            const totalCount = m.count || 1;
            if(openedList.some(o => o.name === userName)) continue;
            if(openedList.length < totalCount){
              pending.push({ direction:'toUser', kind:'redpacket', ref:m, amount:m.amount, msg:m.msg||'', rpType:m.rpType||'fixed', count:totalCount });
            }
          }
        }
        return pending.length ? pending : null;
      }

      function applyPaymentsToParts(parts){
        const pendingAll = collectPendingIncomingPayments();
        if(!pendingAll) return;
        const pending = pendingAll.filter(p => p.direction === 'toAI');
        if(!pending.length) return;

        const memberDecisions = {};
        parts.forEach(p => {
          const sn = p.speakerName;
          let tx = p.text || '';
          const decisions = [];

          if(/[\[【]确认收款[\]】]/.test(tx)){
            decisions.push({ kind:'transfer', action:'accept' });
            tx = tx.replace(/[\[【]确认收款[\]】]\s*/g, '');
          }
          if(/[\[【]拒绝收款/.test(tx)){
            decisions.push({ kind:'transfer', action:'decline' });
            tx = tx.replace(/[\[【]拒绝收款[\]】]?\s*[:：]?\s*[^\]】]*[\]】]?\s*/g, '');
          }
          if(/[\[【]领取红包[\]】]/.test(tx)){
            decisions.push({ kind:'redpacket', action:'open' });
            tx = tx.replace(/[\[【]领取红包[\]】]\s*/g, '');
          }
          if(/[\[【]不领红包/.test(tx)){
