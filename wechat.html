          if(allStickers.length){
            sys += `\n\n【可用表情包】\n`;
            sys += allStickers.map(s => `- ${s.caption || '无含义'}：[表情：${s.id}]`).join('\n');
            sys += `\n\n⚠️ 发表情时，必须根据当前对话的**具体场景和情绪**，挑选最贴切的表情。选表情之前，先想清楚：
- 对方刚才说了什么？（是开心、难过、生气、撒娇、感动...？）
- 当前聊天氛围是什么？（甜蜜、打闹、认真、日常...？）
- 挑一个 caption（含义）最匹配这个场景的表情，而不是随便发一个。
选好后直接发送 [表情：表情ID] 即可，不要加其他文字。
例如：对方说了好消息想庆祝，就选含义"开心/庆祝/棒棒"的；对方难过安慰他，就选含义"安慰/抱抱/别难过"的。`;
          }

          sys += `\n\n【生成文字图片】\n如果想发送一张纯文字图片（适合用来发鸡汤、金句、心情语录等），直接在回复中写 [文字图:要渲染的文字内容] 即可。例如：[文字图:今天也要元气满满呀]。文字图会自动生成正方形图片发送。`;

          try {
            const allD = Phone.getData('wechat');
            const cm = allD.memories?.[chatId];
            if(cm?.core?.length){
              sys += `\n\n【核心记忆 - 必须牢记】\n${cm.core.map(m => m.content).join('\n')}`;
            }
            if(cm?.storylines?.length){
              sys += `\n\n【剧情线 - 必须据此发挥】\n${cm.storylines.map(m => m.content).join('\n')}`;
            }
            const hvs = allD.heartVoices?.[chatId];
            if(hvs?.length){
              sys += `\n\n【你的内心独白（心声）- 这些是你曾在心里真实想过的事】\n${hvs.slice(0,5).map(h => h.content).join('\n')}`;
            }
          } catch(e){}

          const VALID_ROLES = ['system','user','assistant','tool'];
          const messages = [{ role:'system', content:sys }, ...history
            .filter(m => m.role && (m.content !== undefined || m.type === 'call'))
            .map(m => ({
              role: (() => {
                const raw = m.role === 'typing' ? 'user' : (m.role === 'ai' ? 'assistant' : m.role);
                return VALID_ROLES.includes(raw) ? raw : 'user';
              })(),
              content: m.type === 'call'
                ? (m.status === 'connected'
                    ? `[${m.kind === 'video' ? '视频' : '语音'}通话 ${callClock(m.duration || 0)}]`
                    : `[${m.kind === 'video' ? '视频' : '语音'}通话未接通]`)
                : (m.type==='image' ? (m.caption?`[图片：${m.caption}]`:'[图片]') : m.content)
            }))];
          const rawReply = await Phone.chatWithAI(messages);

          function resolveSpeakerName(sn){
            if(!members.some(mm => mm.name === sn)){
              const found = members.find(mm => mm.name.includes(sn) || sn.includes(mm.name.split(' ')[0]));
              if(found) sn = found.name;
            }
            return sn;
          }

          const speakerTagRe = /^[【〖\[［「『]\s*([^】〗\]］」』]{1,20}?)\s*[】〗\]］」』]\s*[：:．.]\s*/m;
          const speakerTagReG = /^[【〖\[［「『]\s*([^】〗\]］」』]{1,20}?)\s*[】〗\]］」』]\s*[：:．.]\s*/gm;

          function parseSpeakerAndText(part){
            let sn = chat.name;
            let tx = part.trim();
            const m = tx.match(speakerTagRe);
            if(m){
              sn = resolveSpeakerName(m[1].trim());
              tx = tx.slice(m[0].length).trim();
            }
            return { speakerName: sn, text: tx };
          }

          function splitGroupReply(raw){
            const segs = [];
            raw.replace(/\|\|\|/g, '\n').split('\n').forEach(line => {
              const t = line.trim();
              if(!t) return;
              const m = t.match(speakerTagRe);
              if(m){
                segs.push({ hasTag:true, speaker: m[1].trim(), text: t.slice(m[0].length).trim() });
              } else {
                segs.push({ hasTag:false, text: t });
              }
            });
            const out = [];
            let lastSpeaker = chat.name;
            for(const s of segs){
              if(!s.text) continue;
              if(s.hasTag){
                lastSpeaker = resolveSpeakerName(s.speaker);
              }
              const last = out[out.length - 1];
              if(last && last.speakerName === lastSpeaker && last.text === s.text) continue;
              out.push({ speakerName: lastSpeaker, text: s.text });
            }
            return out;
          }

          let defaultFontType = '';
          const defaultContact = MOCK_CONTACTS.find(c => c.id === chat.contactId);
          if(defaultContact?.fontType) defaultFontType = defaultContact.fontType;

          const parts = isGroup
            ? splitGroupReply(rawReply)
            : rawReply.split(/\|\|\|/).map(s => s.trim()).filter(Boolean).map(p => ({ speakerName: chat.name, text: p }));

          applyPaymentsToParts(parts);

          const allCommands = [];
          parts.forEach(p => {
            const { speakerName, text } = isGroup ? p : (typeof p === 'string' ? parseSpeakerAndText(p) : p);
            const { replyText, commands } = parseAISendCommands(text, speakerName);
            p.text = replyText;
            if(commands.length) allCommands.push(...commands);
          });
          executeAISendCommands(allCommands);

          const finalParts = parts
            .filter(p => p.text && p.text.trim())
            .reduce((acc, p) => {
              const last = acc[acc.length - 1];
              if(last && last.speakerName === p.speakerName && last.text === p.text) return acc;
              acc.push(p);
              return acc;
            }, []);

          const stickerMap = {};
          allStickers.forEach(s => { stickerMap[s.id] = s; });
          const parsedMessagesRaw = await Promise.all(finalParts.map(async (p, i) => {
            const { speakerName, text } = isGroup ? p : (typeof p === 'string' ? parseSpeakerAndText(p) : p);
            const stickerMatch = text.match(/\[表情[：:]([^\]]+)\]/);
            if(stickerMatch){
              const sid = stickerMatch[1].trim();
              const sk = stickerMap[sid];
              if(sk){
                return { role:'ai', type:'sticker', content: sk.src, caption: sk.caption||'', speakerName, ts: Date.now() + i };
              }
            }
            const textImgMatch = text.match(/\[文字图[：:]([^\]]+)\]/);
            if(textImgMatch){
              const imgText = textImgMatch[1].trim();
              const src = await genTextImage(imgText);
              return { role:'ai', type:'image', content: src, caption:'', isTextImg:true, speakerName, ts: Date.now() + i };
            }
            let ft = '';
            if(isGroup){
              const spk = members.find(m => m.name === speakerName);
              if(spk) ft = spk.fontType || '';
            } else {
              ft = defaultFontType;
            }
            const finalText = (ft === '繁体') ? toTraditional(text) : text;
            return { role:'ai', content:finalText, speakerName, ts: Date.now() + i };
          }));
          const parsedMessages = parsedMessagesRaw.filter((m, i, arr) => {
            if(!m.type){
              const prev = arr[i - 1];
              if(prev && prev.type === 'sticker' && prev.speakerName === m.speakerName){
                const txt = (m.content || '').trim().replace(/[-—~～！!。.？?]+$/g,'');
                const cap = (prev.caption || '').trim().replace(/[-—~～！!。.？?]+$/g,'');
                if(cap && (txt === cap || txt.startsWith(cap) || cap.startsWith(txt))){
                  return false;
                }
              }
            }
            return true;
          });
          parsedMessages.forEach(m => history.push(m));
          saveHistoryToStorage();
          t.remove();

          let idx = 0;
          function revealNext(){
            if(idx >= parsedMessages.length){
              _notifyChatUpdated();
              isReplying = false;
              input.focus();
              if(pendingCharCall){
                const req = pendingCharCall;
                pendingCharCall = null;
                const callers = (req.callers || []).map(c => {
                  if(!isGroup) return null;
                  const byName = members.find(mm => mm.name === c.speakerName);
                  if(byName) return byName;
                  if(c.target) return members.find(mm => mm.name === c.target || (mm.name && c.target.includes(mm.name))) || null;
                  return null;
                }).filter(Boolean);
                const callerArg = isGroup
                  ? (callers.length ? callers : (members[0] ? [members[0]] : null))
                  : undefined;
                lastCharCallAt = Date.now();
                aiReplyCountSinceCall = 0;
                setTimeout(() => {
                  if(!document.body.contains(detail) || isReplying) return;
                  if(document.querySelector('.wc-call') || document.querySelector('.wc-incoming')) return;
                  startIncomingCall(callerArg || undefined);
                }, 1200);
                return;
              }
              maybeCharInitiateCall();
              return;
            }
            msgs.appendChild(renderOneMessage(parsedMessages[idx]));
            msgs.scrollTop = msgs.scrollHeight;
            idx++;
            setTimeout(revealNext, 500 + Math.random() * 400);
          }
          revealNext();
          return;
        }catch(err){
          t.textContent = '出错了：' + err.message;
          t.style.color = '#e74c3c';
        }finally{
          isReplying = false;
          input.focus();
        }
      }
    }

          stickerGroupIds:[], worldbookGroupIds:[],
          autoReply:false, autoReplySeconds:5, contextCount:50,
          realTime:false, shareGroupMemory:false, shareGroupIds:[],
          phonePassword:'', proactiveMsg:false, proactiveMsgInterval:30, proactiveMoment:false, proactiveMomentInterval:60
        };
        d.chatSettings[chatId] = cs;
        return { d, cs };
      }
      function saveSettings(d){ Phone.setData('wechat', d); }

      function getStickerGroupNames(ids){
        const packs = getStickerPacks();
        const names = packs.filter(p => ids.includes(p.id)).map(p => p.name);
        return names.length ? names.join(', ') : '未绑定';
      }
      function getGroupNames(ids){
        const d = Phone.getData('groups') || { list: [] };
        const list = d.list || [];
        const names = list.filter(g => ids.includes(g.id)).map(g => g.name);
        return names.length ? names.join(', ') : '未选择';
      }

      const SVG_ICONS = {
        mic: '<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
        download: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
        upload: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
        restart: '<svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>',
        trash: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>'
      };

      function render(){
        const { d, cs } = getSettings();
        const allChars = (Phone._getState().characters || []);
        const personaChar = allChars.find(c => c.id === (cs.personaId || char.id));
        const personaDisplayName = personaChar ? personaChar.name : '未选择';
        body.innerHTML = '';

        const profileCard = document.createElement('div');
        profileCard.className = 'wc-set-card';
        profileCard.innerHTML = `
          <div class="wc-set-profile" data-act="profile">
            ${avatarHTML(contact?.name || chat.name, '', contact?.avatar || '')}
            <div class="wc-set-profile-info">
              <div class="wc-set-profile-name">${escAttr(contact?.name || chat.name)}</div>
              <div class="wc-set-profile-sign">${cs.signature ? escAttr(cs.signature) : '点击更改个性签名'}</div>
            </div>
            <span class="wc-set-arrow">›</span>
          </div>`;
        body.appendChild(profileCard);

        const card1 = document.createElement('div');
        card1.className = 'wc-set-card';
        card1.innerHTML = `
          <div class="wc-set-row" data-act="remark">
            <span class="wc-set-label">角色备注</span>
            <span class="wc-set-val"><span class="wc-set-val-text">${cs.remark || '未设置'}</span><span class="wc-set-arrow">›</span></span>
          </div>
          <div class="wc-set-row" data-act="persona">
            <span class="wc-set-label">当前用户人设</span>
            <span class="wc-set-val"><span class="wc-set-val-text">${personaDisplayName}</span><span class="wc-set-arrow">›</span></span>
          </div>
          <div class="wc-set-row" data-act="stickerGroups">
            <span class="wc-set-label">表情包分组绑定</span>
            <span class="wc-set-val"><span class="wc-set-val-text">${getStickerGroupNames(cs.stickerGroupIds)}</span><span class="wc-set-arrow">›</span></span>
          </div>
          <div class="wc-set-row" data-act="worldbookGroups">
            <span class="wc-set-label">世界书分组绑定</span>
            <span class="wc-set-val"><span class="wc-set-val-text">${cs.worldbookGroupIds.length ? '已绑定 ' + cs.worldbookGroupIds.length + ' 项' : '未绑定'}</span><span class="wc-set-arrow">›</span></span>
          </div>
          <div class="wc-set-row" data-act="autoReply">
            <span class="wc-set-label">角色自动回复</span>
            <span class="wc-set-val"><button class="wc-set-toggle ${cs.autoReply?'on':''}" data-sw="autoReply"></button></span>
          </div>
          ${cs.autoReply ? `
          <div class="wc-set-sub-row">
            <span class="wc-set-sub-label">角色</span>
            <input type="number" class="wc-set-sub-input" min="1" max="30" value="${cs.autoReplySeconds}" data-num="autoReplySeconds">
            <span class="wc-set-sub-label">秒回复</span>
          </div>` : ''}
          <div class="wc-set-slider-row">
            <div class="wc-set-slider-head">
              <span class="wc-set-label">上下文记忆条数</span>
              <span class="wc-set-slider-val">${cs.contextCount}</span>
            </div>
            <input type="range" class="wc-set-slider" min="5" max="200" step="5" value="${cs.contextCount}" data-slider="contextCount">
          </div>`;
        body.appendChild(card1);

        const card2 = document.createElement('div');
        card2.className = 'wc-set-card';
        function makeRow(act, label, valHtml, hasArrow){
          const r = document.createElement('div');
          r.className = 'wc-set-row';
          if(act) r.setAttribute('data-act', act);
          r.innerHTML = `<span class="wc-set-label">${label}</span><span class="wc-set-val">${valHtml}${hasArrow?'<span class="wc-set-arrow">›</span>':''}</span>`;
          return r;
        }
        function makeSubRow(label, numKey, defVal){
          const r = document.createElement('div');
          r.className = 'wc-set-sub-row';
          r.innerHTML = `<span class="wc-set-sub-label">每隔</span><input type="number" class="wc-set-sub-input" min="1" max="1440" value="${defVal}" data-num="${numKey}"><span class="wc-set-sub-label">分钟${label}</span>`;
          return r;
        }
        function makeToggleRow(act, label, swKey){
          return makeRow(act, label, `<button class="wc-set-toggle ${cs[swKey]?'on':''}" data-sw="${swKey}"></button>`, false);
        }
        function makeTextRow(act, label, textVal){
          return makeRow(act, label, `<span class="wc-set-val-text">${textVal}</span>`, true);
        }

        card2.appendChild(makeRow('memory', '记忆', '<span class="wc-set-arrow">›</span>', false));
        card2.appendChild(makeToggleRow('realTime', '真实时间感知', 'realTime'));
        card2.appendChild(makeToggleRow('shareGroupMemory', '与群聊共享记忆', 'shareGroupMemory'));
        if(cs.shareGroupMemory){
          card2.appendChild(makeTextRow('shareGroups', '选择共享群聊', getGroupNames(cs.shareGroupIds)));
        }
        card2.appendChild(makeRow('phonePassword', '角色手机密码', `<span class="wc-set-val-text">${cs.phonePassword ? '已设置' : char?.birthday || '未设置'}</span>`, true));
        card2.appendChild(makeToggleRow('proactiveMsg', '主动发消息', 'proactiveMsg'));
        if(cs.proactiveMsg){
          card2.appendChild(makeSubRow('主动发消息', 'proactiveMsgInterval', cs.proactiveMsgInterval));
        }
        card2.appendChild(makeToggleRow('proactiveMoment', '主动发朋友圈', 'proactiveMoment'));
        if(cs.proactiveMoment){
          card2.appendChild(makeSubRow('主动发朋友圈', 'proactiveMomentInterval', cs.proactiveMomentInterval));
        }
        const btnWrap = document.createElement('div');
        btnWrap.style.cssText = 'padding:12px 16px';
        const btnGreen = document.createElement('button');
        btnGreen.className = 'wc-set-btn-green';
        btnGreen.setAttribute('data-act', 'postMoment');
        btnGreen.textContent = '立刻发朋友圈';
        btnWrap.appendChild(btnGreen);
        card2.appendChild(btnWrap);
        body.appendChild(card2);

        const btnRestart = document.createElement('button');
        btnRestart.className = 'wc-set-btn-restart';
        btnRestart.setAttribute('data-act', 'restart');
        btnRestart.innerHTML = SVG_ICONS.restart + ' 重启会话';
        body.appendChild(btnRestart);

        const btnDelete = document.createElement('button');
        btnDelete.className = 'wc-set-btn-delete';
        btnDelete.setAttribute('data-act', 'delete');
        btnDelete.innerHTML = SVG_ICONS.trash + ' 删除会话';
        body.appendChild(btnDelete);

        bindEvents(d, cs);
      }

      function bindEvents(d, cs){
        body.querySelectorAll('.wc-set-toggle').forEach(sw => {
          sw.addEventListener('click', e => {
            e.stopPropagation();
            const key = sw.dataset.sw;
            cs[key] = !cs[key];
            saveSettings(d);
            sw.classList.toggle('on', cs[key]);
            render();
          });
        });

        body.querySelectorAll('.wc-set-sub-input').forEach(inp => {
          inp.addEventListener('change', () => {
            const key = inp.dataset.num;
            const v = parseInt(inp.value);
            if(key === 'autoReplySeconds') cs.autoReplySeconds = Math.max(1, Math.min(30, v||5));
            if(key === 'proactiveMsgInterval') cs.proactiveMsgInterval = Math.max(5, Math.min(1440, v||30));
            if(key === 'proactiveMomentInterval') cs.proactiveMomentInterval = Math.max(5, Math.min(1440, v||60));
            saveSettings(d);
            render();
          });
        });

        body.querySelectorAll('.wc-set-slider').forEach(sl => {
          sl.style.setProperty('--pct', ((sl.value - sl.min) / (sl.max - sl.min) * 100) + '%');
          sl.addEventListener('input', () => {
            const key = sl.dataset.slider;
            cs[key] = parseInt(sl.value);
            sl.style.setProperty('--pct', ((sl.value - sl.min) / (sl.max - sl.min) * 100) + '%');
            const valEl = sl.parentElement.querySelector('.wc-set-slider-val');
            if(valEl) valEl.textContent = sl.value;
            saveSettings(d);
          });
        });

        body.querySelectorAll('[data-act]').forEach(el => {
          el.addEventListener('click', () => handleAction(el.dataset.act, d, cs));
        });
      }

      function handleAction(act, d, cs){
        switch(act){
          case 'profile':
            Phone.modal({
              title:'个性签名',
              fields:[{key:'val',label:'签名内容',value:cs.signature||'',placeholder:'写点什么...'}],
              onOk: v => { cs.signature = (v.val||'').trim(); saveSettings(d); render(); return v; }
            });
            break;
          case 'remark':
            Phone.modal({
              title:'角色备注',
              fields:[{key:'val',label:'备注',value:cs.remark||'',placeholder:'给这个角色设置备注'}],
              onOk: v => { cs.remark = (v.val||'').trim(); saveSettings(d); render(); return v; }
            });
            break;
          case 'persona': {
            const chars = (Phone._getState().characters || []);
            const curCharId = cs.personaId || Phone.getCurrentChar()?.id || '';
            openMultiPicker('选择用户人设', chars.map(c=>({id:c.id,name:c.name + (c.persona ? ' · ' + c.persona.slice(0,30) : '')})), curCharId?[curCharId]:[], (ids) => {
              const selected = chars.find(c => ids.includes(c.id));
              cs.personaId = selected ? selected.id : '';
              cs.persona = selected ? (selected.persona || '') : '';
              Phone.updateChar({ personaId: cs.personaId, persona: cs.persona });
              saveSettings(d); render();
            }, '暂无可用人设，请先去"设置 → 人设"中创建', { single:true });
            break;
          }
          case 'stickerGroups':
            openMultiPicker('选择表情包分组', getStickerPacks().map(p=>({id:p.id,name:p.name})), cs.stickerGroupIds, (ids) => {
              cs.stickerGroupIds = ids; saveSettings(d); render();
            });
            break;
          case 'worldbookGroups':
            openMultiPicker('选择世界书分组', (Phone._getState().worldbooks||[]).map(w=>({id:w.id,name:w.name})), cs.worldbookGroupIds, (ids) => {
              cs.worldbookGroupIds = ids;
              if(contact){ contact.worldbookIds = ids.slice(); saveContacts(MOCK_CONTACTS); }
              saveSettings(d); render();
            });
            break;
          case 'shareGroups': {
            const groups = getGroups();
            openMultiPicker('选择共享群聊', groups.map(g=>({id:g.id,name:g.name})), cs.shareGroupIds, (ids) => {
              cs.shareGroupIds = ids; saveSettings(d); render();
            }, '该角色未参与任何群聊');
            break;
          }
          case 'phonePassword':
            Phone.modal({
              title:'角色手机密码',
              fields:[{key:'val',label:'密码（默认角色生日）',value:cs.phonePassword||char?.birthday||'',placeholder:'例如：0915'}],
              onOk: v => { cs.phonePassword = (v.val||'').trim(); saveSettings(d); render(); return v; }
            });
            break;
          case 'memory':
            openMemoryPage();
            break;
          case 'postMoment': {
            const tip = document.createElement('div');
            tip.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:99999';
            const posterName = contact?.name || chat.name;
            const posterAvatar = contact?.avatar || '';
            const posterPersona = contact?.roleSetting || '';
            const posterFontType = contact?.fontType || '';
            tip.textContent = posterName + ' 正在发朋友圈...';
            document.body.appendChild(tip);
            (async () => {
              try {
                const now = new Date();
                const timeStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                let sys = `你是 ${posterName}，现在要在微信朋友圈发一条动态。\n当前时间：${timeStr}\n`;
                if(posterPersona) sys += `【你的人设】\n${posterPersona}\n`;
                if(contact?.writingStyle?.length) sys += `【文风参考（请模仿这些话法和语气）】\n${contact.writingStyle.slice(0,15).map(s => s.trim()).filter(Boolean).join('\n')}\n`;
                sys += `风格：符合你作为 ${posterName} 的性格和身份，自然、生活化。\n要求：只用一段简短的文字，像真实的朋友圈一样，不要加标点符号以外的格式，不要说自己是AI，不要用表情符号以外的东西。控制在1-3句话。\n如果想配一张纯文字图片，在行尾加上 [文字图:要渲染的文字内容] 即可生成一张配图。`;
                const reply = await Phone.chatWithAI([{ role:'system', content:sys }, { role:'user', content:'发一条朋友圈吧' }]);
                let content = (reply || '').trim().replace(/^["「『]|["」』]$/g, '');
                if(posterFontType === '繁体') content = toTraditional(content);
                const images = [];
                content = content.replace(/\[文字图[：:]([^\]]+)\]/g, (m, txt) => {
                  images.push({ type:'text', text: txt.trim(), bg:'#ffffff', fg:'#1a1a1a' });
                  return '';
                }).trim();
                const puqData = Phone.getData('puq') || { posts:[] };
                const post = {
                  id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
                  authorId: contact?.id || '',
                  authorName: posterName,
                  authorAvatar: posterAvatar,
                  text: content || '今天也是美好的一天~',
                  images,
                  createdAt: Date.now(),
                  likes: [],
                  comments: []
                };
                puqData.posts = puqData.posts || [];
                puqData.posts.push(post);
                Phone.setData('puq', puqData);
                if(window.__puqRuntime && window.__puqRuntime.renderList){
                  window.__puqRuntime.renderList();
                }
                if(window.__puqRuntime && window.__puqRuntime.triggerPostLaunchInteractions){
                  window.__puqRuntime.triggerPostLaunchInteractions(post);
                }
                tip.textContent = '朋友圈已发布！';
                setTimeout(() => tip.remove(), 1200);
              } catch(e) {
                tip.textContent = '生成失败，请重试';
                tip.style.background = 'rgba(220,50,50,0.85)';
                setTimeout(() => tip.remove(), 1800);
              }
            })();
            break;
          }
          case 'restart':
            if(confirm('确定重启会话？将清空当前聊天记录和所有记忆，仅保留开场白。')){
              const d2 = Phone.getData('wechat');
              if(d2.memories && d2.memories[chatId]){
                d2.memories[chatId] = { core:[], storylines:[] };
              }
              if(d2.heartVoices && d2.heartVoices[chatId]){
                d2.heartVoices[chatId] = [];
              }
              Phone.setData('wechat', d2);
              const c = MOCK_CHATS.find(x=>x.id===chatId);
              let fresh = [];
              if(c){
                if(!c.isGroup){
                  const contact = MOCK_CONTACTS.find(cc => cc.id === c.contactId);
                  const lines = (contact?.openingLine || '').split('\n').filter(Boolean);
                  if(lines.length){
                    const baseTs = Date.now();
                    fresh = lines.map((l,i) => ({ role:'ai', content:l, ts: baseTs - (lines.length - i - 1) * 60000 }));
                  }
                }
              }
              const existing = chatHistory[chatId];
              if(existing){
                existing.length = 0;
                fresh.forEach(m => existing.push(m));
              } else {
                chatHistory[chatId] = fresh;
              }
              saveHistoryToStorage();
              document.dispatchEvent(new CustomEvent('wechat-data-updated', { detail:{ type:'chat' } }));
              render();
              alert('会话已重启');
            }
            break;
          case 'delete':
            if(confirm(`确定删除与「${contact?.name||chat.name}」的会话？此操作不可恢复。`)){
              const idx = MOCK_CHATS.findIndex(c=>c.id===chatId);
              if(idx>-1) MOCK_CHATS.splice(idx,1);
              const wd = Phone.getData('wechat') || {};
              if(wd.chatList){
                const sIdx = wd.chatList.findIndex(c=>c.id===chatId);
                if(sIdx>-1){ wd.chatList.splice(sIdx,1); Phone.setData('wechat', wd); }
              }
              delete chatHistory[chatId];
              page.classList.remove('show');
              setTimeout(()=>{ page.remove(); if(parentDetail){ parentDetail.classList.remove('show'); setTimeout(()=>parentDetail.remove(),300); } },300);
              renderTab(currentTab);
            }
            break;
        }
      }

        d.memories = d.memories || {};
        d.heartVoices = d.heartVoices || {};
        const chatMem = d.memories[chatId] || { core:[], storylines:[] };
        if(!d.memories[chatId]){ d.memories[chatId] = chatMem; Phone.setData('wechat', d); }

              </div>
              <div class="wc-mem-section-body">
                <div class="wc-mem-tip" style="font-size:12px;color:#888;padding:0 0 8px">在聊天室点击爱心生成，记录角色内心的真实想法</div>
                <div class="wc-mem-list" id="wcHeartList"></div>
              </div>
            </div>
          </div>`;
        page.appendChild(memPage);
        requestAnimationFrame(() => memPage.classList.add('show'));

        memPage.querySelectorAll('.wc-mem-section-head').forEach(head => {
          head.addEventListener('click', () => {
            head.parentElement.classList.toggle('collapsed');
          });
        });

        function renderList(listEl, items, onEdit, onDel, emptyText){
          if(!items.length){
            listEl.innerHTML = `<div class="wc-mem-empty">${emptyText}</div>`;
            return;
          }
          listEl.innerHTML = items.map((mem, i) => `
            <div class="wc-mem-item">
              <div class="wc-mem-item-content">${escAttr(mem.content)}</div>
              <div class="wc-mem-item-time">${escAttr(mem.time)}</div>
              <div class="wc-mem-item-actions">
                ${onEdit ? `<button class="wc-mem-edit-btn" data-i="${i}" title="修改">✎</button>` : ''}
                <button class="wc-mem-del-btn" data-i="${i}" title="删除">×</button>
              </div>
            </div>`).join('');
          listEl.querySelectorAll('.wc-mem-del-btn').forEach(btn => btn.addEventListener('click', () => {
            const i = parseInt(btn.dataset.i);
            if(confirm('确定删除？')){ onDel(i); Phone.setData('wechat', d); render(); }
          }));
          if(onEdit){
            listEl.querySelectorAll('.wc-mem-edit-btn').forEach(btn => btn.addEventListener('click', () => {
              const i = parseInt(btn.dataset.i); onEdit(i);
            }));
          }
        }

        function render(){
          const coreList = memPage.querySelector('#wcCoreMemList');
          const slList = memPage.querySelector('#wcStorylineList');
          const hList = memPage.querySelector('#wcHeartList');
          renderList(coreList, chatMem.core,
            (i) => Phone.modal({ title:'修改核心记忆', fields:[{key:'content',label:'内容',value:chatMem.core[i].content,type:'textarea'}], onOk: v => {
              if(!(v.content||'').trim()) return false; chatMem.core[i].content = v.content.trim(); const now = new Date();
              chatMem.core[i].time = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
              Phone.setData('wechat', d); render(); return v;
            }}),
            (i) => chatMem.core.splice(i,1),
            '暂无核心记忆<br>点击右下角 + 添加重要记忆'
          );
          renderList(slList, chatMem.storylines,
            (i) => Phone.modal({ title:'修改剧情线', fields:[{key:'content',label:'剧情线内容',value:chatMem.storylines[i].content,type:'textarea'}], onOk: v => {
              if(!(v.content||'').trim()) return false; chatMem.storylines[i].content = v.content.trim(); const now = new Date();
              chatMem.storylines[i].time = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
              Phone.setData('wechat', d); render(); return v;
            }}),
            (i) => chatMem.storylines.splice(i,1),
            '暂无剧情线'
          );
          renderList(hList, heartList, null,
            (i) => { heartList.splice(i,1); d.heartVoices[chatId] = heartList; },
            '还没有心声<br>去聊天室点击爱心生成'
          );
        }
        render();

        function addItem(store, title, placeholder){
          Phone.modal({ title, fields:[{key:'content',label:'内容',value:'',type:'textarea',placeholder}], onOk: v => {
            if(!(v.content||'').trim()) return false;
            const now = new Date();
            const time = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            chatMem[store].unshift({ content: v.content.trim(), time });
            Phone.setData('wechat', d); render(); return v;
          }});
        }

        memPage.querySelector('#wcCoreAdd').addEventListener('click', () => addItem('core','添加核心记忆','输入需要角色记住的重要内容...'));
        memPage.querySelector('#wcStorylineAdd').addEventListener('click', () => addItem('storylines','添加剧情线','输入故事背景、人物关系、世界观剧情等...'));

        memPage.querySelector('.wc-cd-back').addEventListener('click', () => {
          memPage.classList.remove('show');
          setTimeout(() => memPage.remove(), 300);
        });
      }

      page.querySelector('.wc-cd-back').addEventListener('click', () => {
        page.classList.remove('show');
        setTimeout(() => page.remove(), 300);
      });

      render();
    }

    switchTab('chat');
  };
})();
</script>
</body>
</html>
