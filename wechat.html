.wc-rp-amount{width:120px;border:none;border-bottom:1.5px solid rgba(255,255,255,.8);font-size:36px;font-weight:600;color:#fff;text-align:center;outline:none;padding:4px 0;background:transparent;}
.wc-rp-amount::placeholder{color:rgba(255,255,255,.5);font-weight:400;font-size:28px;}
.wc-rp-count-row{display:none;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;background:rgba(255,255,255,.15);border-radius:10px;}
.wc-rp-count-row.show{display:flex;}
.wc-rp-count-label{font-size:13px;opacity:.9;flex-shrink:0;}
.wc-rp-count-input{width:60px;border:none;border-bottom:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-size:15px;text-align:center;outline:none;font-family:inherit;}
.wc-rp-msg-row{margin-bottom:16px;}
.wc-rp-msg{width:100%;border:none;background:rgba(255,255,255,.15);border-radius:10px;padding:10px 12px;color:#fff;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box;}
.wc-rp-msg::placeholder{color:rgba(255,255,255,.6);}
.wc-rp-balance{font-size:11px;opacity:.75;text-align:center;margin-bottom:12px;}
.wc-rp-send-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#fff;color:#e03c1c;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.wc-rp-send-btn:active{opacity:.85;}
.wc-rp-send-btn:disabled{opacity:.5;cursor:not-allowed;}
.wc-rp-ornament{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:60px;height:60px;background:radial-gradient(circle,rgba(255,215,0,.6),transparent 70%);pointer-events:none;}

/* ==== 聊天中转账/红包卡片 ==== */
.wc-xfer-card{width:220px;background:linear-gradient(135deg,#fef9e7,#fff5cc);border:1px solid #f0d88a;border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;}
.wc-xfer-card:active{transform:scale(.98);}
.wc-xfer-card.claimed{background:linear-gradient(135deg,#f5f5f5,#ebebeb);border-color:#d0d0d0;opacity:.85;}
.wc-xfer-card.rejected{background:linear-gradient(135deg,#fdf2f2,#fce4e4);border-color:#f5b3b3;opacity:.85;}
.wc-xfer-card.rejected .wc-xfer-label,.wc-xfer-card.rejected .wc-xfer-amt-symbol,.wc-xfer-card.rejected .wc-xfer-amt-text,.wc-xfer-card.rejected .wc-xfer-note{color:#c05050;}
.wc-xfer-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.wc-xfer-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#3fa96a,#2d8e57);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wc-xfer-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;}
.wc-xfer-label{font-size:13px;color:#8a6e00;font-weight:500;}
.wc-xfer-body-row{display:flex;align-items:baseline;justify-content:space-between;}
.wc-xfer-amt-text{font-size:22px;font-weight:700;color:#1a1a1a;}
.wc-xfer-amt-symbol{font-size:14px;color:#1a1a1a;margin-right:1px;}
.wc-xfer-note{font-size:11px;color:#999;margin-top:4px;}
.wc-xfer-status{font-size:11px;color:#b8860b;margin-top:4px;}
.wc-xfer-card.claimed .wc-xfer-status{color:#888;}
.wc-xfer-claimed-label{display:inline-block;font-size:11px;color:#999;background:#f1f1f1;padding:3px 10px;border-radius:10px;}

.wc-rp-card{width:220px;background:linear-gradient(135deg,#f55a3b,#e03c1c);border-radius:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;color:#fff;transition:transform .15s;box-shadow:0 4px 14px -4px rgba(224,60,28,.45);}
.wc-rp-card:active{transform:scale(.98);}
.wc-rp-card.claimed{background:linear-gradient(135deg,#b0b0b0,#888);box-shadow:none;opacity:.8;}
.wc-rp-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,215,0,.35),transparent 65%);pointer-events:none;}
.wc-rp-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.wc-rp-card-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.wc-rp-card-label{font-size:13px;font-weight:500;}
.wc-rp-card-msg{font-size:14px;opacity:.9;margin-bottom:4px;line-height:1.3;min-height:18px;}
.wc-rp-card-amt{font-size:20px;font-weight:700;}
.wc-rp-card-amt-symbol{font-size:13px;margin-right:1px;}
.wc-rp-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.wc-rp-card-status{font-size:11px;opacity:.85;}
.wc-rp-card.claimed .wc-rp-card-status{opacity:.95;}
.wc-rp-card-type{font-size:11px;opacity:.75;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:4px;}
.wc-rp-card.claimed .wc-rp-card-type{opacity:.7;}

/* ==== 位置消息卡片 ==== */
.wc-loc-card{width:184px;border-radius:13px;overflow:hidden;cursor:pointer;transition:transform .15s;
  background:linear-gradient(180deg,#f4fbf7,#eef8f1);
  border:1px solid #d5ebde;
  box-shadow:0 7px 16px -13px rgba(45,142,87,.55);}
.wc-loc-card:active{transform:scale(.98);}
.wc-loc-map{position:relative;height:84px;background-color:#eaf6ee;
  background-image:linear-gradient(rgba(63,169,106,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(63,169,106,.09) 1px,transparent 1px);
  background-size:16px 16px,16px 16px;}
.wc-loc-shadow{position:absolute;left:50%;top:50%;width:14px;height:4px;margin:4px 0 0 -7px;border-radius:50%;
  background:rgba(45,142,87,.2);}
.wc-loc-pin{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-19px 0 0 -9px;
  background:linear-gradient(160deg,#5cc489,#2d8e57);
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  box-shadow:0 4px 10px -4px rgba(45,142,87,.5);}
.wc-loc-pin::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#eefaf2;}
.wc-loc-info{padding:7px 10px 9px;}
.wc-loc-name{font-size:12.5px;font-weight:700;color:var(--green-ink);line-height:1.3;}
.wc-loc-addr{font-size:10px;color:#5f8a71;line-height:1.35;margin-top:2px;word-break:break-word;}
.wc-loc-dist{font-size:9.5px;color:#9abfab;margin-top:3px;}

/* ==== 发送位置弹窗 ==== */
.wc-loc-mask{position:fixed;inset:0;background:rgba(24,64,40,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:wcFadeIn .22s ease;}
.wc-loc-box{position:relative;width:86%;max-width:330px;background:#fff;border-radius:20px;overflow:hidden;animation:wcPopIn .3s cubic-bezier(.32,.72,0,1);box-shadow:0 22px 56px -20px rgba(20,60,35,.5);}
.wc-loc-box-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;font-size:15px;font-weight:700;color:var(--green-ink);}
.wc-loc-box-close{border:none;background:none;color:#a3c0b0;font-size:20px;line-height:1;cursor:pointer;padding:0 2px;}
.wc-loc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:1px solid #f1f7f3;}
.wc-loc-row-label{font-size:12.5px;color:#8ba99a;}
.wc-loc-row-val{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:4px 0;font-size:13.5px;font-weight:600;color:var(--green-ink);font-family:inherit;cursor:pointer;max-width:180px;}
.wc-loc-row-val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-loc-chev{font-size:13px;color:#b6cdc0;line-height:1;}
.wc-loc-picker{position:absolute;inset:0;background:#fff;border-radius:20px;display:flex;flex-direction:column;z-index:2;animation:wcFadeIn .16s ease;}
.wc-loc-picker-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px;font-size:15px;font-weight:700;color:var(--green-ink);}
.wc-loc-picker-list{overflow-y:auto;padding:0 8px 12px;max-height:300px;}
.wc-loc-picker-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:none;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;}
.wc-loc-picker-item:active{background:#f2faf5;}
.wc-loc-picker-item.on{background:#eaf6ee;}
.wc-loc-picker-av{width:28px;height:28px;border-radius:8px;object-fit:cover;background:#eaf6ee;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#2d8e57;flex:0 0 auto;overflow:hidden;}
.wc-loc-picker-name{font-size:13.5px;color:var(--green-ink);font-weight:500;}
.wc-loc-preview{position:relative;height:132px;background-color:#eaf6ee;
  background-image:linear-gradient(rgba(63,169,106,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(63,169,106,.09) 1px,transparent 1px);
  background-size:24px 24px,24px 24px;}
.wc-loc-chip{position:absolute;left:12px;bottom:12px;max-width:70%;padding:5px 10px;border-radius:10px;
  background:rgba(255,255,255,.85);font-size:12px;color:#8bb09c;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wc-loc-chip.filled{color:var(--green-ink);font-weight:600;}
.wc-loc-box-body{padding:2px 16px 16px;}
.wc-loc-field{width:100%;box-sizing:border-box;border:none;border-bottom:1px solid #e8f2ea;padding:11px 0;font-size:14px;color:var(--green-ink);font-family:inherit;outline:none;background:transparent;}
.wc-loc-field::placeholder{color:#a9c2b4;}
.wc-loc-field:focus{border-bottom-color:#3fa96a;}
.wc-loc-send-btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#3fa96a,#2d8e57);color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.wc-loc-send-btn:active{opacity:.85;}

/* ==== 领取红包弹窗 ==== */
.wc-rp-open-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:wcFadeIn .3s ease;}
.wc-rp-open-box{width:75%;max-width:280px;background:linear-gradient(180deg,#f55a3b,#c82310);border-radius:50% 50% 20px 20px / 40% 40% 20px 20px;padding:28px 24px 22px;text-align:center;color:#fff;animation:wcPopIn .35s cubic-bezier(.32,.72,0,1);position:relative;box-shadow:0 16px 48px -4px rgba(224,60,28,.55);}
.wc-rp-open-box.claimed{background:linear-gradient(180deg,#b0b0b0,#777);border-radius:20px;box-shadow:none;animation:wcPopIn .25s ease;}
.wc-rp-open-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;margin:0 auto 10px;}
.wc-rp-open-sender{font-size:14px;font-weight:500;margin-bottom:2px;}
.wc-rp-open-msg{font-size:12px;opacity:.9;margin-bottom:16px;line-height:1.4;}
.wc-rp-open-amt-wrap{margin-bottom:18px;}
.wc-rp-open-amt-label{font-size:11px;opacity:.85;margin-bottom:6px;}
.wc-rp-open-amt{font-size:38px;font-weight:700;}
.wc-rp-open-amt-symbol{font-size:18px;margin-right:2px;}
.wc-rp-open-btn{width:100%;padding:11px;border:none;border-radius:10px;background:#fff;color:#e03c1c;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.wc-rp-open-btn:active{opacity:.85;}
.wc-rp-close-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;border:none;background:rgba(255,255,255,.25);border-radius:50%;cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;}
.wc-rp-open-count{font-size:11px;opacity:.75;margin-top:10px;}
.wc-rp-open-claimed-list{margin-top:14px;padding:10px;background:rgba(255,255,255,.15);border-radius:8px;text-align:left;font-size:12px;max-height:120px;overflow-y:auto;}
.wc-rp-open-claimed-item{display:flex;justify-content:space-between;padding:3px 0;}
.wc-rp-open-claimed-name{opacity:.9;}
.wc-rp-open-claimed-amt{font-weight:600;}

/* ==== 居中收款/领红包结果弹窗 ==== */
.wc-pay-result-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.wc-pay-result-mask.show{opacity:1;pointer-events:auto;}
.wc-pay-result-box{min-width:220px;max-width:280px;padding:24px 22px;border-radius:20px;text-align:center;box-shadow:0 16px 48px -12px rgba(0,0,0,.25);transform:scale(.85);transition:transform .35s cubic-bezier(.32,.72,0,1);border:1px solid rgba(255,255,255,.6);}
.wc-pay-result-mask.show .wc-pay-result-box{transform:scale(1);}
.wc-pay-result-icon{font-size:42px;margin-bottom:10px;line-height:1;}
.wc-pay-result-title{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:10px;letter-spacing:.5px;}
.wc-pay-result-amount{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:1px;}
.wc-pay-result-sub{font-size:13px;color:#6b7280;line-height:1.5;}

/* ==== 动画 ==== */
@keyframes wcFadeIn{from{opacity:0}to{opacity:1}}
@keyframes wcPopIn{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes wcShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ==== 转账详情弹窗 ==== */
.wc-xfer-detail-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:wcFadeIn .25s ease;}
.wc-xfer-detail-box{width:82%;max-width:320px;background:#fff;border-radius:16px;overflow:hidden;animation:wcPopIn .28s cubic-bezier(.32,.72,0,1);}
.wc-xfer-detail-head{padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;}
.wc-xfer-detail-title{font-size:16px;font-weight:600;color:#1a1a1a;}
.wc-xfer-detail-close{width:26px;height:26px;border:none;background:none;cursor:pointer;color:#999;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.wc-xfer-detail-close:active{background:#f5f5f5;}
.wc-xfer-detail-body{padding:20px;}
.wc-xfer-detail-amt-wrap{text-align:center;margin-bottom:20px;}
.wc-xfer-detail-amt-label{font-size:12px;color:#999;margin-bottom:6px;}
.wc-xfer-detail-amt{font-size:40px;font-weight:700;color:#1a1a1a;}
.wc-xfer-detail-amt-symbol{font-size:18px;margin-right:3px;}
.wc-xfer-detail-rows{border-top:1px solid #f0f0f0;}
.wc-xfer-detail-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;}
.wc-xfer-detail-row-label{font-size:13px;color:#888;}
.wc-xfer-detail-row-val{font-size:13px;color:#1a1a1a;font-weight:500;max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-xfer-detail-foot{padding:12px 20px 20px;}
.wc-xfer-detail-claim-btn{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#3fa96a,#2d8e57);color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.wc-xfer-detail-claim-btn:active{opacity:.85;}
.wc-xfer-detail-claim-btn:disabled{background:#e0e0e0;color:#999;cursor:not-allowed;opacity:1;}
.wc-xfer-detail-mark-btn{width:100%;padding:12px;border:1.5px solid var(--green-deep);border-radius:8px;background:rgba(124,204,155,.15);color:var(--green-deep);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;}
.wc-xfer-detail-mark-btn:active{background:rgba(124,204,155,.3);transform:scale(.98);}

.wc-status-bar{height:calc(var(--phone-w,420px)*0.095 + var(--safe-top,0px));
   padding:calc(var(--safe-top,0px) + var(--phone-w,420px)*0.015) calc(var(--phone-w,420px)*0.064) 0;
  display:flex;justify-content:space-between;align-items:center;
  font-size:calc(var(--phone-w,420px)*0.04);font-weight:600;color:var(--green-ink);
     position:relative;z-index:5;flex-shrink:0;
   background:transparent;}
.wc-status-bar .wc-status-icons{display:flex;gap:calc(var(--phone-w,420px)*0.016);align-items:center;font-size:calc(var(--phone-w,420px)*0.035);}
.wc-status-bar .wc-status-icons svg{display:block;flex-shrink:0;}
.wc-status-bar .sig-icon,.wc-status-bar .wifi-icon{width:calc(var(--phone-w,420px)*0.045);height:calc(var(--phone-w,420px)*0.045);}
.wc-status-bar .bat-icon{width:calc(var(--phone-w,420px)*0.062);height:calc(var(--phone-w,420px)*0.034);}
.wc-status-bar .bat-text{font-variant-numeric:tabular-nums;}

/* ===== 语音通话（小剧场） ===== */
.wc-call{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(175deg,#f6fdf9 0%,#eaf8ef 40%,#daf0e3 100%);
  opacity:0;transition:opacity .28s ease;color:#1d4a33;
}
.wc-call.show{opacity:1;}
.wc-call-bg{
  position:absolute;inset:-12%;background-position:center;background-size:cover;background-color:#e9f7ef;
  filter:blur(34px) brightness(1.3) saturate(1.05) opacity(.5);transform:scale(1.16);
}
.wc-call-mask{
  position:absolute;inset:0;
  background:radial-gradient(110% 56% at 50% 4%,rgba(148,214,175,.3),transparent 72%),
             linear-gradient(180deg,rgba(250,254,251,.82),rgba(216,239,226,.9));
}
.wc-call-inner{
  position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;
  padding-top:calc(var(--phone-w,380px)*0.09);
}
.wc-call-header{flex-shrink:0;text-align:center;padding:8px 24px 4px;}
.wc-call-name{font-size:20px;font-weight:600;letter-spacing:.6px;color:#14452c;}
.wc-call-party{
  margin-top:6px;display:inline-block;padding:3px 10px;border-radius:10px;
  max-width:78%;line-height:1.5;word-break:break-word;
  font-size:11px;color:rgba(20,69,44,.62);background:rgba(255,255,255,.6);
}
.wc-call-status{
  margin-top:8px;font-size:13px;color:rgba(29,74,51,.6);min-height:18px;
  font-variant-numeric:tabular-nums;letter-spacing:.4px;
}
.wc-call.connected .wc-call-status::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#3fa96a;margin-right:6px;vertical-align:middle;
  animation:wcCallPulse 1.8s ease-in-out infinite;
}
@keyframes wcCallPulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.wc-call-wait{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:middle;}
.wc-call-wait i{width:4px;height:4px;border-radius:50%;background:rgba(63,169,106,.85);display:inline-block;animation:wcCallWaitDot 1.2s infinite;}
.wc-call-wait i:nth-child(2){animation-delay:.2s;}
.wc-call-wait i:nth-child(3){animation-delay:.4s;}
@keyframes wcCallWaitDot{0%,80%,100%{opacity:.2;transform:scale(.75)}40%{opacity:1;transform:scale(1.2)}}

.wc-call-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 18px;}
.wc-call-avatar-wrap{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wc-call-ring{
  position:absolute;width:150px;height:150px;border-radius:50%;
  border:2px solid rgba(96,186,133,.42);animation:wcCallRing 2.8s ease-out infinite;
}
.wc-call-ring.r2{animation-delay:1.4s;}
@keyframes wcCallRing{0%{transform:scale(.7);opacity:.85}75%{opacity:0}100%{transform:scale(1.72);opacity:0}}
.wc-call-avatar{
  width:112px;height:112px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  box-shadow:0 14px 34px rgba(52,124,86,.28),0 0 0 5px rgba(255,255,255,.72),0 0 0 11px rgba(255,255,255,.32);
  z-index:2;animation:wcCallBreath 2.6s ease-in-out infinite;
}
.wc-call-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes wcCallBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

.wc-call-bubbles{
  display:none;flex-direction:column;gap:10px;width:100%;flex:1;min-height:0;overflow-y:auto;
  padding:16px 2px 10px;-webkit-overflow-scrolling:touch;
}
.wc-call-bubbles::-webkit-scrollbar{width:0;}
.wc-call.connected .wc-call-avatar-wrap{display:none;}
.wc-call.connected .wc-call-stage{justify-content:flex-start;align-items:stretch;padding:0 16px;}
.wc-call.connected .wc-call-stage::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:20px;pointer-events:none;
  background:linear-gradient(180deg,rgba(219,241,229,0),rgba(219,241,229,.85));
}
.wc-call.connected .wc-call-bubbles{display:flex;}
.wc-call-bubble-row{display:flex;gap:8px;align-items:flex-end;max-width:86%;animation:wcCallBubbleIn .28s ease both;}
.wc-call-bubble-row.ai{align-self:flex-start;}
.wc-call-bubble-row.user{align-self:flex-end;flex-direction:row-reverse;}
@keyframes wcCallBubbleIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.wc-call-bubble-mini{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  box-shadow:0 2px 8px rgba(52,124,86,.22);
}
.wc-call-bubble-mini img{width:100%;height:100%;object-fit:cover;display:block;}
.wc-call-bubble{padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.58;word-break:break-word;white-space:pre-wrap;}
.wc-call-bubble-row.ai .wc-call-bubble{
  background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);color:#22503a;
  border-bottom-left-radius:6px;box-shadow:0 4px 14px rgba(38,94,66,.09);
}
.wc-call-bubble-row.user .wc-call-bubble{
  background:linear-gradient(135deg,#6fd193,#3fa96a);color:#fff;border-bottom-right-radius:6px;
  box-shadow:0 5px 16px rgba(63,169,106,.32);
}
.wc-call-bubble-wrap{display:flex;flex-direction:column;gap:4px;min-width:0;}
.wc-call-bubble-name{font-size:11px;color:rgba(29,74,51,.5);line-height:1;padding-left:4px;}
.wc-call-bubble.typing{display:flex;align-items:center;background:rgba(255,255,255,.94);}
.wc-call-typing{display:flex;gap:5px;align-items:center;height:20px;}
.wc-call-typing span{width:6px;height:6px;border-radius:50%;background:rgba(63,169,106,.65);animation:wcCallTypingDot 1.2s ease-in-out infinite;}
.wc-call-typing span:nth-child(2){animation-delay:.18s;}
.wc-call-typing span:nth-child(3){animation-delay:.36s;}
@keyframes wcCallTypingDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}

.wc-call-composer{display:none;flex-shrink:0;align-items:center;gap:8px;padding:8px 16px 4px;}
.wc-call.connected .wc-call-composer{display:flex;}
.wc-call-input{
  flex:1;border:1px solid rgba(63,169,106,.18);border-radius:20px;padding:9px 15px;font-size:14px;
  color:#1d4a33;background:rgba(255,255,255,.92);outline:none;font-family:inherit;
  min-height:40px;max-height:76px;resize:none;line-height:1.4;
  box-shadow:0 2px 10px rgba(38,94,66,.07);transition:border-color .15s,box-shadow .15s;
}
.wc-call-input::placeholder{color:rgba(29,74,51,.38);}
.wc-call-input:focus{border-color:rgba(63,169,106,.55);box-shadow:0 3px 14px rgba(63,169,106,.18);}
.wc-call-send{
  width:40px;height:40px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,#6fd193,#3fa96a);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(63,169,106,.32);transition:transform .1s,opacity .15s;
}
.wc-call-send:active{transform:scale(.9);}
.wc-call-send:disabled{opacity:.4;cursor:not-allowed;}
.wc-call-send svg{width:17px;height:17px;fill:currentColor;}

.wc-call-actions{
  flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:44px;
  padding:12px 0 calc(var(--phone-w,380px)*0.06);
}
.wc-call-btn{
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .15s,color .15s,box-shadow .15s;
}
.wc-call-btn:active{transform:scale(.9);}
.wc-call-btn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-call-hangup{background:linear-gradient(135deg,#ff6b6b,#e8453c);color:#fff;box-shadow:0 10px 26px rgba(232,69,60,.38);}
.wc-call-hangup svg{transform:rotate(135deg);}
.wc-call-aux{
  background:rgba(255,255,255,.86);color:#3f8a63;border:1px solid rgba(63,169,106,.16);
  box-shadow:0 6px 18px rgba(38,94,66,.1);
}
.wc-call-aux.on{background:linear-gradient(135deg,#6fd193,#3fa96a);color:#fff;border-color:transparent;}

.wc-call-log-tip{
  display:inline-block;color:#5c8b72;background:rgba(255,255,255,.75);
  font-size:12px;padding:4px 14px;border-radius:12px;
}

/* ===== 聊天里的通话记录 ===== */
.wc-call-log{
  display:inline-flex;align-items:center;gap:7px;
  background:#f2f2f2;color:#6b6b6b;font-size:12px;
  padding:6px 14px;border-radius:6px;cursor:pointer;
  transition:background .15s;
}
.wc-call-log:active{background:#e8e8e8;}
.wc-call-log svg{width:14px;height:14px;fill:none;stroke:#9a9a9a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.wc-call-log .wc-call-log-dur{color:#a5a5a5;font-variant-numeric:tabular-nums;}
.wc-call-miss{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:#8b9aab;background:rgba(226,238,250,.85);
  padding:5px 14px;border-radius:12px;line-height:1;
}
.wc-call-miss svg{width:14px;height:14px;fill:none;stroke:#e2695f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ===== 通话记录详情 ===== */
.wc-callrec-mask{
  position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.34);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  animation:wcFadeIn .22s ease;padding:18px;
}
.wc-callrec-box{
  width:88%;max-width:360px;max-height:78vh;display:flex;flex-direction:column;
  background:#fff;border-radius:16px;overflow:hidden;
  animation:wcPopIn .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 18px 50px rgba(0,0,0,.24);
}
.wc-callrec-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 18px 0;
}
.wc-callrec-title{font-size:16px;font-weight:600;color:#1a1a1a;line-height:1.4;}
.wc-callrec-close{
  width:26px;height:26px;border:none;background:none;color:#b0b0b0;font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;
}
.wc-callrec-close:active{background:#f5f5f5;}
.wc-callrec-meta{
  padding:6px 18px 0;font-size:13px;color:#9a9a9a;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:8px;
}
.wc-callrec-del{
  border:none;background:none;padding:0;cursor:pointer;
  font-size:14px;line-height:1;font-family:inherit;
}
.wc-callrec-del:active{opacity:.7;}
.wc-callrec-body{
  flex:1;min-height:0;overflow-y:auto;padding:14px 18px 20px;margin-top:10px;
  border-top:1px solid #f2f2f2;background:#fff;
}
.wc-callrec-body::-webkit-scrollbar{width:0;}
.wc-callrec-row{display:flex;gap:8px;margin-bottom:16px;}
.wc-callrec-row.user{flex-direction:row-reverse;}
.wc-callrec-avatar{
  width:34px;height:34px;border-radius:6px;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
}
.wc-callrec-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.wc-callrec-main{max-width:76%;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.wc-callrec-row.user .wc-callrec-main{align-items:flex-end;}
.wc-callrec-name{font-size:11px;color:#a8a8a8;line-height:1;}
.wc-callrec-bubble{
  padding:9px 13px;border-radius:6px;background:#f2f2f2;color:#2b2b2b;
  font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap;
}
.wc-callrec-row.user .wc-callrec-bubble{background:#e6eefb;}
.wc-callrec-empty{padding:28px 0;text-align:center;font-size:12px;color:#bbb;}

/* ===== 来电（角色主动打来） ===== */
.wc-incoming{
  position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(175deg,#f7fdfa 0%,#e8f7ee 42%,#d7efe1 100%);
  opacity:0;transition:opacity .28s ease;color:#1d4a33;
}
.wc-incoming.show{opacity:1;}
.wc-incoming-inner{
  position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 24px;
}
.wc-incoming-avatar{
  width:112px;height:112px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  box-shadow:0 14px 34px rgba(52,124,86,.28),0 0 0 5px rgba(255,255,255,.72),0 0 0 11px rgba(255,255,255,.32);
  animation:wcCallBreath 2.6s ease-in-out infinite;
}
.wc-incoming-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.wc-incoming-name{margin-top:22px;font-size:21px;font-weight:600;letter-spacing:.5px;color:#14452c;max-width:80%;line-height:1.35;word-break:break-word;}
.wc-incoming-tip{
  margin-top:10px;font-size:13px;color:rgba(29,74,51,.6);
  display:flex;align-items:center;gap:2px;
}
.wc-incoming-actions{
  position:relative;z-index:2;flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:56px;
  padding:0 0 calc(var(--phone-w,380px)*0.08);
}
.wc-incoming-btn{
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,opacity .15s;
}
.wc-incoming-btn:active{transform:scale(.9);}
.wc-incoming-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-incoming-btn.decline{background:linear-gradient(135deg,#ff6b6b,#e8453c);box-shadow:0 10px 26px rgba(232,69,60,.38);}
.wc-incoming-btn.decline svg{transform:rotate(135deg);}
.wc-incoming-btn.accept{
  background:linear-gradient(135deg,#6fd193,#3fa96a);
  box-shadow:0 10px 26px rgba(63,169,106,.38);
  animation:wcCallAcceptPulse 1.6s ease-in-out infinite;
}
@keyframes wcCallAcceptPulse{
  0%,100%{box-shadow:0 10px 26px rgba(63,169,106,.38)}
  50%{box-shadow:0 10px 36px rgba(63,169,106,.62)}
}

/* ===== 群聊选择通话成员 · 绿色主题 ===== */
.wc-callpick-mask{
  position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;
  background:rgba(14,48,30,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:wcFadeIn .22s ease;padding:18px;
}
.wc-callpick-box{
  width:88%;max-width:340px;max-height:80vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f4fcf7 0%,#ffffff 36%);
  border-radius:18px;overflow:hidden;
  border:1px solid rgba(63,169,106,.18);
  animation:wcPopIn .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 20px 54px -12px rgba(20,74,44,.38),inset 0 0 0 1px rgba(255,255,255,.6);
}
.wc-callpick-head{
  flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:18px 16px 14px;
  background:linear-gradient(135deg,rgba(184,226,198,.5),rgba(255,255,255,.15));
  border-bottom:1px solid rgba(63,169,106,.14);
}
.wc-callpick-title-row{display:flex;flex-direction:column;gap:5px;min-width:0;}
.wc-callpick-title{font-size:17px;font-weight:700;color:var(--green-ink,#1e4a30);letter-spacing:.3px;}
.wc-callpick-sub{font-size:12px;color:#5a8d6e;}
.wc-callpick-count{font-weight:700;color:#3fa96a;font-variant-numeric:tabular-nums;}
.wc-callpick-close{
  width:28px;height:28px;border:1px solid rgba(63,169,106,.22);border-radius:50%;
  background:rgba(255,255,255,.8);color:#7aa58c;font-size:18px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s,color .15s,transform .12s;
}
.wc-callpick-close:active{background:#e8f6ee;color:#3fa96a;transform:scale(.94);}
.wc-callpick-list{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 6px;}
.wc-callpick-list::-webkit-scrollbar{width:0;}
.wc-callpick-row{
  display:flex;align-items:center;gap:12px;padding:9px 10px;margin-bottom:6px;
  cursor:pointer;border-radius:12px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(63,169,106,.1);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .12s;
}
.wc-callpick-row.on{
  background:linear-gradient(135deg,rgba(184,226,198,.45),rgba(238,250,242,.92));
  border-color:rgba(63,169,106,.42);
  box-shadow:0 4px 14px -6px rgba(40,130,70,.34);
}
.wc-callpick-row:active{transform:scale(.985);}
.wc-callpick-avatar{
  width:44px;height:44px;border-radius:12px;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--green-mid,#7ccc9b),var(--green-deep,#3fa96a));
  box-shadow:0 4px 10px -4px rgba(40,130,70,.45);
  transition:box-shadow .15s;
}
.wc-callpick-row.on .wc-callpick-avatar{
  box-shadow:0 0 0 2px rgba(255,255,255,.92),0 0 0 4px rgba(63,169,106,.45);
}
.wc-callpick-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.wc-callpick-name{flex:1;font-size:15px;color:var(--green-ink,#1e4a30);word-break:break-word;}
.wc-callpick-check{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(63,169,106,.3);background:#fff;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;line-height:1;
  transition:background .18s,border-color .18s,transform .18s,box-shadow .18s;
}
.wc-callpick-check.on{
  background:linear-gradient(135deg,#7ccc9b,#3fa96a);
  border-color:transparent;
  transform:scale(1.06);
  box-shadow:0 3px 10px -3px rgba(40,130,70,.55);
}
.wc-callpick-check.on::after{content:'✓';font-size:12px;}
.wc-callpick-foot{
  flex-shrink:0;display:flex;gap:10px;padding:12px 16px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(238,250,242,.9));
  border-top:1px solid rgba(63,169,106,.12);
}
.wc-callpick-cancel,.wc-callpick-ok{
  height:46px;border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;
  transition:transform .12s,opacity .15s,box-shadow .15s;
}
.wc-callpick-cancel{
  flex:0 0 34%;
  background:#fff;color:#5a8d6e;border:1px solid rgba(63,169,106,.28);
}
.wc-callpick-ok{
  flex:1;border:none;font-weight:600;letter-spacing:.5px;
  background:linear-gradient(135deg,#7ccc9b,#3fa96a);color:#fff;
  box-shadow:0 8px 20px -8px rgba(40,130,70,.65);
}
.wc-callpick-cancel:active,.wc-callpick-ok:active{transform:scale(.97);opacity:.9;}
</style>

<body>
<div class="wc-app" id="wcApp">
<div class="wc-status-bar" id="wcStatusBar">
  <span id="wcStatusTime">00:00</span>
  <span class="wc-status-icons" id="wcStatusIcons"></span>
</div>
  <div class="wc-topbar">
    <button class="wc-icon-btn wc-back-btn" id="wcBackBtn" aria-label="返回">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="wc-title" id="wcTopTitle">微信</span>
    <div class="wc-top-actions">
      <button class="wc-icon-btn" id="wcPlusBtn" aria-label="更多">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="wc-body" id="wcBody"></div>
  <div class="wc-tabbar">
    <button class="wc-tab active" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    </button>
    <button class="wc-tab" data-tab="contacts">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    </button>
    <button class="wc-tab" data-tab="moments">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
    </button>
    <button class="wc-tab" data-tab="me">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>
</div>
<script>
(function(){
  const TAB_TITLES = { chat:'微信', contacts:'通讯录', moments:'朋友圈', me:'我' };

  (function renderStatusBar(){
    const bar = document.getElementById('wcStatusBar');
    if(!bar) return;
    const TIME_EL = document.getElementById('wcStatusTime');
    const ICONS_EL = document.getElementById('wcStatusIcons');
    const SIG_SVG = '<svg class="sig-icon" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2.4" height="4" rx="0.6"/><rect x="3.4" y="6" width="2.4" height="6" rx="0.6"/><rect x="6.8" y="4" width="2.4" height="8" rx="0.6"/><rect x="10.2" y="2" width="2.4" height="10" rx="0.6"/><rect x="13.6" y="0" width="2.4" height="12" rx="0.6"/></svg>';
    const WIFI_SVG = '<svg class="wifi-icon" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.5a10 10 0 0114 0"/><path d="M3.2 7a6 6 0 019.6 0"/><path d="M5.6 9.2a2.5 2.5 0 014.8 0"/><circle cx="8" cy="11" r="0.7" fill="currentColor" stroke="none"/></svg>';
    let batteryLevel = null;
    let charging = false;
    const batterySvg = () => {
      const lvl = batteryLevel == null ? 1 : batteryLevel;
      const fillW = Math.max(1, Math.round(lvl * 16));
      const fillColor = charging ? '#f5b800' : (lvl <= 0.2 ? '#e74c3c' : 'var(--green-deep)');
      return `<svg class="bat-icon" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="${fillW}" height="8" rx="1.5" fill="${fillColor}"/><rect x="21.2" y="4" width="1.8" height="4" rx="0.6" fill="currentColor"/></svg>`;
    };
    const batPct = () => batteryLevel == null ? '' : `<span class="bat-text">${Math.round(batteryLevel*100)}%</span>`;
    const update = () => {
      const d = new Date();
      if(TIME_EL) TIME_EL.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      if(ICONS_EL) ICONS_EL.innerHTML = SIG_SVG + WIFI_SVG + batterySvg() + batPct();
    };
    update();
    setInterval(update, 30000);
    if(navigator.getBattery){
      navigator.getBattery().then(bat => {
        const updBat = () => { batteryLevel = bat.level; charging = bat.charging; update(); };
        updBat();
        bat.addEventListener('levelchange', updBat);
        bat.addEventListener('chargingchange', updBat);
      }).catch(()=>{});
    }

    function _fmtListTime(ts){
      if(!ts) return '';
      const d = new Date(ts);
      const d0 = new Date(); d0.setHours(0,0,0,0);
      const dm = new Date(ts); dm.setHours(0,0,0,0);
      const diffDay = Math.floor((d0 - dm) / 86400000);
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      if(diffDay === 0) return `${hh}:${mm}`;
      if(diffDay === 1) return `昨天`;
      if(diffDay < 7){
        const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        return wk;
      }
      return `${d.getMonth()+1}/${d.getDate()}`;
    }
    function _previewFromLastMsg(m, isGroup){
      if(!m) return '';
      if(m.type === 'sticker') return '[表情]';
      if(m.type === 'voice') return '[语音]';
      if(m.type === 'image') return '[图片]';
      if(m.type === 'video') return '[视频]';
      if(m.type === 'file') return '[文件]';
      if(m.type === 'call'){
        const w = m.kind === 'video' ? '视频通话' : '语音通话';
        return m.status === 'connected' ? `[${w}]` : `[未接${w}]`;
      }
      let txt = m.content || '';
      txt = txt.replace(/\[表情[：:][^\]]*\]/g, '[表情]');
      if(isGroup && m.role !== 'user' && m.speakerName){
        const me = Phone.getCurrentChar()?.name || '我';
        const who = m.speakerName === me ? '我' : m.speakerName;
        txt = (who || '') + '：' + txt;
      } else if(m.role === 'user'){
        txt = '我：' + txt;
      }
      return txt;
    }

    function renderChatList(){
      const groups = getGroups();
      const contacts = getContacts();
      const allTags = getTags();
      const wechatData = Phone.getData('wechat') || {};
      const savedPrivateChats = wechatData.chatList || [];
      savedPrivateChats.forEach(c => {
        if(!MOCK_CHATS.some(x => x.id === c.id)){
          MOCK_CHATS.push(c);
        }
      });
      groups.forEach(g => {
        if(!MOCK_CHATS.some(c => c.isGroup && c.groupId === g.id)){
          MOCK_CHATS.unshift({
            id: 'chat_' + g.id, name: g.name,
            last: g.announcement ? '[群公告] ' + g.announcement.split('\n')[0] : '群聊已创建',
            time: '刚刚', unread: 0, isGroup: true, groupId: g.id
          });
        }
      });
      let html = '';
      const allSettings = wechatData.chatSettings || {};

      const validChats = MOCK_CHATS.filter(c => {
        if(c.isGroup){
          const g = groups.find(x => x.id === c.groupId);
          if(!g) return false;
          if(c.unread === undefined) c.unread = 0;
          c.pinned = !!(g.pinned);
        } else {
          const contact = contacts.find(x => x.id === c.contactId);
          if(!contact) return false;
          if(c.unread === undefined) c.unread = 0;
          c.pinned = false;
        }
        return true;
      });
      MOCK_CHATS.length = 0;
      MOCK_CHATS.push(...validChats);

      const enriched = MOCK_CHATS.map(c => {
        const hist = chatHistory[c.id] || [];
        let lastMsg = null, lastIdx = -1;
        for(let i = hist.length - 1; i >= 0; i--){
          const m = hist[i];
          if(m.role && m.role !== 'typing' && (m.content !== undefined || m.type)){ lastMsg = m; lastIdx = i; break; }
        }
        let preview, timeStr, ts;
        if(lastMsg){
          preview = _previewFromLastMsg(lastMsg, c.isGroup);
          ts = lastMsg.ts || 0;
          timeStr = _fmtListTime(ts);
        } else {
          preview = c.last || '';
          ts = 0;
          timeStr = c.time || '';
        }
        if(c.isGroup){
          const g = groups.find(x => x.id === c.groupId);
          if(g?.pinned) ts = ts + 86400000 * 36500;
        }
        return { c, preview, timeStr, ts };
      });

      enriched.sort((a,b) => b.ts - a.ts);

      enriched.forEach((item, i) => {
        const c = item.c;
        let displayName = c.name;
        let subName = '';
        if(c.isGroup){
          const group = groups.find(g => g.id === c.groupId);
          if(group && group.remark){
            displayName = group.remark;
            subName = c.name;
          }
        } else {
          const cs = allSettings[c.id] || {};
          if(cs.remark){
            displayName = cs.remark;
            subName = c.name;
          }
        }
        let avatarHtml;
        if(c.isGroup){
          const group = groups.find(g => g.id === c.groupId);
          if(group && group.avatar){
            avatarHtml = avatarHTML(group.name, '', group.avatar);
          } else {
            const memIds = group ? group.members : [];
            const mems = memIds.map(id => contacts.find(x=>x.id===id)).filter(Boolean).slice(0,4);
            avatarHtml = `<div class="wc-group-list-avatars">${mems.map(m => avatarHTML(m.name,'mini', m.avatar || '')).join('')}</div>`;
          }
        } else {
          const contact = contacts.find(x => x.id === c.contactId);
          avatarHtml = avatarHTML(c.name, '', contact?.avatar || '');
        }
        html += `<div class="wc-chat-item" data-id="${c.id}">
          ${avatarHtml}
          <div class="wc-chat-info">
            <div class="wc-chat-top"><span class="wc-chat-name">${escAttr(displayName)}</span><span class="wc-chat-time">${escAttr(item.timeStr)}</span></div>
            ${subName ? `<div class="wc-chat-subname">${escAttr(subName)}</div>` : ''}
            <div class="wc-chat-preview">${escAttr(item.preview)}</div>
          </div>
          ${c.unread ? `<span class="wc-badge">${c.unread}</span>` : ''}
        </div>`;
        if(i < enriched.length - 1) html += '<div class="wc-divider"></div>';
      });
      body.innerHTML = html;
      body.querySelectorAll('.wc-chat-item').forEach(el => {
        el.addEventListener('click', () => openChat(el.dataset.id));
      });
    }

    function openWallet(){
      function getWallet(){
        const d = Phone.getData('wechat');

        }

      function saveWallet(w){

      }

      const panel = document.createElement('div');
      panel.className = 'wc-chat-detail';

        <div class="wc-cd-topbar">
          <button class="wc-cd-back">‹</button>

      async function extractFromChats(){
        const btn = body.querySelector('#wcWalletExtract');
        if(btn) { btn.disabled = true; btn.textContent = '分析中...'; }
        try{
          const allD = Phone.getData('wechat');
          const chatHist = allD.chatHistory || {};
          let allTexts = '';
          Object.entries(chatHist).forEach(([cid, msgs]) => {
            if(!Array.isArray(msgs)) return;
            const chatInfo = MOCK_CHATS.find(c => c.id === cid);
            const chatName = chatInfo ? chatInfo.name : cid;
            allTexts += `\n--- 和 ${chatName} 的对话 ---\n`;
            msgs.forEach(m => {
              if(m.content && !m.content.startsWith('[系统]') && !m.content.startsWith('[图片]')){
                const who = m.role === 'user' ? '我' : (m.speakerName || chatName);
                allTexts += `${who}：${m.content}\n`;
              }
            });
          });
          if(!allTexts.trim()){
            Phone.toast('没有对话记录可以分析');
            return;
          }

          const sys = `你是一个资金记录提取助手。分析下面的微信对话，从中提取所有明确提到的支出/消费行为。

规则：
1. 只提取对话中**明确提到金额或具体消费行为**的支出
2. 对于没有明确金额的，金额填 0
3. 对于有明确金额的（如"花了50块""付了120""咖啡35元""AA每人88"），提取数字
4. 返回严格的 JSON 数组，每个元素：{amount: 数字, note: "简短备注（如：给扬扬买咖啡）", source:"对话原文片段摘要"}
5. 如果没有任何支出，返回 []

只输出纯 JSON，不要有任何其他内容。`;
          const messages = [
            { role:'system', content:sys },
            { role:'user', content: allTexts.slice(-8000) }
          ];
          const reply = await Phone.chatWithAI(messages);
          let jsonStr = reply.trim();
          const start = jsonStr.indexOf('[');
          const end = jsonStr.lastIndexOf(']');
          if(start < 0 || end < 0) { Phone.toast('未提取到支出记录'); return; }
          jsonStr = jsonStr.slice(start, end+1);
          const items = JSON.parse(jsonStr);
          if(!Array.isArray(items) || !items.length){
            Phone.toast('对话中未发现支出记录');
            return;
          }

          const w = getWallet();
          let added = 0;
          items.forEach(it => {
            if(!it || typeof it.amount !== 'number') return;
            w.records.push({
              type: 'out',

              source: 'chat',
              sourceDetail: String(it.source || '').slice(0, 100),
              ts: Date.now()
            });
            added++;
          });
          saveWallet(w);
          Phone.toast(`从对话提取到 ${added} 条支出记录`);
          render();
        } catch(err){
          console.error(err);
          Phone.toast('提取失败，请重试');

    function openFavoritesPage(){
      function getFavData(){
        const d = Phone.getData('wechat');
        d.favorites = d.favorites || [];
        d.favGroups = d.favGroups || [{ id:'default', name:'全部收藏' }];
        return d;
      }
      function saveFavData(d){
        Phone.setData('wechat', d);
      }

      const panel = document.createElement('div');
      panel.className = 'wc-chat-detail';
      panel.innerHTML = `
        <div class="wc-cd-topbar">
          <button class="wc-cd-back">‹</button>
          <span class="wc-cd-title">收藏</span>
          <span class="wc-cd-more-text" id="wcFavAddGroup" style="right:12px;position:absolute;top:50%;transform:translateY(-50%);font-size:20px;color:var(--green-deep);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%">+</span>
        </div>
        <div class="wc-fav-groups" id="wcFavGroups"></div>
        <div class="wc-fav-list" id="wcFavList"></div>`;
      app.appendChild(panel);
      requestAnimationFrame(() => panel.classList.add('show'));

      const groupsEl = panel.querySelector('#wcFavGroups');
      const listEl = panel.querySelector('#wcFavList');
      let activeGroupId = 'default';

      function renderGroups(){
        const d = getFavData();
        let html = '';
        d.favGroups.forEach(g => {
          const count = g.id === 'default' ? d.favorites.length : d.favorites.filter(f => f.groupId === g.id).length;
          html += `<div class="wc-fav-group-tab${g.id===activeGroupId?' active':''}" data-gid="${g.id}">
            <span>${escAttr(g.name)}</span>
            <span class="wc-fav-group-count">${count}</span>
            ${g.id !== 'default' ? `<span class="wc-fav-group-del" data-del-gid="${g.id}">×</span>` : ''}
          </div>`;
        });
        groupsEl.innerHTML = html;
        groupsEl.querySelectorAll('.wc-fav-group-tab').forEach(el => {
          el.addEventListener('click', (e) => {
            if(e.target.classList.contains('wc-fav-group-del')) return;
            activeGroupId = el.dataset.gid;
            renderGroups();
            renderList();
          });
        });
        groupsEl.querySelectorAll('.wc-fav-group-del').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const gid = btn.dataset.delGid;
            const d = getFavData();
            const grp = d.favGroups.find(g => g.id === gid);
            if(!grp) return;
            const r = await Phone.modal({ title:`删除分组「${grp.name}」？`, fields:[], confirmText:'删除' });
            if(!r) return;
            d.favGroups = d.favGroups.filter(g => g.id !== gid);
            d.favorites.forEach(f => { if(f.groupId === gid) f.groupId = 'default'; });
            saveFavData(d);
            if(activeGroupId === gid) activeGroupId = 'default';
            renderGroups();
            renderList();
          });
        });
      }

      function renderList(){
        const d = getFavData();
        let favs = d.favorites;
        if(activeGroupId !== 'default'){
          favs = favs.filter(f => f.groupId === activeGroupId);
        }
        if(!favs.length){
          listEl.innerHTML = `<div class="wc-fav-empty">暂无收藏<br><span style="color:#bbb;font-size:12px">长按消息选择「收藏」即可保存</span></div>`;
          return;
        }
        let html = '';
        favs.forEach((f, idx) => {
          const time = new Date(f.ts);
          const timeStr = `${time.getMonth()+1}月${time.getDate()}日 ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
          const chatInfo = MOCK_CHATS.find(c => c.id === f.chatId);
          const chatName = chatInfo ? chatInfo.name : '未知对话';
          const speaker = f.speakerName || (f.role === 'user' ? '我' : chatName);
          const groupOpts = d.favGroups.map(g => `<option value="${g.id}"${f.groupId===g.id?' selected':''}>${escAttr(g.name)}</option>`).join('');
          html += `<div class="wc-fav-item" data-fid="${f.id||idx}">
            <div class="wc-fav-item-actions">
              <select class="wc-fav-group-select" data-fid="${f.id||idx}">${groupOpts}</select>
              <button class="wc-fav-del" data-fid="${f.id||idx}" title="删除">🗑</button>
            </div>
            <div class="wc-fav-item-head">
              <span class="wc-fav-speaker">${escAttr(speaker)}</span>
              <span class="wc-fav-meta">${escAttr(chatName)} · ${timeStr}</span>
            </div>
            <div class="wc-fav-content">${escAttr(f.content||'')}</div>
          </div>`;
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('.wc-fav-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const fid = btn.dataset.fid;
            const d = getFavData();
            const r = await Phone.modal({ title:'删除这条收藏？', fields:[] });
            if(!r) return;
            d.favorites = d.favorites.filter(f => String(f.id||d.favorites.indexOf(f)) !== String(fid));
            saveFavData(d);
            renderGroups();
            renderList();
            Phone.toast('已删除');
          });
        });

        listEl.querySelectorAll('.wc-fav-group-select').forEach(sel => {
          sel.addEventListener('change', () => {
            const fid = sel.dataset.fid;
            const d = getFavData();
            const f = d.favorites.find(x => String(x.id||d.favorites.indexOf(x)) === String(fid));
            if(f){
              f.groupId = sel.value;
              saveFavData(d);
              renderGroups();
              renderList();
              Phone.toast('已移动到「' + (d.favGroups.find(g=>g.id===sel.value)?.name||'') + '」');
            }
          });
        });
      }

      async function addGroup(){
        const r = await Phone.modal({
          title:'新建分组',
          fields:[{ key:'name', label:'分组名称', value:'', placeholder:'例如：重要、情话、截图' }],
          onOk: v => {
            const name = (v.name||'').trim();
            if(!name){ Phone.toast('请输入分组名称'); return null; }
            return v;

        if(!r) return;
        const d = getFavData();
        const gid = 'g_' + Date.now();
        d.favGroups.push({ id:gid, name:r.name.trim() });
        saveFavData(d);
        renderGroups();
        Phone.toast('分组已创建');
      }

      panel.querySelector('.wc-cd-back').addEventListener('click', () => {
        panel.classList.remove('show');
        setTimeout(() => panel.remove(), 300);
      });
      panel.querySelector('#wcFavAddGroup').addEventListener('click', addGroup);

      renderGroups();
      renderList();
    }

    async function editProfileField(field, detail){
      const char = Phone.getCurrentChar();
      const profile = getWcProfile();

      if(field === 'avatar'){
        await changeAvatar();
        refreshProfileRow(detail, 'avatar');
        return;
      }

      const fieldMap = {
        name: { title:'修改名字', key:'name', label:'名字', value: char.name||'', type:'text' },
        gender: { title:'修改性别', key:'gender', label:'性别', value: profile.gender||'', type:'select', opts:'<option value="">请选择</option><option value="男">男</option><option value="女">女</option>' },

        wechatId: { title:'修改微信号', key:'wechatId', label:'微信号', value: (char.social?.wechatId)||'', type:'text' },
        patMsg: { title:'修改拍一拍', key:'patMsg', label:'拍一拍内容', value: profile.patMsg||'', type:'text' },
        signature: { title:'修改签名', key:'signature', label:'个性签名', value: profile.signature||'', type:'textarea' }
      };

      const cfg = fieldMap[field];
      if(!cfg) return;

      const r = await Phone.modal({
        title: cfg.title,
        fields:[{ key: cfg.key, label: cfg.label, value: cfg.value, type: cfg.type, opts: cfg.opts }],
        onOk: v => {
          const val = (v[cfg.key]||'').trim();
          if(field === 'name'){
            Phone.updateChar({ name: val });
          } else if(field === 'wechatId'){
            char.social = char.social || { wechatId:'', weiboId:'', bubbleId:'', taobaoId:'' };
            char.social.wechatId = val;
            Phone.updateChar({ social: char.social });
          } else {
            profile[field] = val;
            Phone.updateChar({ wcProfile: profile });
          }
          return v;
        }
      });
      if(r) refreshProfileRow(detail, field);
    }

    function refreshProfileRow(detail, field){
      const char = Phone.getCurrentChar();

      const row = detail.querySelector(`.wc-profile-row[data-field="${field}"]`);
      if(!row) return;
      const textEl = row.querySelector('.wc-profile-text');
      let val = '';
      if(field === 'name') val = char.name || '未设置';
      else if(field === 'wechatId') val = (char.social?.wechatId) || '未设置';
      else val = profile[field] || '未设置';
      if(textEl) textEl.textContent = val;
      if(field === 'avatar'){
        const valEl = row.querySelector('.wc-profile-val');
        if(valEl){
          valEl.innerHTML = `${avatarHTML(char.name||'','wc-profile-avatar',char.avatar||'')}<span class="wc-profile-arrow">›</span>`;
        }
      }
    }

        if(avatarUrl && typeof avatarUrl === 'string') return avatarUrl;
        return null;

      function buildAvatarHtml(npc, sizeClass){
        const url = getNodeAvatar(npc);
        if(url){
          return `<img src="${escAttr(url)}" alt="">`;

        return `<span class="letter">${escAttr(letter)}</span>`;

        const rect = npcList.getBoundingClientRect();
        const W = rect.width || 340;
        const H = rect.height || 260;
        const cx = W / 2;
        const cy = H / 2;

        if(npcs.length === 0){
          const empty = document.createElement('div');
          empty.className = 'wc-ce-npc-empty';
          empty.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="11" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M15 14c2 0 5 1.5 5 4"/></svg><div>暂无关系，点击下方按钮添加</div>`;
          const center = document.createElement('div');
          center.className = 'wc-ce-mm-center';
          center.style.left = cx + 'px';
          center.style.top = cy + 'px';
          center.innerHTML = buildAvatarHtml(contact);
          npcList.appendChild(empty);
          npcList.appendChild(center);
          return;
        }

        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('class','wc-ce-mm-svg');
        svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
        svg.setAttribute('width', W);
        svg.setAttribute('height', H);

        const maxRadius = Math.min(cx, cy) - 40;
        const minRadius = 50;
        const radius = Math.max(minRadius, Math.min(maxRadius, (npcs.length <= 4 ? 65 : npcs.length <= 6 ? 80 : 90)));

        const positions = [];
        npcs.forEach((npc, idx) => {
          const angle = (2 * Math.PI * idx / npcs.length) - (Math.PI / 2);
          positions.push({
            x: cx + radius * Math.cos(angle),
            y: cy + radius * Math.sin(angle),
            npc, idx
          });
        });

        positions.forEach(({x, y}) => {
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('class','wc-ce-mm-line');
          line.setAttribute('x1', cx);
          line.setAttribute('y1', cy);
          line.setAttribute('x2', x);
          line.setAttribute('y2', y);
          svg.appendChild(line);
        });
        npcList.appendChild(svg);

        const center = document.createElement('div');
        center.className = 'wc-ce-mm-center';
        center.style.left = cx + 'px';
        center.style.top = cy + 'px';
        center.innerHTML = buildAvatarHtml(contact);
        const centerLabel = document.createElement('span');
        centerLabel.className = 'wc-ce-mm-center-label';
        centerLabel.textContent = (contact.name || '').slice(0, 6) || '中心';
        center.appendChild(centerLabel);
        npcList.appendChild(center);

        positions.forEach(({x, y, npc, idx}) => {
          const node = document.createElement('div');
          node.className = 'wc-ce-mm-node';
          node.style.left = x + 'px';
          node.style.top = y + 'px';
          node.innerHTML = buildAvatarHtml(npc);
          const rel = (npc.relationship || '').slice(0, 8);
          if(rel){
            const label = document.createElement('span');
            label.className = 'wc-ce-mm-node-rel';
            label.textContent = rel;
            node.appendChild(label);
          }
          if(npc.dedicated){
            const dot = document.createElement('span');
            dot.className = 'wc-ce-mm-node-dot';
            node.appendChild(dot);
          }
          node.addEventListener('click', (e) => {
            e.stopPropagation();
            showNpcDetail(idx);
          });
          npcList.appendChild(node);
        });
      }

      function showNpcDetail(idx){
        const npc = contact.npcs[idx];
        if(!npc) return;
        const npcList = document.getElementById('ceNpcList');
        if(!npcList) return;
        if(npcList.querySelector('.wc-ce-mask')) return;

        const mask = document.createElement('div');
        mask.className = 'wc-ce-mask';
        mask.innerHTML = `
          <div class="wc-ce-detail">
            <div class="wc-ce-detail-header">
              <div class="wc-ce-detail-avatar">${buildAvatarHtml(npc)}</div>
              <div>
                <div class="wc-ce-detail-name">${escAttr(npc.name || '未命名')}</div>
                ${npc.remark ? `<div class="wc-ce-detail-remark">备注：${escAttr(npc.remark)}</div>` : ''}
              </div>
            </div>
            <div class="wc-ce-detail-row">
              <div class="wc-ce-detail-label">身份</div>
              <div class="wc-ce-detail-value">${escAttr(npc.identity || '-')}</div>
            </div>
            <div class="wc-ce-detail-row">
              <div class="wc-ce-detail-label">关系</div>
              <div class="wc-ce-detail-value">${escAttr(npc.relationship || '-')}</div>
            </div>
            <div class="wc-ce-detail-actions">
              <button class="wc-ce-detail-btn secondary" data-act="close">关闭</button>
              <button class="wc-ce-detail-btn primary" data-act="edit">编辑</button>
            </div>
          </div>
        `;
        function close(){ mask.style.animation='fadeIn .12s ease reverse'; setTimeout(() => mask.remove(), 120); }
        mask.addEventListener('click', (e) => {

          if(act === 'close') close();
          if(act === 'edit') { close(); setTimeout(() => editNpcRelation(idx), 150); }
        });

      function editNpcRelation(idx){
        const npc = contact.npcs[idx];
        if(!npc) return;
        Phone.modal({
          title: '编辑关系',
          fields: [
            {key:'name',label:'姓名',value:npc.name||''},
            {key:'remark',label:'备注',value:npc.remark||'',placeholder:'角色对TA的称呼（括号显示）'},
            {key:'identity',label:'身份',value:npc.identity||'',placeholder:'如：队友、同事'},
            {key:'relationship',label:'关系',value:npc.relationship||'',placeholder:'如：队友、朋友、亲戚'},
            {key:'deleteMe',label:'删除此关系',type:'checkbox',checked:false}
          ]
        }).then(v => {
          if(!v) return;
          if(v.deleteMe){
            if(confirm(`确定移除「${npc.name}」的关系？`)){
              contact.npcs.splice(idx, 1);
              saveContacts(MOCK_CONTACTS);
              renderNpcList();
            }
            return;
          }
          if(v.name.trim()) npc.name = v.name.trim();
          npc.remark = (v.remark||'').trim();
          npc.identity = (v.identity||'').trim();
          npc.relationship = (v.relationship||'').trim();
          saveContacts(MOCK_CONTACTS);
          renderNpcList();
        });
      }

      function bindFieldEvents(){

                if(v.file) contact.avatar = await Phone.fileToBase64(v.file);

                else return false;
                return v;

                if(npcContact){

                    title:'填写关系信息',
                    fields:[
                      {key:'name',label:'姓名',value:npcContact.name},
                      {key:'remark',label:'备注',placeholder:'角色对TA的称呼（括号显示）',value:''},
                      {key:'identity',label:'身份',placeholder:'如：队友、同事',value:''},

          addCustomBtn.addEventListener('click', () => {
            const emojis = ['🐱','🐶','🐰','🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🐧','🦉','🦄','🐙','🦋','🌻','🌸','🍀','⭐','🌙','☀️','🎵','🎨','📷','✈️','🏠','☕','🧸','🌈'];
            const randomEmoji = emojis[Math.floor(Math.random()*emojis.length)];
            Phone.modal({
              title:'添加专属NPC',
              fields:[
                {key:'name',label:'姓名',placeholder:'请输入姓名',value:''},
                {key:'remark',label:'备注',placeholder:'角色对TA的称呼（括号显示）',value:''},
                {key:'identity',label:'身份',placeholder:'如：队友、同事',value:''},
                {key:'relationship',label:'关系',placeholder:'如：队友、朋友、亲戚',value:''}
              ]
            }).then(v => {
              if(v && v.name.trim()){
                contact.npcs = contact.npcs || [];
                contact.npcs.push({
                  id: 'npc_' + Date.now(),
                  name: v.name.trim(),
                  remark: (v.remark||'').trim(),
                  identity: (v.identity||'').trim(),
                  relationship: (v.relationship||'').trim(),
                  avatar: randomEmoji,
                  dedicated: true
                });
                saveContacts(MOCK_CONTACTS);
                renderNpcList();

                alert('请填写姓名');

        // 把删除按钮追加到滚动区域末尾
        const existingDel = body.querySelector('.wc-ce-delete-btn');

        delBtn.className = 'wc-ce-delete-btn';
        delBtn.id = 'wcCeDeleteBtn';
        delBtn.textContent = '删除联系人';
        body.appendChild(delBtn);
        // 删除按钮
       const deleteBtn = body.querySelector('#wcCeDeleteBtn');
        if(deleteBtn){
          deleteBtn.addEventListener('click', () => {
            if(confirm(`确定删除联系人「${contact.name || '未命名'}」？此操作不可恢复。`)){
              const idx = MOCK_CONTACTS.findIndex(c => c.id === contact.id);
              if(idx > -1) MOCK_CONTACTS.splice(idx, 1);
              saveContacts(MOCK_CONTACTS);
              editPage.classList.remove('show');
              setTimeout(() => {
                editPage.remove();
                renderTab(currentTab);
              }, 300);

          });

      }

      function getBoundWorldbookNames(contact){
        const state = Phone._getState();
        const wbs = state.worldbooks || [];
        const ids = contact.worldbookIds || [];
        if(!ids.length) return '无';
        const names = wbs.filter(w => ids.includes(w.id)).map(w => w.name);
        return names.length ? names.join('、') : '无';
      }

      function openWorldbookPicker(contact, onDone){
        const state = Phone._getState();
        const wbs = state.worldbooks || [];
        const selected = new Set(contact.worldbookIds || []);
        const root = document.getElementById('modalRoot');
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        let body;
        if(!wbs.length){
          body = '<div style="font-size:13px;color:var(--green-ink-soft);padding:16px 0;text-align:center">暂无世界书，请先在世界书 App 中添加</div>';
        } else {
          body = wbs.map(wb => {
            const checked = selected.has(wb.id) ? 'checked' : '';
            return `<label style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;cursor:pointer">
              <input type="checkbox" data-wb-id="${wb.id}" ${checked} style="width:16px;height:16px;margin-top:2px">
              <div style="flex:1">
                <div style="font-size:13px;color:var(--green-ink)">${escAttr(wb.name)}${wb.global?' <span style="font-size:11px;color:var(--green-deep)">[全局]</span>':''}</div>
                <div style="font-size:11px;color:var(--green-ink-soft);margin-top:2px;white-space:pre-wrap;max-height:60px;overflow:hidden">${escAttr(wb.content||'')}</div>
              </div>
            </label>`;
          }).join('');
        }
        mask.innerHTML = `<div class="modal-box" style="animation:popIn .25s ease;max-height:80vh;overflow-y:auto">
          <h4>绑定世界书（可多选）</h4>
          <div>${body}</div>
          <div class="modal-actions"><button class="btn-cancel" data-act="cancel">取消</button>${wbs.length?'<button class="btn-ok" data-act="ok">确定</button>':''}</div>
        </div>`;
        root.appendChild(mask);
        const box = mask.querySelector('.modal-box');
        function dismiss(){ mask.style.animation='fadeIn .2s ease reverse'; box.style.animation='popIn .2s ease reverse'; setTimeout(()=>mask.remove(),180); }
        mask.addEventListener('click', e => {
          if(e.target === mask) dismiss();
          const act = e.target.dataset.act;
          if(act === 'cancel') dismiss();
          if(act === 'ok'){
            const ids = Array.from(mask.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.dataset.wbId);
            contact.worldbookIds = ids;
            const allD = Phone.getData('wechat');
            allD.chatSettings = allD.chatSettings || {};
            Object.keys(allD.chatSettings).forEach(cid => {
              const chat = MOCK_CHATS.find(c => c.id === cid);
              if(chat && !chat.isGroup && chat.contactId === contact.id){
                allD.chatSettings[cid].worldbookGroupIds = ids.slice();
              }
            });
            Phone.setData('wechat', allD);
            saveContacts(MOCK_CONTACTS);
            dismiss();
            if(onDone) onDone();
          }
        });
      }

      // 返回按钮
      editPage.querySelector('.wc-ce-back').addEventListener('click', () => {
        editPage.classList.remove('show');
        setTimeout(() => editPage.remove(), 300);
      });

      render();
    }

      if(!data.packs || !Array.isArray(data.packs)){
        data.packs = [];

    function uid(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function openMultiPicker(title, items, selectedIds, onDone, emptyTip, opts){
      opts = opts || {};
      const single = !!opts.single;
      const root = document.getElementById('modalRoot');
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      const selected = new Set(selectedIds);
      let body;
      if(!items.length){
        body = `<div style="font-size:13px;color:var(--green-ink-soft);padding:20px 0;text-align:center">${emptyTip||'暂无选项'}</div>`;
      } else {
        body = items.map(it => {
          const checked = selected.has(it.id);
          const inputType = single ? 'radio' : 'checkbox';
          const nameAttr = single ? `name="${title.replace(/"/g,'')}"` : '';
          return `<label style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer">
            <input type="${inputType}" ${nameAttr} data-id="${it.id}" ${checked?'checked':''} style="width:16px;height:16px">
            <span style="font-size:13px;color:var(--green-ink)">${escAttr(it.name)}</span>
          </label>`;
        }).join('');
      }
      const canPick = items.length;
      mask.innerHTML = `<div class="modal-box" style="animation:popIn .25s ease;max-height:80vh;overflow-y:auto">
        <h4>${title}</h4>
        <div>${body}</div>
        <div class="modal-actions"><button class="btn-cancel" data-act="cancel">取消</button>${canPick?'<button class="btn-ok" data-act="ok">确定</button>':''}</div>
      </div>`;
      root.appendChild(mask);
      const box = mask.querySelector('.modal-box');
      function dismiss(){ mask.style.animation='fadeIn .2s ease reverse'; box.style.animation='popIn .2s ease reverse'; setTimeout(()=>mask.remove(),180); }
      mask.addEventListener('click', e => {
        if(e.target===mask) dismiss();
        if(e.target.dataset.act==='cancel') dismiss();
        if(e.target.dataset.act==='ok' && canPick){
          const ids = Array.from(mask.querySelectorAll(single?'input[type="radio"]:checked':'input[type="checkbox"]:checked')).map(cb=>cb.dataset.id);
          onDone(ids);
          dismiss();
        }
      });
    }

    function makeSubPage(title){
      const page = document.createElement('div');
      page.className = 'wc-sub-page';
      page.innerHTML = `<div class="wc-cd-topbar"><button class="wc-cd-back">‹</button><span class="wc-cd-title">${escAttr(title)}</span><div class="wc-sub-right"></div></div><div class="wc-sub-body"></div>`;
      app.appendChild(page);
      requestAnimationFrame(() => page.classList.add('show'));
      const body = page.querySelector('.wc-sub-body');
      const right = page.querySelector('.wc-sub-right');
      page.querySelector('.wc-cd-back').addEventListener('click', () => { page.classList.remove('show'); setTimeout(() => page.remove(), 300); });
      return { page, body, right };
    }

        body.appendChild(exitBtn);

        // AI 设置事件绑定
        body.querySelectorAll('.wc-set-toggle').forEach(sw => {
          sw.addEventListener('click', e => {
            e.stopPropagation();
            const key = sw.dataset.sw;
            gs[key] = !gs[key];
            saveSettings(d);
            sw.classList.toggle('on', gs[key]);
            render();

        function handleGroupSettingAction(act){
          switch(act){
            case 'stickerGroups':
              openMultiPicker('选择表情包分组', getStickerPacks().map(p=>({id:p.id,name:p.name})), gs.stickerGroupIds, (ids) => {

            case 'worldbookGroups':
              openMultiPicker('选择世界书分组', (Phone._getState().worldbooks||[]).map(w=>({id:w.id,name:w.name})), gs.worldbookGroupIds, (ids) => {
                gs.worldbookGroupIds = ids; saveSettings(d); render();
              });
              break;
            case 'autoReplyMembers': {
              const memberOpts = mems.map(m => ({ id: m.name, name: m.name }));
              openMultiPicker('选择允许自动回复的成员', memberOpts, gs.autoReplyMembers, (ids) => {
                gs.autoReplyMembers = ids; saveSettings(d); render();
              }, '', { noneAllHint:'不选则全部成员都可回复' });
              break;
            }
            case 'memory':
              openGroupMemoryPage(g.id);
              break;
            case 'restart':
              if(confirm('确定重启会话？将清空当前聊天记录和所有记忆。')){
                               try{
                  const chat = MOCK_CHATS.find(c => c.isGroup && c.groupId === g.id);
                  const chatId = chat ? chat.id : ('chat_' + g.id);
                  const arr = chatHistory[chatId];
                  if(arr){ arr.length = 0; } else { chatHistory[chatId] = []; }
                  const d2 = Phone.getData('wechat');
                  if(d2.memories && d2.memories[chatId]){
                    d2.memories[chatId] = { core:[], storylines:[] };
                  }
                  if(d2.heartVoices && d2.heartVoices[chatId]){
                    d2.heartVoices[chatId] = [];
                  }
                  Phone.setData('wechat', d2);
                  saveHistoryToStorage();
                  document.dispatchEvent(new CustomEvent('wechat-data-updated', { detail:{ type:'chat' } }));
                  alert('会话已重启');
                  page.classList.remove('show'); setTimeout(() => page.remove(), 300);

                  alert('重启失败：' + err.message);
                }

              break;

        head.querySelectorAll('.wc-group-mem-rm').forEach(btn => {
          btn.addEventListener('click', e => {

            saveGroups(groups); render();
          });
        });
        head.querySelector('.wc-group-add').addEventListener('click', () => {
                  head.querySelector('.wc-group-remove').addEventListener('click', () => {
          head.classList.toggle('wc-group-minus-mode');
        });
