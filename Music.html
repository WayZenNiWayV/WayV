<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.mu-app{
  --mu-deep:#3fa96a;
  --mu-deep-2:#2f8f57;
  --mu-mid:#7ccc9b;
  --mu-soft:#b8e2c6;
  --mu-ink:#1e4a30;
  --mu-ink-soft:#5a8d6e;
  --mu-line:rgba(206,232,212,.9);
  display:flex;flex-direction:column;flex:1;height:0;min-height:0;
  background:linear-gradient(180deg,#f4fbf6 0%,#eefaf2 46%,#e3f6ea 100%);
  position:relative;overflow:hidden;color:var(--mu-ink);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
.mu-app::before{content:"";position:absolute;top:-16%;right:-22%;width:70%;height:42%;background:radial-gradient(circle,rgba(124,204,155,.30),transparent 70%);pointer-events:none;}
.mu-app::after{content:"";position:absolute;bottom:-14%;left:-18%;width:66%;height:40%;background:radial-gradient(circle,rgba(184,226,198,.38),transparent 70%);pointer-events:none;}

.mu-topbar{flex-shrink:0;min-height:56px;padding:0 14px;display:flex;align-items:center;gap:8px;position:relative;z-index:5;}
.mu-back{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:var(--mu-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px -4px rgba(40,130,70,.42);transition:transform .1s;}
.mu-back:active{transform:scale(.9);}
.mu-back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.mu-title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;color:var(--mu-ink);pointer-events:none;}
.mu-avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.96);
  background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;box-shadow:0 8px 20px -9px rgba(40,130,70,.68);overflow:hidden;
  position:relative;flex-shrink:0;transition:transform .12s;}
.mu-avatar:active{transform:scale(.9);}
.mu-avatar img{width:100%;height:100%;object-fit:cover;display:none;}
.mu-avatar.has-img img{display:block;}
.mu-avatar.has-img svg{display:none;}
.mu-avatar svg{width:24px;height:24px;fill:currentColor;}
.mu-avatar.online::after{content:"";position:absolute;right:2px;bottom:2px;width:8px;height:8px;border-radius:50%;
  background:#2ee06f;border:1.5px solid #fff;box-shadow:0 0 6px rgba(46,224,111,.7);}
.mu-pl-name{display:flex;align-items:center;gap:5px;max-width:44%;min-width:0;border:none;background:none;padding:0;
  font-family:inherit;font-size:13px;font-weight:700;color:var(--mu-ink);cursor:pointer;}
.mu-pl-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-pl-caret{font-size:10px;color:var(--mu-ink-soft);font-weight:400;flex-shrink:0;}
.mu-mode-btn{width:26px;height:26px;padding:0;border-radius:50%;border:none;background:rgba(255,255,255,.92);
  color:var(--mu-deep);display:flex;align-items:center;justify-content:center;font-family:inherit;
  cursor:pointer;flex-shrink:0;box-shadow:0 3px 9px -5px rgba(40,130,70,.45);transition:transform .1s,background .15s;}
.mu-mode-btn:active{transform:scale(.9);}
.mu-mode-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.mu-pl-row{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;margin-bottom:6px;
  background:#f4faf6;border:1px solid rgba(63,169,106,.16);cursor:pointer;transition:transform .1s,background .15s;}
.mu-pl-row.active{background:#fff;border-color:rgba(63,169,106,.5);box-shadow:0 4px 14px -10px rgba(40,130,70,.6);}
.mu-pl-row:active{transform:scale(.99);}
.mu-pl-row-main{flex:1;min-width:0;}
.mu-pl-row-name{font-size:13px;font-weight:700;color:var(--mu-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-pl-row-sub{font-size:10.5px;color:var(--mu-ink-soft);margin-top:1px;}
.mu-pl-row-del{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--mu-ink-soft);
  font-size:15px;line-height:1;font-family:inherit;cursor:pointer;flex-shrink:0;transition:background .15s,color .15s;}
.mu-pl-row-del:active{background:rgba(231,76,60,.14);color:#e74c3c;}
.mu-pl-create{display:flex;gap:8px;margin-top:2px;}
.mu-pl-create input{flex:1;min-width:0;border:1px solid var(--mu-line);background:#f6fdf8;border-radius:10px;
  padding:9px 11px;font-size:13px;color:var(--mu-ink);font-family:inherit;outline:none;}
.mu-pl-create input:focus{border-color:var(--mu-deep);background:#fff;}
.mu-pl-create button{padding:0 15px;border-radius:10px;border:none;font-family:inherit;font-size:13px;font-weight:700;
  background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;cursor:pointer;transition:transform .1s;}
.mu-pl-create button:active{transform:scale(.96);}

.mu-body{flex:1;overflow-y:auto;position:relative;z-index:2;-webkit-overflow-scrolling:touch;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
.mu-body::-webkit-scrollbar{width:0;}

.mu-stage{display:flex;align-items:center;justify-content:center;padding:10px 0 4px;}
.mu-vinyl{
  width:min(150px,calc(var(--phone-w,380px)*0.44));
  height:min(150px,calc(var(--phone-w,380px)*0.44));
  border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
  background:repeating-radial-gradient(circle at center,#16241c 0,#16241c 1.4px,#22352a 2px,#22352a 2.6px);
  box-shadow:0 16px 32px -16px rgba(20,60,40,.6);
  animation:muSpin 14s linear infinite;animation-play-state:paused;
}
.mu-vinyl.spinning{animation-play-state:running;}
@keyframes muSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.mu-label{
  width:44%;height:44%;border-radius:50%;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));
  border:2px solid rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:19px;font-weight:700;
}
.mu-label img{width:100%;height:100%;object-fit:cover;display:none;}
.mu-label.has-img img{display:block;}
.mu-label.has-img span{display:none;}

.mu-meta{text-align:center;padding:12px 22px 0;}
.mu-eq{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:12px;margin-bottom:6px;}
.mu-eq i{width:3px;border-radius:2px;background:linear-gradient(180deg,var(--mu-mid),var(--mu-deep));height:4px;animation:muEq 1s ease-in-out infinite;animation-play-state:paused;}
.mu-eq i:nth-child(2){animation-delay:.18s;}
.mu-eq i:nth-child(3){animation-delay:.36s;}
.mu-eq i:nth-child(4){animation-delay:.12s;}
.mu-eq i:nth-child(5){animation-delay:.3s;}
.mu-app.is-playing .mu-eq i{animation-play-state:running;}
@keyframes muEq{0%,100%{height:4px}50%{height:12px}}
.mu-song{font-size:16px;font-weight:700;color:var(--mu-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-artist{font-size:12px;color:var(--mu-ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-lyric{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;min-height:16px;
  font-size:11.5px;line-height:1.45;color:var(--mu-ink-soft);opacity:.9;}
.mu-lyric span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;}
.mu-lyric.empty{opacity:.5;}
.mu-lyric .mu-lyric-note{color:var(--mu-deep);flex-shrink:0;font-size:11px;}

.mu-progress{padding:16px 22px 0;}
.mu-bar{position:relative;height:5px;border-radius:3px;background:rgba(63,169,106,.18);cursor:pointer;}
.mu-bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--mu-mid),var(--mu-deep));}
.mu-bar-dot{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--mu-deep);transform:translate(-50%,-50%);box-shadow:0 2px 6px -1px rgba(40,130,70,.5);}
.mu-time{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--mu-ink-soft);font-variant-numeric:tabular-nums;}

.mu-controls{display:flex;align-items:center;justify-content:center;gap:26px;padding:14px 0 16px;}
.mu-ctrl{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.72);color:var(--mu-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -8px rgba(40,130,70,.45);transition:transform .12s;}
.mu-ctrl:active{transform:scale(.9);}
.mu-ctrl svg{width:20px;height:20px;fill:currentColor;stroke:none;}
.mu-play{width:58px;height:58px;background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;box-shadow:0 10px 22px -10px rgba(40,130,70,.75);}
.mu-play svg{width:24px;height:24px;}

.mu-list-head{display:flex;align-items:center;gap:6px;padding:0 14px 8px;font-size:13px;font-weight:700;color:var(--mu-ink);}
.mu-count{margin-left:auto;font-size:11px;font-weight:500;color:var(--mu-ink-soft);white-space:nowrap;}
.mu-list{padding:0 12px;}
.mu-track{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.72);cursor:pointer;
  transition:background .15s,transform .1s;}
.mu-track.active{background:rgba(255,255,255,.9);border-color:rgba(63,169,106,.45);box-shadow:0 4px 14px -10px rgba(40,130,70,.6);}
.mu-track:active{transform:scale(.985);}
.mu-thumb{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:repeating-radial-gradient(circle at center,#1b2b22 0,#1b2b22 1px,#2a3f33 1.6px,#2a3f33 2px);
  color:#cbe9d5;font-size:11px;font-variant-numeric:tabular-nums;}
.mu-eq-mini{display:none;align-items:flex-end;gap:2px;height:12px;}
.mu-eq-mini i{width:2px;border-radius:1px;background:var(--mu-mid);height:4px;animation:muEq 1s ease-in-out infinite;animation-play-state:paused;}
.mu-eq-mini i:nth-child(2){animation-delay:.2s;}
.mu-eq-mini i:nth-child(3){animation-delay:.4s;}
.mu-track.active .mu-thumb .mu-thumb-num{display:none;}
.mu-track.active .mu-thumb .mu-eq-mini{display:flex;}
.mu-app.is-playing .mu-track.active .mu-eq-mini i{animation-play-state:running;}
.mu-track-main{flex:1;min-width:0;}
.mu-track-name{font-size:13px;font-weight:600;color:var(--mu-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-track-artist{font-size:11px;color:var(--mu-ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-track-time{font-size:11px;color:var(--mu-ink-soft);font-variant-numeric:tabular-nums;flex-shrink:0;}
.mu-track-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--mu-ink-soft);font-size:16px;line-height:1;font-family:inherit;cursor:pointer;flex-shrink:0;transition:background .15s,color .15s;}
.mu-track-del:active{background:rgba(231,76,60,.14);color:#e74c3c;}
.mu-track-pick{width:24px;height:24px;border-radius:50%;border:none;background:rgba(63,169,106,.12);color:var(--mu-mid);font-size:12px;line-height:1;font-family:inherit;cursor:pointer;flex-shrink:0;transition:background .15s,transform .12s;}
.mu-track-pick:active{background:rgba(63,169,106,.26);transform:scale(.92);}
.mu-pick-banner{display:none;margin:0 14px 8px;padding:7px 11px;border-radius:11px;background:rgba(255,214,227,.5);border:1px solid rgba(229,82,127,.35);color:#c73d67;font-size:11.5px;font-weight:600;letter-spacing:.2px;}
.mu-empty{padding:34px 20px;text-align:center;font-size:12.5px;color:var(--mu-ink-soft);}

.mu-modal{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
  background:rgba(20,50,35,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.mu-modal.show{display:flex;animation:muFade .2s ease;}
@keyframes muFade{from{opacity:0}to{opacity:1}}
@keyframes muPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.mu-sheet{width:100%;max-height:86%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;
  animation:muUp .26s cubic-bezier(.32,.72,0,1);}
@keyframes muUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mu-sheet-title{font-size:15px;font-weight:700;text-align:center;color:var(--mu-ink);margin-bottom:2px;}
.mu-field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mu-ink-soft);}
.mu-field input[type=text],.mu-field input[type=url]{width:100%;border:1px solid var(--mu-line);background:#f6fdf8;
  border-radius:10px;padding:9px 11px;font-size:13px;color:var(--mu-ink);font-family:inherit;outline:none;}
.mu-field input[type=text]:focus,.mu-field input[type=url]:focus{border-color:var(--mu-deep);background:#fff;}
.mu-field input[type=file]{font-size:12px;color:var(--mu-ink-soft);}
.mu-field textarea{width:100%;height:88px;border:1px solid var(--mu-line);background:#f6fdf8;
  border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--mu-ink);font-family:inherit;outline:none;
  resize:none;line-height:1.6;}
.mu-field textarea:focus{border-color:var(--mu-deep);background:#fff;}
.mu-sheet-actions{display:flex;gap:10px;margin-top:6px;}
.mu-sheet-actions button{flex:1;padding:11px;border-radius:12px;border:none;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .1s;}
.mu-sheet-actions button:active{transform:scale(.97);}
.mu-cancel{background:#f1f7f2;color:var(--mu-ink);}
.mu-confirm{background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;}

.mu-toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.62);
  color:#fff;padding:9px 18px;border-radius:10px;font-size:12.5px;white-space:nowrap;transition:opacity .3s;
  animation:muFade .2s ease;}

.mu-qq-btn{margin-left:auto;height:32px;padding:0 11px;border-radius:16px;border:none;background:#fff;color:var(--mu-deep);
  font-size:11.5px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:4px;cursor:pointer;
  box-shadow:0 3px 10px -4px rgba(40,130,70,.42);transition:transform .1s,background .15s;}
.mu-qq-btn:active{transform:scale(.92);}
.mu-qq-btn.on{background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;}

.mu-login-mask{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(16,34,24,.44);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.mu-login-mask.show{display:flex;animation:muFade .18s ease;}
.mu-login-card{width:100%;max-width:322px;max-height:100%;overflow-y:auto;border-radius:26px;
  padding:18px 18px 15px;background:linear-gradient(180deg,#f8fdfa 0%,#e9f7ee 100%);
  box-shadow:0 26px 64px -22px rgba(10,40,24,.6);display:flex;flex-direction:column;align-items:center;
  animation:muPop .26s cubic-bezier(.2,1.12,.4,1);}
.mu-login-card::-webkit-scrollbar{width:0;}
.mu-login-head{width:100%;display:flex;align-items:flex-start;gap:8px;}
.mu-login-title{flex:1;font-size:17.5px;font-weight:800;color:var(--mu-ink);letter-spacing:.2px;line-height:1.3;}
.mu-login-x{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.86);
  color:var(--mu-ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .1s,background .15s;}
.mu-login-x:active{transform:scale(.9);background:#fff;}
.mu-login-x svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;}
.mu-login-desc{width:100%;font-size:11px;line-height:1.65;color:var(--mu-ink-soft);margin:7px 0 16px;}
.mu-login-body{width:100%;display:flex;flex-direction:column;align-items:center;}
.mu-qr-card{width:198px;height:198px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px -14px rgba(40,130,70,.4);position:relative;overflow:hidden;flex-shrink:0;}
.mu-qr-card img{width:180px;height:180px;display:block;}
.mu-qr-card.loading img{display:none;}
.mu-qr-card.loading::after{content:"二维码加载中…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--mu-ink-soft);background:#fff;}
.mu-qr-hint{font-size:12px;color:var(--mu-ink-soft);margin-top:13px;text-align:center;}
.mu-cookie-link{margin-top:9px;background:none;border:none;font-family:inherit;font-size:12px;font-weight:700;
  color:#d34a3f;cursor:pointer;padding:5px 8px;border-radius:8px;}
.mu-cookie-link:active{background:rgba(211,74,63,.09);}
.mu-login-status{width:100%;margin-top:15px;padding:11px;border-radius:15px;text-align:center;
  font-size:12px;font-weight:600;color:var(--mu-ink-soft);background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.92);}
.mu-login-status:empty{display:none;}
.mu-login-status.ok{color:#2e9d5b;background:rgba(255,255,255,.92);}
.mu-login-status.warn{color:#d34a3f;}
.mu-login-success{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0 2px;}
.mu-login-avatar{width:68px;height:68px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:700;
  box-shadow:0 10px 24px -12px rgba(40,130,70,.7),0 0 0 3px rgba(255,255,255,.92);}
.mu-login-avatar img{width:100%;height:100%;object-fit:cover;}
.mu-login-nick{font-size:14px;font-weight:700;color:var(--mu-ink);display:flex;align-items:center;gap:5px;}
.mu-login-sub{font-size:11px;color:var(--mu-ink-soft);}
.mu-steps{width:100%;font-size:11px;line-height:1.75;color:var(--mu-ink-soft);background:rgba(255,255,255,.66);
  border-radius:11px;padding:9px 11px;}
.mu-steps b{color:var(--mu-ink);}
.mu-bridge{width:100%;display:flex;gap:7px;align-items:center;}
.mu-bridge input{flex:1;min-width:0;border:1px solid var(--mu-line);border-radius:10px;background:#fff;
  padding:8px 10px;font-size:11.5px;font-family:inherit;color:var(--mu-ink);outline:none;}
.mu-bridge button{height:30px;padding:0 10px;border-radius:10px;border:none;font-family:inherit;font-size:11.5px;
  font-weight:600;background:rgba(255,255,255,.92);color:var(--mu-deep);cursor:pointer;flex-shrink:0;}
.mu-bridge button:active{transform:scale(.95);}
.mu-diag{width:100%;font-size:11.5px;line-height:1.8;color:var(--mu-ink-soft);background:rgba(255,255,255,.74);
  border-radius:12px;padding:11px 13px;}
.mu-diag b{color:var(--mu-ink);}
.mu-diag code{background:rgba(63,169,106,.13);padding:1px 4px;border-radius:4px;font-size:11px;}
.mu-login-fail{width:100%;background:rgba(255,255,255,.86);border-radius:14px;padding:12px 14px;
  box-shadow:0 10px 24px -16px rgba(40,130,70,.5);}
.mu-login-fail-title{font-size:12px;font-weight:800;color:#c9463b;margin-bottom:6px;}
.mu-login-fail-msg{font-size:11px;line-height:1.7;color:var(--mu-ink-soft);word-break:break-all;}
.mu-login-trace{margin:8px 0 0;padding:8px;border-radius:8px;background:rgba(63,169,106,.08);
  font-size:10px;line-height:1.6;color:var(--mu-ink-soft);white-space:pre-wrap;word-break:break-all;
  max-height:120px;overflow:auto;}
.mu-login-acts{width:100%;display:flex;gap:8px;margin-top:11px;}
.mu-login-act{flex:1;height:36px;border-radius:12px;border:none;font-family:inherit;font-size:12px;
  font-weight:700;background:rgba(255,255,255,.92);color:var(--mu-deep);cursor:pointer;}
.mu-login-act.primary{background:linear-gradient(135deg,#4cb877,#2f9b62);color:#fff;}
.mu-login-act:active{transform:scale(.96);}
.mu-login-picker{width:100%;display:flex;flex-direction:column;gap:10px;}
.mu-prov{width:100%;display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:16px;border:none;

.mu-float{position:absolute;inset:0;z-index:22;pointer-events:none;display:none;

.mu-float.mu-float-fixed{position:fixed;}
.mu-float-dot{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%);pointer-events:auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;}
.mu-float-cover{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));
  background-size:cover;background-position:center;

.mu-float-dot.dragging .mu-float-cover{animation:none;transform:scale(1.12);}
.mu-float-del{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;border:none;
  background:#e0503f;color:#fff;font-size:11px;line-height:1;font-family:inherit;display:none;padding:0;

.mu-float-pop{position:absolute;width:150px;display:none;flex-direction:column;gap:5px;pointer-events:auto;
  padding:7px 8px 8px;border-radius:12px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.92);
  box-shadow:0 16px 34px -16px rgba(10,40,24,.55);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  backdrop-filter:blur(14px) saturate(1.3);}
.mu-float-pop.show{display:flex;animation:muFloatPop .16s ease;}
.mu-float.mu-float-together .mu-float-cover{box-shadow:0 0 0 2px rgba(255,150,180,.95),0 4px 10px -2px rgba(120,30,60,.5);}
.mu-float.mu-float-together .mu-float-pop{border-color:rgba(255,150,180,.95);}
.mu-float-bubble{position:absolute;width:190px;max-width:190px;padding:8px 11px;border-radius:10px;background:#fff;
  color:#5b4760;font-size:11.5px;line-height:1.5;box-shadow:0 8px 20px -8px rgba(120,40,80,.35);
  border:1px solid #ffd3e0;opacity:0;pointer-events:none;transition:opacity .25s;
  white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;box-sizing:border-box;text-align:left;}
.mu-float-bubble.show{opacity:1;pointer-events:auto;}
.mu-float-bubble.big{width:230px;max-width:230px;font-size:13px;line-height:1.6;padding:10px 13px;border-radius:12px;}
.mu-float-bubble::after{content:'';position:absolute;top:50%;width:0;height:0;border:5px solid transparent;}
.mu-float-bubble.side-right::after{left:-9px;border-right-color:#fff;}
.mu-float-bubble.side-left::after{right:-9px;border-left-color:#fff;}
@keyframes muFloatPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.mu-float-top{display:flex;align-items:center;gap:6px;height:30px;}
.mu-float-art{width:30px;height:30px;border-radius:7px;overflow:hidden;position:relative;flex-shrink:0;
  background:linear-gradient(135deg,var(--mu-mid),var(--mu-deep));color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -8px rgba(30,90,55,.6);}
.mu-float-art img{width:100%;height:100%;object-fit:cover;display:none;}
.mu-float-art.has-img img{display:block;}
.mu-float-art.has-img span{display:none;}
.mu-float-side{flex:1;min-width:0;height:30px;display:flex;flex-direction:column;justify-content:space-between;}
.mu-float-title{font-size:10.5px;font-weight:700;line-height:12px;color:var(--mu-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-float-bar{position:relative;height:2px;border-radius:1px;margin-top:1px;background:rgba(63,169,106,.2);cursor:pointer;}
.mu-float-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:1px;background:linear-gradient(90deg,var(--mu-mid),var(--mu-deep));}
.mu-float-thumb{position:absolute;top:50%;left:0;width:5px;height:5px;border-radius:50%;background:#fff;
  border:1px solid var(--mu-deep);transform:translate(-50%,-50%);}
.mu-float-time{display:flex;justify-content:space-between;margin-top:-1px;font-size:7px;color:var(--mu-ink-soft);
  font-variant-numeric:tabular-nums;}
.mu-float-ctrls{display:flex;align-items:center;justify-content:flex-start;gap:7px;height:18px;padding:0;
  transform:translateY(2px);}
.mu-float-btn{width:16px;height:16px;border-radius:50%;border:none;background:#f2faf5;color:#2f8f57;padding:0;
  box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s;flex-shrink:0;}
.mu-float-btn:active{transform:scale(.9);}
.mu-float-btn svg{width:8px;height:8px;fill:currentColor;}
.mu-float-play{width:18px;height:18px;color:#1e4a30;background:rgba(124,204,155,.34);
  border:1px solid rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(9px) saturate(1.55);backdrop-filter:blur(9px) saturate(1.55);
  box-shadow:0 5px 12px -9px rgba(40,130,70,.5),inset 0 1px 0 rgba(255,255,255,.62);}
.mu-float-play svg{width:9px;height:9px;}
.mu-float-lyric{font-size:8px;line-height:1.4;text-align:center;color:var(--mu-ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:4px;
  border-top:1px solid rgba(63,169,106,.14);}
.mu-float-lyric.empty{opacity:.55;}

body[data-mu-standalone]{margin:0;min-height:100vh;background:#eefaf2;display:flex;align-items:center;justify-content:center;}

  overflow:hidden;box-shadow:0 24px 70px -24px rgba(20,60,35,.4);--phone-w:min(92vw,420px);}

<body>
<div class="mu-app" id="musicApp">
  <div class="mu-topbar">
    <button class="mu-back" id="muBack" aria-label="返回"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="mu-title">音乐</div>
    <button class="mu-avatar" id="muAvatar" aria-label="QQ音乐账号">
      <img id="muAvatarImg" alt="">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3.9 0-7 2.1-7 4.6V21h14v-2.4C19 16.1 15.9 14 12 14z"/></svg>
    </button>
  </div>
  <div class="mu-body">
    <div class="mu-stage">
      <div class="mu-vinyl" id="muVinyl">
        <div class="mu-label" id="muLabel"><img id="muCover" alt=""><span id="muInitial">♪</span></div>
      </div>
    </div>
    <div class="mu-meta">
      <div class="mu-eq" id="muEq"><i></i><i></i><i></i><i></i><i></i></div>

      <div class="mu-bar" id="muBar"><div class="mu-bar-fill" id="muFill"></div><div class="mu-bar-dot" id="muDot"></div></div>

        <button class="mu-login-x" id="muLoginX" aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>

        <button id="muPlCreate">新建</button>

</div>
<script>
(function(){
  if(window.mountMusicApp) return;
  var LOCAL_KEY = 'wayv_music_data';
  var LEGACY_DEFAULT_IDS = ['mu_takeoff', 'mu_moonwalk', 'mu_lovetalk', 'mu_turnback', 'mu_phantom'];
  var MODE_LABEL = { seq:'顺序', loop:'循环', random:'随机' };
  var MODE_ORDER = ['seq', 'loop', 'random'];
  var MODE_ICON = {
    seq: '<svg viewBox="0 0 24 24"><path d="M4 7h10"/><path d="M4 12h10"/><path d="M4 17h10"/>' +
         '<path d="M18.5 4.5v8.5"/><path d="M16 10.5l2.5 2.5 2.5-2.5"/></svg>',
    loop: '<svg viewBox="0 0 24 24"><path d="M16.5 2.5l3.5 3.5-3.5 3.5"/>' +
          '<path d="M3.5 11.5V10a4 4 0 014-4h12"/>' +
          '<path d="M7 21.5L3.5 18.5 7 15.5"/><path d="M20.5 12.5V14a4 4 0 01-4 4H4"/></svg>',
    random: '<svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/>' +
            '<path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>'
  };
  var AUDIO_EXT = /\.(mp3|m4a|wav|flac|aac|ogg|opus|wma)$/i;
  var PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
  var PAUSE_ICON = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>';
  var memSrc = {};

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }

  var PLAYER = { audio:null, src:'', dur:0, playing:false, progress:0 };
  var UIHOOKS = { tick:null, time:null, meta:null, end:null };
  var PTIMER = null;

  function playerAudio(){
    if(PLAYER.audio) return PLAYER.audio;
    var a = new Audio();
    a.preload = 'metadata';
    a.addEventListener('timeupdate', function(){ if(UIHOOKS.time) UIHOOKS.time(); });

      if(ctl) opt.signal = ctl.signal;
      var timer = ctl ? setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 2500) : null;
      return fetch(url, opt).then(function(r){
        return r.text().then(function(t){
          try{ JSON.parse(t); return true; }catch(e){ return false; }
        });
      }).catch(function(){ return false; }).then(function(ok){
        if(timer) clearTimeout(timer);
        return ok;
      });
    }

    function ensureBridge(){
      if(bridgeOk) return Promise.resolve(true);
      var list = ['', 'http://127.0.0.1:8000', 'http://localhost:8000'];
      if(bridgeBase && list.indexOf(bridgeBase) < 0) list.unshift(bridgeBase);
      return new Promise(function(resolve){
        var i = 0;
        (function next(){
          if(i >= list.length){ resolve(false); return; }
          var b = list[i++];
          probeBridge(b).then(function(ok){
            if(ok){ setBridge(b); bridgeOk = true; resolve(true); }
            else next();
          });
        })();
      });
    }

    function qqStopPoll(){
      if(qrTimer){ clearInterval(qrTimer); qrTimer = null; }
    }

    function avatarUrl(p){
      p = p || {};
      if(p.avatar) return String(p.avatar);
      var u = String(p.uin || '');
      if(/^\d+$/.test(u)) return 'https://q1.qlogo.cn/g?b=qq&nk=' + u + '&s=140';
      return '';
    }

    function setProfile(p){
      qqProfile = (p && p.loggedIn) ? p : null;
      if(qqProfile) prov = qqProfile.provider === 'ne' ? 'ne' : 'qq';
      var url = avatarUrl(p);
      if(url){
        if(avatarImg.getAttribute('src') !== url){
          avatarImg.onerror = function(){ avatarEl.classList.remove('has-img'); };
          avatarImg.src = url;
        }
        avatarEl.classList.add('has-img');
      } else {
        avatarImg.removeAttribute('src');
        avatarEl.classList.remove('has-img');
      }
      avatarEl.classList.toggle('online', !!(p && p.loggedIn));
    }

    function openQQSheet(){
      qqView.classList.add('show');
      qqLoadLists();
    }

    function qqOpen(){
      if(qqProfile && qqProfile.loggedIn){ openQQSheet(); return; }
      openLogin(true);
      ensureBridge().then(function(ok){
        if(!ok){ openLogin(); return; }
        detectProfile().then(function(p){
          p = p || {};
          if(p.loggedIn){ setProfile(p); closeLogin(); openQQSheet(); return; }
          setProfile(p);
          openLogin();
        }).catch(function(){ openLogin(); });
      });
    }

    function qqClose(){
      qqView.classList.remove('show');
      qqStopPoll();
    }

    function openLogin(pending){
      qqStopPoll();
      loginMask.classList.add('show');
      if(pending){
        loginTitle.textContent = '登录音乐平台';
        loginDesc.textContent = '正在连接本机音乐服务…';

          '<div class="mu-qr-card loading" id="muQrCard"><img id="muQrImg" alt="登录二维码"></div>';
        loginStatusSet('正在连接本机服务…');
        return;
      }
      renderLoginPicker();
    }

    function closeLogin(){
      loginMask.classList.remove('show');
      qqStopPoll();
      stopBridgeWatch();
    }

    function loginDone(res){
      qqStopPoll();
      var p = (res && res.profile) ? res.profile : (res && res.loggedIn !== undefined ? res : null);
      if(!p || !p.loggedIn){
        setProfile(null);
        loginTitle.textContent = 'QQ 音乐登录';
        loginDesc.textContent = '扫码已完成，但没有拿到 QQ 音乐登录态。';
        loginStatusSet('登录失败', 'warn');
        var msg = (res && res.error) || '登录态未生效，请重试或改用 Cookie 登录';
        var trace = (res && res.trace) ? res.trace : [];
        loginBody.innerHTML =
          '<div class="mu-login-fail">' +
            '<div class="mu-login-fail-title">扫码成功，换取登录态失败</div>' +
            '<div class="mu-login-fail-msg">' + esc(msg) + '</div>' +
            (trace.length ? '<pre class="mu-login-trace">' + esc(trace.join('\n')) + '</pre>' : '') +
          '</div>' +
          '<div class="mu-login-acts">' +
            '<button class="mu-login-act" id="muFailRetry">重新扫码</button>' +
            '<button class="mu-login-act primary" id="muFailCookie">改用 Cookie 登录</button>' +
          '</div>';
        var r1 = loginBody.querySelector('#muFailRetry');
        var r2 = loginBody.querySelector('#muFailCookie');
        if(r1) r1.onclick = function(){ qqStopPoll(); loadQr(); };
        if(r2) r2.onclick = renderLoginCookie;
        return;
      }
      setProfile(p);
      var nick = (p && p.nick) || 'QQ 音乐用户';
      var url = avatarUrl(p);
      var hasKey = !!(p && p.hasKey);
      var warn = (res && res.warning) || '';
      loginTitle.textContent = 'QQ 音乐登录成功';
      loginDesc.textContent = '账号已连接到本机 QQ 音乐服务。';
      loginStatusSet('登录成功', 'ok');
      loginBody.innerHTML =
        '<div class="mu-login-success">' +
          '<div class="mu-login-avatar">' +
            (url ? '<img src="' + esc(url) + '" alt="">' : esc(String(nick).charAt(0) || 'Q')) +

            ((p && p.vip) ? '<span class="mu-vip-badge">VIP</span>' : '') + '</div>' +
          '<div class="mu-login-sub">' + esc(warn || (hasKey ? '播放凭证已就绪，正在打开曲库…' : '已登录，正在打开曲库…')) + '</div>' +
        '</div>' +
        (hasKey ? '' :
          '<div class="mu-login-fail" style="margin-top:10px">' +
            '<div class="mu-login-fail-msg">QQ 扫码只拿到了账号身份（歌单、昵称可用）。' +
            '要播放 VIP 歌曲，改用微信扫码即可直接拿到播放凭证。</div>' +
          '</div>' +
          '<div class="mu-login-acts">' +
            '<button class="mu-login-act" id="muKeyLater">先进入曲库</button>' +
            '<button class="mu-login-act primary" id="muKeyAdd">改用微信扫码</button>' +
          '</div>');
      var addBtn = loginBody.querySelector('#muKeyAdd');
      if(addBtn) addBtn.onclick = function(){ renderLoginWxQr(); };
      var laterBtn = loginBody.querySelector('#muKeyLater');
      if(laterBtn) laterBtn.onclick = function(){ closeLogin(); openQQSheet(); };
      toast('已登录 QQ 音乐');
      if(!hasKey) return;
      setTimeout(function(){
        closeLogin();
        openQQSheet();
      }, 1200);
    }

      loginStatus.textContent = txt;
      loginStatus.className = 'mu-login-status' + (kind ? ' ' + kind : '');
    }

    function renderLoginNoBridge(next){
      qqStopPoll();
      loginTitle.textContent = '登录音乐平台';
      loginDesc.textContent = '二维码登录需要在本机运行音乐桥接服务（浏览器无法直接访问音乐平台接口）。';
      loginBody.innerHTML =
        '<div class="mu-diag">' +
          '<div style="font-weight:700;color:var(--mu-ink);margin-bottom:6px">正在等待本机服务</div>' +
          '① 在本机运行 <code>python qqmusic_server.py</code><br>' +

        '</div>' +
        '<button class="mu-cookie-link" id="muLgRetry">重新检测</button>';
      loginStatusSet('正在连接本机服务…', 'warn');
      var retry = loginBody.querySelector('#muLgRetry');
      if(retry) retry.onclick = function(){ loginEnsureBridge(renderLoginPicker); };
      watchBridgeThen(next || (qrMode === 'ne' ? renderLoginNeQr : (qrMode === 'wx' ? renderLoginWxQr : renderLoginQr)));
    }

    var bridgeWatch = null;
    function stopBridgeWatch(){
      if(bridgeWatch){ clearInterval(bridgeWatch); bridgeWatch = null; }
    }
    function watchBridgeThen(next){
      stopBridgeWatch();
      var bases = ['', 'http://127.0.0.1:8000', 'http://localhost:8000'];
      bridgeWatch = setInterval(function(){
        if(!loginMask.classList.contains('show')){ stopBridgeWatch(); return; }
        if(bridgeOk){ stopBridgeWatch(); if(next) next(); return; }
        (function tryAt(i){
          if(i >= bases.length) return;
          probeBridge(bases[i]).then(function(ok){
            if(ok){
              setBridge(bases[i]);
              bridgeOk = true;
              stopBridgeWatch();
              if(next) next();
            } else {
              tryAt(i + 1);
            }
          });
        })(0);
      }, 2000);
    }

    var qrMode = 'qq';
    var prov = 'qq';

    function provName(){
      return prov === 'ne' ? '网易云音乐' : 'QQ 音乐';
    }

    function qrEndpoint(){
      if(qrMode === 'ne') return '/api/ne/qr';
      return qrMode === 'wx' ? '/api/qq/wxqr' : '/api/qq/qr';
    }

    function qrCheckEndpoint(){
      if(qrMode === 'ne') return '/api/ne/qr/check';
      return qrMode === 'wx' ? '/api/qq/wxqr/check' : '/api/qq/qr/check';
    }

    function detectProfile(){
      return probeProviders().then(function(st){
        if(!st) return null;
        var q = (st.qq && st.qq.loggedIn) ? st.qq : null;
        var n = (st.ne && st.ne.loggedIn) ? st.ne : null;
        if(q && n) return (n.loginTime || 0) > (q.loginTime || 0) ? n.profile : q.profile;
        if(q) return q.profile;
        if(n) return n.profile;
        return (st.qq && st.qq.ok) ? st.qq.profile : ((st.ne && st.ne.ok) ? st.ne.profile : null);
      }).catch(function(){ return null; });
    }

    var provState = { qq: null, ne: null };

    function probeProviders(){
      if(!bridgeOk) return Promise.resolve(null);
      return Promise.all([
        api('/api/qq/status').catch(function(){ return null; }),
        api('/api/ne/status').catch(function(){ return null; })
      ]).then(function(res){
        var q = res[0], n = res[1];
        var qOK = !!(q && !q.notJson), nOK = !!(n && !n.notJson);
        if(!qOK && !nOK) return null;
        provState.qq = qOK
          ? { ok:true, loggedIn: !!(q.profile && q.profile.loggedIn),
              profile: q.profile || {}, loginTime: q.loginTime || 0 }
          : { ok:false, loggedIn:false, profile:{}, loginTime:0 };
        provState.ne = nOK
          ? { ok:true, loggedIn: !!(n.profile && n.profile.loggedIn),
              profile: n.profile || {}, loginTime: n.loginTime || 0 }
          : { ok:false, loggedIn:false, profile:{}, loginTime:0 };
        return provState;
      });
    }

    function provSubInner(p){
      var st = provState[p];
      if(!st) return '<span class="mu-prov-dot"></span>正在检查登录状态…';
      if(!st.ok) return '<span class="mu-prov-dot"></span>本机服务读不到这个平台的登录态';
      var prof = st.profile || {};
      if(st.loggedIn){
        return '<span class="mu-prov-dot on"></span>已登录' +
               (prof.nick ? '：' + esc(prof.nick) : '') +
               (prof.vip ? '<span class="mu-vip-badge">VIP</span>' : '') +
               ' · 点击直接进入';
      }
      return '<span class="mu-prov-dot"></span>未登录 · ' +
             (p === 'ne' ? '用网易云音乐 App 扫码' : '用手机 QQ 扫码');
    }

    function provRow(p, ico, title){
      var st = provState[p];
      var cur = (prov === p && st && st.loggedIn) ? ' current' : '';
      var key = p === 'ne' ? 'Ne' : 'Qq';
      return '<button class="mu-prov' + cur + '" id="muPick' + key + '" data-prov="' + p + '">' +
        '<div class="mu-prov-ico' + (p === 'ne' ? ' ne' : '') + '">' + ico + '</div>' +
        '<div class="mu-prov-main">' +
          '<div class="mu-prov-title">' + title + '</div>' +
          '<div class="mu-prov-sub" id="muSub' + key + '">' + provSubInner(p) + '</div>' +
        '</div>' +
        '<div class="mu-prov-arrow">›</div>' +
      '</button>';
    }

    function bindPicker(){
      var btns = loginBody.querySelectorAll('.mu-prov');
      for(var i = 0; i < btns.length; i++){
        btns[i].onclick = function(){ pickProvider(this.getAttribute('data-prov')); };
      }
    }

    function refreshPicker(){
      return probeProviders().then(function(st){
        if(!loginMask.classList.contains('show')) return;
        if(!st){
          if(loginBody.querySelector('#muPickQq')) renderLoginNoBridge(renderLoginPicker);
          return;
        }
        if(!loginBody.querySelector('#muPickQq')) return;
        ['qq', 'ne'].forEach(function(p){
          var key = p === 'ne' ? 'Ne' : 'Qq';
          var btn = loginBody.querySelector('#muPick' + key);
          var sub = loginBody.querySelector('#muSub' + key);
          if(sub) sub.innerHTML = provSubInner(p);
          if(btn) btn.classList.toggle('current', prov === p && !!(provState[p] && provState[p].loggedIn));
        });
        var any = (provState.qq && provState.qq.loggedIn) || (provState.ne && provState.ne.loggedIn);
        loginStatusSet(any ? '已登录的平台点一下直接进入' : '请选择要扫码登录的平台');
      }).catch(function(){});
    }

    function renderLoginPicker(){
      if(!loginMask.classList.contains('show')) return;
      qqStopPoll();
      qrMode = '';
      loginTitle.textContent = '登录音乐平台';
      loginDesc.textContent = '会同时检查 QQ 音乐和网易云音乐的登录状态；已登录的点一下直接进入，未登录的点一下扫码。';
      provState.qq = null;
      provState.ne = null;
      loginBody.innerHTML =
        '<div class="mu-login-picker">' +
          provRow('qq', 'Q', 'QQ 音乐') +
          provRow('ne', '云', '网易云音乐') +
        '</div>' +
        (bridgeOk ? '' :
          '<div class="mu-login-note">正在自动连接本机服务（<code>qqmusic_server.py</code>），连上后会直接显示两个平台的登录状态，无需刷新。</div>');
      loginStatusSet(bridgeOk ? '正在检查两个平台的登录状态…' : '正在连接本机服务…');
      bindPicker();
      if(!bridgeOk){
        watchBridgeThen(function(){
          if(loginMask.classList.contains('show') && loginBody.querySelector('#muPickQq')) renderLoginPicker();
        });
        return;
      }
      stopBridgeWatch();
      refreshPicker();
    }

    function startQr(p){
      var next = (p === 'ne') ? renderLoginNeQr : renderLoginQr;
      if(bridgeOk){ next(); return; }
      loginStatusSet('正在连接本机服务…');
      ensureBridge().then(function(ok){
        if(!loginMask.classList.contains('show')) return;
        if(ok){ next(); return; }
        renderLoginPicker();
        watchBridgeThen(next);
      });
    }

    function useProvider(p){
      prov = p;
      qrMode = p;
      setProfile((provState[p] && provState[p].profile) || null);
      closeLogin();
      openQQSheet();
      toast('已进入' + provName());
    }

    function pickProvider(p){
      prov = p;
      qrMode = p;
      var st = provState[p];
      if(st && st.loggedIn){ useProvider(p); return; }
      if(!st && bridgeOk){
        probeProviders().then(function(res){
          if(res){ pickProvider(p); return; }
          renderLoginNoBridge(renderLoginPicker);
        }).catch(function(){ startQr(p); });
        return;
      }
      startQr(p);
    }

    function loginEnsureBridge(next){
      loginStatusSet('正在连接本机服务…');
      ensureBridge().then(function(ok){
        if(!ok){ renderLoginNoBridge(next); return; }
        if(loginMask.classList.contains('show')) next();
      });
    }

      if(!loginMask.classList.contains('show')) return;

      qrMode = 'qq';

      var r = loginBody.querySelector('#muNeRiskRetry');

    function renderLoginWxQr(){
      if(!loginMask.classList.contains('show')) return;

      qrMode = 'wx';
      loginTitle.textContent = 'QQ 音乐登录（微信扫码）';

        '<div class="mu-qr-card loading" id="muQrCard"><img id="muQrImg" alt="登录二维码"></div>' +
        '<div class="mu-login-acts">' +
          '<button class="mu-login-act" id="muQqQrSwitch">改用 QQ 扫码</button>' +
          '<button class="mu-login-act" id="muCookieSwitch">使用 Cookie</button>' +

      loginBody.querySelector('#muQqQrSwitch').onclick = renderLoginQr;
      loginBody.querySelector('#muCookieSwitch').onclick = renderLoginCookie;

    function renderLoginCookie(){
      qqStopPoll();
      loginTitle.textContent = 'QQ 音乐登录（Cookie 导入）';
      loginDesc.textContent = '播放 VIP 歌曲需要 QQ 音乐网页版的播放凭证（qm_keyst）。';
      loginBody.innerHTML =
        '<div class="mu-cookie-panel">' +
          '<div class="mu-steps">' +
            '① 电脑浏览器打开 <b>y.qq.com</b> 并用你这个 VIP 账号登录<br>' +
            '② 按 <b>F12</b> → <b>应用 / Application</b> → <b>Cookie</b> → <b>https://y.qq.com</b><br>' +
            '③ 找到 <b>qm_keyst</b>（没有的话找 <b>qqmusic_key</b>），把它的值整段复制<br>' +
            '④ 粘到下面「qm_keyst」输入框，点保存。uin 可留空，会自动识别<br>' +
            '⑤ 凭证有效期几天到几十天，过期后重来一次' +
          '</div>' +
          '<label class="mu-field">uin<input type="text" id="muKeyUin" placeholder="o0123456789 或 123456789"></label>' +
          '<label class="mu-field">qm_keyst<input type="text" id="muKeyKeyst" placeholder="粘贴 qm_keyst 的值"></label>' +
          '<div class="mu-cookie-box">' +
            '<textarea id="muCookieText" placeholder="或整段粘贴：uin=...; qm_keyst=...; qqmusic_key=..."></textarea>' +
            '<button id="muCookieSave">保存并登录</button>' +
          '</div>' +
          '<button class="mu-cookie-link" id="muQrSwitch">← 返回扫码登录</button>' +
        '</div>';
      loginStatusSet('手动 Cookie 登录');
      loginBody.querySelector('#muQrSwitch').onclick = renderLoginQr;
      loginBody.querySelector('#muCookieSave').onclick = function(){
        var uin = (loginBody.querySelector('#muKeyUin').value || '').trim();
        var keyst = (loginBody.querySelector('#muKeyKeyst').value || '').trim();
        var txt = (loginBody.querySelector('#muCookieText').value || '').trim();
        if(!uin && !keyst && !txt){ loginStatusSet('请先填写 uin / qm_keyst 或粘贴 Cookie', 'warn'); return; }
        loginStatusSet('正在验证 Cookie…');
        api('/api/qq/cookie', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ uin: uin, keyst: keyst, cookie: txt }) }).then(function(j){
          if(j && j.profile && j.profile.loggedIn){
            loginDone(j.profile);
          } else {
            loginStatusSet((j && j.error) || 'Cookie 无效或已过期，请重新获取', 'warn');
          }
        }).catch(function(){ loginStatusSet('保存失败，检查服务是否在运行', 'warn'); });
      };
    }

    function loadQr(){
      var card = loginBody.querySelector('#muQrCard');
      var qrImg = loginBody.querySelector('#muQrImg');
      if(!card || !qrImg) return;
      qqStopPoll();
      card.classList.add('loading');
      loginStatusSet('二维码加载中…');
      api(qrEndpoint()).then(function(j){
        if(!j || j.notJson){
          bridgeOk = false;
          renderLoginNoBridge();
          return;
        }
        card.classList.remove('loading');
        if(!j.ok || !j.image){
          loginStatusSet(j.error || '二维码获取失败，请稍后重试', 'warn');
          return;
        }
        qrImg.src = j.image;
        loginStatusSet('');
        qqPoll();
      }).catch(function(){
        bridgeOk = false;
        renderLoginNoBridge();
      });
    }

    function qqPoll(){
      qqStopPoll();
      qrTimer = setInterval(function(){
        api(qrCheckEndpoint()).then(function(j){
          if(!j) return;
          if(j.status === 0){
            qqStopPoll();
            if(qrMode === 'ne'){
              loginStatusSet('正在读取网易云账号…', 'ok');
              loginDoneNe(j);
              return;
            }
            loginStatusSet('正在换取 QQ 音乐登录态…', 'ok');
            loginDone(j);
            return;
          }
          if(j.status === 67) loginStatusSet('已扫码，请在手机上确认登录');
          else if(j.status === 66) loginStatusSet(j.msg && j.msg.indexOf('风控') >= 0 ? j.msg : '');
          else if(j.status === 69){
            qqStopPoll();
            renderLoginNeRisk(j);
          } else if(j.status === 68 || j.status === 1){
            loginStatusSet('已取消登录，正在刷新二维码…');
            qqStopPoll();
            loadQr();
          } else if(j.status === 65){
            qqStopPoll();
            if(j.error){
              if(qrMode === 'ne'){ renderLoginNeRisk(j); return; }
              loginStatusSet(j.error, 'warn');
              return;
            }
            loginStatusSet('二维码已过期，正在刷新…');
            loadQr();
          } else {
            loginStatusSet(j.error || '二维码已失效，正在刷新…', 'warn');
            qqStopPoll();
            loadQr();
          }
        }).catch(function(){});
      }, 2000);
    }

    function img(url){
      if(!url) return '';
      return apiUrl('/api/qq/cover?url=' + encodeURIComponent(url));
    }

    function qqTop(){
      return '<div class="mu-search">' +
          '<input id="muSearchInput" type="search" placeholder="搜索歌曲 / 歌手" autocomplete="off" value="' + esc(qqKeyword) + '">' +
          '<button class="mu-search-btn" id="muSearchBtn">搜索</button>' +
        '</div>';
    }

    function bindQQTop(){
      var input = qqBody.querySelector('#muSearchInput');
      var btn = qqBody.querySelector('#muSearchBtn');
      if(input){
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ e.preventDefault(); doSearch(input.value); }
        });
      }
      if(btn) btn.onclick = function(){ doSearch(input ? input.value : ''); };
    }

    function qqRender(html){
      qqBody.innerHTML = html;

    function qqLoadLists(){
      qqStopPoll();
      qqSongs = [];
      qqRender(qqTop() + qqUserBar() + '<div class="mu-empty">读取歌单中…</div>');
      var tasks = [api('/api/' + prov + '/playlists')];
      if(prov === 'ne') tasks.push(api('/api/ne/collection').catch(function(){ return {ok:true}; }));
      Promise.all(tasks).then(function(ress){
        var j = ress[0];
        if(!j || !j.ok){
          if(j && /未登录/.test(String(j.error || ''))){
            setProfile(null);
            qqClose();
            openLogin();
            return;
          }
          qqRender(qqTop() + qqUserBar() + '<div class="mu-empty">' + esc((j && j.error) || '歌单读取失败') + '</div>');
          return;
        }
        qqLists = j.playlists || [];
        var coll = (ress[1] && ress[1].ok) ? ress[1] : {subAlbums:[], purchasedAlbums:[]};
        var subAlbums = coll.subAlbums || [], purchasedAlbums = coll.purchasedAlbums || [];
        if(!qqLists.length && !subAlbums.length && !purchasedAlbums.length){
          qqRender(qqTop() + qqUserBar() + '<div class="mu-empty">这个账号还没有歌单</div>');
          return;
        }
        var html = qqTop() + qqUserBar() + '<div class="mu-qq-head"><div class="mu-qq-head-title">我的歌单</div>' +
          '<button class="mu-qq-out" data-qq="reload">刷新</button></div>';
        if(qqLists.length){
          html += qqLists.map(function(p){
            return '<div class="mu-pl" data-qq="pl" data-id="' + esc(p.id) + '">' +
              (p.cover ? '<img class="mu-pl-cover" src="' + esc(img(p.cover)) + '" alt="">' : '<div class="mu-pl-cover"></div>') +
              '<div class="mu-pl-main"><div class="mu-pl-title">' + esc(p.title || '未命名歌单') + '</div>' +
              '<div class="mu-pl-sub">' + (p.count || 0) + ' 首</div></div></div>';
          }).join('');
        }
        if(prov === 'ne'){
          if(subAlbums.length){
            html += '<div class="mu-qq-head"><div class="mu-qq-head-title">收藏的专辑</div></div>';
            html += subAlbums.map(function(a){ return albumRow(a, 'sub'); }).join('');
          }
          if(purchasedAlbums.length){
            html += '<div class="mu-qq-head"><div class="mu-qq-head-title">已购专辑</div></div>';
            html += purchasedAlbums.map(function(a){ return albumRow(a, 'pur'); }).join('');
          }
        }
        qqRender(html);
      }).catch(function(){
        qqRender(qqTop() + qqUserBar() + '<div class="mu-empty">歌单读取失败，请稍后重试</div>');
      });
    }

    function qqSearch(kw){
      return api('/api/' + prov + '/search?kw=' + encodeURIComponent(kw)).then(function(j){
        if(!j || !j.ok) throw new Error((j && j.error) || '搜索失败');
        return j.songs || [];
      });
    }

    function doSearch(kw){
      kw = String(kw || '').trim();
      if(!kw){ toast('请输入搜索关键词'); return; }
      qqKeyword = kw;
      qqSearchSongs = [];
      qqRender(qqTop() + '<div class="mu-empty">搜索中…</div>');
      qqSearch(kw).then(function(list){
        qqSearchSongs = list;
        var html = qqTop() + '<div class="mu-qq-head"><div class="mu-qq-head-title">「' + esc(kw) + '」的结果</div>' +
          '<div class="mu-qq-state">' + list.length + ' 首</div></div>';
        if(!list.length) html += '<div class="mu-empty">没有找到相关歌曲，换个关键词试试</div>';
        html += list.map(function(s, i){ return songRow(s, i, 'sr'); }).join('');
        qqRender(html);
      }).catch(function(e){
        qqRender(qqTop() + '<div class="mu-empty">' + esc((e && e.message) || '搜索失败，请检查本机服务') + '</div>');
      });
    }

          qqBody.innerHTML = '<div class="mu-qq-head"><button class="mu-qq-back-sm" data-qq="back">‹</button>' +

    function qqRenderSongs(){

    function qqTrackOf(s){
      return {
        id: (prov === 'ne' ? 'ne_' : 'qq_') + s.songmid,
        qq: prov !== 'ne',
        ne: prov === 'ne',
        songmid: s.songmid,
        mediaMid: s.mediaMid || s.songmid,
        title: s.title,
        artist: s.artist,
        duration: s.duration,
        cover: img(s.cover),
        src: ''
      };
    }

    function qqImportAll(){
      if(!qqSongs.length){ toast('歌单里没有歌曲'); return; }
      var tracks = d.tracks.slice();
      var ids = {};
      tracks.forEach(function(t){ ids[t.id] = 1; });
      var added = 0, skipped = 0;
      qqSongs.forEach(function(s){
        var t = qqTrackOf(s);
        if(!t.id || ids[t.id]){ skipped++; return; }
        ids[t.id] = 1;
        tracks.push(t);
        added++;
      });
      if(!added){ toast('这 ' + skipped + ' 首都已经在「' + curPl().name + '」里了'); return; }
      setTracks(tracks);
      writeStore();
      renderList();
      toast('已导入 ' + added + ' 首到「' + curPl().name + '」' +
            (skipped ? '，跳过 ' + skipped + ' 首重复' : ''));
    }

    function playFail(){
      stopTimer();
      setPlaying(false);
      renderFloat();
    }

    function provOfSong(s){
      if(s && s.ne === true) return 'ne';
      if(s && s.qq === true) return 'qq';
      return prov;
    }

    function qqAddAndPlay(s, src, note){
      var p = provOfSong(s);
      var id = (p === 'ne' ? 'ne_' : 'qq_') + s.songmid;
      var exists = false;
      for(var i=0;i<d.tracks.length;i++){
        if(d.tracks[i].id === id){
          exists = true;
          if(src) d.tracks[i].src = src;
          d.tracks[i].songmid = s.songmid;
          d.tracks[i].mediaMid = s.mediaMid || s.songmid;
          break;
        }
      }
      if(!exists){
        d.tracks.push({
          id: id,
          qq: p !== 'ne',
          ne: p === 'ne',
          songmid: s.songmid,
          mediaMid: s.mediaMid || s.songmid,
          title: s.title,
          artist: s.artist,
          duration: s.duration,
          cover: img(s.cover),
          src: src
        });
      }
      writeStore();
      selectTrack(id, true);
      qqClose();
      renderList();
      toast(note || (exists ? '正在播放《' + s.title + '》' : '已加入播放列表并播放《' + s.title + '》'));
    }

    function qqPlaySong(s){
      if(!s) return;
      if(provOfSong(s) === 'ne'){ nePlaySong(s); return; }
      var probe = '/api/qq/stream?debug=1&songmid=' + encodeURIComponent(s.songmid) +
            '&mediaMid=' + encodeURIComponent(s.mediaMid || s.songmid);
      api(probe).then(function(j){
        if(j && j.ok && j.url){
          console.log('[QQ音乐] 播放地址：', j.url);
          qqAddAndPlay(s, apiUrl('/api/qq/stream?songmid=' + encodeURIComponent(s.songmid) +
                '&mediaMid=' + encodeURIComponent(s.mediaMid || s.songmid)));
          return;
        }
        var noKey = !(j && j.hasKey);
        var reason = (j && j.fileDead)
          ? '音频文件已下架'
          : (j && j.needVip)
            ? (noKey ? '需要扫码补播放凭证' : '需要 VIP 权限')
            : ('result=' + ((j && j.result) || '?'));
        toast('《' + s.title + '》' + reason + '，正在寻找可播放版本…');
        api('/api/qq/find-playable?kw=' + encodeURIComponent(s.title) +
            '&exclude=' + encodeURIComponent(s.songmid)).then(function(f){
          if(f && f.ok && f.song){
            var alt = f.song;
            alt.qq = true; alt.ne = false;
            console.log('[QQ音乐] 改用可播放版本：', alt.songmid, f.url);
            qqAddAndPlay(alt, apiUrl('/api/qq/stream?songmid=' + encodeURIComponent(alt.songmid) +
                  '&mediaMid=' + encodeURIComponent(alt.mediaMid || alt.songmid)),
                  '《' + s.title + '》原版本' + reason + '，已切换到可播放版本');
          } else {
            toast('《' + s.title + '》无法播放：' + ((f && f.error) || '没有可播放的版本'));
            playFail();
            if((j && j.needVip) && noKey) setTimeout(function(){
              qqClose();
              openLogin();
            }, 900);
          }
        }).catch(function(){
          toast('《' + s.title + '》无法播放：' + reason);
          playFail();
        });
      }).catch(function(){
        toast('《' + s.title + '》无法播放：本机服务未连接');
        playFail();
      });
    }

    function nePlaySong(s){
      api('/api/ne/stream?debug=1&id=' + encodeURIComponent(s.songmid)).then(function(j){
        if(j && j.ok && j.url){
          console.log('[网易云] 播放地址：', j.url);
          qqAddAndPlay(s, apiUrl('/api/ne/stream?id=' + encodeURIComponent(s.songmid)));
          return;
        }
        var reason = (j && j.needVip) ? '需要 VIP 或版权受限' : ('code=' + ((j && j.code) || '?'));
        toast('《' + s.title + '》' + reason + '，正在寻找可播放版本…');
        api('/api/ne/find-playable?kw=' + encodeURIComponent(s.title) +
            '&exclude=' + encodeURIComponent(s.songmid)).then(function(f){
          if(f && f.ok && f.song){
            var alt = f.song;
            alt.ne = true; alt.qq = false;
            console.log('[网易云] 改用可播放版本：', alt.songmid, f.url);
            qqAddAndPlay(alt, apiUrl('/api/ne/stream?id=' + encodeURIComponent(alt.songmid)),
                  '《' + s.title + '》原版本' + reason + '，已切换到可播放版本');
          } else {
            toast('《' + s.title + '》无法播放：' + ((f && f.error) || '没有可播放的版本'));
            playFail();
          }
        }).catch(function(){
          toast('《' + s.title + '》无法播放：' + reason);
          playFail();
        });
      }).catch(function(){
        toast('《' + s.title + '》无法播放：本机服务未连接');
        playFail();
      });
    }

    function qqPlay(idx){
      qqPlaySong(qqSongs[idx]);
    }

    qqBody.addEventListener('click', function(e){
      var t = e.target.closest('[data-qq]');
      if(!t) return;
      var act = t.getAttribute('data-qq');
      if(act === 'out'){
        api('/api/' + prov + '/logout', { method:'POST' }).then(function(){
          setProfile(null);
          qqLists = []; qqSongs = []; qqSearchSongs = [];
          toast('已退出' + provName());
          qqClose();
          openLogin();
        }).catch(function(){ toast('退出失败'); });
      } else if(act === 'pl'){
        qqLoadSongs(t.getAttribute('data-id'));
      } else if(act === 'album'){
        qqLoadAlbum(t.getAttribute('data-id'));
      } else if(act === 'song'){
        qqPlay(parseInt(t.getAttribute('data-idx'), 10));
      } else if(act === 'sr'){
        qqPlaySong(qqSearchSongs[parseInt(t.getAttribute('data-idx'), 10)]);
      } else if(act === 'importall'){
        qqImportAll();
      } else if(act === 'back'){
        qqLoadLists();
      } else if(act === 'reload'){
        qqLoadLists();
      } else if(act === 'cookie'){
        qqClose();
        openLogin();
      }
    });

    avatarEl.onclick = function(){ qqOpen(); };
    qqBackEl.onclick = function(){ qqClose(); };
    qqView.addEventListener('click', function(e){ if(e.target === qqView) qqClose(); });
    if(loginX) loginX.onclick = function(){ closeLogin(); };
    if(loginMask) loginMask.addEventListener('click', function(e){
      if(e.target === loginMask) closeLogin();
    });

    attachHooks();
    renderNow();
    renderList();
    setPlaying(playing);
    ensureBridge().then(function(ok){
      if(!ok) return;
      probeProviders().then(function(st){
        if(!st) return;
        var q = (st.qq && st.qq.loggedIn) ? st.qq : null;
        var n = (st.ne && st.ne.loggedIn) ? st.ne : null;
        if(q && n) setProfile((n.loginTime || 0) > (q.loginTime || 0) ? n.profile : q.profile);
        else if(q) setProfile(q.profile);
        else if(n) setProfile(n.profile);
      }).catch(function(){});
    });

    var guard = setInterval(function(){
      if(!app.isConnected){ uiOn = false; qqStopPoll(); clearInterval(guard); }
    }, 1000);

  };

  if(!document.getElementById('phoneScreen')){
    document.body.setAttribute('data-mu-standalone', '1');
    if(window.mountMusicApp) window.mountMusicApp(document, null, null);
  }
})();
</script>
</body>
</html>
