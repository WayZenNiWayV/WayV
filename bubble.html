<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>泡泡 bubble</title>
<style>
.bb-app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#f6f2fb;font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;color:#1b1b21;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;letter-spacing:.01em}
.bb-app *{box-sizing:border-box;margin:0;padding:0}
.bb-app ::-webkit-scrollbar{display:none}
.bb-view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:5}
.bb-view.on{transform:translateX(0)}
.bb-view.bb-noanim{transition:none}
.bb-list{transform:none;z-index:1;background:linear-gradient(180deg,#dcd0f7 0%,#ebe3fa 12%,#f8f4fe 24%,#fdfcff 34%,#fff 44%,#fff 100%)}
.bb-settings-view,.bb-album-view{z-index:6;background:#fff}
.bb-ic{flex:none;width:36px;height:36px;border:none;background:transparent;color:#1b1b21;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:50%}
.bb-ic svg{width:21px;height:21px;display:block}
.bb-ic:active{opacity:.5}
.bb-ic.on{color:#8a5cf6}
.bb-fav-btn.on{color:#ffc93c}
.bb-fav-btn.on svg path{fill:#ffc93c;stroke:#ffc93c}
.bb-list-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--safe-top,0px)) 12px 4px 22px}
.bb-brand{font-family:Georgia,"Times New Roman",serif;font-size:30px;letter-spacing:.05em;color:#4a3570;line-height:1.1;text-shadow:0 1px 2px rgba(255,255,255,.6)}
.bb-head-tools{display:flex;align-items:center;gap:0}
.bb-list-head .bb-ic{color:#4a3570}
.bb-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.bb-sec-title{font-size:12px;letter-spacing:.14em;color:rgba(70,52,110,.62);padding:20px 22px 8px}
.bb-empty{font-size:12px;color:rgba(70,52,110,.5);padding:6px 22px 10px;letter-spacing:.05em}
.bb-room{display:flex;align-items:center;gap:13px;padding:8px 20px;cursor:pointer}
.bb-room:active{background:rgba(255,255,255,.55)}
.bb-av{flex:none;border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,"Songti SC",serif;background:#cbb7f0}
.bb-av img{width:100%;height:100%;object-fit:cover;display:block}
.bb-room-main{flex:1;min-width:0}
.bb-room-name{font-size:17px;letter-spacing:.02em;color:#1b1b21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(255,255,255,.35)}
.bb-room-sub{font-size:12px;color:rgba(38,26,64,.52);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-room-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px}
.bb-room-date{font-size:11px;color:rgba(38,26,64,.42)}
.bb-badge{min-width:17px;height:17px;border-radius:9px;background:#8a5cf6;color:#fff;font-size:10px;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bb-divider{height:1px;background:rgba(120,100,160,.16);margin:14px 20px}
.bb-chat-head{flex:none;background:#fff;padding:calc(4px + var(--safe-top,0px)) 2px 0;border-radius:0 0 16px 16px;box-shadow:0 2px 12px rgba(70,50,110,.06);position:relative;z-index:3}
.bb-chat-top{display:flex;align-items:center;height:44px;padding:0 2px}
.bb-chat-title{flex:1;min-width:0;text-align:center;font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#16161b}
.bb-sub-line{display:flex;align-items:center;justify-content:center;gap:5px;padding:1px 0 10px}
.bb-sub-txt{font-size:11px;color:#b6b0c1;letter-spacing:.04em}
.bb-sub-txt.on{font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;color:#1b1b21}
.bb-sub-txt.on .bb-logo{font-style:italic}
.bb-heart{width:14px;height:14px;flex:none}
.bb-heart path{fill:#d3cddd}
.bb-heart.grad path{fill:url(#bbhg)}
.bb-heart.beat{animation:bbBeat .92s ease-in-out infinite;transform-origin:50% 60%;filter:drop-shadow(0 0 4px rgba(255,138,194,.75))}
@keyframes bbBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.24)}36%{transform:scale(.96)}54%{transform:scale(1.14)}}
.bb-chat-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 12px 4px;background:linear-gradient(180deg,#e9e4f3,#f0ebf8 55%,#f5f0fc);background-size:cover;background-position:center}
.bb-day{text-align:center;font-size:11px;color:#9d95ab;letter-spacing:.06em;margin:14px 0 12px}
.bb-msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;max-width:100%}
.bb-msg.me{flex-direction:row-reverse}
.bb-msg-col{display:flex;flex-direction:column;max-width:78%;min-width:0}
.bb-msg.ai .bb-msg-col{align-items:flex-start}
.bb-msg.me .bb-msg-col{align-items:flex-end}
.bb-msg-av{width:34px;height:34px;border-radius:50%;font-size:13px}
.bb-msg.ai .bb-msg-av{box-shadow:0 0 0 2px #fff,0 0 0 4px #b98bf5}
.bb-msg-name{display:flex;align-items:center;gap:5px;font-size:11px;color:#8d8599;margin:0 0 4px 2px;max-width:100%}
.bb-msg-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-artist-pill{flex:none;font-family:-apple-system,"Helvetica Neue",sans-serif;font-size:8px;font-weight:700;letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#a05cff,#c27bff);padding:2px 6px;border-radius:8px;line-height:1.3}
.bb-bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap;max-width:100%;text-align:left;font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
.bb-bubble.ai{background:#fff;color:#232029;box-shadow:0 1px 3px rgba(80,60,120,.07)}
.bb-bubble.me{background:#a98cf0;color:#fff;box-shadow:0 1px 4px rgba(120,80,200,.18)}
.bb-bubble.bb-bub-media{padding:4px;background:#fff;overflow:hidden;position:relative}
.bb-bubble.bb-bub-media.me{background:#a98cf0}
.bb-media{display:block;max-width:100px;width:100%;border-radius:9px}
.bb-media.vid{max-width:100px}
.bb-fav-star{position:absolute;top:4px;right:4px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(30,24,45,.42);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:2}
.bb-fav-star svg{width:11px;height:11px}
.bb-fav-star.on{color:#ffc93c}
.bb-fav-star.on svg path{fill:#ffc93c;stroke:#ffc93c}
.bb-voice-fav{flex:none;width:20px;height:20px;border:none;background:transparent;color:inherit;opacity:.55;display:flex;align-items:center;justify-content:center;padding:0;margin-left:2px;cursor:pointer}
.bb-voice-fav svg{width:14px;height:14px}
.bb-voice-fav.on{opacity:1;color:#ffc93c}
.bb-voice-fav.on svg path{fill:#ffc93c;stroke:#ffc93c}
.bb-msg-time{font-size:10px;color:#a49db2;margin-top:4px;font-family:-apple-system,sans-serif}
.bb-voice{display:flex;align-items:center;gap:8px;min-width:96px;cursor:pointer}
.bb-voice .bb-vw{display:flex;align-items:flex-end;gap:2px;height:16px}
.bb-voice .bb-vw i{display:block;width:2px;background:currentColor;border-radius:2px;opacity:.55;height:6px}
.bb-voice.playing .bb-vw i{animation:bbwave .7s ease-in-out infinite alternate}
.bb-voice .bb-vw i:nth-child(2){animation-delay:.12s;height:12px}
.bb-voice .bb-vw i:nth-child(3){animation-delay:.24s;height:9px}
.bb-voice .bb-vw i:nth-child(4){animation-delay:.36s;height:14px}
.bb-voice .bb-vw i:nth-child(5){animation-delay:.48s;height:7px}
@keyframes bbwave{from{transform:scaleY(.5)}to{transform:scaleY(1.5)}}
.bb-voice .bb-dur{font-size:12px;font-family:-apple-system,sans-serif}
.bb-voice-wrap{display:flex;flex-direction:column;gap:3px;max-width:100%}
.bb-msg.ai .bb-voice-wrap{align-items:flex-start}
.bb-msg.me .bb-voice-wrap{align-items:flex-end}
.bb-voice-trans{font-size:11px;color:#9a92a8;padding:1px 3px;cursor:pointer;letter-spacing:.02em;user-select:none}
.bb-voice-trans:active{opacity:.55}
.bb-voice-txt{display:none;max-width:214px;padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.9);color:#5f5870;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(80,60,120,.07)}
.bb-voice-txt.on{display:block}
.bb-hl{background:#ffe9a8;color:inherit;border-radius:3px}
.bb-read{flex:none;align-self:flex-end;font-size:10px;line-height:1;color:#9c93ae;font-family:-apple-system,"Helvetica Neue",sans-serif;margin:0 1px 7px 0;letter-spacing:0;transition:opacity .5s ease,transform .5s ease}
.bb-read.bb-read-in{animation:bbReadIn .42s cubic-bezier(.34,1.56,.64,1) both}
.bb-read.bb-read-out{animation:bbReadOut 1.15s ease forwards}
@keyframes bbReadIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes bbReadOut{0%{opacity:1;transform:scale(1)}22%{opacity:.75;transform:scale(1.18)}55%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(.72)}}
.bb-quote{display:block;font-size:11px;line-height:1.55;color:#a29ab0;border-left:2px solid #e0d9ee;padding:1px 0 1px 7px;margin:0 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-vidplay{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;color:#5b4a7a;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
.bb-vidplay svg{width:9px;height:9px;margin-left:1px}
.bb-vdur{position:absolute;right:5px;bottom:4px;font-size:8px;color:#fff;font-family:-apple-system,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.55);pointer-events:none}
.bb-mv{position:absolute;inset:0;background:#000;z-index:43;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s}
.bb-mv.on{opacity:1;pointer-events:auto}
.bb-mv-top{flex:none;display:flex;align-items:center;padding:calc(6px + var(--safe-top,0px)) 6px 0;color:#fff}
.bb-mv-top .bb-spacer{flex:1}
.bb-mv-top .bb-ic{color:#fff}
.bb-mv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:4px 0 0}
.bb-mv-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.bb-mv-play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:opacity .22s,transform .22s}
.bb-mv-play svg{width:21px;height:21px;margin-left:2px}
.bb-mv-play.off{opacity:0;pointer-events:none;transform:scale(.9)}
.bb-mv-bar{flex:none;height:2px;background:rgba(255,255,255,.18);display:none;margin:0 14px 2px}
.bb-mv-bar.on{display:block}
.bb-mv-desc{flex:none;display:none;max-height:32%;overflow-y:auto;padding:2px 20px 12px;font-size:12.5px;line-height:1.72;color:rgba(255,255,255,.94);white-space:pre-wrap;word-break:break-word;font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif}
.bb-mv-desc.on{display:block}
.bb-mv-prog{height:100%;width:0;background:#fff;transition:width .12s linear}
.bb-mv-foot{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px calc(18px + var(--safe-bottom,0px))}
.bb-mv-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#d9cff2;flex:none}
.bb-mv-av img{width:100%;height:100%;object-fit:cover;display:block}
.bb-mv-meta{flex:1;min-width:0}
.bb-mv-name{font-size:13px;color:#fff;letter-spacing:.02em}
.bb-mv-time{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;font-family:-apple-system,sans-serif}
.bb-input-bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + var(--safe-bottom,0px));background:#fff;box-shadow:0 -2px 12px rgba(70,50,110,.05)}
.bb-input-wrap{flex:1;min-width:0;display:flex;align-items:center;background:#f2f0f6;border-radius:20px;padding:0 6px 0 14px;height:40px}
.bb-input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14px;font-family:inherit;color:#1b1b21}
.bb-input::placeholder{color:#b3acbf}
.bb-emoji-btn{width:30px;height:30px}
.bb-emoji-btn svg{width:20px;height:20px;color:#8b8496}
.bb-send{flex:none;width:36px;height:36px;border:none;background:transparent;color:#b6afc2;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bb-send svg{width:22px;height:22px}
.bb-send.act{color:#8a5cf6}
.bb-lock-tip{position:absolute;left:50%;bottom:calc(60px + var(--safe-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:9px;max-width:calc(100% - 28px);padding:8px 16px 8px 9px;border-radius:22px;background:#fff;box-shadow:0 5px 20px rgba(70,50,110,.16);z-index:4;cursor:pointer;white-space:nowrap}
.bb-lock-tip.on{display:flex}
.bb-lock-ic{flex:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#a05cff,#c27bff);color:#fff;display:flex;align-items:center;justify-content:center}
.bb-lock-ic svg{width:14px;height:14px}
.bb-lock-txt{font-size:12px;color:#3b3546;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.bb-limit-tip{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:11px;padding:18px 22px;border-radius:16px;background:rgba(58,52,70,.8);box-shadow:0 10px 30px rgba(30,20,50,.3);z-index:29;pointer-events:none}
.bb-limit-tip.on{display:flex}
.bb-limit-ic{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #ff6b6b;color:#ff6b6b;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Helvetica Neue",sans-serif;font-size:21px;font-weight:600;line-height:1}
.bb-limit-txt{color:#fff;font-size:13px;line-height:1.65;letter-spacing:.03em;text-align:center}
.bb-drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .28s;z-index:20}
.bb-drawer-mask.on{opacity:1;pointer-events:auto}
.bb-drawer{position:absolute;top:0;right:0;bottom:0;width:78%;background:#fff;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:21;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(40,30,70,.12)}
.bb-drawer.on{transform:translateX(0)}
.bb-drawer-top{flex:none;display:flex;align-items:center;padding:calc(8px + var(--safe-top,0px)) 6px 4px}
.bb-drawer-top .bb-spacer{flex:1}
.bb-drawer-body{flex:1;min-height:0;overflow-y:auto;padding:8px 0 0}
.bb-drow{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer}
.bb-drow:active{background:#faf8fd}
.bb-drow .bb-av{width:44px;height:44px;font-size:16px}
.bb-drow-artist{cursor:default}
.bb-drow-artist .bb-av{box-shadow:0 0 0 2px #fff,0 0 0 4px #b98bf5}
.bb-drow-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.bb-drow-name{font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;letter-spacing:.02em;color:#17171c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-drow-sub{font-size:10px;color:#a9a2b5}
.bb-artist-badge{align-self:flex-start;font-family:-apple-system,"Helvetica Neue",sans-serif;font-size:8px;font-weight:700;letter-spacing:.08em;color:#fff;background:linear-gradient(90deg,#9a4df8,#c77dff);padding:2px 7px;border-radius:8px}
.bb-artist-line{display:flex;align-items:center;gap:6px;min-width:0}
.bb-artist-line .bb-drow-name{min-width:0}
.bb-box-card{margin:16px 16px 0;padding:16px 18px;border-radius:12px;background:#f3edfd;display:flex;align-items:center;gap:12px;cursor:pointer}
.bb-box-card:active{background:#ece4fc}
.bb-box-ic{width:26px;height:26px;flex:none}
.bb-box-txt{font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.1em;color:#1d1a24}
.bb-drawer-bottom{flex:none;display:flex;align-items:center;gap:10px;padding:12px 20px calc(14px + var(--safe-bottom,0px));border-top:1px solid #f3f0f7}
.bb-dbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border:none;border-radius:12px;background:#f5f1fd;color:#7c4dff;font-family:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer}
.bb-dbtn:active{background:#ece4fb}
.bb-dbtn svg{width:18px;height:18px}
.bb-prof-view{z-index:26;background:#9d9d9d}
.bb-prof-bg{position:absolute;inset:0;background:#9d9d9d center/cover no-repeat}
.bb-prof-top{position:relative;z-index:2;display:flex;align-items:center;padding:calc(10px + var(--safe-top,0px)) 8px 0}
.bb-prof-top .bb-ic{color:#fff}
.bb-prof-top .bb-spacer{flex:1}
.bb-prof-mid{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:16vh}
.bb-prof-av{width:116px;height:116px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#d9cff2;color:#fff;font-size:40px;font-family:Georgia,serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.bb-prof-av img{width:100%;height:100%;object-fit:cover;display:block}
.bb-prof-name{margin-top:22px;font-size:16px;color:#fff;letter-spacing:.1em;cursor:pointer;font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei",sans-serif;text-shadow:0 1px 4px rgba(0,0,0,.22);max-width:76%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-prof-hint{margin-top:26px;font-size:10px;color:rgba(255,255,255,.62);letter-spacing:.12em}
.bb-set-head{flex:none;display:flex;align-items:center;gap:4px;padding:calc(8px + var(--safe-top,0px)) 6px 6px 8px}
.bb-set-title{font-family:"SimHei","黑体","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;font-size:19px;letter-spacing:.05em;color:#16161b}
.bb-set-scroll{flex:1;min-height:0;overflow-y:auto;padding-top:4px}
.bb-set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 22px;cursor:pointer}
.bb-set-row:active{background:#fbf9fd}
.bb-set-col{flex-direction:column;align-items:stretch;gap:8px}
.bb-set-col .bb-set-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bb-set-label{font-size:15px;color:#1b1b21;letter-spacing:.02em}
.bb-set-val{display:flex;align-items:center;gap:4px;font-size:14px;color:#8a5cf6;max-width:58%;min-width:0}
.bb-set-val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-set-val .bb-chev{color:#c3bccd;font-family:-apple-system,sans-serif;font-size:16px;line-height:1}
.bb-set-val.off{color:#c3bccd}
.bb-set-hint{font-size:11px;color:#b0a9bb;letter-spacing:.03em;line-height:1.6}
.bb-sub-card{margin:14px 18px 2px;padding:17px 18px 16px;border-radius:16px;background:linear-gradient(150deg,#f8f3ff 0%,#efe6ff 55%,#f7f1ff 100%);border:1px solid #ece2fb}
.bb-sub-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bb-sub-name{font-size:14px;color:#2b2536;letter-spacing:.08em}
.bb-sub-tag{flex:none;font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:9px;background:#7c4dff;color:#fff}

async function ctxAction(act){
  const id=els.ctx.dataset.mid;
  const m=msgById(id);
  hideCtx();
  if(!m||!current)return;
  const s=data.rooms[current];
  if(act==='copy'){copyText(m.text||'');return;}
  if(act==='del'){
    const ok=await P.modal({title:'删除这条消息',fields:[],onOk:()=>true});
    if(!ok)return;
    s.msgs=s.msgs.filter(x=>x.id!==m.id);
    save();renderChat(false);renderList();renderBox();
    toast('已删除');
    return;
  }
  if(act==='edit'){
    editId=m.id;
    els.input.value=m.text||'';
    els.input.focus();
    updateSend();
    toast('修改后点击发送');
    return;
  }
  if(act==='retry'){
    if(m.from==='ai'){
      if(!subActive(current)){showLockTip();return;}
      const r=ROOM_BY[current];
      s.msgs=s.msgs.filter(x=>x.id!==m.id);
      save();renderChat(false);
      const reply=await genReply(r,s);
      if(!reply.text){
        s.msgs.push(m);s.msgs.sort((a,b)=>(a.at||0)-(b.at||0));
        save();renderChat(false);toast('AI 没有返回内容');
        return;
      }
      s.msgs.push({id:uid(),from:'ai',type:'text',text:reply.text,at:Date.now(),quote:reply.quote||undefined});
      save();renderChat(true);renderList();
    }else{
      if(!canSend())return;
      s.sent=(s.sent||0)+1;
      pushMsg(current,{id:uid(),from:'me',type:'text',text:m.text,at:Date.now()});
      afterMyMsg();
    }
    return;
  }
  if(act==='box'){
    toggleBox(m.id);
    return;
  }
  if(act==='trans'){
    openSheet('翻译',`<div class="bb-trans-src">${esc(m.text||'')}</div><div class="bb-trans-out">${esc(translateText(m.text||''))}</div>`);

function raceTimeout(p,ms,fallback){
  return new Promise(resolve=>{
    let done=false;
    const t=setTimeout(()=>{if(done)return;done=true;resolve(fallback);},ms);
    Promise.resolve(p).then(v=>{
      if(done)return;done=true;clearTimeout(t);resolve(v);
    },()=>{
      if(done)return;done=true;clearTimeout(t);resolve(fallback);
    });
  });
}
function normTxt(x){return String(x||'').replace(/[\s，。！？、,.!?~～…:：；;""''（）()\[\]]/g,'');}
function matchQuote(s,q){
  const nq=normTxt(q);
  if(nq.length<2)return '';
  const cands=s.msgs.filter(m=>m.from==='me'&&m.type==='text'&&m.text);
  for(let i=cands.length-1;i>=0;i--){
    const ns=normTxt(cands[i].text);
    if(ns.length<2)continue;
    if(ns.indexOf(nq)>-1||nq.indexOf(ns)>-1){
      return String(cands[i].text).replace(/\n/g,' ').trim().slice(0,26);
    }
  }
  return '';
}
function parseReply(txt,s){
  const body=String(txt||'').trim();
  if(!body)return {text:'',quote:''};
  const m=body.match(/\{[\s\S]*\}/);
  if(m){
    try{
      const o=JSON.parse(m[0]);
      const text=String(o.reply||o.text||'').trim().slice(0,220);
      if(text)return {text,quote:matchQuote(s,o.quote)};
    }catch(e){}
  }
  return {text:body.slice(0,220),quote:''};
}
async function genReply(r,s){
  const hist=s.msgs.slice(-16).map(m=>({role:m.from==='me'?'user':'assistant',content:previewText(m)}));
  const sys=[
    bubbleRole(r),
    nameHint(s),
    '回复要像手机消息，1到2句，口语化，像只对她一个人说话，不要动作描写，不要括号，不要旁白。',
    '只输出一个JSON对象，不要解释、不要markdown：{"reply":"你的回复","quote":"可选"}。',
    'quote 规则（非常重要）：',
    '1) 只有当你在直接回答她某一条具体的消息时才填 quote；',
    '2) quote 必须是她那条消息里的原话片段，10到18字，不能改写、不能拼接；',
    '3) reply 的内容必须真的在回应 quote 里问的那件事，比如她问「今天在干什么」，就答「今天在练习室排新歌」这类具体内容；',
    '4) 如果 reply 和她的消息没有直接对应关系（比如你只是在说自己的事、只是打招呼、只是随口感慨），就绝对不要输出 quote 字段。',
    '5) 必须顺着你们刚才聊的那件事往下说，不要突然换话题。'
  ].join('');
  const msgs=[{role:'system',content:sys}].concat(hist);
  for(let attempt=0;attempt<2;attempt++){
    try{
      const p=P.chatWithAI(msgs);
      const txt=await raceTimeout(p,35000,'');
      const out=parseReply(txt,s);
      if(out.text)return out;
    }catch(e){}
  }
  return {text:'',quote:''};
}
function fastRead(key,minMs,maxMs){
  const s=data.rooms[key];
  if(!s||!hasUnread(key))return;
  const t=Date.now()+minMs+Math.random()*(maxMs-minMs);
  if(!s.readAt||s.readAt>t){s.readAt=t;save();}
}
async function checkDue(){
  if(!data)return;
  for(const r of ROOMS){
    if(!subActive(r.key))continue;
    const s=data.rooms[r.key];
    if(s.push&&s.push.on){fastRead(r.key,3000,25000);continue;}
    if(!s.nextAt||s.nextAt>Date.now())continue;
    const last=s.msgs[s.msgs.length-1];
    if(!last||last.from!=='me'){
      s.nextAt=Date.now()+gapMs(r);save();continue;
    }
    const reply=await genReply(r,s);
    if(!reply.text){s.nextAt=Date.now()+gapMs(r);save();continue;}
    const at=Date.now();
    markReadSilent(r.key);
    s.msgs.push({id:uid(),from:'ai',type:'text',text:reply.text,at,quote:reply.quote||undefined});
    s.lastAt=at;
    s.sent=0;
    s.nextAt=at+gapMs(r);
    if(!(chatOpen&&current===r.key))s.unread=(s.unread||0)+1;
    save();renderList();
    if(chatOpen&&current===r.key)renderChat(true);
    if(!(chatOpen&&current===r.key)){try{P.toast(r.artist+' 来泡泡了');}catch(e){}}
  }
}

function hexToAudioUrl(hex){
  try{
    const h=String(hex||'');let bin='';
    for(let i=0;i<h.length;i+=2)bin+=String.fromCharCode(parseInt(h.substr(i,2),16));
    return 'data:audio/mpeg;base64,'+btoa(bin);
  }catch(e){return '';}
}
function voiceClean(raw){
  return String(raw||'')
    .replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'')
    .replace(/[~～]/g,'，')
    .replace(/\s+/g,' ')
    .trim();
}
function mmTTS(text,key){
  const t=voiceClean(text).slice(0,220);
  if(!t)return Promise.resolve('');
  const vid=artistVoiceId(key);
  const ck=vid+'|'+t;
  if(MM_TASK[ck])return MM_TASK[ck];
  const p=(async()=>{
    const cfg=mmCfg();
    if(!cfg.apiKey)return '';
    const base=String(cfg.baseUrl||'https://api.minimaxi.com').trim().replace(/\/+$/,'');
    const model=(/t2s/i.test(String(cfg.model||''))||!cfg.model)?'speech-02-turbo':cfg.model;
    const gid=String(cfg.groupId||'').trim();
    const qs=gid?'?GroupId='+encodeURIComponent(gid):'';
    try{
      const res=await fetch(`${base}/v1/t2a_v2${qs}`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
        body:JSON.stringify({
          model,text:t,stream:false,
          voice_setting:{voice_id:vid,speed:Number(cfg.speed)||1.0,vol:1,pitch:0},
          audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1},
          output_format:'hex'
        })
      });
      if(!res.ok)return '';
      const json=await res.json();
      const br=(json&&json.base_resp)||{};
      if(br.status_code&&br.status_code!==0)return '';
      const d=(json&&json.data)||{};
      return d.audio?hexToAudioUrl(d.audio):(d.audio_url||'');
    }catch(e){return '';}
  })();
  MM_TASK[ck]=p;
  return p;
}

/* ---------- 文字图片 ---------- */
function lum(hex){
  const s=String(hex||'').replace('#','');
  const r=parseInt(s.slice(0,2),16),g=parseInt(s.slice(2,4),16),b=parseInt(s.slice(4,6),16);
  if(isNaN(r))return .7;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function tiWrap(ctx,text,maxW){
  const lines=[];
  String(text||'').split('\n').forEach(par=>{
    let line='';
    for(const ch of par){
      if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch;}
      else line+=ch;
    }
    lines.push(line);
  });
  return lines;
}
function textImage(desc,kind){
  return new Promise(resolve=>{
    try{
      const W=520,H=694,PAD=52;
      const c=document.createElement('canvas');c.width=W;c.height=H;
      const ctx=c.getContext('2d');
      const set=TI_THEMES[String(kind||'').toLowerCase()]||TI_THEMES.selfie;
      const pal=set[Math.floor(Math.random()*set.length)];
      const g=ctx.createLinearGradient(0,0,W*0.7,H);
      g.addColorStop(0,pal[0]);g.addColorStop(.58,pal[1]);g.addColorStop(1,pal[2]);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      const rg=ctx.createRadialGradient(W*.26,H*.18,8,W*.26,H*.18,W*.95);
      rg.addColorStop(0,'rgba(255,255,255,.36)');rg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
      const dark=lum(pal[1])<.55;
      const font=s=>s+'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      const txt=String(desc||'').trim();
      let fs=26,lines=[],lh=0,maxW=W-PAD*2;
      const maxH=H-PAD*2-28;
      for(;fs>=14;fs--){
        ctx.font=font(fs);
        lh=Math.round(fs*1.8);
        lines=tiWrap(ctx,txt,maxW);
        if(lines.length*lh<=maxH)break;
      }
      if(lines.length*lh>maxH){
        const keep=Math.max(1,Math.floor(maxH/lh));
        const cut=lines.slice(0,keep);
        let last=cut[keep-1]||'';
        while(last.length>1&&ctx.measureText(last+'…').width>maxW)last=last.slice(0,-1);
        cut[keep-1]=last+'…';
        lines=cut;
      }
      ctx.fillStyle=dark?'rgba(255,255,255,.95)':'rgba(44,34,48,.9)';
      ctx.textAlign='left';ctx.textBaseline='top';
      const top=Math.max(PAD,(H-lines.length*lh)/2);
      lines.forEach((ln,i)=>ctx.fillText(ln,PAD,top+i*lh));
      const d=new Date();
      ctx.font=font(12);
      ctx.fillStyle=dark?'rgba(255,255,255,.42)':'rgba(44,34,48,.4)';
      ctx.fillText(`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}`,PAD,H-PAD+18);
      resolve(c.toDataURL('image/jpeg',0.78));
    }catch(e){resolve('');}
  });
}

/* ---------- 主动发泡泡 ---------- */
function pushGap(mode,inner){
  if(inner){
    if(mode==='burst')return 6000+Math.random()*16000;
    if(mode==='slow')return 45000+Math.random()*110000;
    return 18000+Math.random()*50000;
  }
  const r=Math.random();
  if(r<.32)return 120000+Math.random()*360000;
  if(r<.72)return 480000+Math.random()*1020000;
  return 1500000+Math.random()*2700000;
}
function planBatch(key){
  const s=data.rooms[key];
  const p=s.push;
  const now=Date.now();
  let t=now+5000+Math.random()*15000;
  let left=2+Math.floor(Math.random()*3);
  p.sched=[];
  p.batch.forEach((it,i)=>{
    if(i>0){
      if(left<=0){t+=pushGap(p.mode,false);left=2+Math.floor(Math.random()*3);}
      else t+=pushGap(p.mode,true);
    }
    left--;
    p.sched.push(t);
  });
  const end=p.until?p.until-40000:0;
  if(end&&p.sched.length&&p.sched[p.sched.length-1]>end){
    const span=p.sched[p.sched.length-1]-now;
    const room=Math.max(50000,end-now);
    const k=room/span;
    p.sched=p.sched.map(x=>now+Math.round((x-now)*k));
  }
  p.limit=p.count+p.batch.length;
}

function startPush(key,auto){
  const s=data.rooms[key];
  if(!s||!subActive(key))return;
  const rnd=Math.random();
  s.push.on=true;
  s.push.auto=!!auto;
  s.push.mode=rnd<.4?'burst':(rnd<.78?'mid':'slow');

function autoGap(){
  let g;
  const r=Math.random();
  if(r<.30)g=150000+Math.random()*450000;
  else if(r<.64)g=900000+Math.random()*2400000;
  else if(r<.88)g=3300000+Math.random()*6900000;
  else g=9000000+Math.random()*18000000;
  const h=new Date().getHours();
  if(h>=1&&h<7)g*=2.2;
  return Math.round(g);
}

async function genPushBatch(key){
  const s=data.rooms[key];
  const hist=s.msgs.slice(-18).map(m=>({role:m.from==='me'?'user':'assistant',content:previewText(m)}));
  const sys=buildPushSys(key);
  const msgs=[{role:'system',content:sys}].concat(hist);
  msgs.push({role:'user',content:'现在开始分享我的日常吧，直接给JSON。'});
  for(let attempt=0;attempt<2;attempt++){
    let txt='';
    try{
      const p=P.chatWithAI(msgs);
      txt=await raceTimeout(p,50000,'');
    }catch(e){txt='';}
    const body=String(txt||'');
    const m=body.match(/\{[\s\S]*\}/);
    if(!m)continue;
    let obj=null;
    try{obj=JSON.parse(m[0]);}catch(e){continue;}
    const arr=(obj&&Array.isArray(obj.items))?obj.items:[];
    const list=arr.map(it=>{
      const kind=['text','selfie','scenery','food','object','video','voice'].includes(it.kind)?it.kind:'text';
      const img=['selfie','scenery','food','object'].includes(it.img)?it.img:(kind==='video'?'scenery':kind);
      return {
        kind,
        text:String(it.text||'').trim().slice(0,180),
        img,
        desc:String(it.desc||it.caption||it.text||'').trim().slice(0,180),
        place:String(it.place||'').slice(0,20),
        quote:String(it.quote||'').trim().slice(0,40),
        video:kind==='video',
        dur:Math.max(3,Math.min(14,Math.round(Number(it.dur)||0)||(3+Math.floor(Math.random()*6))))
      };
    }).filter(it=>it.kind==='text'?it.text:(it.desc||it.text));
    if(list.length>=3)return balanceBatch(list);
  }
  return [];
}
function balanceBatch(list){
  const isPic=it=>['selfie','scenery','food','object'].includes(it.kind);
  const maxPic=Math.random()<.35?1:2;
  const maxVideo=Math.random()<.28?1:0;
  const maxVoice=Math.random()<.4?1:0;
  let pic=0,video=0,voice=0;
  const keep=[];
  list.forEach(it=>{
    if(isPic(it)){
      if(pic>=maxPic)return;
      pic++;
    }else if(it.kind==='video'){
      if(video>=maxVideo)return;
      video++;
    }else if(it.kind==='voice'){
      if(voice>=maxVoice)return;
      voice++;
    }
    keep.push(it);
  });
  if(!keep.some(it=>it.kind==='text'))return list;
  return keep;
}
async function makePushMsg(key,item){
  const id=uid();
  const at=Date.now();
  if(item.kind==='voice'){
    return {id,from:'ai',type:'voice',text:item.text||item.desc,dur:item.dur||4,at};
  }
  if(item.video||item.kind==='video'){
    const url=await textImage(item.desc||item.text,item.img||'scenery');
    return {id,from:'ai',type:'video',url,tv:true,dur:9+Math.floor(Math.random()*31),desc:item.desc||item.text,at};
  }
  if(item.kind!=='text'){
    const url=await textImage(item.desc||item.text,item.img||item.kind);
    return {id,from:'ai',type:'image',url,tv:true,desc:item.desc||item.text,at};
  }
  return {id,from:'ai',type:'text',text:item.text||item.desc,at};
}
async function pushTick(){
  if(!data)return;
  for(const r of ROOMS){
    const s=data.rooms[r.key];
    if(!s.push||!s.push.on)continue;
    if(!subActive(r.key)){stopPush(r.key,true);continue;}
    if(!s.push.until)s.push.until=Date.now()+600000;
    if(s.push.until&&Date.now()>=s.push.until){
      stopPush(r.key,true);
      if(chatOpen&&current===r.key)toast('TA 下线了');
      continue;
    }
    const dueNow=s.push.batch.length&&s.push.sched&&s.push.sched.length&&s.push.sched[0]<=Date.now();
    if(!dueNow){
      const sentAt=s.push.lastSendAt||0;
      const lastMe=s.msgs.filter(m=>m.from==='me').slice(-1)[0];
      const ref=sentAt?Math.max(sentAt,lastMe?lastMe.at:0):0;
      const idleMs=s.push.mode==='burst'?150000:(s.push.mode==='slow'?420000:270000);
      const startAt=s.push.startAt||0;
      const dead=ref?(Date.now()-ref>idleMs):(startAt&&Date.now()-startAt>210000);
      if(dead){
        stopPush(r.key,true);
        if(chatOpen&&current===r.key)toast('TA 下线了');
        continue;
      }
    }
    if(hasUnread(r.key))fastRead(r.key,4000,20000);
    if(PUSH_BUSY[r.key])continue;
    PUSH_BUSY[r.key]=true;
    try{
      if(!s.push.batch.length){
        let arr=[];
        try{arr=await genPushBatch(r.key);}catch(e){arr=[];}
        if(!s.push.on)break;
        if(!arr.length){
          if(!s.push.warned){
            s.push.warned=true;save();
            if(!s.push.auto)toast(apiReady()?'AI 没有返回内容':'未配置 AI');
          }
          stopPush(r.key,true);
          continue;
        }
        s.push.batch=arr;
        if(s.push.auto&&s.push.batch.length>4)s.push.batch=s.push.batch.slice(0,3+Math.floor(Math.random()*2));
        planBatch(r.key);
        save();
      }
      if(s.push.batch.length&&(!s.push.sched||!s.push.sched.length))planBatch(r.key);
      let sent=0,added=false;
      while(s.push.batch.length&&s.push.sched&&s.push.sched.length&&s.push.sched[0]<=Date.now()&&sent<4&&(!s.push.until||Date.now()<s.push.until)){
        const item=s.push.batch.shift();
        const when=s.push.sched.shift();
        const msg=await makePushMsg(r.key,item);
        if(!s.push.on||!subActive(r.key))break;
        msg.at=when||Date.now();
        if(msg.type==='text'&&item.quote){
          const q=matchQuote(s,item.quote);
          if(q)msg.quote=q;
        }
        s.msgs.push(msg);
        added=true;
        s.lastAt=msg.at;
        s.push.lastSendAt=Date.now();
        s.sent=0;
        if(!(chatOpen&&current===r.key))s.unread=(s.unread||0)+1;
        s.push.count=(s.push.count||0)+1;
        sent++;
      }
      if(sent||added){
        markReadSilent(r.key);
      }
      const stopAt=s.push.stopAt||0;
      const done=(stopAt&&s.push.count>=stopAt)||(s.push.count>=s.push.limit&&!s.push.batch.length);
      if(done){
        const last=s.msgs[s.msgs.length-1];
        if(s.push.auto&&last&&last.from==='me'&&s.push.count<12&&s.push.until&&Date.now()<s.push.until-60000){
          s.push.until=Math.min(s.push.until,Date.now()+90000);
          s.push.limit=s.push.count+1+Math.floor(Math.random()*2);
          s.push.stopAt=0;
          save();continue;
        }
        stopPush(r.key,true);
        if(hasUnread(r.key))planRead(r.key,600000,10800000);
        if(chatOpen&&current===r.key)toast('TA 下线了');
        continue;
      }
      save();renderList();
      if((sent||added)&&chatOpen&&current===r.key)renderChat(true);
    }catch(e){
      s.push.nextAt=Date.now()+20000;
    }finally{
      PUSH_BUSY[r.key]=false;
    }
  }
}

async function mvPlay(){
  if(!mv)return;

  els.mvBar.classList.add('on');

  const url=await mmTTS(m.desc||m.text||'',key);
  if(!mv||mv.m!==m)return;
  if(url){
    const a=new Audio(url);
    mv.audio=a;
    a.onloadedmetadata=()=>{if(!isNaN(a.duration)&&a.duration>0)ms=a.duration*1000;};
    a.onended=()=>mvStop();
    a.play().catch(()=>{});
  }
  const step=()=>{
    if(!mv||mv.m!==m)return;
    const p=Math.min(1,(Date.now()-t0)/ms);
    els.mvProg.style.width=(p*100)+'%';
    if(p<1)mv.raf=requestAnimationFrame(step);
    else mvStop();
  };
  mv.raf=requestAnimationFrame(step);
}

  els.fileUserBg.onchange=async()=>{
    const f=els.fileUserBg.files&&els.fileUserBg.files[0];
    els.fileUserBg.value='';
    if(!f)return;
    try{
      const url=await P.fileToBase64(f);
      data.user.bg=url;
      save();renderProfile();
      P.toast('背景已更新');
    }catch(e){P.toast('读取文件失败');}
  };
  els.chatBody.addEventListener('click',e=>{
    if(bind._lp){bind._lp=false;return;}
    const tr=e.target.closest('[data-trans]');
    if(tr){e.preventDefault();e.stopPropagation();toggleTrans(tr);return;}
    const fav=e.target.closest('[data-fav]');
    if(fav){e.preventDefault();e.stopPropagation();toggleBox(fav.dataset.fav);return;}
    if(e.target.tagName==='VIDEO')return;
    const img=e.target.closest('[data-preview]');
    if(img&&current){
      const m=data.rooms[current].msgs.find(x=>x.id===img.dataset.preview);
      if(m){ if(m.tv)openMv(m.id); else openPreview(m); }
      return;
    }
    const v=e.target.closest('[data-play]');
    if(v)playVoice(v);
  });
  els.chatBody.addEventListener('contextmenu',e=>{
    const msgEl=e.target.closest('.bb-msg');
    if(!msgEl||!current)return;
    e.preventDefault();
    showCtx(msgEl.dataset.mid,e.clientX,e.clientY);
  });
  els.ctx.addEventListener('click',e=>{
    const it=e.target.closest('.bb-ctx-item');
    if(it)ctxAction(it.dataset.act);
  });
  els.app.addEventListener('pointerdown',e=>{
    bind._lp=false;
    if(els.ctx.classList.contains('on')&&!e.target.closest('.bb-ctx'))hideCtx();
    const msgEl=e.target.closest('.bb-msg');
    if(!msgEl||!current)return;
    clearTimeout(bind._pt);
    const x=e.clientX,y=e.clientY;
    bind._sx=x;bind._sy=y;
    bind._pt=setTimeout(()=>{
      bind._pt=null;
      bind._lp=true;
      showCtx(msgEl.dataset.mid,x,y);
    },520);
  });
  els.app.addEventListener('pointerup',()=>{clearTimeout(bind._pt);bind._pt=null;});
  els.app.addEventListener('pointercancel',()=>{clearTimeout(bind._pt);bind._pt=null;});
  els.app.addEventListener('pointermove',e=>{
    if(!bind._pt)return;
    if(Math.abs(e.clientX-bind._sx)>6||Math.abs(e.clientY-bind._sy)>6){
      clearTimeout(bind._pt);bind._pt=null;
    }
  });
  els.albumGrid.addEventListener('click',e=>{
    const cell=e.target.closest('.bb-ov-cell');
    if(!cell||!current)return;
    const id=cell.dataset.pv||cell.dataset.voice;
    if(ovSel){
      const i=ovPicked.indexOf(id);
      if(i>=0){ovPicked.splice(i,1);cell.classList.remove('ckon');}
      else{ovPicked.push(id);cell.classList.add('ckon');}
      syncAlbumSel();
      return;
    }
    const m=data.rooms[current].msgs.find(x=>x.id===id);
    if(!m)return;
    if(m.type==='voice')playVoice(cell);
    else if(m.tv)openMv(m.id);
    else openPreview(m);
  });
  els.boxGrid.addEventListener('click',e=>{
    const cell=e.target.closest('.bb-album-cell');
    if(!cell||!current)return;
    if(cell.dataset.mid){
      showCtx(cell.dataset.mid,e.clientX,e.clientY);
      return;
    }
    const id=cell.dataset.pv||cell.dataset.voice;
    const m=data.rooms[current].msgs.find(x=>x.id===id);
    if(!m)return;
    if(m.type==='voice')playVoice(cell);
    else if(m.tv)openMv(m.id);
    else openPreview(m);
  });
  els.albumSel.onclick=()=>{ovSel=!ovSel;els.albumSel.classList.toggle('on',ovSel);renderAlbum();};
  els.albumDone.onclick=()=>{ovSel=false;els.albumSel.classList.remove('on');renderAlbum();};
  els.albumDel.onclick=async()=>{
    if(!ovPicked.length)return;
    const ok=await P.modal({title:'删除 '+ovPicked.length+' 项',fields:[],onOk:()=>true});
    if(!ok)return;
    const s=data.rooms[current];
    s.msgs=s.msgs.filter(m=>!ovPicked.includes(m.id));
    save();ovSel=false;renderAlbum();renderChat(true);renderBox();P.toast('已删除');
  };
  els.preview.onclick=closePreview;
  els.previewVid.onclick=e=>e.stopPropagation();
  els.mvBack.onclick=closeMv;
  els.mvPlay.onclick=mvPlay;
  els.mvDown.onclick=()=>{
    if(!mv)return;
    const a=document.createElement('a');
    a.href=mv.m.url;a.download='bubble_'+mv.m.id+'.jpg';
    a.click();
  };
  els.drawerMask.onclick=closeDrawer;
  els.drawerBack.onclick=closeDrawer;
  els.favBtn.onclick=toggleFav;
  els.userRow.onclick=openProfile;
  els.boxCard.onclick=()=>{closeDrawer();openBox();};
  els.drawerAlbum.onclick=()=>{closeDrawer();openAlbum();};
  els.drawerSettings.onclick=()=>{closeDrawer();openSettings();};
  els.setBack.onclick=()=>els.settings.classList.remove('on');
  els.setExit.onclick=confirmExit;
  els.albumBack.onclick=()=>els.album.classList.remove('on');
  els.boxBack.onclick=()=>els.box.classList.remove('on');
  els.boxMore.onclick=openPay;
  els.wxClose.onclick=()=>els.wxPay.classList.remove('on');
  els.profClose.onclick=()=>els.profile.classList.remove('on');
  els.profAv.onclick=e=>{e.stopPropagation();els.fileAv.click();};
  els.profName.onclick=e=>{e.stopPropagation();openIdSheet();};
  els.profBg.onclick=openUserBgSheet;
  const mid=els.profile.querySelector('.bb-prof-mid');
  if(mid)mid.onclick=e=>{
    if(e.target.closest('#bbProfAv')||e.target.closest('#bbProfName'))return;
    openUserBgSheet();
  };
  els.subLine.addEventListener('dblclick',openSubSheet);
  els.sheetMask.onclick=closeSheet;
}
window.mountBubbleApp=function(container,Phone,onClose){
  P=Phone;
  closeApp=typeof onClose==='function'?onClose:null;
  app=container.querySelector('#bbApp');
  if(!app)return;
  const q=s=>app.querySelector(s);
  els={
    app:app,
    list:q('#bbList'),listScroll:q('#bbListScroll'),favList:q('#bbFavList'),recentList:q('#bbRecentList'),
    listClose:q('#bbListClose'),
    chat:q('#bbChat'),chatBody:q('#bbChatBody'),chatTitle:q('#bbChatTitle'),subLine:q('#bbSubLine'),
    chatBack:q('#bbChatBack'),chatSearch:q('#bbChatSearch'),chatMore:q('#bbChatMore'),
    cSearch:q('#bbCSearch'),cSearchInput:q('#bbCSearchInput'),cSearchInfo:q('#bbCSearchInfo'),cSearchClose:q('#bbCSearchClose'),
    input:q('#bbInput'),send:q('#bbSend'),emojiBtn:q('#bbEmojiBtn'),lockTip:q('#bbLockTip'),limitTip:q('#bbLimitTip'),
    ctx:q('#bbCtx'),toast:q('#bbToast'),
    settings:q('#bbSettings'),setBody:q('#bbSetBody'),setBack:q('#bbSetBack'),setExit:q('#bbSetExit'),
    album:q('#bbAlbum'),albumGrid:q('#bbAlbumGrid'),albumBack:q('#bbAlbumBack'),
    albumSel:q('#bbAlbumSel'),albumFoot:q('#bbAlbumFoot'),albumCnt:q('#bbAlbumCnt'),albumDel:q('#bbAlbumDel'),albumDone:q('#bbAlbumDone'),
    box:q('#bbBox'),boxGrid:q('#bbBoxGrid'),boxCount:q('#bbBoxCount'),boxBack:q('#bbBoxBack'),boxMore:q('#bbBoxMore'),
    profile:q('#bbProfile'),profBg:q('#bbProfBg'),profAv:q('#bbProfAv'),profName:q('#bbProfName'),profClose:q('#bbProfClose'),profHint:q('#bbProfHint'),
    drawer:q('#bbDrawer'),drawerMask:q('#bbDrawerMask'),drawerBack:q('#bbDrawerBack'),drawerBody:q('#bbDrawer'),
    favBtn:q('#bbFavBtn'),
    userRow:q('#bbUserRow'),userAv:q('#bbUserAv'),userName:q('#bbUserName'),
    artistAv:q('#bbArtistAv'),artistName:q('#bbArtistName'),artistExpire:q('#bbArtistExpire'),
    boxCard:q('#bbBoxCard'),drawerAlbum:q('#bbDrawerAlbum'),drawerSettings:q('#bbDrawerSettings'),
    sheet:q('#bbSheet'),sheetMask:q('#bbSheetMask'),
    preview:q('#bbPreview'),previewImg:q('#bbPreviewImg'),previewVid:q('#bbPreviewVid'),previewCap:q('#bbPreviewCap'),
    mv:q('#bbMv'),mvImg:q('#bbMvImg'),mvPlay:q('#bbMvPlay'),mvBar:q('#bbMvBar'),mvProg:q('#bbMvProg'),mvDesc:q('#bbMvDesc'),
    mvAv:q('#bbMvAv'),mvName:q('#bbMvName'),mvTime:q('#bbMvTime'),mvBack:q('#bbMvBack'),mvDown:q('#bbMvDown'),
    wxPay:q('#bbWxPay'),wxBody:q('#bbWxBody'),wxBar:q('#bbWxPayBar'),wxClose:q('#bbWxClose'),
    fileImg:q('#bbFileImg'),fileVid:q('#bbFileVid'),fileBg:q('#bbFileBg'),fileAv:q('#bbFileAv'),fileUserBg:q('#bbFileUserBg')
  };
  initData();
  renderList();
  bind();
  updateSend();
  try{checkDue();}catch(e){}
  timer=setInterval(()=>{
    if(!document.body.contains(app)){clearInterval(timer);return;}
    try{checkDue();}catch(e){}
    try{readTick();}catch(e){}
    try{pushTick();}catch(e){}
    try{autoTick();}catch(e){}
    try{refreshSub();}catch(e){}
  },15000);
};
})();
</script>
