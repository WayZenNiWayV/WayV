<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朋友圈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8f5e9;color:#222;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;user-select:none;height:100%;overflow-y:auto;}
img{display:block;max-width:100%;}
.puq-wrap{max-width:480px;margin:0 auto;position:relative;min-height:100%;background:#e8f5e9;}
.puq-banner{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#c8e6c9;cursor:pointer;}
.puq-banner-slide{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s ease;}
.puq-profile{position:relative;padding:0 16px 18px;margin-top:-48px;z-index:4;display:flex;justify-content:flex-end;align-items:flex-end;gap:12px;}
.puq-profile-info{text-align:right;padding-bottom:6px;max-width:65%;}
.puq-profile-name{font-size:17px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);word-break:break-all;}
.puq-profile-slogan{font-size:12px;color:rgba(255,255,255,.9);margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.4);word-break:break-all;}
.puq-profile-avatar{width:72px;height:72px;border-radius:6px;overflow:hidden;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#e5e5e5;}
.puq-profile-avatar img{width:100%;height:100%;object-fit:cover;}
.puq-profile-avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#81c784,#4caf50);color:#fff;font-size:26px;font-weight:600;}
.puq-list{padding:0 0 40px;}
.puq-item{padding:14px 16px;border-bottom:1px solid #c8e6c9;display:flex;gap:12px;position:relative;background:#e8f5e9;}
.puq-item-avatar{width:42px;height:42px;border-radius:5px;overflow:hidden;flex-shrink:0;background:#e5e5e5;}
.puq-item-avatar img{width:100%;height:100%;object-fit:cover;}
.puq-item-avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#81c784,#4caf50);color:#fff;font-size:16px;font-weight:600;}
.puq-item-body{flex:1;min-width:0;position:relative;}
.puq-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px;}
.puq-item-author{font-size:14px;color:#07c160;font-weight:500;cursor:pointer;}
.puq-item-author:hover{text-decoration:underline;}
.puq-item-del{cursor:pointer;padding:2px 4px;display:flex;align-items:center;color:#07c160;transition:opacity .15s;flex-shrink:0;border:none;background:transparent;}
.puq-item-del:hover{opacity:.7;}
.puq-item-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.puq-item-text{font-size:15px;color:#222;line-height:1.5;margin-top:2px;white-space:pre-wrap;word-break:break-all;}
.puq-item-images{margin-top:8px;display:grid;gap:4px;}
.puq-item-images.count-1{grid-template-columns:1fr;}
.puq-item-images.count-2,.puq-item-images.count-4{grid-template-columns:repeat(2,1fr);}
.puq-item-images.count-3,.puq-item-images.count-5,.puq-item-images.count-6,.puq-item-images.count-7,.puq-item-images.count-8,.puq-item-images.count-9{grid-template-columns:repeat(3,1fr);}
.puq-item-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:#f0f0f0;cursor:pointer;}
.puq-item-img.text-img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:8px;font-size:12px;text-align:center;color:#555;line-height:1.4;background:var(--ti-bg,#f5f5f5);border:1px dashed #ddd;word-break:break-all;overflow:hidden;}
.puq-item-footer{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:#999;}
.puq-item-time{flex-shrink:0;color:#bbb;}
.puq-item-tools{display:flex;gap:6px;margin-left:auto;align-items:center;}
.puq-item-tool{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#bbb;transition:background .15s,color .15s;}
.puq-item-tool:hover{background:#f5f5f5;color:#07c160;}
.puq-item-tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.puq-item-tool.liked{color:#e74c3c;}
.puq-item-tool.liked svg{fill:#e74c3c;}
.puq-item-tool.refreshing{animation:puqSpin 1s linear infinite;color:#07c160;}
@keyframes puqSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.puq-like-list{margin-top:8px;background:#e8f5e9;border-radius:4px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:#07c160;}
.puq-like-list svg{width:14px;height:14px;fill:#e74c3c;margin-right:2px;flex-shrink:0;}
.puq-like-name{color:#07c160;cursor:pointer;margin-right:4px;}
.puq-like-name:hover{text-decoration:underline;}
.puq-like-sep{color:#999;margin-right:4px;}
.puq-comments{margin-top:6px;background:#e8f5e9;border-radius:4px;padding:4px 10px;}
.puq-comment{padding:6px 0;font-size:13px;color:#333;position:relative;line-height:1.4;cursor:default;}
.puq-comment + .puq-comment{border-top:1px solid #c8e6c9;}
.puq-comment-name{color:#07c160;font-weight:500;margin-right:2px;cursor:pointer;}
.puq-comment-name:hover{text-decoration:underline;}
.puq-comment-reply-tag{color:#999;margin:0 2px;font-size:12px;}
.puq-comment-text{color:#333;word-break:break-all;}
.puq-comment-inline-img{display:inline-block;height:18px;width:auto;max-width:60px;vertical-align:middle;margin:0 2px;cursor:pointer;border-radius:2px;}
.puq-comment-del{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:transparent;color:#07c160;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;z-index:2;font-weight:700;}
.puq-comment.show-del .puq-comment-del{display:flex;}
.puq-comment-input-bar{display:none;align-items:center;gap:6px;margin-top:4px;padding:6px;background:#e8f5e9;border-radius:6px;border:1px solid #c8e6c9;flex-wrap:wrap;}
.puq-comment-input-bar.show{display:flex;}
.puq-comment-input{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;min-width:0;}
.puq-comment-send{padding:5px 12px;background:#07c160;color:#fff;border:none;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.puq-comment-send:disabled{background:#ccc;}
.puq-comment-tool{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#555;border-radius:4px;flex-shrink:0;transition:background .15s;}
.puq-comment-tool:hover{background:#f0f0f0;}
.puq-comment-preview-img{width:40px;height:40px;border-radius:4px;object-fit:cover;margin:2px 0;}
.puq-comment-preview-img.remove{cursor:pointer;position:relative;}
.puq-comment-preview-img-wrap{position:relative;display:inline-block;margin:2px 0;}
.puq-comment-preview-img-wrap .remove-x{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.puq-comment-inline-img{display:inline-block;height:18px;width:auto;max-width:60px;vertical-align:middle;margin:0 2px;cursor:pointer;border-radius:2px;}
.puq-emoji-panel{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 -4px 12px rgba(0,0,0,.1);padding:8px;z-index:50;max-height:200px;overflow-y:auto;}
.puq-emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.puq-emoji-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;overflow:hidden;transition:background .1s,transform .1s;background:#fafafa;}
.puq-emoji-item img{width:100%;height:100%;object-fit:contain;}
.puq-emoji-item:hover{background:#f0f0f0;transform:scale(1.05);}
.puq-empty{text-align:center;padding:60px 20px;color:#bbb;font-size:13px;}
.puq-empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4;}
.puq-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2500;display:flex;flex-direction:column;animation:puqFadeIn .2s;}
@keyframes puqFadeIn{from{opacity:0}to{opacity:1}}
.puq-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;}
.puq-modal-cancel{font-size:15px;color:#666;cursor:pointer;padding:4px 8px;margin:-4px -8px;}
.puq-modal-title{font-size:16px;font-weight:500;}
.puq-modal-publish{font-size:14px;color:#fff;background:#07c160;padding:6px 16px;border-radius:5px;cursor:pointer;font-family:inherit;border:none;}
.puq-modal-publish:disabled{background:#bcc;cursor:not-allowed;}
.puq-modal-body{flex:1;background:#fff;overflow-y:auto;padding:14px 16px;}
.puq-compose-textarea{width:100%;min-height:120px;border:none;outline:none;font-size:16px;font-family:inherit;resize:none;background:transparent;line-height:1.5;color:#222;}
.puq-compose-textarea::placeholder{color:#bbb;}
.puq-compose-images{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.puq-compose-img{width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;background:#f5f5f5;}
.puq-compose-img img{width:100%;height:100%;object-fit:cover;}
.puq-compose-img .text-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6px;font-size:12px;text-align:center;color:#555;line-height:1.3;background:var(--ti-bg,#f5f5f5);border:1px dashed #ddd;word-break:break-all;overflow:hidden;}
.puq-compose-img-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1;}
.puq-compose-add{width:100%;aspect-ratio:1;border-radius:4px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#bbb;flex-direction:column;gap:4px;font-size:11px;transition:border-color .15s,color .15s;}
.puq-compose-add:hover{border-color:#07c160;color:#07c160;}
.puq-compose-add svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;}
.puq-txt-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2700;display:flex;align-items:center;justify-content:center;padding:20px;}
.puq-txt-box{background:#fff;border-radius:12px;width:100%;max-width:340px;overflow:hidden;}
.puq-txt-head{padding:14px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:500;}
.puq-txt-body{padding:16px;}
.puq-txt-body textarea{width:100%;min-height:100px;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-family:inherit;font-size:14px;outline:none;resize:vertical;line-height:1.5;}
.puq-txt-body textarea:focus{border-color:#07c160;}
.puq-txt-colors{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.puq-txt-colors-label{font-size:12px;color:#999;margin-right:2px;}
.puq-txt-color{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.puq-txt-color.active{border-color:#333;}
.puq-txt-foot{padding:12px 16px;border-top:1px solid #eee;display:flex;gap:10px;justify-content:flex-end;}
.puq-txt-foot button{padding:6px 16px;border-radius:5px;border:none;cursor:pointer;font-size:14px;font-family:inherit;}
.puq-txt-foot .cancel-btn{background:#f0f0f0;color:#666;}
.puq-txt-foot .ok-btn{background:#07c160;color:#fff;}
.puq-txt-preview{margin-top:12px;aspect-ratio:1;border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:#333;border:1px solid #eee;}
.puq-img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2800;display:flex;align-items:center;justify-content:center;animation:puqFadeIn .2s;}
.puq-img-viewer img{max-width:95vw;max-height:90vh;object-fit:contain;}
.puq-img-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;}
.puq-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:3000;pointer-events:none;animation:puqFadeIn .2s;}
.puq-item-del-confirm{position:absolute;top:-5px;right:32px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:4px 0;z-index:10;min-width:80px;animation:puqPopIn .15s;}
@keyframes puqPopIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
@keyframes puqSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.puq-item-del-confirm div{padding:6px 14px;font-size:13px;cursor:pointer;text-align:center;}
.puq-item-del-confirm div:hover{background:#f5f5f5;}
.puq-item-del-confirm div.danger{color:#07c160;font-weight:500;}
.puq-ai-loading{font-size:12px;color:#07c160;font-style:italic;padding:4px 0;}
.puq-sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2600;animation:puqFadeIn .2s;}
.puq-sheet{position:fixed;left:0;right:0;bottom:0;z-index:2601;background:#fff;border-radius:14px 14px 0 0;animation:puqSlideUp .25s ease;max-height:85vh;overflow-y:auto;}
.puq-sheet-title{padding:14px 16px;font-size:13px;color:#999;text-align:center;border-bottom:1px solid #f0f0f0;}
.puq-sheet-item{padding:14px 16px;font-size:16px;color:#222;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f5f5f5;}
.puq-sheet-item:hover{background:#f7f7f7;}
.puq-sheet-item svg{width:20px;height:20px;color:#07c160;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.puq-sheet-cancel{margin-top:6px;background:#f7f7f7;border-bottom:none;border-radius:0 0 14px 14px;justify-content:center;color:#666;font-weight:500;}
.puq-char-picker{display:flex;flex-direction:column;gap:0;}
.puq-char-row{padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.puq-char-row:hover{background:#f7f7f7;}
.puq-char-row.active{background:#e8f5e9;}
.puq-char-avatar{width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#e5e5e5;}
.puq-char-avatar img{width:100%;height:100%;object-fit:cover;}
.puq-char-avatar-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#81c784,#4caf50);color:#fff;font-size:14px;font-weight:600;}
.puq-char-name{font-size:15px;color:#222;flex:1;}
.puq-char-check{color:#07c160;font-size:18px;font-weight:600;}
.puq-char-compose-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2500;display:flex;flex-direction:column;animation:puqFadeIn .2s;}
.puq-char-compose-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;}
.puq-char-compose-cancel{font-size:15px;color:#666;cursor:pointer;padding:4px 8px;margin:-4px -8px;}
.puq-char-compose-title{font-size:16px;font-weight:500;}
.puq-char-compose-publish{font-size:14px;color:#fff;background:#07c160;padding:6px 16px;border-radius:5px;cursor:pointer;font-family:inherit;border:none;}
.puq-char-compose-publish:disabled{background:#bcc;cursor:not-allowed;}
.puq-char-compose-body{flex:1;background:#fff;overflow-y:auto;padding:14px 16px;}
.puq-char-compose-body textarea{width:100%;min-height:100px;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-family:inherit;font-size:14px;outline:none;resize:vertical;line-height:1.5;}
.puq-char-compose-body textarea:focus{border-color:#07c160;}
.puq-char-section-title{font-size:13px;color:#999;margin:10px 0 6px;}
.puq-char-mode-row{display:flex;gap:8px;margin-bottom:12px;}
.puq-char-mode-btn{flex:1;padding:10px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:#666;transition:all .15s;}
.puq-char-mode-btn.active{border-color:#07c160;color:#07c160;background:#f0faf3;}
.puq-char-images{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.puq-char-img{width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;background:#f5f5f5;}
.puq-char-img img{width:100%;height:100%;object-fit:cover;}
.puq-char-img-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1;}
.puq-char-add-img{width:100%;aspect-ratio:1;border-radius:4px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#bbb;flex-direction:column;gap:4px;font-size:11px;transition:border-color .15s,color .15s;}
.puq-char-add-img:hover{border-color:#07c160;color:#07c160;}
.puq-char-add-img svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;}
.puq-char-generate-btn{width:100%;padding:12px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;}
.puq-char-generate-btn:disabled{background:#bcc;cursor:not-allowed;}
.puq-char-generate-btn.loading{display:flex;align-items:center;justify-content:center;gap:8px;}
.puq-char-generate-btn.loading::before{content:'';width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:puqSpin .8s linear infinite;}
.puq-char-preview-author{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px;background:#f7f7f7;border-radius:8px;}
.puq-char-preview-author-name{font-size:14px;font-weight:500;color:#07c160;}
</style>
</head>
<body>
<div class="puq-wrap" id="puqRoot">
  <div class="puq-banner" id="puqBanner">
    <div class="puq-banner-slide" id="puqBannerSlide"></div>
  </div>
  <div class="puq-profile" id="puqProfile"></div>
  <div class="puq-list" id="puqList"></div>
</div>
<input type="file" id="puqFileInput" accept="image/*" multiple style="display:none">

<script>
(function(){
  const root = document.getElementById('puqRoot');
  const bannerEl = document.getElementById('puqBanner');
  const bannerSlideEl = document.getElementById('puqBannerSlide');
  const profileEl = document.getElementById('puqProfile');
  const listEl = document.getElementById('puqList');

  let puqData = loadPuqData();
  let bannerIdx = 0;
  let composeImages = [];
  let composeText = '';
  let composeReplyTo = null;
  const puqPendingAIs = new Map();

  function loadPuqData(){
    const d = Phone.getData('puq');
    if(!d.posts){
      d.posts = [];
      d.banners = d.banners || [
        'https://a0ai.marscode.cn/api/ide/v1/text_to_image?prompt=WayV%20friends%20gathering%20warm%20evening%20cafe%20photo%20album&image_size=landscape_16_9',
        'https://a0ai.marscode.cn/api/ide/v1/text_to_image?prompt=sunset%20beach%20peaceful%20film%20photo%20vibe&image_size=landscape_16_9',
        'https://a0ai.marscode.cn/api/ide/v1/text_to_image?prompt=city%20night%20skyline%20neon%20lights%20moody&image_size=landscape_16_9'
      ];
      Phone.setData('puq', d);
    }
    return d;
  }
  function savePuq(){
    if(_savePuqTimer) clearTimeout(_savePuqTimer);
    _savePuqTimer = setTimeout(async () => {
      try{
        Phone.setData('puq', puqData);
      }catch(err){
        console.warn('[puq] savePuq failed, retrying after cleanup...', err);
        try{
          const d = JSON.parse(JSON.stringify(puqData || {}));
          let cleaned = false;
          if(d.banners){
            const newBanners = [];
            for(const b of d.banners){
              if(b && typeof b === 'string' && b.startsWith('data:image')){
                try{
                  const compressed = await _compressDataImage(b, 800, 0.6);
                  if(compressed && compressed.length < b.length){ cleaned = true; newBanners.push(compressed); continue; }
                }catch(_){}
              }
              newBanners.push(b);
            }
            d.banners = newBanners;
          }
          if(d.posts){
            for(const p of d.posts){
              if(p.images){
                const newImages = [];
                for(const img of p.images){
                  if(img && img.type !== 'text' && img.src && img.src.startsWith('data:image')){
                    try{
                      const compressed = await _compressDataImage(img.src, 600, 0.5);
                      if(compressed && compressed.length < img.src.length){ cleaned = true; newImages.push({ ...img, src: compressed }); continue; }
                    }catch(_){}
                  }
                  newImages.push(img);
                }
                p.images = newImages;
              }
            }
          }
          if(cleaned){
            Phone.setData('puq', d);
            puqData = d;
            toast('已自动压缩图片节省空间');
          }else{
            toast('存储空间不足，请清理聊天记录或图片');
          }
        }catch(err2){
          console.error('[puq] savePuq retry also failed:', err2);
          toast('存储空间不足，请清理聊天记录或图片');
        }
      }
    }, 200);
  }
  let _savePuqTimer = null;

  function _compressDataImage(dataUrl, maxSide, quality){
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }
  function esc(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function nowTs(){ return Date.now(); }
  function fmtTime(ts){
    if(!ts) return '';
    const diff = Date.now() - ts;
    const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
    if(m < 1) return '刚刚';
    if(m < 60) return m + '分钟前';
    if(h < 24) return h + '小时前';
    if(d < 7) return d + '天前';
    const dt = new Date(ts);
    return (dt.getMonth()+1) + '月' + dt.getDate() + '日';
  }

  function buildContactReply(c, userInput, context){
    let sys = `你是微信朋友圈里的一个真人，名字叫${c.name}。\n`;
    if(c.roleSetting) sys += `【你的人设】\n${c.roleSetting}\n\n`;
    if(context && context.posterName){
      sys += `发这条朋友圈的人（帖子作者）是${context.posterName}。\n`;
    }
    if(context && context.isReply && context.replyToName){
      sys += `\n你在回复 ${context.replyToName}。\n`;
    }
    sys += `\n⚠️ 你要发的是朋友圈评论，不是私聊！语气要像微信里真实的朋友留言，简短、口语化。\n`;
    sys += `⚠️ 10-40字之间，自然活泼。可以带表情但不要太多。\n`;
    sys += `⚠️ 直接输出评论内容，不要加【名字】：好、请、引号等任何格式。\n`;
    sys += `⚠️ 禁止输出任何不在朋友圈评论里出现的内容（例如：好的收到、我想想、以下是评论列表等）`;
    let userPrompt = '';
    if(context && context.postContent){
      userPrompt += `【朋友圈内容】\n"${context.postContent}"\n\n`;
    }
    if(context && context.thread && context.thread.length > 0){
      userPrompt += `【已有评论】\n${context.thread.map(r => r.name+': '+r.text).join('\n')}\n\n`;
    }
    userPrompt += `刚才有人说了："${userInput}"\n请你作为 ${c.name} 评一句：`;
    return [
      { role:'system', content: sys },
      { role:'user', content: userPrompt }
    ];
  }

  async function generateContactComment(contact, userInput, context){
    try{
      const messages = buildContactReply(contact, userInput, context);
      console.log('[puq-comment] request for', contact.name, 'messages:', messages);
      const raw = await Phone.chatWithAI(messages);
      console.log('[puq-comment] raw response:', JSON.stringify(raw));
      let text = (raw || '').trim();
      const orig = text;
      text = text.replace(/^[【「『][^】」』]*[】」』][:：\s]*/, '');
      text = text.replace(/^[""「『"'']+|[""」』"'']+$/g, '');
      text = text.replace(/^(评论|回复)[：:]\s*/, '');
      text = text.replace(/^\S+?[说道曰][：:]\s*/, '');
      text = text.replace(/^(好的收到|收到|我想想|以下是|这是|我的)[^，。！？]*[：:]\s*/, '');
      text = text.trim();
      console.log('[puq-comment] cleaned:', JSON.stringify(text), '(orig:', JSON.stringify(orig), ')');
      if(text.length > 80) text = text.slice(0, 77) + '...';
      if(text.length === 0 && orig.length > 0) text = orig.slice(0, Math.min(40, orig.length));
      if(text.length === 0) text = '哈哈';
      return text;
    }catch(err){
      console.error('[puq-comment] AI error:', err);
      const fallbacks = ['哈哈哈','有意思~','+1','好看','笑死','同感同感','确实','666','爱了爱了'];
      return fallbacks[Math.floor(Math.random()*fallbacks.length)];
    }
  }

roke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span><span class="puq-comment-img-preview"></span><button class="puq-comment-send" disabled>发送/button></div></div>';

  function bindPostEvents(div, p, curChar){
    div.querySelectorAll('.puq-item-img').forEach(img => {
      img.addEventListener('click', (e) => { e.stopPropagation(); openImageViewer(p.images || [], parseInt(img.dataset.idx)); });
    });
    div.querySelectorAll('.puq-comment-inline-img').forEach(img => {
      img.addEventListener('click', (e) => { e.stopPropagation(); openImageViewer([{ src: img.src }], 0); });
    });
    const likeBtn = div.querySelector('[data-like]');
    if(likeBtn) likeBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleLike(p, curChar); });
    const refreshBtn = div.querySelector('[data-refresh]');
    if(refreshBtn) refreshBtn.addEventListener('click', (e) => { e.stopPropagation(); triggerFriendCommentAI(p, curChar, refreshBtn); });
    const commentBtn = div.querySelector('[data-comment]');
    if(commentBtn) commentBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const bar = div.querySelector('.puq-comment-input-bar');
      bar.classList.toggle('show');
      if(bar.classList.contains('show')){
        const input = bar.querySelector('.puq-comment-input');
        input.placeholder = '评论...';
        composeReplyTo = null;
        bar._puqCommentImages = [];
        renderCommentInputState(bar);
        setTimeout(() => input.focus(), 50);
      } else {
        closeEmojiPanel(div);
      }
    });
    const bar = div.querySelector('.puq-comment-input-bar');
    if(bar){
      const input = bar.querySelector('.puq-comment-input');
      const send = bar.querySelector('.puq-comment-send');
      const preview = bar.querySelector('.puq-comment-img-preview');
      const emojiBtn = bar.querySelector('.emoji-btn');
      const imgBtn = bar.querySelector('.img-btn');
      let imgFileInput = null;

      function renderCommentInputState(){
        const imgs = bar._puqCommentImages || [];
        const val = input.value.trim();
        send.disabled = !val && imgs.length === 0;
        if(imgs.length > 0){
          preview.innerHTML = imgs.map((src, i) => '<div class="puq-comment-preview-img-wrap"><img class="puq-comment-preview-img" src="'+esc(src)+'" alt=""><span class="remove-x" data-i="'+i+'" title="移除">×</span></div>').join('');
          preview.querySelectorAll('.remove-x').forEach(x => {
            x.onclick = (e) => { e.stopPropagation(); imgs.splice(parseInt(x.dataset.i), 1); renderCommentInputState(); };
          });
        } else {
          preview.innerHTML = '';
        }
      }
      input.addEventListener('input', renderCommentInputState);

      emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleEmojiPanel(div, bar, input);
      });

      imgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeEmojiPanel(div);
        if(!imgFileInput){
          imgFileInput = document.createElement('input');
          imgFileInput.type = 'file';
          imgFileInput.accept = 'image/*';
          imgFileInput.multiple = false;
          imgFileInput.onchange = async (ev) => {
            const file = (ev.target.files || [])[0];
            if(!file) return;
            const src = await Phone.fileToBase64(file);
            bar._puqCommentImages = [src];
            renderCommentInputState();
          };
        }
        imgFileInput.value = '';
        imgFileInput.click();
      });

      const doSend = () => {
        const val = input.value.trim();
        const imgs = bar._puqCommentImages || [];
        if(!val && imgs.length === 0) return;
        addComment(p, curChar, val, composeReplyTo, imgs);
        const wasReplyTo = composeReplyTo;
        input.value = ''; composeReplyTo = null; bar._puqCommentImages = []; bar.classList.remove('show');
        closeEmojiPanel(div);
        renderList();
        if(wasReplyTo){
          setTimeout(() => triggerReplyBackAI(p, curChar, wasReplyTo), 300);
        }
      };
      send.addEventListener('click', (e) => { e.stopPropagation(); doSend(); });
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); doSend(); } });
    }
    div.querySelectorAll('.puq-comment').forEach(cc => {
      cc.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = cc.dataset.cid;
        const delX = cc.querySelector('.puq-comment-del');
        if(delX && e.target === delX){ deleteComment(p, cid); renderList(); return; }
        const c = (p.comments||[]).find(x => x.id === cid);
        if(!c) return;
        document.querySelectorAll('.puq-comment.show-del').forEach(x => { if(x !== cc) x.classList.remove('show-del'); });
        cc.classList.toggle('show-del');
        if(!cc.classList.contains('show-del')){
          const inputBar = div.querySelector('.puq-comment-input-bar');
          inputBar.classList.add('show');
          inputBar._puqCommentImages = [];
          composeReplyTo = { postId: p.id, userId: c.authorId, userName: c.authorName };
          const input = inputBar.querySelector('.puq-comment-input');
          input.placeholder = '回复 ' + c.authorName + '...';
          inputBar.querySelector('.puq-comment-send').disabled = true;
          inputBar.querySelector('.puq-comment-img-preview').innerHTML = '';
          closeEmojiPanel(div);
          setTimeout(() => input.focus(), 50);
        }
      });
    });
    const delBtn = div.querySelector('.puq-item-del');
    if(delBtn){
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const existing = div.querySelector('.puq-item-del-confirm');
        if(existing){ existing.remove(); return; }
        const confirm = document.createElement('div');
        confirm.className = 'puq-item-del-confirm';
        confirm.innerHTML = '<div class="danger" data-act="delete">删除</div><div data-act="cancel">取消</div>';
        delBtn.appendChild(confirm);
        confirm.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if(ev.target.dataset.act === 'delete'){ puqData.posts = (puqData.posts || []).filter(x => x.id !== p.id); savePuq(); renderList(); }
          confirm.remove();
        });
        setTimeout(() => { document.addEventListener('click', function autoClose(ev){ if(!div.contains(ev.target)){ confirm.remove(); document.removeEventListener('click', autoClose); } }); }, 0);
      });
    }
  }

  function toggleLike(p, curChar){
    if(!curChar) return;
    p.likes = p.likes || [];
    const idx = p.likes.findIndex(l => curChar && l.authorId === curChar.id);
    if(idx >= 0) p.likes.splice(idx, 1);
    else p.likes.push({ authorId: curChar.id, authorName: curChar.name, authorAvatar: curChar.avatar });
    savePuq(); renderList();
  }

  function addComment(p, curChar, text, replyTo, images){
    if(!curChar) return;
    p.comments = p.comments || [];
    const c = { id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), authorId:curChar.id, authorName:curChar.name, authorAvatar:curChar.avatar, text, createdAt:nowTs() };
    if(images && images.length > 0) c.images = images.slice();
    if(replyTo && replyTo.postId === p.id){ c.replyToId = replyTo.userId; c.replyToName = replyTo.userName; }
    p.comments.push(c); savePuq();
  }

  function deleteComment(p, cid){ p.comments = (p.comments || []).filter(c => c.id !== cid); savePuq(); }

  function getPostContextForAI(p){
    const author = findContactById(p.authorId);
    const imgs = (p.images||[]).map(img => img.type === 'text' ? img.text : '[图片]').join('、');
    const postContent = (p.text||'') + (imgs ? (' [配图：'+imgs+']') : '');
    const thread = (p.comments||[]).slice(-6).map(c => ({ name: c.authorName, text: c.text }));
    return {
      posterName: (author && author.name) || p.authorName || '匿名作者',
      postContent: postContent.slice(0, 300),
      thread
    };
  }

  async function triggerFriendCommentAI(p, curChar, btnEl){
    const excludeIds = [curChar && curChar.id, p.authorId].filter(Boolean);
    const allContacts = getContactsList().filter(c => !excludeIds.includes(c.id));
    if(allContacts.length === 0){ toast('暂无联系人'); return; }
    const shuffled = allContacts.sort(() => Math.random() - 0.5);
    const batchSize = Math.min(shuffled.length, 2 + Math.floor(Math.random()*2));
    const batch = shuffled.slice(0, batchSize);
    batch.forEach(contact => {
      bumpPending(p.id, 1);
      setTimeout(() => runSingleCommentAI(p, curChar, contact, null, null), 200 + Math.random()*1200);
    });
  }

  function bumpPending(postId, delta){
    const cur = puqPendingAIs.get(postId) || 0;
    const next = cur + delta;
    if(next <= 0) puqPendingAIs.delete(postId);
    else puqPendingAIs.set(postId, next);
    renderList();
  }

  async function runSingleCommentAI(p, curChar, contact, replyToId, replyToName){
    try{
      const lastComment = (p.comments || [])[p.comments.length - 1];
      if(!replyToId && !replyToName && lastComment && lastComment.authorId !== contact.id){
        replyToId = lastComment.authorId;
        replyToName = lastComment.authorName;
      }
      const context = getPostContextForAI(p);
      if(replyToId && replyToName){
        context.isReply = true;
        context.replyToName = replyToName;
      }
      const userInput = lastComment ? lastComment.text : '（有新评论）';
      const text = await generateContactComment(contact, userInput, context);
      p.comments = p.comments || [];
      const c = { id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+contact.id, authorId:contact.id, authorName:contact.name, authorAvatar:contact.avatar, text, createdAt:nowTs() };
      if(replyToId && replyToName){ c.replyToId = replyToId; c.replyToName = replyToName; }
      p.comments.push(c); savePuq();
    }catch(err){
      console.error('[puq-comment] runSingleCommentAI error for', contact?.name, err);
    }
    bumpPending(p.id, -1);
  }

  async function triggerReplyBackAI(p, curChar, replyTo){
    const targetContact = findContactById(replyTo.userId);
    if(!targetContact || targetContact.id === curChar.id) return;
    bumpPending(p.id, 1);
    setTimeout(() => {
      runSingleCommentAI(p, curChar, targetContact, curChar.id, curChar.name);
    }, 500 + Math.random()*1500);
  }

  async function triggerOtherFriendsComment(p, curChar, excludeContact){
    const excludeIds = [curChar && curChar.id, excludeContact && excludeContact.id, p.authorId].filter(Boolean);
    const contact = pickRandomContact(excludeIds);
    if(!contact) return;
    bumpPending(p.id, 1);
    setTimeout(() => runSingleCommentAI(p, curChar, contact, null, null), 300 + Math.random()*1000);
  }

  async function triggerPostLaunchInteractions(p){
    const excludeIds = [p.authorId].filter(Boolean);
    const all = getContactsList().filter(c => !excludeIds.includes(c.id));
    if(all.length === 0) return;
    const shuffled = all.sort(() => Math.random() - 0.5);
    const likeCount = Math.min(3, shuffled.length);
    const likeContacts = shuffled.slice(0, likeCount);
    for(let i = 0; i < likeContacts.length; i++){
      await new Promise(r => setTimeout(r, 600 + Math.random()*800));
      const contact = likeContacts[i];
      if(!(p.likes || []).find(l => l.authorId === contact.id)){
        p.likes = p.likes || [];
        p.likes.push({ authorId: contact.id, authorName: contact.name, authorAvatar: contact.avatar });
        savePuq(); renderList();
      }
    }
    const commentCount = Math.min(2 + Math.floor(Math.random()*2), shuffled.length - likeCount);
    const commentContacts = shuffled.slice(likeCount, likeCount + Math.max(commentCount, 1));
    commentContacts.forEach((contact, i) => {
      bumpPending(p.id, 1);
      setTimeout(() => runSingleCommentAI(p, null, contact, null, null), 800 + Math.random()*1800);
    });
  }

    const imagesBox = modal.querySelector('.puq-compose-images');
    const publishBtn = modal.querySelector('[data-act=publish]');
    const cancelBtn = modal.querySelector('[data-act=cancel]');
    function refreshPublish(){ publishBtn.disabled = !composeText.trim() && composeImages.length === 0; }
    function renderImages(){
      imagesBox.innerHTML = '';
      composeImages.forEach((img, idx) => {
        const div = document.createElement('div');
        div.className = 'puq-compose-img';
        if(img.type === 'text') div.innerHTML = '<div class="text-img" style="--ti-bg:'+esc(img.bg||'#f5f5f5')+'">'+esc(img.text)+'</div>';
        else div.innerHTML = '<img src="'+esc(img.src)+'" alt="">';
        const del = document.createElement('div');
        del.className = 'puq-compose-img-del'; del.textContent = '×';
        del.onclick = (e) => { e.stopPropagation(); composeImages.splice(idx,1); renderImages(); refreshPublish(); };
        div.appendChild(del); imagesBox.appendChild(div);
      });
      if(composeImages.length < 9){
        const add = document.createElement('div');
        add.className = 'puq-compose-add';
        add.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>图片</span>';
        add.onclick = () => showImageSourceSheet((src) => {
          if(src === 'local'){ const input = document.getElementById('puqFileInput'); input.value = ''; input.click(); }
          else if(src === 'text'){ openTextImageEditor((img) => { if(img){ if(composeImages.length >= 9){ toast('最多9张'); return; } composeImages.push(img); renderImages(); refreshPublish(); } }); }
        });
        imagesBox.appendChild(add);
      }
    }
    textarea.addEventListener('input', () => { composeText = textarea.value; refreshPublish(); });
    cancelBtn.onclick = () => modal.remove();
    modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
    publishBtn.onclick = () => {
      const post = { id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), authorId:char.id, authorName:char.name, authorAvatar:char.avatar, text:composeText.trim(), images:composeImages.slice(), createdAt:nowTs(), likes:[], comments:[] };
      puqData.posts = puqData.posts || []; puqData.posts.push(post);
      savePuq(); modal.remove(); renderList(); toast('已发表');
      setTimeout(() => triggerPostLaunchInteractions(post), 800);
    };
    document.getElementById('puqFileInput').onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      for(const f of files){ if(composeImages.length >= 9) break; const src = await Phone.fileToBase64(f); composeImages.push({ type:'image', src }); }
      renderImages(); refreshPublish();
    };
    renderImages();
  }

  function openTextImageEditor(onDone){
    const mask = document.createElement('div');
    mask.className = 'puq-txt-modal';
    const colors = [
      { name:'娴呯伆', bg:'#f5f5f5', fg:'#333' },
      { name:'绫崇櫧', bg:'#fef9e7', fg:'#5a4a1a' },
      { name:'娣¤摑', bg:'#e8f4fd', fg:'#1a4a7a' },
      { name:'娣＄矇', bg:'#fde8f0', fg:'#7a1a4a' },
      { name:'娣＄豢', bg:'#e8f8f0', fg:'#1a5a3a' },
      { name:'绾粦', bg:'#222', fg:'#fff' }
    ];
    let selectedBg = colors[0].bg, selectedFg = colors[0].fg;
    mask.innerHTML = '<div class="puq-txt-box"><div class="puq-txt-head">文字图片</div><div class="puq-txt-body"><textarea placeholder="输入你想写的话..."></textarea><div class="puq-txt-preview" style="background:'+selectedBg+';color:'+selectedFg+'">预览文字</div><div class="puq-txt-colors"><span class="puq-txt-colors-label">背景色</span>'+colors.map((c,i)=>'<div class="puq-txt-color '+(i===0?'active':'')+'" data-idx="'+i+'" style="background:'+c.bg+'"></div>').join('')+'</div></div><div class="puq-txt-foot"><button class="cancel-btn">取消</button><button class="ok-btn">生成</button></div></div>';
    document.body.appendChild(mask);
    const ta = mask.querySelector('textarea');
    const preview = mask.querySelector('.puq-txt-preview');
    function updatePreview(){ preview.textContent = ta.value.trim() || '预览文字'; preview.style.background = selectedBg; preview.style.color = selectedFg; }
    ta.addEventListener('input', updatePreview);
    mask.querySelectorAll('.puq-txt-color').forEach(dot => {
      dot.addEventListener('click', () => {
        const i = parseInt(dot.dataset.idx); selectedBg = colors[i].bg; selectedFg = colors[i].fg;
        mask.querySelectorAll('.puq-txt-color').forEach(x => x.classList.remove('active')); dot.classList.add('active'); updatePreview();
      });
    });
    mask.querySelector('.cancel-btn').onclick = () => mask.remove();
    mask.addEventListener('click', (e) => { if(e.target === mask) mask.remove(); });
    mask.querySelector('.ok-btn').onclick = () => {
      const text = ta.value.trim();
      if(!text){ toast('请输入文字'); return; }
      const cv = document.createElement('canvas'); cv.width = 400; cv.height = 400;
      const ctx = cv.getContext('2d'); ctx.fillStyle = selectedBg; ctx.fillRect(0,0,400,400);
      ctx.fillStyle = selectedFg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 26px sans-serif';
      wrapCanvasText(ctx, text, 200, 200, 32, 10);
      onDone({ type:'text', src:cv.toDataURL(), text, bg:selectedBg });
      mask.remove();
    };
  }

  function wrapCanvasText(ctx, text, x, y, lineHeight, maxLines){
    const chars = text.split(''); let line = '', lines = 0;
    for(let n = 0; n < chars.length; n++){
      const test = line + chars[n];
      if(ctx.measureText(test).width > 360 && line.length > 0){
        ctx.fillText(line, x, y + lines * lineHeight); line = chars[n]; lines++;
        if(lines >= maxLines - 1){ let rest = text.slice(n); while(ctx.measureText(rest+'...').width>360&&rest.length>0) rest=rest.slice(0,-1); ctx.fillText(rest+(text.slice(n).length>rest.length?'...':''), x, y + lines*lineHeight); return; }
      } else { line = test; }
    }
    if(line) ctx.fillText(line, x, y + lines * lineHeight);
  }

  function toast(msg){
    const t = document.createElement('div'); t.className = 'puq-toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(() => t.remove(), 300); }, 1500);
  }

  function getStickerLib(){
    try{
      const d = Phone.getData('sticker');
      if(!d || !d.packs || !Array.isArray(d.packs)) return [];
      const all = [];
      d.packs.forEach(p => {
        (p.stickers || []).forEach(s => { if(s && s.src) all.push(s.src); });
      });
      return all;
    }catch(e){ return []; }
  }

  function toggleEmojiPanel(div, bar, input){
    closeEmojiPanel(div);
    const stickers = getStickerLib();
    const panel = document.createElement('div');
    panel.className = 'puq-emoji-panel';
    if(stickers.length === 0){
      panel.innerHTML = '<div style="padding:16px;text-align:center;color:#bbb;font-size:12px;">还没有表情包<br>去微信「我 → 设置」里添加吧</div>';
    } else {
      panel.innerHTML = '<div class="puq-emoji-grid">' + stickers.map(src => '<div class="puq-emoji-item"><img src="'+esc(src)+'" alt=""></div>').join('') + '</div>';
      panel.querySelectorAll('.puq-emoji-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const src = item.querySelector('img').src;
          bar._puqCommentImages = [src];
          renderCommentInputState();
        });
      });
    }
    bar.style.position = 'relative';
    bar.appendChild(panel);
  }
  function closeEmojiPanel(div){
    const old = div.querySelector('.puq-emoji-panel');
    if(old) old.remove();
  }

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.puq-item')){
      document.querySelectorAll('.puq-comment.show-del').forEach(c => c.classList.remove('show-del'));
      document.querySelectorAll('.puq-comment-input-bar.show').forEach(b => b.classList.remove('show'));
    }
  });

  renderBanner(); renderProfile(); renderList();
  document.addEventListener('char-updated', () => { renderProfile(); renderList(); });
  window.__puqRuntime = { renderList, triggerPostLaunchInteractions };

  function openCharPicker(){
    const all = getContactsList();
    if(!all.length){ toast('通讯录为空'); return; }
    const mask = document.createElement('div');
    mask.className = 'puq-sheet-mask';
    const sheet = document.createElement('div');
    sheet.className = 'puq-sheet';
    sheet.innerHTML = '<div class="puq-sheet-title">选择要发表的角色</div><div class="puq-char-picker" id="puqCharPicker"></div><div class="puq-sheet-item puq-sheet-cancel" id="puqCharCancel">取消</div>';
    mask.appendChild(sheet);
    document.body.appendChild(mask);
    const listEl = sheet.querySelector('#puqCharPicker');
    all.forEach(c => {
      const row = document.createElement('div');
      row.className = 'puq-char-row';
      row.innerHTML = '<div class="puq-char-avatar">' + (c.avatar ? '<img src="'+esc(c.avatar)+'" alt="">' : '<div class="puq-char-avatar-fb">'+esc((c.name||'?').charAt(0))+'</div>') + '</div><div class="puq-char-name">'+esc(c.name)+'</div><div class="puq-char-check">›</div>';
      row.addEventListener('click', () => { mask.remove(); openCharCompose(c); });
      listEl.appendChild(row);
    });
    sheet.querySelector('#puqCharCancel').addEventListener('click', () => mask.remove());
    mask.addEventListener('click', (e) => { if(e.target === mask) mask.remove(); });
  }

  function openCharCompose(char){
    let charComposeImages = [];
    let charComposeText = '';
    const mask = document.createElement('div');
    mask.className = 'puq-char-compose-mask';
    mask.innerHTML = `
      <div class="puq-char-compose-head">
        <div class="puq-char-compose-cancel" data-act="cancel">取消</div>
        <div class="puq-char-compose-title"> 发朋友圈</div>
        <button class="puq-char-compose-publish" data-act="publish" disabled>发表</button>
      </div>
      <div class="puq-char-compose-body">
        <div class="puq-char-preview-author">
          <div class="puq-char-avatar" style="width:32px;height:32px;border-radius:7px"></div>
          <div class="puq-char-preview-author-name">@${esc(char.name||'')}</div>
        </div>
        <textarea id="puqCharMainText" placeholder="写点什么...（也可以只发图片）" style="width:100%;min-height:120px;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-family:inherit;font-size:14px;outline:none;resize:vertical;line-height:1.5;"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="puq-char-generate-btn" id="puqCharGenBtn" style="width:auto;padding:8px 16px;font-size:13px;flex-shrink:0;">让 TA 帮写 / 润色</button>
          <span id="puqCharGenHint" style="font-size:12px;color:#aaa;">留空也可以点，TA会自由发挥</span>
        </div>
        <div class="puq-char-section-title">配图（可选，最多9张）</div>
        <div class="puq-char-images" id="puqCharImages"></div>
      </div>
    `;
    document.body.appendChild(mask);

    const mainTextArea = mask.querySelector('#puqCharMainText');
    const genBtn = mask.querySelector('#puqCharGenBtn');
    const publishBtn = mask.querySelector('[data-act=publish]');
    const imagesBox = mask.querySelector('#puqCharImages');

    function refreshPublish(){
      publishBtn.disabled = !charComposeText.trim() && charComposeImages.length === 0;
    }

    function renderCharImages(){
      imagesBox.innerHTML = '';
      charComposeImages.forEach((img, idx) => {
        const div = document.createElement('div');
        div.className = 'puq-char-img';
        div.innerHTML = '<img src="'+esc(img.src)+'" alt=""><div class="puq-char-img-del">×</div>';
        div.querySelector('.puq-char-img-del').onclick = () => { charComposeImages.splice(idx,1); renderCharImages(); };
        imagesBox.appendChild(div);
      });
      if(charComposeImages.length < 9){
        const add = document.createElement('div');
        add.className = 'puq-char-add-img';
        add.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>图片</span>';
        add.onclick = () => showImageSourceSheet((src) => {
          if(src === 'local'){ const input = document.getElementById('puqFileInput'); input.value = ''; input.click(); }
          else if(src === 'text'){ openTextImageEditor((img) => { if(img){ if(charComposeImages.length >= 9){ toast('最多9张'); return; } charComposeImages.push(img); renderCharImages(); refreshPublish(); } }); }
        });
        imagesBox.appendChild(add);
      }
    }
    renderCharImages();

    mainTextArea.addEventListener('input', () => { charComposeText = mainTextArea.value; refreshPublish(); });

    genBtn.addEventListener('click', async () => {
      const now = new Date();
      const timeStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      let sys = `你是${char.name}，现在要在微信朋友圈发一条动态。\n当前时间：${timeStr}\n`;
      if(char.roleSetting) sys += `【你的人设】${char.roleSetting}\n\n`;
      if(char.writingStyle?.length) sys += `【文风参考（请模仿这些话法和语气）】${char.writingStyle}\n\n`;
      sys += `风格：符合你作为${char.name}的性格和身份，自然、生活化。\n要求：只用一段简短的文字，像真实的朋友圈一样，不要加标点符号以外的格式，不要说自己是AI。控制在1-3句话。`;
      const currentText = mainTextArea.value.trim();
      const userPrompt = currentText
        ? `请帮我润色/扩展这条朋友圈，让它更自然有味道：\n${currentText}`
        : '自由发挥发一条朋友圈吧';
      genBtn.disabled = true;
      genBtn.classList.add('loading');
      genBtn.textContent = '生成中';
      try {
        const reply = await Phone.chatWithAI([{ role:'system', content:sys }, { role:'user', content:userPrompt }]);
        let content = (reply || '').trim().replace(/^["「『]|["」』]$/g, '');
        charComposeText = content;
        mainTextArea.value = content;
        refreshPublish();
        toast('已生成，可继续修改');
      } catch(err){
        toast('生成失败');
      } finally {
        genBtn.disabled = false;
        genBtn.classList.remove('loading');
        genBtn.textContent = '让 TA 帮写 / 润色';
      }
    });

    document.getElementById('puqFileInput').onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      for(const f of files){ if(charComposeImages.length >= 9) break; const src = await Phone.fileToBase64(f); charComposeImages.push({ type:'image', src }); }
      renderCharImages();
      refreshPublish();
    };

    publishBtn.addEventListener('click', () => {
      const text = mainTextArea.value.trim();
      if(!text && charComposeImages.length === 0) return;
      const post = { id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), authorId:char.id, authorName:char.name, authorAvatar:char.avatar, text, images:charComposeImages.slice(), createdAt:nowTs(), likes:[], comments:[] };
      puqData.posts = puqData.posts || []; puqData.posts.push(post);
      savePuq();
      mask.remove();
      renderList();
      toast('已发表');
      setTimeout(() => triggerPostLaunchInteractions(post), 800);
    });
    mask.querySelector('[data-act=cancel]').addEventListener('click', () => mask.remove());
    mask.addEventListener('click', (e) => { if(e.target === mask) mask.remove(); });
  }

})();
